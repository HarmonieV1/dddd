## Ordre de démarrage. Les ressources qui déclarent leurs dépendances (fxmanifest) se réordonnent
## d'elles-mêmes à l'intérieur d'un bloc, les blocs, eux, doivent rester dans cet ordre.
## Jamais de point-virgule dans un .cfg, même en commentaire : FiveM le lit comme séparateur de commandes.
## Chaque ressource tierce passe la checklist d'audit (docs/SECURITY.md) AVANT d'être ajoutée ici.
## Ne JAMAIS ajouter : qbx_management (gs_jobs), qbx_weathersync / Renewed-Weathersync (gs_weather), qbx_hud (gs_hud),
## npwd (gs_phone), qbx_drugs / qbx_weed / qbx_storerobbery / qbx_jewelery / qbx_bankrobbery (gs_drugs / gs_heists).

## ---- 0. Ressources Cfx par défaut ----
ensure mapmanager
ensure chat                 # chat système FiveM (resources_useSystemChat)
ensure spawnmanager
ensure baseevents
ensure bob74_ipl            # intérieurs de la map (commissariat, etc.)

## ---- 1. Base (ne jamais réordonner) ----
ensure oxmysql
ensure ox_lib
ensure qbx_core

## ---- 2. overextended ----
ensure ox_target
ensure ox_inventory
ensure ox_doorlock
ensure ox_fuel

## ---- 3. Voix ----
ensure pma-voice

## ---- 4. Gameplay Qbox existant (audité) ----
ensure qbx_vehicles         # véhicules possédés (garages, concession)
ensure qbx_idcard           # OBLIGATOIRE : qbx_core donne la carte d'identité au 1er perso (sinon écran noir)
ensure qbx_spawn
ensure qbx_properties       # logements : appartement de départ, achat / location (agents Dynasty 8 : /createproperty)
ensure illenium-appearance
ensure qbx_vehiclekeys
ensure qbx_garages
ensure qbx_vehicleshop
ensure qbx_medical
ensure qbx_ambulancejob     # désactiver son service/garage/coffres : gérés par gs_jobs
ensure qbx_police           # idem
ensure qbx_cityhall         # désactiver sa liste de jobs : Pôle Emploi = gs_jobs
ensure mm_radio
ensure scully_emotemenu     # animations /e
ensure [assets]             # MLO fournis par la recipe (Pillbox)
ensure qbx_smallresources

## ---- 5. GTA SOON (maison) ----
ensure gs_security
ensure gs_bridge
ensure gs_onboarding        # règlement à accepter (/regles), liste blanche, accueil « premier jour »
ensure gs_markers           # marqueurs au sol (cercles, icônes, losange de quête)
