immédiatement.\n3. **QG de gangs Grove / Ballas / Vagos** (gratuit) — trois QG d'un coup.\n4. **Laverie** (gratuit) — le blanchiment devient visible et attaquable.\n5. **Pack de coquilles K4MB1** — le logement devient un vrai marché, pour un poids minime.\n", "BOB74_IPL": "# Audit `bob74_ipl` — les intérieurs gratuits qu'on n'exploite pas encore\n\nFait le 11/10/2026 sur **bob74_ipl 2.7.1** (dernière version, 04/10/2026), code source lu intérieur par\nintérieur. Objectif : savoir exactement ce qui est déjà chargé par la ressource, ce que RoadLine en utilise, et\nce qui dort. **Zéro téléchargement, zéro poids réseau en plus, zéro risque de marque** : ces intérieurs sont\ndans le GTA V de chaque joueur, `bob74_ipl` ne fait que les allumer.\n\n- Source : https://github.com/Bob74/bob74_ipl · licence **MIT** (aucun souci de redistribution)\n- Déjà dans `server/cfg/resources.cfg` : `ensure bob74_ipl` (ligne 13)\n- Wiki des réglages par intérieur : https://github.com/Bob74/bob74_ipl/wiki\n\n---\n\n## 1. Trois familles d'intérieurs — ça change tout\n\nComprendre la différence évite de perdre du temps :\n\n| Famille | Où est l'intérieur | Ce qu'il faut pour y entrer |\n|---|---|---|\n| **A. Sous la carte** (DLC Online) | à des Z négatifs, hors de la ville (ex. `-38`, `-50`, `-100`) | une **porte-téléportation** dans `gs_interiors` (c'est exactement ce que fait la ressource aujourd'hui) |\n| **B. En place** (mode histoire, DLC « en ville ») | à sa vraie adresse dans Los Santos | **rien à téléporter** : le joueur pousse la porte. Il faut juste l'IPL allumé (c'est le cas) et, parfois, `ox_doorlock` pour gérer la serrure |\n| **C. Coquille** (*shell*) | un intérieur unique réutilisé | **un seul intérieur, plusieurs façades**, séparées par un `routing bucket` (un « monde » par locataire) |\n\n**La famille C est déjà en production chez nous** : `gs_hideouts` prend l'appartement bas de gamme du jeu\n(`261.46, -998.82, -99.0`) et donne à chaque locataire son propre monde (`Config.BucketBase = 5000`). Même\nintérieur, 3 motels différents, 0 Mo de plus. C'est le modèle à dupliquer.\n\n---\n\n## 2. Ce que RoadLine utilise aujourd'hui\n\n`gs_interiors/shared/config.lua` : **6 portes**, toutes dans la zone des business bikers et au casino.\n\n| Porte | Intérieur bob74_ipl | Centre réel de l'intérieur |\n|---|---|---|\n| `casino` | `dlc_casino/casino` | `1089.73, 206.36, -48.99` |\n| `lost_club` | `dlc_bikers/clubhouse1` | `1107.04, -3157.40, -37.52` |\n| `lab_families` | `dlc_bikers/weed` (ferme de cannabis) | `1051.49, -3196.54, -39.15` |\n| `lab_ballas` | `dlc_bikers/cocaine` (lockup) | `1093.60, -3196.60, -38.99` |\n| `lab_vagos` | `dlc_bikers/meth` (labo de meth) | `1009.50, -3196.60, -38.99` |\n| `lab_madrazo` | `dlc_bikers/counterfeit_cash` (faux billets) | `1121.90, -3195.34, -40.40` |\n\nAilleurs dans le serveur :\n- `gs_hideouts` → appartement bas de gamme (famille C, routing buckets)\n- `gs_casino` → l'intérieur du casino (roue, tables)\n- `gs_business` → Bahama Mamas **en place** (`-1388.4, -607.2, 30.32`), famille B, aucune téléportation\n\n**Verdict : on exploite 6 intérieurs sur ~90 disponibles.** Il reste beaucoup.\n\n---\n\n## 3. Inventaire complet (coordonnées lues dans le code source, donc exactes)\n\nCe sont les **centres d'intérieur** donnés par bob74_ipl. Pour une porte, le `inside` se cale à 2-5 m de là,\nà l'endroit où le joueur doit apparaître (voir § 6 : ça se fait en jeu en 20 secondes).\n\n### Famille A — sous la carte (une porte-téléportation à créer)\n\n| Intérieur | Fichier bob74 | Centre | État |\n|---|---|---|---|\n| Boîte de nuit (After Hours) | `dlc_afterhours/nightclubs` | `-1604.66, -3012.58, -78.00` | **libre** |\n| Club-house biker n°2 | `dlc_bikers/clubhouse2` | `998.48, -3164.71, -38.91` | **libre** |\n| Atelier de faux papiers | `dlc_bikers/document_forgery` | `1165.00, -3196.60, -39.01` | **libre** |\n| Arcade (salle de jeux) | `dlc_casino/arcade` | `2732.00, -380.00, -50.00` | **libre** |\n| Sous-sol de l' (Radio Los Santos) | Radio Los Santos existe déjà. Un studio où on enregistre pour de vrai, c'est une signature que personne n'a. |\n| 6 | **Garage de l'agence** | `gs_dossier` / `gs_evidence` | Le bureau du détective privé. Le RP enquête privée (hors police) n'a aujourd'hui aucun lieu. |\n| 7 | **Boîte de nuit** | `gs_business` + `gs_events` | Un intérieur, **10 façades possibles** dans la ville (coquille). Piste de danse, DJ, VIP, bureau, entrepôt au sous-sol. Le meilleur rapport qualité/poids du lot. |\n| 8 | **Labo d'acide** | `gs_drugs` | Une drogue de plus, dans un labo mobile (il est dans un camion dans le jeu de base). |\n| 9 | **Garage Eclipse Boulevard** | `gs_tuning` / `gs_hideouts` haut de gamme | 10 places de parking + atelier. Le garage de luxe que les joueurs riches veulent. |\n| 10 | **Hangar de contrebande (LSIA)** | `gs_smuggling` | `gs_smuggling` existe et n'a pas de base. Le hangar, c'est son QG évident. |\n| 11 | **Station de lavage** | `gs_business` (blanchiment) | Le blanchiment par commerce légal existe déjà. Un car-wash, c'est le cliché parfait — et c'est gratuit. |\n| 12 | **Maison milieu de gamme** | `gs_hideouts` | Un **palier au-dessus** des motels, avec le système de routing bucket déjà écrit. Quasi rien à coder : 1 ligne de config. |\n\nEt en réserve, sans porte à créer (famille B, le joueur entre physiquement) :\n- **Les 8 maisons de Vinewood** (Wild Oats, North Conker ×2, Hillcrest ×3, Whispymound, Mad Wayne Thunder) →\n  logement haut de gamme à leur vraie adresse. C'est ce que les serveurs vendent le plus cher.\n- **Les 3 villas** (Vinewood, Richman, Tongva) + leurs sous-sols → QG de gang de haut niveau, ou la maison du\n  joueur le plus riche du serveur.\n- **Les 4 bureaux de PDG** (Arcadius, Maze Bank, Lom Bank, Maze Bank West) → siège d'entreprise pour `gs_business`.\n- **Le musée Kortz Center** → cible de braquage d'œuvre d'art pour `gs_heists`, et lieu visitable le reste du temps.\n\n---\n\n## 5. Blocs prêts à coller dans `gs_interiors/shared/config.lua`\n\nLes `inside` ci-dessous sont **exacts** (lus dans la source de bob74_ipl). Les `outside` sont marqués\n`⚠ À RELEVER` : je ne peux pas les inventer sans risquer de poser un marqueur dans un mur. Le § 6 explique\ncomment les relever en jeu en 20 secondes par porte — et comment les corriger sans toucher au code.\n\n```lua\n-- ⚠ Chaque `outside` est à relever en jeu (F11 → Copier mes coordonnées), devant la façade indiquée.\n-- Les `inside` sont les centres d'intérieur donnés par bob74_ipl : à affiner de 2-5 m pour tomber\n-- sur le pas de porte intérieur plutôt qu'au milieu de la pièce.\n\n-- 1 · Faux papiers (accès gang). Façade : un local discret, idéalement dans le quartier du gang.\n{ id = 'faux_papiers', label = 'Atelier de faux papiers', access = { gang = 'madrazo' },\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(1165.0, -3196.6, -39.01, 180.0) },\n\n-- 2 · Bureau de caution / chasse aux primes (métier). Façade : près du commissariat de Mission Row.\n{ id = 'primes', label = 'Bureau de caution', access = { job = 'bail' }, blip = { sprite = 110, color = 5 },\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(565.89, -2688.76, -50.0, 0.0) },\n\n-- 3 · Los Santos Car Meet (public). Façade : l'entrepôt de Cypress Flats (rideau métallique).\n{ id = 'carmeet', label = 'Los Santos Car Meet', access = { public = true }, blip = { sprite = 226, color = 46 },\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(-2000.0, 1113.21, -25.36, 0.0) },\n\n-- 4 · Casse (métier mécano / fourrière). Façade : le portail de la casse.\n{ id = 'casse', label = 'Casse', access = { job = 'mecano' },\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(1077.28, -2274.88, -50.0, 0.0) },\n\n-- 5 · Studio d'enregistrement (public ou métier radio). Façade : l'immeuble du studio, Del Perro.\n{ id = 'studio', label = 'Studio d\\'enregistrement', access = { public = true }, blip = { sprite = 136, color = 27 },\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(-1010.22, -52.21, -100.0, 0.0) },\n\n-- 6 · Agence de détective privé (métier). Façade : l'entrée de l'agence.\n{ id = 'agence', label = 'Agence', access = { job = 'detective' },\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(-1071.83, -77.96, -95.0, 0.0) },\n\n-- 7 · Boîte de nuit (public la nuit). UN intérieur, 10 façades possibles : voir le § « coquille » ci-dessous.\n{ id = 'club', label = 'Boîte de nuit', access = { public = true }, blip = { sprite = 614, color = 27 },\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(-1604.66, -3012.58, -78.0, 0.0) },\n\n-- 8 · Labo d'acide (accès gang). Façade : un hangar ou un camion garé.\n{ id = 'lab_acide', label = 'Labo d\\'acide', access = { gang = 'lostmc' }, lab = 'acid',\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(483.43, -2625.07, -50.0, 0.0) },\n\n-- 9 · Garage Eclipse Boulevard (10 places + atelier). Façade : la rampe du parking.\n{ id = 'garage_eclipse', label = 'Garage Eclipse', access = { public = true },\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(519.25, -2618.79, -50.0, 0.0) },\n\n-- 10 · Hangar de contrebande (métier / gang). Façade : les hangars de l'aéroport.\n{ id = 'hangar', label = 'Hangar', access = { gang = 'lostmc' },\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(-1267.0, -3013.14, -49.5, 0.0) },\n\n-- 11 · Station de lavage (blanchiment, public). Façade : le car-wash.\n{ id = 'carwash', label = 'Station de lavage', access = { public = true },\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(26.07, -1398.98, -75.0, 0.0) },\n\n-- 12 · Club-house biker n°2 (second gang). Façade : un local de gang.\n{ id = 'club_house_2', label = 'Club-house', access = { gang = 'ballas' },\n  outside = vec4(0.0, 0.0, 0.0, 0.0),   -- ⚠ À RELEVER\n  inside  = vec4(998.48, -3164.71, -38.91, 0.0) },\n```\n\nPour le n°12 de la liste des recommandations (maison milieu de gamme), ce n'est **pas** une porte `gs_interiors` :\nc'est une ligne dans `gs_hideouts/shared/config.lua`, car le système de routing bucket est déjà là.\n\n```lua\n-- gs_hideouts : palier au-dessus des motels (même mécanique, intérieur plus grand)\n-- Intérieur : maison milieu de gamme du jeu, centre 347.27, -999.30, -99.20\n-- À ajouter dans Config.Sites avec son propre interior / stash / wardrobe (3 coords à relever dedans).\n```\n\n### La coquille, en pratique : 1 boîte de nuit → 10 façades\n\nL'intérieur `ba_int_placement_ba_interior_0_dlc_int_01_ba_milo_` est **unique** : les 10 boîtes de nuit de\nGTA Online partagent le même. Donc :\n\n- **une** entrée `Config.Doors` par façade (10 entrées), toutes avec le **même** `inside` ;\n- un `routing bucket` par club si tu veux qu'ils soient indépendants (comme `gs_hideouts`), ou aucun si tu\n  veux un seul club commun où tout le monde se croise (plus vivant, et plus simple).\n\nMon avis : **un seul club pour commencer**, commun à tous, dans un quartier central. Dix clubs vides valent\nmoins qu'un club plein. On en ouvre un deuxième quand le premier est trop petit.\n\n---\n\n## 6. Relever les coordonnées de façade (20 secondes par porte)\n\n1. En jeu, mode staff, `F11` → **Copier mes coordonnées** : le `vec4` complet (position + orientation) part\n   dans le presse-papiers. Place-toi devant la porte, **tourné vers elle**, et copie.\n2. Colle-le dans `outside`.\n\n**Et surtout** : `gs_interiors` inclut déjà `@gs_bridge/shared/points.lua`. Donc **chaque `outside` et chaque\n`inside` est déjà déplaçable en jeu** par le staff (`F11` → **Déplacer un point**), sans toucher au code et\nsans redémarrer le serveur à la main. Concrètement : on peut poser les 12 portes avec des coordonnées\napproximatives, puis les caler toutes en une seule session de jeu.\n\nC'est pour ça que je n'ai pas inventé les `outside` : ce n'est pas le travail difficile. Le travail difficile\n(savoir quels intérieurs existent, où ils sont exactement, et lesquels valent le coup) est fait ci-dessus.\n\n---\n\n## 7. Pièges à connaître\n\n- **Ne jamais déplacer un intérieur.** Les intérieurs de la famille A sont sous la carte à des coordonnées\n  fixes : si tu bouges le point `inside` de plus de quelques mètres, tu sors de l'intérieur et tu tombes dans\n  le vide. Le `outside`, lui, se déplace librement.\n- **`dlc_import/garage4` chevauche `dlc_finance/office4`** (le code de bob74_ipl le signale lui-même). Si tu\n  utilises les deux, vérifie en jeu.\n- **Un intérieur partagé est partagé.** Sans routing bucket, deux gangs qui auraient le même intérieur se\n  verraient. C'est déjà le cas chez nous : chaque labo a son propre intérieur, c'est volontaire.\n- **La famille B n'a pas besoin de nous.** Pour une villa ou une maison de Vinewood, le joueur pousse la\n  porte. S'il faut une serrure (clé, propriétaire), c'est `ox_doorlock`, pas `gs_interiors`.\n- **`sv_entityLockdown`** : ces portes ne créent aucune entité, donc aucun impact — même en `strict`\n  (voir le bloc de commentaires dans `server/cfg/prod.cfg`).\n- **Aucune marque réelle** dans tout ce qui précède : ce sont des lieux du jeu de base (Vanilla Unicorn,\n  Maze Bank, Bahama Mamas sont des marques **fictives** de Rockstar). Zéro risque Cfx.re.\n\n---\n\n## 8. Ce que ça coûte\n\n| Poste | Coût |\n|---|---|\n| Téléchargement joueur | **0 Mo** (déjà dans son GTA V) |\n| Poids serveur | **0 Mo** (`bob74_ipl` est déjà installé) |\n| Performance | une porte = un marqueur `gs_markers` + un blip. Négligeable, et les marqueurs non autorisés ne sont même pas créés côté client. |\n| Licence | MIT, aucune contrainte |\n| Risque Cfx.re / DMCA | **aucun** |\n| Travail | ~15 min par porte (relevé façade + test aller-retour), plus le branchement RP de la ressource concernée |\n\nÀ comparer avec un MLO payant : 25-45 € l'unité, 30-120 Mo de téléchargement par joueur, et une licence à\nvérifier. Voir `docs/MLO.md`.\n", "VEHICULES_ADDON": "# Véhicules « addon » (voitures moddées)\n\n## ⚠️ À lire avant d'ajouter des voitures de vraies marques\n\nLamborghini, Audi, Mercedes, BMW… sont des **marques déposées**, et la plupart des modèles 3D qui circulent\nsont des **rips** de jeux comme Forza ou Assetto Corsa, donc sans licence.\n\n- **Cfx (FiveM)** interdit de **vendre** ou de monétiser du contenu de marques tierces ou sans licence :\n  pas de voiture de vraie marque dans la boutique Tebex, ni en avantage payant.\n  L'enjeu, c'est la suspension de la clé serveur.\n- Pour les **ayants droit**, un serveur public avec des modèles rippés s'expose à une demande de retrait (DMCA).\n- Règle GTA SOON (prompt maître) : **aucune IP tierce**.\n\n**Ce qui reste possible :**\n1. Les véhicules **du jeu** qui s'en inspirent, prêts tout de suite et sans risque :\n   Pegassi **Toros** (SUV « Urus »), Obey **10F** (« R8 »), Obey **Tailgater S** (« A4/S4 »),\n   Benefactor **Schlagen GT** (« AMG GT »), Übermacht **Cypher** (« M2 »),\n   Pfister **Comet S2** (« 911 »), Enus **Paragon R** (« Continental »).\n2. Des modèles **originaux**, ou **sous licence explicite de leur auteur** (création gratuite avec autorisation\n   écrite, ou achat chez un créateur qui fournit une licence FiveM), **sans logo ni nom de marque réelle**.\n3. Le « flex » réel passe par le **style** (couleurs, néons, jantes, plaques perso), pas par le logo.\n\n## Ajouter un véhicule autorisé (5 min)\n\n1. Récupère le pack du créateur. Tu y trouves des `.yft` / `.ytd` (le modèle) et des `.meta` (réglages).\n2. Mets les `.yft` et `.ytd` dans `resources/[addons]/gs_cars/stream/`.\n3. Crée un dossier `resources/[addons]/gs_cars/data/<nom_du_modele>/` et mets-y ses `.meta`.\n4. Dans `cfg/resources.cfg`, décommente la ligne `ensure gs_cars` si ce n'est pas déjà fait.\n5. Pour qu'il apparaisse en concession et dans les garages Qbox, ajoute-le à `qbx_core/shared/vehicles.lua`\n   (modèle, nom, prix, catégorie) en suivant l'exemple des autres lignes.\n6. Redémarre, puis teste en jeu : menu staff **F11 → Faire apparaître un véhicule →** `<nom_du_modele>`.\n\n`METTRE-A-JOUR.bat` ne touche **jamais** à `[addons]` : tes véhicules ne sont pas écrasés par une mise à jour.\n\n## Poids et performance\n\nChaque voiture addon est téléchargée par tous les joueurs. Vise **moins de 16 Mo par véhicule**\n(textures en 2K maximum), et pas plus d'une trentaine de voitures au lancement : sinon, les premiers\nchargements seront très longs.\n", "PHOTOS": "# Photos Vibe, stories et bodycam\n\nTout est prêt dans le code ; il reste deux choses à faire de ton côté, sinon le bouton 📷 reste simplement masqué.\n\n## 1. screenshot-basic : déjà installé (V12.60)\nLa ressource officielle Cfx.re qui capture l'écran est **livrée compilée** dans `resources/[gtasoon]/screenshot-basic`\n(licence MIT) et démarrée par `cfg/resources.cfg` : METTRE-A-JOUR l'installe, rien à télécharger ni à compiler.\n\n## 2. Choisir un hébergeur d'images\nUn service qui accepte un envoi `multipart/form-data` et répond en JSON avec l'adresse de l'image (par exemple Fivemanage,\nou ton propre petit serveur). Dans `cfg/secrets.cfg` :\n```\nset gs_photo_upload_url \"https://…/upload\"      # adresse d'envoi\nset gs_photo_auth \"CLE_API\"                     # si l'hébergeur demande une clé (en-tête Authorization)\nset gs_photo_field \"file\"                       # nom du champ fichier\nset gs_photo_url_field \"url\"                    # champ JSON de la réponse contenant l'adresse\nset gs_photo_allowed_host \"https://…/\"          # début des adresses acceptées (le reste est refusé)\n```\nPourquoi c'est sûr : le joueur envoie sa capture **au serveur**, et c'est le serveur qui l'envoie à l'hébergeur : la clé\nne quitte jamais le serveur. Les adresses d'images affichées sont limitées à ton hébergeur (pas de traçage d'IP par un\nsite tiers). Taille max 1,5 Mo, une photo toutes les 20 s par joueur.\n\n## Ce que ça débloque\n- Vibe : bouton 📷 → photo dans un post, ou **story 24 h** (bandeau en haut du fil).\n- **Heure dorée** (18 h – 20 h, heure du jeu) : une photo par jour rapporte de l'XP.\n- Police : **capture bodycam** jointe à un rapport (F4 → Dossiers → Rapports → Nouveau rapport).\n- **Lives staff** (V12.60, gs_lives) : F11 → Lives ou `/lives` : l'écran d'un ou plusieurs joueurs dans des fenêtres\n  déplaçables (une image toutes les 1,5 s, rien n'est enregistré, chaque visionnage est écrit dans le journal staff).\n  Seul screenshot-basic est nécessaire (pas d'hébergeur d'images).\n  V12.63 : la capture est faite chez le joueur et renvoyée par le réseau du jeu (plus d'envoi par une adresse web) ; la même image sert\n  à F11, à l'appli staff et aux replays des tickets ; screenshot-basic livré patché pour les versions récentes de FiveM (rappel en\n  https). Si l'image ne vient pas, la fenêtre dit pourquoi ; F8 `/livestest` teste la capture sur son PC, « (toi : test) » dans la liste\n  permet de vérifier seul. Photomaton de la fête foraine (gs_casino) : même photo que l'appareil argentique, image réelle si l'hébergement\n  des photos est configuré.\n", "INSTALL": "# Installation du serveur de dev (local, Windows)\n\n[CONFIG] Checklist Phase 0. Rien n'est exposé sur Internet : on joue en `localhost`.\nLes écrans et menus exacts de txAdmin/Qbox évoluent : en cas de doute, docs.qbox.re et docs.fivem.net font foi.\n\n## 0. Liens officiels (ne télécharger que là)\n| Quoi | Lien |\n|---|---|\n| **MariaDB** (recommandé) | https://mariadb.org/download/ → version **LTS**, Windows, x86_64, **MSI** |\n| Alternative : XAMPP (MariaDB + panneau, local uniquement) | https://www.apachefriends.org/ |\n| Alternative : MySQL 8 | https://dev.mysql.com/downloads/installer/ |\n| HeidiSQL (voir la base, souvent installé avec MariaDB) | https://www.heidisql.com/download.php |\n| Serveur FiveM (artifacts Windows, prendre « Latest Recommended ») | https://runtime.fivem.net/artifacts/fivem/build_server_windows/master/ |\n| Clé de licence serveur (gratuite) | https://portal.cfx.re (anciennement keymaster.fivem.net) |\n| Doc Qbox (recipe, ressources) | https://docs.qbox.re |\n| Doc FiveM / txAdmin | https://docs.fivem.net |\n**Un seul** serveur de BDD à la fois (MariaDB OU XAMPP OU MySQL) : ils utilisent tous le port 3306.\n\n## Ce qu'il faut pour tester concrètement\n1. MariaDB installé (ci-dessous) · 2. artifacts FXServer · 3. clé de licence · 4. recipe Qbox dans txAdmin ·\n5. `brancher-gtasoon.bat` · 6. te donner le groupe admin · 7. te connecter avec FiveM (F8 → `connect localhost`).\n**Tester à 2** (duo, embauche, factures) : ton pote doit pouvoir joindre ton PC. Le plus simple et sans ouvrir de port :\nun VPN privé gratuit type **Tailscale** (vous l'installez tous les deux, il se connecte à ton IP Tailscale).\nSinon : ouvrir le port 30120 TCP+UDP sur ta box (moins sûr).\n\n## ⚡ Installation express (recommandée) : sans la recipe txAdmin\n1. `scripts/windows/reparer-mariadb.bat` → crée l'utilisateur `gtasoon` (identifiants sur le Bureau).\n2. `scripts/windows/installer-serveur.bat` → installe Qbox (recipe officielle exécutée sans l'API GitHub,\n   donc sans « rate limit »), branche GTA SOON, ajoute les items, crée `C:\\GTASOON\\server-data\\DEMARRER.bat` et lance le serveur.\n3. FiveM → F8 → `connect localhost`.\nPlus tard, txAdmin peut reprendre ce serveur : setup → « Existing server data » → `C:\\GTASOON\\server-data`.\n\n## Premier lancement en 6 étapes (version simple)\n1. **txAdmin n'est pas un logiciel à part** : il est inclus dans le serveur FiveM. Télécharge les artifacts\n   (lien ci-dessus, fichier `server.7z` du build « Latest Recommended »), extrais-le dans `C:\\FXServer\\server`.\n2. Double-clic sur `C:\\FXServer\\server\\FXServer.exe` : une fenêtre noire s'ouvre et ton navigateur affiche\n   **txAdmin** (`http://localhost:40120`). Un **code PIN** s'affiche dans la fenêtre noire : entre-le.\n3. Connecte ton compte Cfx.re, choisis un mot de passe admin, puis **Popular Recipes → Qbox**.\n   Base de données : hôte `localhost`, utilisateur `root`, le mot de passe MariaDB noté.\n4. Quand la recipe a fini : lance `scripts/windows/brancher-gtasoon.bat` et choisis le dossier du serveur créé par txAdmin\n   (celui qui contient `server.cfg`, souvent dans `C:\\FXServer\\txData\\...`).\n5. Dans txAdmin : bouton **Start** (ou Restart). Laisse la fenêtre noire ouverte.\n6. **Se connecter** : lance FiveM, puis appuie sur **F8** dans le menu principal de FiveM : une console s'ouvre en haut,\n   tape `connect localhost` et Entrée. (Alternative sans F8 : onglet « Localhost / Direct connect » du menu FiveM, adresse `localhost`.)\n\n## 1. Prérequis\n- [ ] GTA V **Legacy** + client FiveM qui se lance (voir FAQ en bas)\n- [ ] Git (ou GitHub Desktop), et ce repo cloné\n- [ ] MariaDB, installé comme ci-dessous\n\n### MariaDB en 5 minutes (obligatoire : Qbox y stocke persos, inventaires, contrats)\n1. mariadb.org/download → version **LTS**, Windows x86_64, fichier `.msi`\n2. Lancer l'installeur, tout laisser par défaut, sauf :\n   - cocher **Modify password for database user 'root'** → choisir un mot de passe et **le noter**\n   - laisser coché **Install as service** (MariaDB démarre avec Windows)\n3. Terminer. C'est tout : pas besoin de créer la base à la main, la recipe txAdmin le fait.\n4. Dans txAdmin, à l'étape base de données de la recipe : hôte `localhost`, port `3306`,\n   utilisateur `root`, le mot de passe noté. (En local seulement ; en prod on utilisera un\n   utilisateur dédié, pas root.)\n5. Optionnel : HeidiSQL (installé avec MariaDB) pour voir les tables.\n\n## 2. FXServer + txAdmin + Qbox\n- [ ] Télécharger les artifacts serveur Windows (runtime.fivem.net, build \"recommended\")\n- [ ] Lancer `FXServer.exe` → txAdmin s'ouvre sur `http://localhost:40120` → code PIN affiché en console\n- [ ] Créer le compte admin txAdmin, choisir **Popular Recipes → Qbox**\n- [ ] Clé de licence : keymaster.fivem.net (gratuite)\n- [ ] Laisser la recipe installer les ressources et la BDD\n\n## 3. Brancher GTA SOON sur la recipe (automatique)\n- [ ] Double-cliquer sur `scripts/windows/brancher-gtasoon.bat` et choisir le dossier du serveur\n      (celui qui contient `server.cfg` et `resources`). Le script :\n      sauvegarde le cfg de la recipe, copie nos ressources et `cfg/`, crée `cfg/secrets.cfg` avec ta\n      licence et ta connexion MySQL, met de côté les doublons, et liste ce qui manque.\n      Non testé sur une vraie machine Windows : envoie la sortie à [DEV] si une ligne est rouge.\n- [ ] Étapes Qbox de `docs/JOBS.md` (jobs en double, maxJobsPerPlayer)\n- [ ] **Items** : copier le contenu de `server/ox_items_gtasoon.lua` dans `resources/[ox]/ox_inventory/data/items.lua`\n- [ ] Ajouter ton identifiant `license:` en `group.admin` dans `cfg/secrets.cfg`\n      (txAdmin → Players → ton joueur → identifiers)\n\n## 4. Premier démarrage\n- [ ] Console : `[gs_jobs] prêt : 6 jobs chargés`, aucune ligne rouge\n- [ ] Console : aucune erreur `[gs_bridge]` (sinon un nom d'API `[API]` est à corriger dans gs_bridge)\n- [ ] En jeu : F8 → `connect localhost`\n- [ ] `/gsjob add <ton id> police 4`, F6, prise de service, `/meteo RAIN 5`, `/heure 18 30`\n- [ ] `resmon 1` : chaque ressource `gs_*` < 0,5 ms au repos\n\n## 5. Avant chaque mise à jour\n- [ ] `./tests/run.sh` vert (syntaxe, linter config, tests logique)\n- [ ] `scripts/backup_db.sh` puis restart via txAdmin\n\n## FAQ — FiveM ne détecte pas GTA\nVersion complète pas à pas : [`FAQ_FIVEM.md`](FAQ_FIVEM.md). Résumé :\nFiveM ne marche qu'avec **GTA V Legacy** (pas Enhanced), inclus dans l'achat (entrée séparée Steam/Epic).\n1. Fermer FiveM (Gestionnaire des tâches).\n2. Supprimer `%localappdata%\\FiveM\\FiveM.app\\CitizenFX.ini` (désinstaller FiveM ne l'efface pas :\n   c'est lui qui garde l'ancien chemin). Radical : supprimer tout `%localappdata%\\FiveM`.\n3. Relancer FiveM et donner le dossier qui contient **`GTA5.exe`**\n   (s'il n'y a que `GTA5_Enhanced.exe`, c'est Enhanced, pas Legacy).\n4. Toujours bloqué : noter le message exact + plateforme + liste des `.exe` du dossier du jeu.\n", "OVH": "# RoadLine RP sur le VPS OVH\n\nCe guide explique comment passer du PC de développement au serveur officiel sur le VPS OVH, sous Ubuntu ou Debian.\nTrois outils font tout le travail, en un double-clic chacun. Ta base de données n'est jamais écrasée sans ta confirmation.\n\n| Quoi | Où | Quand |\n|---|---|---|\n| `PREPARER-OVH.bat` | PC | Une seule fois (première mise en ligne), ou pour renvoyer toute la base |\n| `METTRE-A-JOUR-OVH.bat` | PC | À chaque nouvelle version (la base du VPS n'est jamais touchée) |\n| `GERER-OVH.bat` | PC | Au quotidien : état, console, redémarrage, public/privé, sauvegardes, mode, retour arrière |\n| `roadline …` | VPS (SSH) | Les mêmes commandes, à la main (pour les habitués) |\n\n## 0. Avant de commencer (5 min)\n\n1. **Espace client OVH** : Bare Metal Cloud → VPS → ton VPS.\n   - Réinstalle-le en **Ubuntu 24.04** si ce n'est pas déjà le cas (image sans panneau).\n   - Note l'**adresse IP**.\n   - L'utilisateur est `ubuntu`. Aucun mot de passe à retenir : la connexion se fait par une clé (voir plus bas).\n2. **Licence FiveM** : sur keymaster.fivem.net, crée une clé pour l'IP du VPS (ou réutilise la tienne).\n   - Elle est déjà dans ton `secrets.cfg` si tu l'avais mise en local.\n3. **Sur le PC** :\n   - le serveur local est **fermé** ;\n   - MariaDB tourne (la base doit être lisible) ;\n   - **METTRE-A-JOUR.bat** a été lancé avec la dernière version.\n\n## 1. Mise en ligne (une fois) : `PREPARER-OVH.bat`\n\nL'outil te demande :\n- l'**IP** et l'**utilisateur** du VPS (ces deux infos sont retenues pour les fois suivantes).\n\nIl fait ensuite tout seul :\n\n1. **Sauvegarde de ta base locale** dans `base.sql` (personnages, argent, inventaires, gangs, véhicules…).\n2. **Copie de `server-data`**, sans cache ni journaux, dans une archive au format Linux.\n3. **Envoi sur le VPS**. La copie locale contient la base et les secrets : elle est effacée du PC juste après.\n4. **Installation sur le VPS** (`installer-ovh.sh`) :\n   - installe MariaDB et le programme FiveM pour Linux (version recommandée) ;\n   - crée la base `gtasoon` avec un **mot de passe aléatoire**. Ce mot de passe n'est jamais affiché ; il est gardé dans `/home/fivem/outils/.env` ;\n   - **importe ta base**. Si le VPS contient déjà des personnages, il demande de taper `ECRASER`. Sans cette confirmation, la base du VPS est gardée, et une sauvegarde est faite avant tout import ;\n   - ouvre le pare-feu : SSH, `30120` pour le jeu, `40120` pour txAdmin ;\n   - crée un service qui **démarre le serveur tout seul** (OneSync activé, rien à configurer) et le relance après un plantage ou un redémarrage du VPS ;\n   - programme une sauvegarde de la base toutes les 6 h ;\n   - laisse le serveur en **profil privé** (caché de la liste, 16 places pour le backtest) pour que tu puisses tester d'abord.\n\n> **Aucun mot de passe à taper** : au début, l'outil copie la « clé » de ton PC et te dit où la coller chez OVH\n> (Réinstaller mon VPS → Ubuntu 24.04 → champ « Clé SSH » → coller → Confirmer). La fenêtre attend toute seule la fin\n> de la réinstallation (5 à 10 min), puis enchaîne. Les mises à jour suivantes n'ont plus rien à demander.\n>\n> (Ancienne méthode, si tu préfères le mot de passe : il ne s'affiche pas quand tu le tapes (ni étoiles, ni chiffres) : c'est normal sous Linux. Tape-le\n> (ou colle-le avec un clic droit dans la fenêtre), puis Entrée. Il n'est demandé qu'une fois : l'outil installe ensuite\n> une clé de connexion, et les mises à jour ne le redemandent plus.)\n\n**C'est tout : rien à configurer à la fin.** Le serveur est déjà lancé.\n\n> txAdmin (panneau web, code PIN) n'est plus nécessaire. Si tu le veux plus tard : `GERER-OVH.bat` → **Mode txAdmin**\n> (puis http://IP-DU-VPS:40120 avec le PIN affiché, « Existing server data » → `/home/fivem/server-data`, OneSync On).\n> Pour revenir : `GERER-OVH.bat` → **Mode simple**.\n\nEnsuite, en jeu : **F8** → `connect IP-DU-VPS:30120`.\n\n## 2. Ouvrir au public\n\nUne fois tes tests faits : `GERER-OVH.bat` → **Ouvrir au PUBLIC** (liste FiveM, 48 places, protections prod).\nPour une maintenance : **Repasser en PRIVÉ**. (En SSH : `sudo roadline public` / `sudo roadline prive`.)\n\nLe choix est retenu : les mises à jour ne le changent pas.\n\n> Au-delà de 48 joueurs, il faut un abonnement Cfx.re Element Club (Argentum ou plus) et augmenter `sv_maxclients` dans `cfg/prod.cfg`.\n\n## 3. Mettre à jour (à chaque version) : `METTRE-A-JOUR-OVH.bat`\n\n> **PC = test, VPS = officiel.** METTRE-A-JOUR.bat ne change que le serveur du PC (ta base locale, tes essais). Rien ne part sur le VPS\n> tant que tu ne lances pas METTRE-A-JOUR-OVH.bat. Ce qui est envoyé : RoadLine, les autres ressources modifiées depuis le dernier envoi,\n> les `cfg`, `permissions.cfg` compris (V12.36 : groupes et ACE, dont « admin » pour /optin ; le staff ajouté à la main sur le VPS est conservé).\n> Jamais la base ni `secrets.cfg` (réglages du VPS : option 12 si tu veux les remplacer).\n\n1. Sur le PC : **METTRE-A-JOUR.bat** avec le nouveau zip, puis un test rapide en local.\n2. **METTRE-A-JOUR-OVH.bat**.\n\nL'outil envoie :\n- tout RoadLine (`[gtasoon]`) ;\n- les fichiers des autres ressources modifiés depuis le dernier envoi (réglages Qbox, nouveaux mods importés) ; les gros fichiers\n  déjà présents sur le VPS avec la même taille ne repartent pas (V12.63) ;\n- les fichiers `cfg`.\n\nPendant l'envoi, l'avancée s'affiche (Mo reçus, %, temps restant). Si la connexion coupe, l'outil reprend tout seul ; si tu\nrelances l'outil après une coupure, réponds **O** à « reprendre » : le VPS complète l'archive au lieu de tout recevoir à nouveau.\nPendant un gros envoi, GERER-OVH peut être lent (la connexion est occupée) : attends la fin de l'envoi.\n\nSur le VPS, il :\n- **sauvegarde la base** ;\n- arrête le serveur, installe la mise à jour et redémarre (environ 30 s de coupure) ;\n- garde les **3 versions précédentes**.\n\n**Jamais envoyés** : `secrets.cfg` (clés et codes du VPS) et la base. `permissions.cfg` est envoyé depuis la V12.36 (structure des groupes et ACE) ; les lignes `add_principal identifier…` écrites à la main sur le VPS sont gardées à la fin du fichier.\n\nSi une mise à jour pose problème : `GERER-OVH.bat` → **Revenir à la version précédente** (10 secondes).\n\n## 4. Au quotidien : `GERER-OVH.bat`\n\nUn menu sur le PC, sans mot de passe (connexion par la clé). Au lancement, il remet à jour la commande `roadline` du VPS\net termine tout seul une installation interrompue.\n\n| N° | Option | Quand |\n|---|---|---|\n| 1 | État + diagnostic | Version en ligne, profil, service, port 30120, cause en clair si le serveur ne répond pas |\n| 2 | Console | Les 60 dernières lignes |\n| 3 | Erreurs de scripts | Backtest : erreurs depuis le démarrage, regroupées par ressource |\n| 4 / 5 / 6 | Redémarrer / Arrêter / Démarrer | Maintenance |\n| 7 / 8 | Public / Privé | Ouvrir (48 places, liste FiveM) ou cacher (16 places, testeurs) |\n| 9 / 10 | Sauvegarder / Liste | Sauvegarde immédiate (sinon auto toutes les 6 h, 30 gardées) |\n| 11 | Copier la dernière sauvegarde sur le PC | Copie de sécurité hors VPS (`C:\\GTASOON\\ovh\\sauvegardes-vps`) |\n| 12 | Envoyer mes réglages du PC | Après CONFIGURER-DISCORD (`secrets.cfg`) ; gardés côté VPS : base, codes du panneau staff, txAdmin, heure du redémarrage |\n| 13 | Revenir à la version précédente | Une mise à jour pose problème |\n| 14 / 15 | Mode simple / txAdmin | Démarrage direct (défaut) ou panneau txAdmin (port 40120) |\n| 16 | Console du VPS | Pour les habitués |\n| 17 | Vérifier Discord | Bot connecté ? Un message de test est posté dans chaque salon relié |\n| 18 | Copie automatique sur ce PC | Tâche Windows : chaque jour à 12 h, 14 copies gardées dans `C:\\GTASOON\\ovh\\sauvegardes-vps` |\n| 19 | Heure du redémarrage quotidien | 06:00 par défaut (heure de Paris), annoncé en jeu ; `off` pour désactiver |\n| 20 | Codes du panneau staff | Voir / ajouter / retirer l'accès d'un membre au panneau sur téléphone |\n| 21 | Adresse https | Une fois : panneau staff installable comme une appli + carte en direct sur le site |\n| 22 | txAdmin : mauvais compte | Mauvais compte Cfx.re lié ? Nouveau code PIN, la configuration du serveur est gardée |\n\n**Tout seul sur le VPS (V11)** :\n- **veille** toutes les 2 min : serveur injoignable 4 min → alerte dans le salon staff Discord et relance ; message quand il revient.\n  Un arrêt volontaire (option 5) ne déclenche rien ;\n- **redémarrage quotidien** à 6 h, annoncé en jeu 15, 5 et 1 min avant ;\n- **sauvegardes** de la base toutes les 6 h (30 gardées), heure de Paris.\n\n**txAdmin** (option 15) : l'outil affiche le code PIN et les 3 étapes (compte Cfx.re, « Existing server data » →\n`/home/fivem/server-data`, OneSync On). Le bouton « Ouvrir txAdmin » apparaît alors dans le panneau staff mobile.\nRetour au démarrage automatique : option 14.\n\nLes mêmes commandes existent en SSH :\n\n```\nroadline etat                 version, profil, état, disque, mémoire\nsudo roadline diagnostic      pourquoi le serveur ne répond pas · sudo roadline erreurs : erreurs de scripts\nsudo roadline mode simple     démarrage direct (défaut) · sudo roadline mode txadmin : panneau web 40120\nroadline logs                 dernières lignes de la console (roadline suivre : en direct)\nsudo roadline redemarrer      redémarrer le serveur\nsudo roadline sauvegarde      sauvegarde immédiate de la base (auto toutes les 6 h, 30 gardées)\nsudo roadline sauvegardes     liste des sauvegardes\nsudo roadline restaurer FICHIER              toute la base revient à cette heure (serveur arrêté)\nsudo roadline restaurer-joueur FICHIER CID   un seul joueur (perso + véhicules) revient à cette heure\nsudo roadline programme       mettre à jour le programme FiveM (version recommandée)\n```\n\nLes **bannissements** et la modération se font en jeu (menu admin), sur le panneau staff web ou par le bot Discord (section 5).\n\n## 5. Modération depuis le téléphone\n\nDeux façons, à combiner (plus txAdmin si tu l'as activé) :\n\n1. **Panneau staff RoadLine** (une appli sur le téléphone) : joueurs, tickets, geler / dégeler, message, avertir, expulser, annonce, txAdmin.\n   - **Une fois** : `GERER-OVH.bat` → **21** (adresse https gratuite, certificat automatique). L'adresse devient\n     `https://57-129-170-173.sslip.io/gs_admin/` (l'IP du VPS avec des tirets).\n   - **Pour chaque membre** : `GERER-OVH.bat` → **20** → A → son pseudo. Le code s'affiche une seule fois : donne-le-lui en privé.\n     Le serveur redémarre (1 min). R → pseudo : retire l'accès.\n   - **Installer l'appli** : ouvrir l'adresse dans Chrome (Android : menu ⋮ → « Installer l'application ») ou Safari (iPhone : Partager\n     → « Sur l'écran d'accueil »). Icône « RL Staff », plein écran. Marche aussi dans un navigateur classique (PC compris).\n   - Sans l'option 21, ça marche aussi en `http://57.129.170.173:30120/gs_admin/` (raccourci simple, sans « vraie » appli).\n   - Aussi en bas du site : lien « Espace staff ». 5 essais ratés depuis une même adresse la bloquent 15 minutes.\n2. **Bot Discord** : `/joueurs`, `/geler`, `/degeler`, `/avertir`, `/expulser`, `/message`, `/annonce`.\n   - Réservé aux administrateurs du Discord et au rôle indiqué dans `set gs_discord_staff_role \"ID-DU-ROLE\"` (secrets.cfg).\n   - Réponses visibles par toi seul.\n\nToutes les actions sont journalisées (« Web · pseudo », « Discord · pseudo ») dans les logs staff.\n\n## 6. Éditer un réglage sur le VPS\n\nLe plus simple : modifie les réglages sur le PC (CONFIGURER-DISCORD.bat, `cfg\\secrets.cfg`), puis `GERER-OVH.bat` → **12**.\nSinon, le fichier à modifier sur le VPS est `secrets.cfg` (codes, webhooks, jeton du bot, et le staff : `add_principal identifier.license:… group.god`, posé par DEVENIR-ADMIN puis GERER-OVH → 12). `permissions.cfg` (groupes, ACE) vient du PC à chaque METTRE-A-JOUR-OVH. Utilise WinSCP ou FileZilla en SFTP, ou `sudo nano /home/fivem/server-data/cfg/secrets.cfg`, puis `GERER-OVH.bat` → **Redémarrer**.\n\n## Dépannage\n\n| Symptôme | Solution |\n|---|---|\n| « You are required to change your password » | Géré par l'outil : colle le mot de passe du mail OVH quand il le demande (une seule fois) |\n| L'envoi est refusé / la fenêtre attend sans fin | Vérifie l'IP et l'utilisateur (`ubuntu`), et que la clé a bien été collée dans « Clé SSH » à la réinstallation |\n| « ssh introuvable » | Paramètres Windows → Applications → Fonctionnalités facultatives → **Client OpenSSH** |\n| Qbox ne démarre pas, erreur OneSync | `GERER-OVH.bat` → **Mode simple** (OneSync y est toujours activé) |\n| On m'a parlé d'un code PIN txAdmin | Inutile en mode simple : `GERER-OVH.bat` → **Mode simple** |\n| Le serveur n'apparaît pas dans la liste | Normal en profil privé : `GERER-OVH.bat` → **Ouvrir au PUBLIC** |\n| Base vide après l'installation | La base du PC n'a pas pu être lue (MariaDB arrêté). Relance PREPARER-OVH avec MariaDB démarré, puis tape `ECRASER` |\n| « Quitting: Ctrl-C pressed » dans la console | Relance `GERER-OVH.bat` : il corrige le service tout seul |\n| METTRE-A-JOUR-OVH annonce une ancienne version | Il propose de mettre le PC à jour d'abord : réponds O |\n| `items.lua … '}' expected near 'eau'` (inventaire, coffres, qbx_core en erreur) | Relance `GERER-OVH.bat` : il répare les fichiers d'objets tout seul et redémarre (ou `sudo roadline reparer-objets`) |\n| Une mise à jour casse quelque chose | `GERER-OVH.bat` → **Revenir à la version précédente**, puis **Console** pour voir l'erreur |\n\n## Points déplacés en jeu (V12.37)\n\nLes points déplacés depuis F11 sont gardés dans la mémoire du serveur (KVP) et survivent à « roadline maj ». Depuis la V12.37, gs_bridge\nles écrit aussi dans `resources/[gtasoon]/gs_bridge/points-deplaces.json` : METTRE-A-JOUR-OVH emporte celui du PC et le VPS l'importe au\ndémarrage (une seule fois par version du fichier). Si l'archive n'en contient pas, le VPS garde le sien. Le PC est la référence : cale les\npoints sur le PC (ou `/pointsexport` en console pour écrire le fichier tout de suite), puis METTRE-A-JOUR-OVH.\n", "PERFORMANCE": "# Budget de performance\n\nObjectif : serveur fluide à 48 joueurs, **client < 0,10 ms par ressource gs_*** au repos dans `resmon`, et aucune ressource\nau-dessus de **0,50 ms** en action (menu, course, braquage).\n\n## Vérifié automatiquement (`tests/check_perf.py`, lancé par les tests et avant chaque envoi)\n- toute boucle `while true do` a un `Wait` (sinon le jeu gèle) ;\n- une boucle qui tourne à **chaque image** doit être justifiée par un commentaire « par frame » ; aujourd'hui : 4\n  (densité PNJ — obligatoire pour GTA —, placement d'objet du builder, animation de la roue, bulles /me) ;\n- côté serveur, pas de boucle infinie plus rapide que 250 ms ;\n- au plus **12 threads client** et **2 boucles permanentes par image** par ressource.\n`python3 tests/check_perf.py -v` affiche le tableau par ressource.\n\n## Règles de conception suivies\n- Pas de boucle par frame au repos : les boucles rapides ne tournent que pendant une action (course, examen, quête).\n- Marqueurs : un seul fil pour tous (gs_markers), tri par distance toutes les 500 ms.\n- Données partagées par `GlobalState` / state bags (pas d'events récurrents).\n- Écritures en base regroupées (cumuls en mémoire, écriture toutes les 60 s : économie, réputation, territoires).\n- Cayo Perico et les props (plants, roue) ne sont chargés qu'à proximité.\n\n## À mesurer en jeu (test de charge)\n1. `resmon 1` dans la console F8, se promener 5 min en ville : noter les 10 ressources les plus lourdes.\n2. Même chose pendant une course, un braquage, un rassemblement Vibe.\n3. Côté serveur : txAdmin → « Diagnostics » (temps des threads) avec 15 puis 30 joueurs.\n4. Toute ressource au-dessus du budget → ticket « perf » avec la capture `resmon`.\n", "ARCHITECTURE": "# Architecture (v0 — à valider par Alpha)\n\n[DEV] Principe : **logique métier découplée du framework** pour rester portable, **données centralisées** (MariaDB en jeu, Supabase pour web/companion).\n\n## Couches\n| Couche | Rôle | Techno |\n|---|---|---|\n| Runtime | serveur de jeu, restarts, backups, bans | FXServer + txAdmin |\n| Framework | joueurs, jobs, gangs, inventaire | Qbox, ox_lib, ox_inventory, ox_target, oxmysql |\n| Voix | proximité, radio, téléphone | pma-voice |\n| Ressources maison (`gs_*`) | features signature | Lua + NUI React/Vite |\n| Web | vitrine, WL future, companion, auth | Netlify + Supabase |\n| Automatisation | logs staff, annonces, sync | webhooks Discord + Make |\n| Monétisation | cosmétiques / confort | Tebex |\n\n## Règles de découplage\n- Chaque feature = une ressource `gs_<nom>` avec `server/` (logique + validation), `client/` (affichage, input), `shared/` (config).\n- Accès framework via une fine couche d'adaptation (`gs_bridge`, à créer Phase 1) : le reste du code n'appelle jamais `qbx_core` directement → portage possible.\n- Le client n'envoie que des **intentions** ; le serveur décide.\n\n## Flux données\nJeu (oxmysql/MariaDB) → événements serveur → webhook/Make → Discord / Supabase (companion, réseau social in-game → Discord/TikTok).\nSupabase n'a jamais d'accès direct à la BDD de jeu : seulement via endpoint serveur signé.\n\n## Ordre des `ensure` (cible)\n`oxmysql` → `ox_lib` → `qbx_core` → `ox_inventory` → `ox_target` → `pma-voice` → `gs_security` → `gs_bridge` → `gs_jobs` → autres `gs_*`.\nÀ confirmer avec docs.qbox.re à l'installation (l'ordre exact dépend de la version).\n\n## Note impact / risques / rollback\n- Impact : aucun code de jeu encore, structure et conventions seulement.\n- Risques : dérive de version Qbox/ox (figer les versions dans un `manifest` de déploiement) ; couplage si on saute `gs_bridge`.\n- Rollback : revert du commit ; pour la BDD, restore du dernier dump (`scripts/backup_db.sh`).\n\n## Questions ouvertes pour Alpha\n1. Nom définitif / préfixe de ressources (`gs_` provisoire) ?\n2. Hébergeur (anti-DDoS, NVMe) et slots visés au lancement ?\n3. Repo unique (jeu + web) ou séparé pour le companion/vitrine ?\n", "V1_RESOURCES": "# Ressources V1 : on récupère l'existant, on ne recode que le différenciant\n\n[DEV] Règle : une ressource open-source maintenue et auditée > un script maison. On recode seulement\nce qui fait notre identité (features signature Phase 2) ou ce qui n'existe pas proprement.\nChaque ressource passe la checklist d'audit (`docs/SECURITY.md`) avant install. Noms et dépôts\nà confirmer sur github.com/Qbox-project et github.com/overextended au moment de l'install.\n\n| Besoin | Ressource | Source | Statut |\n|---|---|---|---|\n| Framework | qbx_core, ox_lib, oxmysql | Qbox / overextended | base |\n| Inventaire, interactions | ox_inventory, ox_target | overextended | base |\n| Voix / radio | pma-voice (+ radio Qbox) | AvarianKnight / Qbox | base |\n| Création perso / spawn | sélection de perso intégrée à qbx_core (à confirmer), qbx_spawn | Qbox | à installer |\n| Apparence / tenues | illenium-appearance | open-source | à installer |\n| Clés / garages / concession | qbx_vehiclekeys, qbx_garages, qbx_vehicleshop | Qbox | à installer |\n| Carburant | ox_fuel | overextended | à installer |\n| Police (menottes, fouille, escorte) | qbx_policejob | Qbox | installer, **désactiver** son service/garage/coffres (gérés par gs_jobs) |\n| EMS (mort, réanimation) | qbx_medical + qbx_ambulancejob | Qbox | idem |\n| Mairie / papiers | qbx_cityhall | Qbox | installer, désactiver sa liste de jobs (Pôle Emploi = gs_jobs) |\n| Banque | Renewed-Banking | open-source | à évaluer (overlap caisses société) |\n| Téléphone | npwd (open-source) ou payant | — | décision Alpha |\n| HUD | qbx_hud ou HUD maison NUI (DA néon) | — | Phase 2 |\n| Boss menu / multijob | ~~qbx_management~~ | — | **remplacé par gs_jobs** |\n| Multi-job, caisses, paie, factures, missions | **gs_jobs** | maison | ✅ fait |\n| Anti-abus events, logs | **gs_security** | maison | ✅ fait |\n| Météo / heure | ~~qbx_weathersync~~ → **gs_weather** | maison | ✅ fait |\n| Dispatch / recherche | **gs_wanted** | maison | ✅ fait |\n| Commerces / revente | **gs_economy** (remplace les shops statiques des supérettes) | maison | ✅ fait |\n| Duo criminel | **gs_duo** | maison | ✅ fait |\n| Réseau social | **gs_social** (Néon, miroir Discord) | maison | ✅ fait |\n| Écran de chargement | **gs_loadscreen** | maison | ✅ fait |\n| Panel staff RP | **gs_admin** (complète le menu txAdmin) | maison | ✅ fait |\n| Téléphone | **gs_phone** | maison | ✅ fait |\n| HUD | **gs_hud** | maison | ✅ fait |\n| Gangs / territoires | **gs_gangs** | maison | ✅ fait |\n| Mapping en jeu | **gs_builder** | maison | ✅ fait |\n| Braquages | **gs_heists** | maison | ✅ fait |\n| Drogue | **gs_drugs** | maison | ✅ fait |\n| Boutique Tebex | **gs_store** (désactivée tant que la conformité PLA n'est pas validée) | maison | ✅ fait |\n\nReste en Phase 2 : companion web (Supabase + Netlify).\nFaits : météo événementielle, wanted intelligent, économie dynamique, duo criminel lié, réseau social Néon (`docs/FEATURES.md`).\n", "AGENTS": "# Agents & workflow\n\n## Agents\n- **[DEV] Dev senior & cybersécu** : archi, Lua/JS/React, revue de code, sécurité défensive. Livrable : code commenté + note *impact / risques / rollback*.\n- **[CONFIG] Configurateur** : configs (jobs, items, prix, véhicules, blips), traductions FR, `server.cfg`, ordre des `ensure`, SQL de seed, docs. Ne touche jamais à la sécurité sans passer par [DEV].\n- **[TEST] Bêta testeur** : plan de test (normal / limite / abusif), resmon < 0,5 ms au repos, 0 erreur console. Verdict : ✅ GO / ⚠️ GO avec réserves / ❌ NO GO + repro.\n\n## Workflow par feature\n1. Alpha définit le besoin\n2. [DEV] propose l'archi, Alpha valide\n3. [DEV] ou [CONFIG] développe sur `feature/*`\n4. [TEST] teste sur le serveur de dev\n5. Alpha valide → merge `main` → déploiement txAdmin → annonce Discord\n\n## Communication\nFrançais, direct, concis. Préfixer `[DEV]` / `[CONFIG]` / `[TEST]`. Code complet avec chemin de fichier. Doute Cfx/Rockstar/Tebex → doc officielle d'abord.\n", "PROMPT_REPRISE": "# Prompt de reprise — RoadLine RP (à coller dans une nouvelle session Claude)\n\n> Copie tout ce qui est sous la ligne ci-dessous dans ta deuxième session. Mis à jour le 15/10/2026 (V12.63).\n\n---\n\nTu reprends le développement de **RoadLine RP**, un serveur GTA RP FiveM **français** (base **Qbox / ox** : qbx_core,\nox_lib, ox_inventory, ox_target, oxmysql, illenium-appearance, qbx_vehiclekeys, pma-voice). Ouverture publique :\n**20/10/2026 à 21 h** ; la **bêta est en cours**. Je m'occupe de la promo ; toi, des corrections, de la configuration et de\nl'optimisation.\n\n## Avant toute chose\n1. Lis **`docs/AUDIT_V12_35.md`** (état et risques au 12/10), puis **`docs/ETAT_PROJET.md`** en entier (récap complet, historique V12.x, décisions) puis `docs/MLO.md` et\n   `docs/IMPORTER_MODS.md` (maps payantes, scripts compagnons, diagnostic).\n2. Vérifie que tu es à jour : `git fetch origin && git log -1 origin/feature/phase1-bridge` doit montrer\n   « V12.58 : bancs réglables pour tous, arme dans le dos, caméras peignables » (ou plus récent).\n\n## Règles permanentes (à respecter sans exception)\n- **Tout en français** (code commenté, messages en jeu, docs, réponses).\n- **Jamais de mot de passe ni de secret en clair** dans tes réponses ; **ne jamais committer `secrets.cfg`**.\n- **Demande-moi avant de supprimer quoi que ce soit** (fichier, map, PDF, ressource).\n- **Aucune vraie marque** (voitures, mode, police réelle) : risque de bannissement Cfx.re. Seulement le « lore GTA ».\n- Lance **`bash tests/run.sh`** avant chaque push (un hook pre-push le fait aussi) : tout doit être vert.\n- Si l'utilisateur t'envoie `ROADLINE-commits.bundle` (commits du PC Windows) : `bash scripts/linux/recevoir-bundle.sh ROADLINE-commits.bundle`\n  (vérifie, fusionne, teste, pousse). Sur le PC Windows, c'est `POUSSER-GITHUB.bat` (voir `docs/GITHUB.md`).\n- Pousse sur **les deux branches** :\n  `for b in feature/phase1-bridge claude/gta-rp-architecture-stack-pbvdxz; do git push origin \"feature/phase1-bridge:$b\"; done`\n- Version : `gs_version` dans `server/server.cfg.example` et `VERSION` dans `tools/pdf.py` (+ `tools/backtest.py`,\n  `tools/doc_hub.py`, `tools/guide_staff.py`, `tools/bilan.py`). Ajoute une entrée en tête de l'historique de\n  `docs/ETAT_PROJET.md` à chaque version.\n- Après une mise à jour : régénère les PDF (`python3 -B tools/pdf.py`, `backtest.py`, `bilan.py`, `guide_staff.py`,\n  `guide_joueur.py`), puis livre :\n  - `git archive --format=zip --prefix=gtasoon/ -o livraison/ROADLINE-V12-installation.zip HEAD`\n  - `cp docs/hub/index.html livraison/ROADLINE-Documentation.html` (site de doc régénéré par `tests/run.sh`)\n- Le guide joueur PDF n'est **pas** publié sur le site.\n- Ne pas enchaîner les essais à l'aveugle : comprendre la cause, tester, puis livrer une seule fois.\n\n## Organisation du dépôt\n- Nos ressources : `server/resources/[gtasoon]/gs_*` (une cinquantaine : gs_bridge, gs_admin, gs_police, gs_jobs,\n  gs_details, gs_phone…). Maps importées : `resources/[addons]/gsa_*` (sur le PC, pas dans git).\n- Outils Windows : `scripts/windows/*.ps1` (+ `.bat` à la racine : METTRE-A-JOUR, METTRE-A-JOUR-OVH, IMPORTER-MODS,\n  VIDER-CACHE-FIVEM, REPARER-FIVEM, NETTOYER-MARQUES). VPS Linux : `scripts/linux/roadline.sh`.\n- Sur le PC : `C:\\GTASOON\\` (server-data, `mods-a-trier` = archives à importer, `mods-tri` = tri + RAPPORT-MODS.txt,\n  `mods-tri\\scripts-a-verifier`, `mods-retires.txt`).\n- Lecteur de maps : `gs_admin/server/maps.js` (scan des .ymap, conflits d'occlusion fusionnés dans\n  `gsa_zz_fusion_occlusion`, `RETIRED_MAPS` + `RETIRED_PATTERNS` (V12.36 : retrait par motif), `PUBLIC` = blips publics, `ACTIVITY`, contrôle d'intégrité) ;\n  menu staff F11 → Monde et lieux → Mappings installés (`gs_admin/client/quick.lua`).\n\n## Pièges FXServer déjà rencontrés (ne pas refaire)\n- Node `fs` en écriture bloqué (`--allow-fs-write`) ; Lua `io.open` en écriture refusé ; `package` absent en Lua FiveM.\n- Export JS → Lua de la MÊME ressource : « No such export » → utiliser des événements locaux avec callback.\n- Une ressource n'écrit (SaveResourceFile) que dans **son propre dossier** (« write not allowed »).\n- Fichier .ydr tronqué = crash client « Invalid fixup… » → archive coupée, à retélécharger.\n- Packs escrow (.fxap) : ne marchent qu'achetés avec le compte Cfx.re lié à la clé du serveur.\n\n## Touches en jeu\nF1 téléphone, F2 inventaire, F3 progression, F4 intervention (police / EMS), F5 emotes, F6 métiers, F7 duo, F9 gang,\nF10/F11 staff, I aide, K inventaire proche, W radial, H mains en l'air, L verrouiller, B ceinture, **U garde-robe**.\n\n## État au 16/10/2026 (V12.63)\n- Récents : clés de véhicule en objet (`gs_carkey`), vêtements et tenues en objets + garde-robe (U), apparition fiable\n  dans les véhicules, blips publics des maps, contrôle « chez moi » des maps (F11), scripts compagnons des maps payantes\n  installés par IMPORTER-MODS, intégrité des maps vérifiée au démarrage, outil REPARER-FIVEM.bat, site de doc HTML.\n- Maps : villa moderne 01 **retirée** (12/10), **villa bunker remise** ; retirées aussi : laser game, karting (+ DLC),\n  plasmatron (V12.33), Willie's, alcool Paleto, Moreo Gym, casse, Benny's original, Digital Den, Shadow Complex.\n  `RETIRED_MAPS` (noms exacts) + `RETIRED_PATTERNS` (motifs : plasmagame, plasmakart, plasmatron, villa_01, redline) dans maps.js = source\n  unique : le serveur les supprime au démarrage, le retrait F11 supprime aussi le dossier, IMPORTER-MODS ne les réinstalle jamais (V12.36).\n- **V12.37 (13/10)** : gs_jobs (une interaction par point, service par état voulu + anti-rebond, garage : messages exacts, armurerie\n  prêtée et reprise), gs_details (holster réécrit, `/dosreglage`, `DAMAGE` adouci), gs_weather (interventions créées à l'approche sur\n  la route), gs_rental (13 comptoirs), gs_admin / gs_bridge / gs_markers (placement libre, « PNJ et objets » reliés aux métiers / gangs,\n  table `gs_staff_peds`), gs_bridge/server/points_fichier.lua (`points-deplaces.json` : les points déplacés passent du PC au VPS via\n  METTRE-A-JOUR-OVH ; gardé par METTRE-A-JOUR et « roadline maj »), retouches Qbox : PPA retiré de qbx_cityhall, service / garage de\n  qbx_police et qbx_ambulancejob neutralisés (motif à confirmer sur la version installée : avertissement jaune si absent).\n- **V12.40 (14/10)** : `gs_showroom` (véhicules d'exposition posés par le staff, essai 2 min, achat), mécano Benny's (aperçu\n  en direct pour le client, animations, facture), courses sur mesure (F11), portes `/doorlock` (F11), territoires de gang\n  visibles des seuls membres + niveaux + population, tempête posée au sol, Cayo en espèces / argent sale, blips de maps devinés,\n  « RoadLine RP » sur la carte Échap. Rien n'a encore été essayé en jeu : backtest section 6d.\n- **V12.41 (14/10)** : achat concession = véhicule sorti avec clés (comme Qbox), staff change le modèle de loin ; balle dans\n  la tête = à terre ; caméras LSPD en direct au terminal ; boutique en jeu (`/boutique`, gs_store/web/boutique.html) aux couleurs\n  du site + **RoadCoins** (docs/BOUTIQUE.md). Boutique toujours désactivée : prix et contenus des packs à définir avec moi.\n- **V12.42 (14/10)** : labo réparé (scellés gardés en base, lus dans le sac), mobilier utilisable (Alt : s'asseoir, s'allonger,\n  rouler en fauteuil roulant ; `Config.Furniture` dans gs_furniture, hauteurs à caler en jeu), arme dans le dos en attache rigide.\n- **V12.43 (14/10)** : erreurs console corrigées (gs_wanted, soins Qbox), pop-up police en boucle (retouche qbx_police\n  job.lua), conflits Patoche tranchés, pack LSPD au garage police. Récap de la session : **`docs/PATCH_SESSION_14-10.md`**.\n  En attente : 30 mods « à convertir » (dossier mods-tri\\a-convertir à m'envoyer), `patoche_interact` pour la villa bunker.\n- **V12.45 (14/10)** : mods solo convertis en ajouts FiveM (`tools/vetements/README.md` : noms dlc déjà pris, suivants\n  `gsahommef` / `gsafemmei`) → 9 zips `ROADTRIP-…` à passer par IMPORTER-MODS ; récolte céréales, tabac (légal) et pavot\n  (illégal, sans blip, receleur du port, crime `drug_cultivation`) avec les props BzZz (`gsa_9a13b85…`).\n- **V12.46 (14/10)** : pack de robes (dresspack) converti en 3 collections, carte **V5** sur le site public (teaser\n  confidentiel passé en V6), priorités du site de doc, guide staff, patch de session final (`docs/PATCH_SESSION_14-10.md`).\n- **V12.47 (14/10)** : REPARER-BDD.bat pour « Unable to establish a connection to the database » (MariaDB redémarrée,\n  cause lue dans son journal, relance automatique si elle plante, serveur relancé).\n- **V12.48 (14/10)** : importeur : bibliothèque réclamée par un script installée sous son vrai nom (patoche_interact →\n  villa bunker), mods déjà convertis prioritaires (lace_up_sweats, hair, natt_hair5_fivem), refus manuels ($Refused).\n- **V12.49 (14/10)** : blush au coiffeur (femme). Corps féminins au choix : jamais reçus ; cardigan cœur et chignon à convertir.\n- **V12.50 (15/10)** : tatouages (français, payé = gardé), voix (portées, atténuation Windows via REPARER-SON), garde-robe U\n  (enfilé d'abord), protection d'arrivée anti-« spawn patate » (gs_onboarding), propositions D6 n° 108-117.\n- **V12.51 (15/10)** : voix par l'export pma-voice (gs_radio/client/voice.lua), [E] du duo / des missions qui restait, anti-spam\n  de coups (0,8 s). Voix = priorité n°1 de l'ouverture : à tester à 2-3 joueurs.\n- **V12.52 (15/10)** : /son (aide vocale en jeu, rappel aux 3 premières connexions, écran de chargement). Stand de jeux\n  Patoche « pas good » : symptôme à préciser (décor cassé par le conflit de ymap tranché V12.43, script, ou armes du stand).\n- **V12.53 (15/10)** : stand de jeux (conflit de ymap rendu au stand + ordre de relance), objets des scripts importés ajoutés\n  à ox_inventory par IMPORTER-MODS (jetons d'auto-tamponneuses), musculation en prison.\n- **V12.54 (15/10)** : armes dans le dos en objets locaux (plus de copie réseau figée), caméra libre dans le menu mécano.\n- **V12.55 (15/10)** : salles de jeu (3 blips aux positions du fondateur, zones sans police). En attente : nom du crash du\n  jeu du clown, retour sur les jetons des auto-tamponneuses (rapport IMPORTER-MODS).\n- **V12.56 (15/10)** : territoires de gang en cases alignées sur les rues (/quartierforme), propositions D7 n° 118-131.\n- **V12.57 (15/10)** : phase 1 D7 — gs_vie (poubelles, se laver, démarche blessée, passagers bavards, porter / otage,\n  /perfserveur), distributeurs snacks / café, magasin de masques, ENVOYER-PLACEMENTS.bat. Phase 2 prévue : 119 cimetière,\n  128 cabines, 129 audit réseau / entityLockdown, peut-être 122 fausse monnaie.\n- **V12.63 (16/10, session de secours)** : appli staff externe complète (tablette : tableau de bord, carte, Lives hors jeu, toutes les\n  sanctions, mot de passe collectif GERER-OVH → 20 → M), F10 recompilé avec la carte en direct. Doc : docs/APPLI_STAFF.md.\n- **V12.62 (15/10, session de secours)** : Lives en grille + bouton TP + replay 30 s des tickets (`/report 12 …`), scène de crime\n  photographiée versée au dossier (labo), hélico de la police IA à 3 étoiles + « EN DIRECT » sur le bandeau du site, jetons de\n  fête foraine (gs_casino `Config.Fair`, objet `fair_token`), relecture complète du gros patch (bugs / perf corrigés).\n- **V12.61 (15/10, session de secours)** : screenshot-basic livré compilé, cabines (numéro masqué, écoute police), rodéo du samedi,\n  rapport staff Discord à 4 h, premier jour réordonné (téléphone acheté), site condensé.\n- **V12.60 (15/10, session de secours)** : DIAGNOSTIC-MODS.bat (mods abîmés / en conflit, corrections sûres), F11 blips en double,\n  gs_cimetiere (tombes, avis de décès, fleurs), gs_cabines (appel anonyme police / Weazel), gs_lives (écrans des joueurs, staff).\n- **V12.59 (15/10, session de secours, branche `claude/presence-check-f9jlgz`)** : IMPORTER-MODS fiabilisé (zips Drive en\n  morceaux, mods sans fxmanifest, doublons, dossiers / volumes, voitures avec script de noms, robes FiveM), tête = mort immobile,\n  casque 1 balle, arme dans le dos ré-accrochée seule, emotes rapides Pavé num. 1-5, M = ragdoll, /vue, traces de sang / douilles\n  (24 h), effets « sur moi » (super vitesse voiture…), caméras du décor peignables + ← → au terminal, police IA qui poursuit\n  (pas pour les braquages), bot Discord (rattrapage des accueils, #statut expliqué, plus « Joue à Qbox »), bandeau Weazel du site,\n  courses sur mesure. Détail : docs/ETAT_PROJET.md.\n- **V12.58 (15/10)** : /meubleregle (bancs : réglage gardé pour tous), arme dans le dos bien placée dès le rangement,\n  caméras de rue peignables (portée 5 m, bombe utilisée dessous).\n- Deux sessions Claude (web + poste Windows) : V12.33 puis V12.37 du poste Windows intégrées par la session web (V12.38 =\n  fusion). Côté Windows : POUSSER-GITHUB.bat (docs/GITHUB.md) pour envoyer directement sur GitHub. Désactivées (archives coupées, à retélécharger) :\n  beach party, soccer / soccer_cloth, plasmatron.\n\n## En attente (à reprendre avec moi) — mis à jour le 14/10\n1. **Dernier gros mod** (optionnel) : `male_hair_collection_vol_1` (134 Mo, un .ydd de 27,8 Mo à alléger) : à envoyer en\n   volumes 7-Zip de 25 Mo. Tous les autres mods « à convertir » sont faits (9 zips ROADTRIP, `tools/vetements/README.md`).\n1 bis. **Personnalisation conseillée mais jamais reçue** (liens donnés le 14/10, rien importé) : visages « Improved Females »\n   (github zfbx/improved-females, change toutes les femmes), corps « Muscular Body for MP Female » (jinxmods, au choix),\n   « Improved Lower Body for MP Female 2.0 » (page gta5-mods d'origine). À convertir (petits) : `natt_s_heart_cardigan`,\n   `long_hair_with_a_bun_by_jaagoda`. Coupes dont la couleur du coiffeur ne s'applique pas partout (shader `ped_alpha`) :\n   Buzzcut Fade ×2 (coiffures_homme_2 n°1-2, pas teintables), dreadlocks Suthyland et 6 coupes TideFN (une partie fixe).\n2. **Récolte** : points des champs (céréales, tabac, pavot) à caler en jeu via F11 si besoin.\n3. **patoche_interact** : importé le 14/10 ; V12.48 l'installe sous son vrai nom au prochain IMPORTER-MODS. Scripts billard /\n   football : à remettre dans mods-a-trier. `mp25_muscular` (vêtement installé) : vérifier qu'il ne change pas tous les corps.\n4. **À caler en jeu** : points du mécano sur la map Benny's, véhicules d'exposition + départ des essais, portes `/doorlock`,\n   hauteurs du mobilier (lignes F8 envoyées par le fondateur → `gs_furniture/shared/config.lua`).\n5. **Doublons de lieux** (casino, concession, Ammu-Nation, prison) et **coordonnées de la prison** à vérifier.\n6. **Boutique** : prix, packs, RoadCoins, adresse Tebex et conformité PLA avant `Config.Enabled = true`.\n7. Après l'ouverture : entityLockdown strict, audit des ~300 points d'entrée réseau, cabines téléphoniques, skate en\n   location, mises à jour ox_lib / ox_inventory / oxmysql.\n\n## Ce qu'a fait la session web le 12/10 (V12.17 → V12.34), en bref\n- Maps payantes (escrow) : import réparé, archives coupées refusées (7-Zip ≥ 2), intégrité vérifiée au démarrage, fusion\n  d'occlusion écrite par `gsa_zz_fusion_occlusion` (seul dossier autorisé), blips publics, contrôle « chez moi » (F11),\n  scripts compagnons installés avec leur map, maps retirées jamais réimportées (V12.35).\n- Joueurs : apparition dans le véhicule fiable, clés en objet, vêtements / tenues en objets, garde-robe (U).\n- Outils : REPARER-FIVEM.bat (erreurs FiveM / Rockstar côté joueur), site de doc HTML (`livraison/ROADLINE-Documentation.html`).\n- La V12.33 du poste Windows (maps plasma retirées, F4 qui explique ses refus, garde-robe sans focus bloqué, atterrissage\n  à Cayo) est intégrée dans git.\n\n## Si tu n'as pas accès au dépôt git\nLe paquet de transfert contient `ROADLINE-V12-installation.zip` (= le dépôt en V12.34, sans secrets), `ETAT_PROJET.md`,\n`MLO.md`, `IMPORTER_MODS.md` et le site de doc. Travaille dans ce zip et, à la fin, renvoie-moi un zip complet + la liste\ndes fichiers modifiés pour que l'autre session les reprenne.\n\nCommence par me dire ce que tu as compris de l'état du projet en 5 lignes, puis attends ma demande.\n", "AUDIT_V12_35": "# Audit global RoadLine RP — 12/10/2026 (V12.35)\n\nÉtat de la base à 8 jours de l'ouverture (20/10, 21 h). Ce qui est vérifié automatiquement, ce qui ne l'est qu'en jeu,\nce qui peut encore faire bugger, et la liste de ce qu'il reste à faire.\n\n## 1. Verdict en une phrase\n\n**Le code est sain** : tous les tests passent, aucune faille évidente, aucun secret dans le dépôt. **Les risques qui\nrestent ne sont pas dans notre code** : ils viennent des maps payantes (licences, archives coupées, scripts jamais\ntestés en jeu), de deux sessions de travail qui peuvent diverger, et de réglages à basculer avant l'ouverture.\n\n## 2. Ce qui a été vérifié (automatiquement, à chaque push)\n\n| Contrôle | Résultat |\n|---|---|\n| Syntaxe de tout le Lua (67 ressources, ~38 000 lignes) | ✅ |\n| ~2 900 tests de logique serveur (économie, police, prison, clés, tenues, maps…) | ✅ tous verts |\n| Liens entre ressources (événements, exports, callbacks) | ✅ |\n| Libellés d'objets en français, images d'objets | ✅ |\n| Budget de performance : 138 threads client, 6 boucles par image justifiées, aucune boucle serveur < 250 ms | ✅ |\n| Lecteur de maps (92 tests) et importeur de mods de bout en bout (9 tests) | ✅ |\n| Marques réelles bloquées (même liste dans l'importeur et NETTOYER-MARQUES) | ✅ |\n| Pièges connus : `and nil or`, apostrophes doublées, schtasks, DLL abîmées | ✅ |\n\nScans faits pour cet audit :\n- **332 points d'entrée réseau** (39 événements + 298 callbacks serveur) : ceux qui donnent argent ou objets ont tous une\n  protection visible (limite de fréquence, distance, métier, session, staff). Heuristique : à confirmer par l'audit\n  détaillé prévu après l'ouverture.\n- **SQL** : aucune requête construite par concaténation (pas d'injection possible par ce chemin).\n- **Secrets** : aucun mot de passe, webhook ou chaîne MySQL en clair dans le dépôt ; `secrets.cfg` absent des zips.\n- **Démarrage** : toutes les ressources `gs_*` sont lancées, après leurs dépendances (oxmysql, ox_lib, ox_inventory,\n  illenium-appearance, qbx_vehiclekeys).\n\n## 3. Ce qui peut encore faire bugger (par ordre de risque)\n\n| # | Risque | Pourquoi | Que faire |\n|---|---|---|---|\n| 1 | **Maps payantes** invisibles ou sans activité | licence Cfx (achat avec un autre compte que la clé), archive coupée, script compagnon jamais testé en jeu, script qui refuse d'être renommé | après chaque import : RAPPORT-MODS.txt + console (« NON démarré », « DÉCOR SEUL », « CONFLIT ») + F11 → Contrôler les maps chez moi |\n| 2 | **Deux sessions qui divergent** (web + poste Windows) | la V12.33 n'était que dans un zip ; une session qui repart d'un vieux zip efface le travail de l'autre | GitHub = seule référence. Chaque session commence par `git fetch` et finit par un push (ou un zip complet à réintégrer) |\n| 3 | **Serveur encore en mode « dev » le jour J** | `dev.cfg` cache le serveur de la liste FiveM (`sv_master1 \"\"`) | sur le VPS, avant l'ouverture : `roadline public` (bascule sur prod.cfg) puis redémarrage |\n| 4 | **Doublons de lieux** (casino, concession, Ammu-Nation, Benny's, prison) | la map payante est là, nos points et blips aussi sur le lieu du jeu | ta décision « nouveau / ancien » pour chacun, puis je recale |\n| 5 | **Prison / jail** avec la nouvelle map | coordonnées de cellule et de sortie calées sur l'ancienne prison | test en jeu : se faire incarcérer, sortir ; `/coords` si décalé |\n| 6 | Packs coupés au téléchargement | beach party, terrain de foot désactivés (fichier tronqué = crash joueur) | retélécharger depuis le portail Cfx, déposer dans mods-a-trier |\n| 7 | `sv_entityLockdown \"relaxed\"` | moins strict qu'idéal contre certaines triches | volontaire : « strict » demande une migration (audit V12.4) → après l'ouverture |\n| 8 | Charge du VPS | ~40 maps payantes + 67 ressources ; RAM à surveiller à 48 joueurs | txAdmin → performance ; `resmon` en jeu ; maps lourdes signalées en console (« au-delà de la limite FiveM ») |\n\n## 4. Le site : héberger sur le VPS ?\n\n**Mon avis : non, garde Netlify.** Le site ne pèse que 260 Ko : ce n'est ni sa taille ni l'hébergeur qui le rendent lourd.\n\n- Netlify sert le site depuis des serveurs partout en Europe (CDN), gratuitement, avec HTTPS automatique.\n- Sur le VPS, le site prendrait du processeur et de la bande passante **au serveur de jeu** ; il exposerait aussi\n  l'adresse du VPS à plus de trafic (attaques), et il faudrait gérer nginx, un domaine et un certificat.\n\n**La vraie cause, mesurée** dans un navigateur (défilement pendant 4 s) : les effets plein écran — aurore très floutée,\ngrain animé, pluie, brouillard, flous d'arrière-plan. Sans eux le site est **2 fois plus fluide** (9 → 19 images/s\nsur une machine sans carte graphique ; l'écart est le même en proportion sur un PC modeste ou un téléphone).\n\n**Corrigé (V12.35) : mode léger automatique.** Ces effets sont coupés d'office sur téléphone et sur petite machine\n(≤ 4 cœurs ou ≤ 4 Go), ou si le site tourne à moins de 35 images/s quelques secondes après l'ouverture. Sur un bon PC,\nrien ne change. Forcer : `…/index.html?lite` (léger) ou `?full` (tous les effets). Vérifié : 0 erreur JavaScript.\n**À faire de ton côté : PUBLIER-SITE.bat** (glisser le dossier `docs\\site` sur Netlify).\n\nAutres points du site :\n- 4 photos (`img/vespucci.jpg`, `course.jpg`, `vanilla.jpg`, `cayo.jpg`) et la police Pricedown (`fonts/`) sont prévues\n  mais absentes : le site a un repli propre, mais ce sont 6 requêtes perdues à chaque visite. Dépose-les dans\n  `docs\\site\\img` et `docs\\site\\fonts` quand tu les as.\n- 5 polices Google : on peut descendre à 3 si on veut gagner encore un peu au premier chargement.\n- Le bloc « en ville » lit `ville.json` sur le VPS toutes les 60 s : si le serveur est éteint, le site reste normal.\n\n## 5. Les mods : où déposer, que sont tous ces dossiers ?\n\n**Un seul dossier pour déposer : `C:\\GTASOON\\mods-a-trier`** — les archives (.zip / .rar / .7z) **telles quelles**, une\npar pack, sans les décompresser. C'est là qu'on met les nouveaux mods ET les packs retéléchargés (à la place de l'ancien\nfichier, même nom). Puis IMPORTER-MODS.bat (ou METTRE-A-JOUR, qui le lance).\n\nLes autres dossiers sont fabriqués par l'importeur — **on n'y dépose rien** :\n\n| Dossier | Contenu |\n|---|---|\n| `C:\\GTASOON\\mods-tri\\` | le tri : `maps`, `vehicules`, `vetements`, `scripts-a-verifier`, `a-convertir`, `deja-convertis`, `rejetes` (+ `RAPPORT-MODS.txt`) |\n| `C:\\GTASOON\\mods-tri\\_extraction` | décompression temporaire (refaite à chaque import) |\n| `C:\\GTASOON\\server-data\\resources\\[addons]\\` | ce qui est **installé** : `gsa_<nom>` (maps, véhicules, vêtements) et, depuis la V12.31, les **scripts compagnons** des maps sous leur nom d'origine (sans `gsa_`) — d'où des dossiers d'un nouveau genre |\n| `C:\\GTASOON\\server-data\\cfg\\addons.cfg` | la liste de ce qui démarre (`ensure …`) |\n| `C:\\GTASOON\\mods-retires.txt` | les mods à ne jamais réinstaller |\n\nRetirer une map : la mettre dans `RETIRED_MAPS` (gs_admin/server/maps.js — demande-le moi) : supprimée au démarrage\ndu serveur, jamais réimportée (V12.34).\n\n## 6. Avant l'ouverture (check-list)\n\n1. METTRE-A-JOUR (V12.35) puis METTRE-A-JOUR-OVH ; console sans ligne rouge.\n2. F11 → Mappings installés → Contrôler les maps chez moi : tout « bâtiment chargé ».\n3. Décisions « nouveau / ancien » (casino, concession, Ammu-Nation, Benny's, prison) → je recale.\n4. Test prison, F4 police / EMS en service, garde-robe (U), clés, tenues.\n5. PUBLIER-SITE.bat (mode léger du site).\n6. Sauvegarde de la base (SAUVEGARDER-BDD ou celle du VPS) la veille.\n7. Le jour J : `roadline public` sur le VPS, redémarrage, vérifier que le serveur apparaît dans la liste FiveM.\n\n## 7. Après l'ouverture (déjà prévu)\n\nentityLockdown strict, audit détaillé des 332 points d'entrée réseau, refonte des cabines téléphoniques, miniatures du\nmenu d'apparence, mises à jour ox_lib / ox_inventory / oxmysql (jamais pendant la semaine d'ouverture).\n", "APPLI_STAFF": "# Appli staff RoadLine (V12.63)\n\nModérer la ville **sans être en jeu**, depuis une tablette, un téléphone ou un PC. L'appli est servie par le serveur FiveM\nlui-même (ressource `gs_admin`) : rien à installer côté staff.\n\n## Adresse et connexion\n- Adresse : `https://<adresse https du VPS>/gs_admin/` (GERER-OVH → 21 pour l'adresse https), ou `http://IP:30120/gs_admin/`.\n- **L'installer comme une vraie appli** (icône au logo RoadLine, plein écran, sans barre d'adresse) — rien à télécharger\n  sur un store, pas de site à part : c'est le VPS qui la sert, à la même adresse https.\n  - **PC (Chrome / Edge)** : bouton « 📲 Installer l'appli » sur l'écran de connexion (ou icône d'installation dans la barre\n    d'adresse) → elle apparaît dans le menu Démarrer / sur le bureau, et s'ouvre dans sa propre fenêtre.\n  - **Android (Chrome)** : même bouton, ou menu ⋮ → **Installer l'application**.\n  - **iPhone / iPad (Safari)** : bouton Partager → **Sur l'écran d'accueil**.\n  - Il faut l'adresse **https** (GERER-OVH → 21) : en http par l'IP, les navigateurs refusent l'installation.\n  - Une mise à jour du serveur met l'appli installée à jour toute seule (rien à réinstaller).\n- Connexion : **ton pseudo staff** (il signe tes actions dans le journal : « Web · pseudo ») + **le mot de passe collectif**.\n- Le mot de passe n'est envoyé qu'une fois : ensuite un jeton de session (12 h, tiré au hasard par le serveur).\n- 5 mauvais mots de passe depuis une même connexion = blocage 15 min ; plus de 30 échecs en 15 min sur tout le serveur =\n  connexions suspendues 15 min et alerte au staff. Chaque connexion est notée dans le journal staff (avec l'adresse).\n- **https obligatoire** dès que l'adresse https est activée (GERER-OVH → 21) : les connexions en clair par le port 30120 sont\n  refusées (sinon, sur un wifi public, le mot de passe pourrait être lu).\n- Mot de passe changé ou code retiré = toutes les sessions ouvertes avec l'ancien se ferment.\n\n## Changer le mot de passe collectif (fondateur)\nGERER-OVH.bat → **20** → **M** : saisie masquée, envoyée directement à la commande du VPS (ni fichier, ni ligne de commande,\njamais dans le dépôt). Les anciens codes personnels sont **effacés** et le serveur redémarre (1 min). Sur le PC local, on peut aussi écrire\nla ligne `set gs_admin_web_password \"…\"` dans `server-data\\cfg\\secrets.cfg` (jamais committé).\n- 6 caractères au moins (12 conseillés : il donne accès aux bannissements), sans guillemet, `\\` ni `;`.\n- Les codes personnels (`gs_admin_web`, GERER-OVH → 20 → A / R) restent possibles en plus.\n\n## Ce qu'on y trouve\n| Onglet | Contenu |\n|---|---|\n| Tableau de bord | Joueurs en ville (courbe 24 h), staff en service, tickets, recherchés, isolés / gelés, carte en direct, derniers tickets, journal, annonce à la ville |\n| Joueurs | Recherche et filtres (recherchés, isolés, staff, en service) ; fiche complète (métier, session, recherche, gang, argent, isolement, dossier staff) |\n| Carte | Tous les joueurs en direct sur la carte de Los Santos (couleur = état) ; clic = fiche ; anneau jaune = auteur d'un ticket ouvert (V12.63) |\n| Lives | Jusqu'à 4 écrans de joueurs en même temps (une image / 1,5 s), replays 30 s des tickets ouverts |\n| Tickets | Prendre en charge, clôturer, ouvrir la fiche, replay |\n| Sanctions | Bannis actifs, recherche, débannir |\n| Journal | Toutes les actions du staff (jeu, Discord, appli) depuis le dernier redémarrage |\n\n## Rangs dans l'appli (V12.63)\n- **Mot de passe collectif** = rang **modérateur** (2), quel que soit le pseudo tapé (un pseudo ne prouve rien).\n- **Code personnel avec un rang** : GERER-OVH → 20 → **A** → pseudo → rang (5 = fondateur, 4 = super-admin, 3 = admin…).\n  Le code s'affiche une fois : se connecter avec ce code (le pseudo est celui du code).\n- Un rang agit sur les joueurs et sur le staff de **rang inférieur** ; le **fondateur agit sur tout le monde**.\n- Rang minimum par action (`Config.Web.actionLevel`) : message, note, soigner, réanimer, réparer, avertir, tickets = 1 ;\n  geler, isoler, expulser, téléporter, effacer la recherche = 2 ; bannir, débannir, annonce, surveillance, ban hors ligne = 3 ;\n  fermer les arrivées = 4.\n- Changer le mot de passe collectif garde les codes avec rang (efface seulement les anciens codes sans rang).\n\n## Actions sur un joueur\n- **Assistance** : soigner, réanimer, réparer le véhicule, effacer la recherche, téléporter (lieu de la liste ou à côté d'un joueur),\n  **coincé : dernier endroit sûr** (V12.63 : le jeu retient la dernière position au sol ; à défaut la place de Legion Square,\n  `Config.Unstuck` ; retour automatique après 6 s sous la carte ; même bouton dans F10 et F11 → Joueurs).\n- **Contrôle** : geler / dégeler, message privé, note staff, isoler (minutes + motif), libérer.\n- **Sanctions** : avertir, expulser, bannir (1, 3, 7, 14, 30 jours ou définitif) — motif obligatoire, publié dans #sanctions.\n- **Modération avancée** (V12.63, admin et plus) : fiche → **Mettre sous surveillance** / **Lever la surveillance** ; onglet\n  **Sanctions** → arrivées (fermer 1 à 60 min / rouvrir : super-admin), joueurs surveillés, **partis récemment → bannir hors ligne**.\n  Rangs : surveillance et ban hors ligne = admin (3) ; fermer les arrivées = super-admin (4). Détails : `docs/ADMIN.md`.\n- Garde-fou : aucune sanction ni téléportation depuis l'appli sur un membre du staff, quel que soit son rang (`Config.Web.protectLevel`).\n  Les durées (isolement, bannissement) doivent être des nombres entiers.\n- Lieux de téléportation : `gs_admin/shared/config.lua` → `Config.Web.places` (déplaçables via F11 → Déplacer un point).\n\n## Technique\n- Serveur : `gs_admin/server/web.lua` (API `POST /api`, fichiers de `web/dist`), jetons : `server/crypto.js`.\n- Interface : `gs_admin/web/src/staff/` (React, compilée par Vite avec le panneau F10 : `npm run build` dans `gs_admin/web`).\n- La carte (`web/src/shared/LiveMap.jsx`) est partagée avec l'onglet **Carte** du panneau F10.\n- Les écrans (Lives) viennent de gs_lives (export `Capture`) : la même capture sert à F11, aux replays et à l'appli. Le joueur\n  regardé doit avoir screenshot-basic (livré dans `[gtasoon]`, rien à installer).\n", "ETAT_DES_LIEUX_16-10": "# État des lieux avant l'ouverture (16/10/2026, V12.63)\n\n> Établi à partir du code et des retours de backtest. Rien ici n'a été vérifié en jeu par la session de secours : la fiche de\n> backtest (sections 4d à 4i, 5) reste la référence.\n\n## 1. À confirmer en jeu (corrigé dans le code, jamais vu tourner)\n| Quoi | Comment vérifier |\n|---|---|\n| Lives (F11 et appli) : screenshot-basic patché (rappel en https) | F8 `/livestest` chez toi puis chez le joueur regardé ; appli → Lives |\n| Poubelles : l'option inventaire d'ox_inventory retirée par gs_vie | Alt sur une benne : une seule option, « Fouiller la poubelle » |\n| Animations des gestes « visage » et « boire » (noms non vérifiés) | Alt sur un lavabo / une fontaine ; sans animation, le geste marche quand même |\n| Idées du soir et retours du 16/10 (affiches, mur des légendes, trêve, figure du coin, avis vitrine, fausse alerte, courses, quartiers rectangulaires, rangs de l'appli) | Fiche de backtest, section 4i |\n| Doublons de mods mis en pause (14) | Après METTRE-A-JOUR-OVH : console sans les lignes en double |\n\n## 2. Risques connus\n- **52 positions « à caler »** dans les configs (guichet des jetons, carré du cimetière, mur des légendes, tribunal, état civil,\n  combats clandestins, assurance, Fleeca, location, quêtes…). Toutes déplaçables en jeu : F11 → Monde et lieux → Déplac
