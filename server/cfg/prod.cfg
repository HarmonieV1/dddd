## Profil PROD (ouverture publique). Tout ce qui est actif ici tourne déjà en dev (cfg/dev.cfg) sans problème connu.
sv_maxclients 48                                # max gratuit avec OneSync, au-delà, licence Cfx
set mysql_ui false                              # pas d'interface de debug de la base en public

## Durcissement anti-triche (validé en dev)
set sv_entityLockdown "relaxed"                 # bloque les entités créées hors script par les clients
set sv_filterRequestControl 2                   # limite les prises de contrôle d'entités par les clients
set sv_enableNetworkedSounds false              # sons réseau (souvent abusés)
set sv_enableNetworkedPhoneExplosions false     # explosions à distance via téléphone

## Fichiers du jeu modifiés : niveau 1 = refuse les mods de triche, accepte le son et les mods graphiques connus
## (validé pendant le backtest : même réglage dans dev.cfg). 2 = tout mod refusé (trop strict pour du RP grand public).
sv_pureLevel 1

## NON activés, volontairement (V11, après vérification) :
## - sv_authMinTrust 5 / sv_authMaxVariance 1 : niveau 5 = authentification externe (Steam) obligatoire →
##   les joueurs sans Steam lancé seraient refusés. Le compte Rockstar (license) suffit, les bans gs_security s'y appuient.
## - sv_forceIndirectListing : ne sert qu'avec un proxy / plusieurs IP devant le serveur (pas notre cas).

