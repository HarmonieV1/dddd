er un joueur → geler, message, avertir, expulser),\n  Tickets (toucher un ticket → le joueur), Ville (annonce, bouton txAdmin). Se rafraîchit seul toutes les 10 s.\n- **Redémarrage quotidien** : 06:00 par défaut, annoncé en jeu ; changer l'heure : GERER-OVH → 19 (« off » pour désactiver).\n- **Serveur tombé** : alerte dans le salon staff Discord au bout de 4 min, relance automatique, message quand il revient.\n  Un arrêt volontaire (GERER-OVH → 5) ne déclenche rien.\n- **Qui utilise quoi** : modérateurs → appli staff (téléphone) + F11 en jeu + bot Discord ; fondateur → en plus txAdmin (console) et GERER-OVH.\n  Mauvais compte Cfx.re lié à txAdmin : GERER-OVH → 22.\n\n## V11.2 · Jurés, Gazette, black-out\n- **Jurés** (`gs_justice`, `Config.Jury`) : le juge, pendant un procès, choisit « Convoquer un jury » (ciblage du prévenu). 5 citoyens\n  en ville (hors prévenu, police et juge) reçoivent la convocation ; ils votent en 3 min (`/jury` pour rouvrir), payés 100 $. À partir\n  de 3 votes, le verdict du juge doit suivre la majorité (« jury 3-2 » dans le fil de la ville). Un jury toutes les 2 h au plus.\n- **Gazette** (`gs_city`, `Config.Gazette`) : publiée seule le dimanche à 20 h (Discord #annonces, site, `/gazette` en jeu).\n  `/gazettepublier` (admin et plus) la publie tout de suite, par exemple pour tester.\n- **Black-out** (`gs_city`, `Config.Blackout`) : un transformateur par quartier (9). Positions estimées : à recaler en jeu si besoin\n  avec F11 → Déplacer un point (« Transformateur »). Sabotage = crochet consommé, 15 min sans lumière, police prévenue, caméras du\n  quartier aveugles ; réparation par n'importe qui (payée par la mairie). 2 h minimum entre deux pannes d'un même quartier.\n\n## V11.3 · Concession, IP masquée, version publique, règlement, guides\n- **Concession** (`scripts/windows/outils-communs.ps1` + `scripts/windows/prix-vehicules.json`, appliqués par METTRE-A-JOUR) :\n  salle **Luxe** à la PDM (« ★ Luxe · Sportives », « ★ Luxe · Supercars ») ; 94 véhicules retirés (armés, arène, militaires, blindés,\n  services, doublons « Yacht », sous-marins) ; aéroport : 17 avions et 14 hélicoptères civils ; prix réalistes pour les bateaux, les avions\n  et la salle Luxe (supercars de 180 000 à 650 000 $). Changer un prix : `prix-vehicules.json`, puis METTRE-A-JOUR et METTRE-A-JOUR-OVH.\n- **Site** : `hideIpUntilOpening: true` → avant `opening`, l'adresse est caviardée et « Rejoindre » mène au Discord ; le jour J, elle se dévoile\n  toute seule (rien à republier). Adresse, carte et lien staff sont encodés (`connectB64`, `cityUrlB64`, `staffUrlB64`) : invisibles en clair\n  dans la page. Limite : un curieux qui ouvre les outils réseau du navigateur voit l'adresse de la carte ; un nom de domaine réglera ça (V12).\n- **Version publique** : `setr gs_public_version \"V4 · bêta\"` (écran de chargement, site, statut Discord). `gs_version` (V11.3) reste pour le staff.\n- **Règlement Discord** : `docs/REGLEMENT.md` (12 messages prêts à coller). **Guides** : `tools/guide_joueur.py` (joueurs, PDF) et\n  `tools/guide_staff.py` (staff, PDF interne) → `docs/pdf/`.\n\n## V12.60 → V12.63 · Lives, appli staff externe, outils du 15-16/10\nDétail version par version : `docs/PATCH_SESSION_15-10.md` ; patch note de la session du 16/10 : `docs/PATCH_NOTE_V12.63.md`.\n- **Lives** (`gs_lives`) : F11 → Lives ou `/lives` (modérateur et plus, mode staff). Capture faite chez le joueur par screenshot-basic\n  et renvoyée par le réseau du jeu ; une seule capture par joueur regardé, partagée entre F11, l'appli et les replays 30 s des tickets.\n  Échec : la raison s'affiche dans la fenêtre (et dans la console, une fois par minute). Ta propre ligne « (toi : test) » = vérifier seul ;\n  F8 `/livestest` = tester la capture sur ton PC. Grille ▦, « ⇢ TP », ⏪ replay (joueurs liés à un ticket ouvert).\n- **Appli staff externe** : remplace l'ancien panneau mobile décrit plus haut. Tout est dans `docs/APPLI_STAFF.md` (connexion, rangs,\n  actions, carte avec les tickets, Lives hors jeu). Mot de passe collectif / codes avec rang : GERER-OVH → 20 (M / A).\n- **F10** : onglet **Carte** (joueurs en direct) ; action « Coincé : dernier endroit sûr ».\n- **Mises en scène** (V12.63, admin et plus ; `server/scenes.lua`, `client/scenes.lua`, `Config.Scenes`) : F11 → Joueurs → le\n  joueur → Mises en scène, ou F10 → fiche. **Enlèvement en camionnette** = expulsion (camionnette noire sur la route la plus proche,\n  deux inconnus, écran noir) ; **Arrestation par un policier PNJ** = isolement dans une cellule de Mission Row (mêmes cellules\n  que la garde à vue de gs_police, `Config.Scenes.arrest.cell`), plaquage et menottes. Le serveur applique la sanction à la fin de\n  la scène ou au bout de `maxSeconds` quoi qu'il arrive, et supprime les entités. Jamais sur un staff de rang égal ou supérieur.\n- **Événements (F11)** rangés par usage : Rassemblements (`Config.Events` : rassemblement auto, club, boxe, salon de l'emploi,\n  course, road trip, plage de Cayo), **Chasse au trésor** (`Config.Hunt` : mallette à la position du staff, zone décalée pour\n  tous, prime en banque au premier joueur, le staff ne peut pas la ramasser), Bonus serveur, Météo et saisons (**neige** :\n  `/meteoevent snow`, gs_weather ; Halloween), Police : fait divers PNJ, Rumeurs, Effets sur moi (+ feux d'artifice, confettis,\n  fumée, `Config.Powers`). Rien n'a été retiré : Halloween est passé dans « Météo et saisons ».\n- **Branding des menus de base** (METTRE-A-JOUR, `scripts/windows/outils-communs.ps1`) : contour violet néon et halo des fenêtres\n  Lives sur les menus et notifications d'ox_lib, titres en dégradé RoadLine, fenêtres de saisie et inventaire bordés de violet.\n  Visuel seulement ; motif absent (autre version) = avertissement jaune.\n- **Modération avancée** (V12.63, admin et plus ; `gs_admin/server/moderation.lua`, `Config.Moderation`) :\n  F11 → **Modération avancée**, F10 → **Serveur** (carte « Modération avancée ») et fiche joueur, appli → **Sanctions** et fiche.\n  - **Surveillance** (admin) : motif obligatoire, invisible du joueur ; le staff en service est prévenu à chacune de ses arrivées ;\n    👁 dans les listes. Gardée au redémarrage (KVP). Jamais sur un membre du staff de rang égal ou supérieur.\n  - **Fermer les arrivées** (super-admin ; appli : super-admin) : 1 à 60 min, motif affiché à ceux qui tentent d'entrer ; le staff\n    entre toujours ; rouvre tout seul à la fin. Contrôle fait par gs_onboarding à la connexion (export `ArrivalCheck`).\n  - **Partis récemment** (admin) et **ban hors ligne** (super-admin en jeu, admin dans l'appli) : les 50 dernières déconnexions\n    (hors staff, vidées au redémarrage) ; un joueur revenu en ville se bannit depuis sa fiche.\n  - **Contournement de ban** : à chaque ban (F10/F11, appli, anti-triche, hors ligne), les jetons FiveM du PC et les comptes liés\n    (Discord, FiveM, Xbox…) sont notés — jamais l'adresse IP ni la licence Rockstar. Un autre compte qui arrive avec l'une\n    d'elles = alerte au staff et au journal ; `evasion = 'block'` = arrivée refusée. Débannir efface ces empreintes.\n- **F11 → Joueurs → un joueur** : « Coincé : ramener au dernier endroit sûr » (helper et plus) ; « Mort RP : tombe au cimetière ».\n- **F11 → Monde et lieux** (super-admin et plus) : **Destination du vol de l'île** (journée North Yankton : alternance, Cayo ou North\n  Yankton tous les jours ; joueurs sur place rapatriés), Courses (véhicule imposé), Gangs, Blips en double, Déplacer un point.\n- **Commandes** : `/quartierforme <quartier> <angle> [taille] [allongement]` (gangs), `/faussealerte <n°>` (police), `/voisins` (joueurs),\n  `/rapportstaff` (console : rapport de fin de soirée tout de suite).\n- **Outils Windows** : DIAGNOSTIC-MODS (abîmés, copies, maps en deux versions, voitures en double, textures ≥ 32 Mo ; O = corrections sûres\n  réversibles), METTRE-A-JOUR-OVH (envoi incrémental, reprise, IPv4), GERER-OVH (verrou pendant une mise à jour).\n\n", "ALERTES": "# Alertes et notifications — qui est prévenu de quoi\n\nRéférence vérifiée le 11/10/2026 (V12.9). Sert au staff pour comprendre ce que voit un policier ou un EMS, et à\nvérifier la cohérence RP. Garde-fou automatique : `tests/check_crimes.py` (aucun type de crime inconnu, donc aucune\nalerte perdue sans message).\n\n## 1. Le central police (`gs_wanted`) — le seul canal pour les crimes\n\nTout crime passe par `exports.gs_wanted:ReportCrime(src, type, coords, opts)`. Le central décide :\n\n- **Signalé ou pas** : base du crime + témoins (PNJ et joueurs à 40 m), × heure, × météo, × black-out, × arme\n  silencieuse, × notoriété, × tension du quartier (`gs_city`). Un policier en service à portée = signalement certain.\n- **Avec quelle précision** : zone floutée (20 à 250 m), délai (5 à 40 s), plaque partiellement lisible, description\n  brute (jamais le nom, sauf visage connu non masqué).\n- **Caméras** de surveillance proches : quasi certain, zone précise, plaque lisible, preuve vidéo gardée.\n- **Alarme silencieuse** (braquages) : certain et précis.\n- **Destinataires** : policiers en service (**LSPD et shérif**, via `countsAs = 'police'`), et les membres d'un gang\n  qui a piraté le scanner. Moins de 1 policier joueur en service → **police IA** (étoiles du jeu, patrouilles).\n- **Seul en ville (aucun policier joueur en service)** : un crime sérieux (gravité ≥ 20 : explosion, braquages,\n  bijouterie, banque, contrat en duo, sabotage, blanchiment) est signalé **au moins 6 fois sur 10**, même sans témoin\n  (`Config.NpcPolice.floor`). Les petits délits (vente de drogue, vol de voiture, course…) restent discrets.\n  Le staff teste la police IA sur lui avec `/policeia [1-5]` (admin).\n\n### Alertes systématiques (même sans témoin)\n\n| Événement | Alerte | Exceptions |\n|---|---|---|\n| Coups de feu | « Coups de feu détectés », rue + GPS, sans description | policier / shérif en service ; stands de tir Ammu-Nation ; **chasseur avec permis dans la zone de chasse** ; arme silencieuse (pas d'alerte automatique, seulement les témoins) ; 1 alerte / 10 s / joueur, 1 / 20 s / zone |\n| Arme blanche (couteau, batte…) | « Agression à l'arme blanche signalée » | policier / shérif en service ; 1 / 15 s |\n\n### Tous les types de crimes (25)\n\n| Type | Intitulé reçu par le policier | Déclenché par |\n|---|---|---|\n| `gunshot` | Coups de feu | tir (gs_evidence → gs_wanted) |\n| `stabbing` | Agression à l'arme blanche | coup d'arme blanche (serveur) |\n| `explosion` | Explosion | explosion causée par un joueur (serveur) |\n| `carjack` | Vol de véhicule avec violence | sortir un conducteur de sa voiture |\n| `vehicle_theft` | Vol de véhicule (serrure forcée / fils) | `qbx_vehiclekeys` (branché sur le central en V12.7) |\n| `store_robbery` | Braquage de supérette | supérettes 24/7 (`gs_heists`) |\n| `shop_robbery` | Braquage de commerce | caisse d'un commerce au pistolet (`gs_stickup`), caisse d'une doublure (`gs_business`) |\n| `teller_robbery` | Braquage de guichet | guichet de banque (`gs_stickup`) |\n| `jewelry` | Braquage de bijouterie | Vangelico (`gs_heists`) |\n| `bank` | Braquage de banque | Fleeca, gros coup en duo (`gs_heists`) |\n| `mugging` | Racket à main armée | racket d'un passant (`gs_stickup`) |\n| `racket` | Racket et dégradation de commerce | racket d'un commerce par un gang (`gs_gangs`) |\n| `vandalism` | Dégradation d'une caméra de surveillance | caméra peinte (`gs_cctv`) |\n| `sabotage` | Sabotage du réseau électrique | transformateur (black-out, `gs_city`) |\n| `drug_sale` | Vente de stupéfiants | ventes, plantations (`gs_drugs`, `gs_gangs`) |\n| `black_market` | Trafic d'armes | marché noir |\n| `contract` | Contrat criminel | contrats du marché noir |\n| `duo_contract` | Vol de marchandise | contrat en duo (`gs_duo`) |\n| `smuggling` | Transport de marchandise illégale | `gs_smuggling`, `gs_gigs` |\n| `street_race` | Course de rue illégale | `gs_races` |\n| `poaching` | Braconnage | dépecer sans permis de chasse (`gs_harvest`) |\n| `refusal` | Refus d'obtempérer | contrôle routier (`gs_roadside`) |\n| `money_laundering` | Blanchiment d'argent | contrôle fiscal (`gs_jobs`) |\n| `assault`, `robbery` | Agression, Braquage | génériques (réservés) |\n\nVolontairement **sans alerte** : combats clandestins (le ring se trouve par les rumeurs), labos et plantations tant\nqu'on n'y vend pas, faux papiers (démasqués au contrôle au commissariat).\n\n### Ce que le crime déclenche ensuite (même s'il n'est pas signalé)\n\nTraces pour l'enquête (`gs_evidence` : douilles, empreintes, sang), mémoire de la ville (tenue, véhicule), tension du\nquartier (`gs_city`), rumeurs (`gs_rumors`), direct Weazel possible (`gs_social`), résumé du soir sur Discord,\nvitres brisées et cicatrices (`gs_scars`), commerçants qui refusent un braqueur reconnu (`gs_economy`).\n\n## 2. Secours (EMS)\n\n| Situation | Ce qui se passe |\n|---|---|\n| À terre, **EMS joueur en service** | « [G] Demander de l'aide » (`qbx_ambulancejob`) → alerte + GPS aux EMS en service |\n| À terre, **aucun EMS** | « [G] Appeler les secours » (`gs_services`) → secouriste IA payant, réanimation |\n| Témoin d'un accident | appli **Urgences** du téléphone → EMS en service, avec position |\n\n## 3. Appels des citoyens\n\nL'appli **Urgences** du téléphone (`gs_phone`) : police, EMS, dépanneuse, avec position. Impossible menotté ou à\nterre (le téléphone est bloqué), c'est voulu. `/911p` (Qbox) est réservé au staff depuis la V12.7 : il permettait\nd'appeler sans téléphone, même menotté.\n\n## 4. Annonces générales (toute la ville)\n\nFlash Weazel et réseau social (`gs_social`), Radio Los Santos (`gs_lsradio`), météo et événements (`gs_weather`),\navis de recherche des fugitifs (`gs_wanted`), annonces staff (`gs_admin`, aussi depuis Discord : `/annonce en_jeu`),\nredémarrages (txAdmin + Discord).\n\n## 5. Ce qui n'est PAS dans le dépôt et dépend de l'installation\n\nLes retouches de `qbx_vehiclekeys` (vols → central) et de `qbx_police` (`/911p` staff) sont appliquées par\n`METTRE-A-JOUR.bat` (`outils-communs.ps1`, liste `$QboxPatches`). Vérifie dans sa fenêtre :\n« qbx_vehiclekeys : vols de véhicule : alerte par le central RoadLine » et « qbx_police : /911p réservé au staff »\nen vert. En jaune = la version de Qbox a changé, me le signaler. Puis `METTRE-A-JOUR-OVH.bat` pour le VPS.\n", "DISCORD": "# Discord de RoadLine : structure conseillée\n\nUn modèle Discord ne contient que des salons, rôles et permissions. Le plus fiable : créer la structure ci-dessous une\nfois, puis **Paramètres du serveur → Modèle de serveur → Générer un lien** pour la dupliquer. (Des modèles communautaires\nexistent aussi, par ex. xenon.bot/templates/for/fivem : vérifie les permissions avant d'en importer un.)\n\n## Rôles (du plus haut au plus bas)\nFondateur · Super-admin · Admin · Modérateur · Helper · Bot · Whitelisté · Candidat · Visiteur\n(les mêmes rangs qu'en jeu ; les rangs en jeu se donnent dans le menu staff F11, pas via Discord)\n\n## Catégories et salons\n- **📢 ACCUEIL** : `règlement` (lecture seule, même texte que /regles), `annonces`, `mises-à-jour`, `statut-serveur`\n- **📝 CANDIDATURES** : `comment-candidater`, `candidatures` (formulaire → staff), `résultats`\n- **💬 COMMUNAUTÉ** : `général`, `médias`, `clips`, `idées`, `vibe-miroir` ← webhook `gs_webhook_social`\n- **⚖️ TRANSPARENCE** : `sanctions` ← webhook `gs_webhook_sanctions` (public, staff anonyme)\n- **🛟 SUPPORT** : `aide`, `signaler-un-bug`, `tickets` (bot de tickets au choix), `remboursements`\n- **🎭 RP HORS JEU** : `entreprises` (recrutements), `gangs` (sur candidature), `événements`\n- **🔒 STAFF** (Helper+) : `staff-général`, `logs-staff` ← `gs_staff_webhook`, `logs-jobs` ← `gs_webhook_jobs`,\n  `logs-boutique` ← `gs_webhook_boutique`, `vocal-staff`\n- **🔊 VOCAL** : `Salle d'attente support`, `Détente`, `Événements`\n\nWebhooks : clic droit sur le salon → Modifier → Intégrations → Webhooks → copier l'adresse dans `cfg/secrets.cfg`.\n\n## Le bot RoadLine (V10) : installation en 5 minutes, une seule fois\nLe bot tourne **dans le serveur FiveM** : rien à installer sur le PC, il démarre et s'arrête avec le serveur (en local\ncomme chez l'hébergeur). Ensuite, plus rien à faire : les mises à jour passent par METTRE-A-JOUR.bat.\n\n1. **Créer le bot** : va sur `discord.com/developers/applications` → **New Application** → nom « RoadLine » → menu\n   **Bot** → **Reset Token** → **Copy** (c'est le jeton : ne le donne jamais à personne).\n2. **Webhooks** : sur ton Discord, salon `statut-serveur` → Modifier → Intégrations → Webhooks → Nouveau → Copier\n   l'URL. Pareil pour le salon `annonces`.\n3. **Double-clic sur `CONFIGURER-DISCORD.bat`** et colle, quand on te le demande :\n   - l'URL du webhook `statut-serveur`, puis celle d'`annonces` ;\n   - l'adresse pour rejoindre (txAdmin → `cfx.re/join/...`) ;\n   - le jeton du bot (il s'écrit masqué) et l'identifiant de ton Discord (clic droit sur l'icône du serveur →\n     Copier l'identifiant ; active le Mode développeur dans les paramètres Discord si l'option n'apparaît pas).\n4. La page d'invitation s'ouvre toute seule : choisis ton serveur Discord → **Autoriser**.\n5. **Relance le serveur** (ou METTRE-A-JOUR.bat). Dans la minute : le bot passe « en ligne » avec « 12/48 citoyens à\n   Los Santos », le salon statut se met à jour, et `/statut`, `/rejoindre`, `/rdv`, `/site` marchent.\n\n**Sur le VPS OVH** : PREPARER-OVH.bat emporte `secrets.cfg`, donc le bot suit tout seul (docs/OVH.md).\n**Rôles de métier** (facultatif) : dans `cfg/secrets.cfg`, `set gs_discord_roles \"police=ID,ambulance=ID,mechanic=ID\"`\n(gardé aux mises à jour), et place le rôle du bot au-dessus d'eux (Paramètres → Rôles).\n\n## Modérer depuis Discord (V10.1), même sur téléphone\nV12.3 : commandes réservées au **rôle staff** (`set gs_discord_staff_role \"ID-DU-ROLE\"`), au **propriétaire** et aux\n**administrateurs du Discord RoadLine**, et **uniquement sur ce Discord** (`gs_discord_guild`, vérifié avant tout :\nun bot invité ailleurs ne répond à personne). CONFIGURER-DISCORD.bat demande ces identifiants.\nLes réponses ne sont visibles que par toi. `/aide` liste les commandes (avec celles du staff si tu y as droit).\n\n| Commande | Effet en jeu |\n|---|---|\n| `/joueurs` | joueurs en ville : identifiant, nom, personnage, ping |\n| `/geler id` · `/degeler id` | le joueur ne peut plus bouger (tricheur repéré) / libéré |\n| `/avertir id texte` | avertissement (note au dossier, publié dans les sanctions) |\n| `/expulser id texte` | expulsion du serveur |\n| `/message id texte` | message privé du staff au joueur |\n| `/annonce texte [titre] [mention] [en_jeu]` | V12.5 : **publiée sur Discord** dans `#annonces` (ou dans le salon courant si `#annonces` n'est pas relié), 1 800 caractères, `@everyone` / `@here` en option ; `en_jeu` = aussi affichée à toute la ville |\n| `/isoler id minutes motif` · `/liberer id` | isolement hors RP (cour de Bolingbroke, 1 à 240 min, publié dans #sanctions) / libération |\n| `/reanimer id` | réanime et soigne un joueur bloqué |\n| `/ticket sujet` · `/fermer` · `/aide` (= `/help`) | tickets en fil privé (tous les membres) · liste des commandes |\n| `/ip` · `/rejoindre` · `/statut` · `/rdv` · `/site` | tous les membres : adresse de connexion, mode d'emploi, état du serveur, rendez-vous, site |\n\nPour bannir : txAdmin (`http://IP:40120`), qui marche aussi sur téléphone. Autre possibilité : le panneau staff web\n`http://IP:30120/gs_admin/` (voir docs/OVH.md, § 5). Chaque action est journalisée « Discord · pseudo ».\n**« Commande disponible uniquement sur le Discord RoadLine » alors que tu y es** (avant V12.5) : l'identifiant du serveur\nDiscord (`gs_discord_guild`) était vide ou faux. Depuis V12.5 : si le bot n'est que sur ton Discord, il le **détecte tout\nseul** à la connexion ; sinon le message dit exactement quoi corriger. GERER-OVH → diagnostic affiche « réglé / NON RÉGLÉ ».\n**Ça ne marche pas ?** Console du serveur : « Bot Discord connecté » = OK ; « Jeton refusé » = relance CONFIGURER-DISCORD\navec un nouveau jeton.\n\n## Tickets (V11.4)\n`/ticket sujet` ouvre un **fil privé** dans `#tickets` : le joueur et le rôle staff y sont ajoutés, rien n'est visible\ndes autres. `/fermer` (auteur ou staff) l'archive et le verrouille. Un ticket ouvert par membre, 2 min entre deux.\n1. Crée le salon `tickets` : les membres peuvent **voir** le salon et **utiliser les commandes**, mais pas y écrire ni\n   créer de fils eux-mêmes. Le staff : « Gérer les fils » (voit tous les tickets).\n2. **CONFIGURER-DISCORD.bat** : colle l'identifiant du salon `tickets` (et du rôle staff), puis réautorise le bot avec le\n   lien qui s'ouvre (nouveaux droits : fils privés). **GERER-OVH.bat → 12** pour l'envoyer au VPS.\nBot de tickets externe à la place : `set gs_discord_tickets \"false\"` dans `secrets.cfg` (les commandes disparaissent).\n\n## Message de bienvenue (V12.8)\n\nLe bot RoadLine accueille chaque nouveau membre dans le salon de ton choix : « Nous sommes heureux de t'accueillir parmi\nnous, @membre, sur RoadLine RP ! Lis le règlement, puis `/ticket` si tu as une question. » (texte modifiable).\n\n1. discord.com/developers → ton application → **Bot** → **Privileged Gateway Intents** → activer **Server Members Intent** → Save.\n   Sans ça, Discord refuse l'intent : le bot l'écrit dans la console, coupe la bienvenue et continue normalement.\n2. CONFIGURER-DISCORD.bat → « Salon #bienvenue » : identifiant du salon (clic droit → Copier l'identifiant).\n   Le bot doit pouvoir écrire dans ce salon (droits du rôle du bot sur le salon).\n3. Texte personnalisé (optionnel) : `set gs_discord_welcome_text \"Bienvenue {membre} ! …\"` dans `cfg/secrets.cfg`\n   (`{membre}` = mention du nouveau).\n4. GERER-OVH → 12 (le bot redémarre avec le serveur), puis fais entrer un compte de test : le message doit apparaître.\n\nAvant la V12.8, le bot RoadLine n'envoyait **aucun** message de bienvenue : si tu en avais un jusqu'au 4 octobre, il venait\nd'un autre bot (MEE6, Dyno, Carl…) ou de l'onboarding Discord ; vérifie-le de son côté, ou laisse le bot RoadLine s'en charger.\n\n## Liste de contrôle Discord (à faire une fois, dans l'ordre)\n\n1. Portail développeur : application créée, **Bot** → jeton (Reset Token), **Server Members Intent** activé.\n2. CONFIGURER-DISCORD.bat : webhooks #statut, #annonces, #logs-staff (privé), #sanctions (public), adresse de connexion,\n   jeton du bot, identifiants : serveur Discord, rôle staff, salon #tickets, salon #bienvenue.\n   Dans `cfg/secrets.cfg` aussi : `gs_webhook_candidatures` (site → #candidatures), `gs_webhook_social`, `gs_webhook_jobs`,\n   `gs_webhook_boutique`, `gs_webhook_anticheat`, `gs_discord_roles` (métier → rôle).\n3. Inviter le bot avec le lien affiché par CONFIGURER-DISCORD (droits : voir, écrire, liens, historique, gérer les rôles,\n   fils privés et les gérer). Sur #tickets : le bot doit pouvoir **créer des fils privés** et **gérer les fils**.\n4. GERER-OVH → 12 (envoi + redémarrage) puis → 17 : un message de test dans chaque salon relié, bot « connecté » dans la console.\n5. Tester en tant que membre : `/statut`, `/ip`, `/rejoindre`, `/rdv`, `/site`, `/aide` (= `/help`), `/ticket test` puis `/fermer` ;\n   en tant que staff (rôle staff ou administrateur) : `/joueurs`, `/geler`, `/degeler`, `/avertir`, `/message`, `/annonce`,\n   `/expulser`, `/isoler`, `/liberer`, `/reanimer` ; faire entrer un compte de test → message de bienvenue.\n6. Si une commande manque : le bot enregistre les commandes à chaque connexion sur le Discord `gs_discord_guild` ;\n   si l'identifiant est faux ou le bot absent du serveur, elles passent en « globales » (jusqu'à 1 h de délai Discord).\n\n## V11 · Vérifier que tout est relié (VPS)\n1. Sur le PC : **CONFIGURER-DISCORD.bat** (jeton du bot, webhooks des salons).\n2. **GERER-OVH.bat → 12** : envoie ces réglages au VPS (la base du VPS n'est pas touchée), le serveur redémarre.\n3. **GERER-OVH.bat → 17** : « Bot Discord : connecté » + un message « ✅ Test du VPS » dans chaque salon relié (sinon : REFUSÉ = webhook\n   supprimé ou mal copié, non réglé = vide dans secrets.cfg). L'adresse `/rejoindre` est réglée toute seule si elle était vide.\n- Le salon **staff** reçoit aussi les alertes de la veille (serveur tombé / revenu).\n", "SECURITY": "# Sécurité (défensive)\n\n## Règles non négociables\n1. Ne jamais faire confiance au client : argent, items, jobs validés côté serveur.\n2. Chaque `RegisterNetEvent` / `lib.callback.register` : rate-limit (vérifié par `tests/check_links.py`), puis source, distance, job/permission.\n3. ACE strictes (`add_ace` / `add_principal`), rien de `allow` global.\n4. Aucun secret dans le repo : `server.cfg` et `cfg/secrets.cfg` ignorés, fichiers `.example` avec placeholders (vérifié par `tests/check_cfg.py`).\n5. Actions sensibles loguées vers webhook Discord staff (URL en convar, jamais en dur).\n6. Backups BDD automatiques (`SAUVEGARDER-BDD.bat`) + rollback documenté à chaque déploiement (`METTRE-A-JOUR.bat` sauvegarde avant).\n7. Anti-DDoS côté hébergeur (voir plus bas).\n\n## Audit V3.1 : ce qui protège le serveur\n\n| Menace | Protection en place | Où |\n|---|---|---|\n| **Injection SQL** | Toutes les requêtes passent des paramètres `?` (oxmysql). Le linter refuse toute requête construite par concaténation `..` | `tests/check_links.py` (règle n°2) |\n| **Exécution de code injecté** | Aucun `load` / `loadstring` côté serveur, refusé par le linter | `tests/check_links.py` (règle n°3) |\n| **Spam d'events (flood, mini-DDoS applicatif)** | Rate-limit par joueur et par action ; au-delà de 60 refus en 30 s, le joueur est **expulsé** et journalisé | `gs_security/server/main.lua` |\n| **Menus de triche : armes données / retirées à distance, éjection de véhicule** | Events natifs `giveWeaponEvent`, `removeWeaponEvent`, `removeAllWeaponsEvent`, `clearPedTasksEvent` bloqués + journal | `gs_security/server/anticheat.lua` |\n| **Explosions en rafale / invisibles** | Plus de 4 explosions en 10 s bloquées, explosions invisibles bloquées | idem |\n| **Lag volontaire (particules)** | `ptFxEvent` limité | idem |\n| **Se démenotter / fausse escorte (client qui écrit son state bag)** | Valeur serveur de référence, modification client annulée et journalisée | `gs_police/server/main.lua` |\n| **Argent / items dupliqués** | Tout gain passe par le serveur (distance, durée réelle, stock, cooldown) ; actions en deux temps (début / fin) pour les récoltes, braquages, réparations | chaque ressource `gs_*` |\n| **Téléportation / missions trichées** | Vitesse crédible entre deux étapes de mission (> 270 km/h = annulée) | `gs_jobs/server/missions.lua` |\n| **Abus de pouvoir staff** | Niveaux ACE, mode staff obligatoire, jamais de sanction sur un staff de niveau égal ou supérieur, tout journalisé (BDD + Discord), sanctions publiques | `gs_admin` |\n| **Entités créées par les clients** | `sv_entityLockdown relaxed`, `sv_filterRequestControl 2`, sons et explosions réseau coupés | `cfg/dev.cfg`, `cfg/prod.cfg` |\n| **ScriptHook / fichiers de jeu modifiés** | `sv_scriptHookAllowed 0`, `sv_pureLevel 1` | `server.cfg.example` |\n| **Fuite de secrets** | Linter qui cherche licences, webhooks et chaînes de connexion commités | `tests/check_cfg.py` |\n| **Perte de données** | Sauvegarde zip avant chaque mise à jour + sauvegarde quotidienne planifiée de la base | `METTRE-A-JOUR.bat`, `SAUVEGARDER-BDD.bat` |\n\nLimites honnêtes : un anti-triche serveur ne voit pas tout ce qui se passe **dans** le client (aimbot, ESP, noclip local).\nPour ça : staff actif (spectate F11), signalements `/report`, et plus tard un anti-triche reconnu (à auditer comme tout script tiers).\n\n## DDoS : ce qui se règle chez l'hébergeur (pas dans le code)\nUne attaque DDoS sature la connexion **avant** d'atteindre FiveM : aucune ligne de Lua ne peut l'arrêter.\n1. **Héberger chez un fournisseur avec anti-DDoS « jeu »** qui filtre l'UDP : OVHcloud (Game / VPS avec Anti-DDoS Game),\n   ou un hébergeur FiveM spécialisé. Un PC à la maison n'est pas protégé : à réserver aux tests.\n2. **Ne pas diffuser l'IP** : on partage le lien `cfx.re/join/…`, jamais l'IP. En prod, tester `sv_forceIndirectListing` (cfg/prod.cfg).\n3. **Pare-feu** : n'ouvrir que le port du serveur (30120 TCP/UDP) et, pour txAdmin, restreindre le port 40120 à ton IP.\n4. **txAdmin** : mot de passe fort + authentification à deux facteurs, pas de compte partagé.\n5. **Discord** : rôles staff limités, jamais de webhook collé dans un salon public.\n\n## Checklist audit script tiers (avant install)\n- [ ] Origine et licence claires (pas de fuite / leak)\n- [ ] grep : `PerformHttpRequest`, `load(`, `loadstring`, `assert(load`, `os.execute`, `io.popen`, base64/hex suspects\n- [ ] Code obfusqué ou fichiers `.dll`/binaires inattendus → refus\n- [ ] Events serveur : validation source/params ? sinon patch avant merge\n- [ ] Ajouts `server_script` cachés dans `fxmanifest`\n- [ ] Test sur dev avec console propre + resmon\n\n## Interdits\nCheats, exploits, contenu Rockstar/IP tierce, loot boxes, monnaie in-game payante.\n", "BOUTIQUE": "# Boutique (gs_store + Tebex)\n\n## ⚠️ À lire AVANT d'ouvrir les ventes (décision Alpha)\nLes règles Cfx.re ont changé en 2026. Des analyses publiques signalent que le Creator PLA de janvier 2026\ndéfinit des « Virtual Items » (véhicules, skins…) et semble en restreindre la vente, et un PLA daté du\n**10 septembre 2026** existe ([PLA officiel](https://static.cfx.re/platform-license-agreement-10-sept-2026.pdf),\n[analyse Prism News](https://www.prismnews.com/news/cfxre-creator-pla-update-threatens-fivem-and-redm-monetization-models),\n[guide FiveM Coach 2026](https://fivemcoach.com/blog/fivem-monetization-rules)).\n[DEV] n'a pas pu lire le texte officiel depuis son environnement. **Alpha doit le lire (ou le faire lire)\net confirmer ce qui est vendable avant de passer `Config.Enabled = true`.** C'est pour ça que la boutique\nest livrée désactivée : les achats sont enregistrés, rien n'est réclamable.\n\n## Règles maison (prompt maître, non négociables)\n| ✅ Autorisé | ❌ Interdit |\n|---|---|\n| Tenues, skins, véhicules **créés pour nous** ou **sous licence** | Marques réelles, véhicules « débadgés » d'autres jeux, personnages connus (IP tierce) |\n| Véhicules aux **performances identiques** à un équivalent achetable en jeu | Véhicule plus rapide/résistant qu'en jeu (pay-to-win) |\n| Confort : slot de perso, plaque perso, emplacement de garage | Argent in-game, armes, items de gameplay, loot box |\n| Tebex uniquement | Tout autre moyen de paiement |\n\nChaque contenu vendu : fichier source et licence gardés (preuve), relu par [DEV] (audit sécurité, docs/SECURITY.md).\n\n## V12.41 · Vitrine en jeu et RoadCoins\n- **Vitrine** : `/boutique` (ou une touche au choix : Paramètres → Raccourcis clavier → FiveM → « Boutique RoadLine ») ouvre\n  une interface aux couleurs du site : catégories RoadCoins, VIP, Véhicules, Personnalisation, Skins d'armes, et « Mes achats »\n  (récupérer un pack, appliquer un skin / une tenue). « Acheter » ouvre la boutique Tebex (`Config.ShopUrl`) dans le\n  navigateur. Articles, textes, icônes et prix : `Config.Catalog` (prix à définir ensemble ; vide = « Prix à venir »).\n- **RoadCoins** (monnaie de la BOUTIQUE, pas du jeu) : packs Tebex `roadcoins_500 / 1100 / 2400 / 5000` (`coins = N`),\n  crédités **tout de suite** sur le compte Cfx.re (table `gs_store_wallet`, journal `gs_store_coin_log`), partagés entre les\n  personnages du compte. Un article du catalogue avec `coins = N` (et un pack avec `grants`) se paie en jeu : débit atomique\n  (jamais de solde négatif), livraison sur le personnage en cours, RoadCoins rendus si rien n'a pu être livré.\n  Remboursement Tebex (`gsstore_revoke`) : les RoadCoins restants sont repris, le manque (déjà dépensé) est signalé au staff.\n- **Jamais** : conversion en $ du jeu, échange entre joueurs, achat d'objet de gameplay, tirage au sort (loot box).\n- Skins d'armes = teintes / gravures uniquement (à brancher : `grants` à définir) ; aucune arme vendue.\n\n## Fonctionnement\n1. Le joueur achète sur Tebex (connecté avec son compte **Cfx.re**).\n2. Tebex exécute une commande **console** sur le serveur : `gsstore_deliver <transaction> <package> <id Cfx.re>`.\n3. La commande est enregistrée une seule fois (`gs_store_orders`, transaction unique : pas de double livraison).\n4. En jeu : `/boutique` → « À récupérer » → le joueur choisit **le personnage** qui reçoit le pack (définitif).\n5. Skins et tenues : applicables depuis `/boutique` ; véhicule : ajouté au garage du personnage.\n6. Remboursement / chargeback : Tebex exécute `gsstore_revoke <transaction>` → skins/tenues retirés ;\n   un véhicule déjà livré est signalé au staff (webhook `gs_webhook_boutique`) pour retrait manuel.\n\nSécurité : les commandes `gsstore_*` sont **refusées en jeu, même pour un admin** (console / Tebex uniquement),\net toute tentative est loggée.\n\n## Installation Tebex ([CONFIG])\n1. Créer la boutique sur tebex.io (type FiveM), relier le serveur : clé secrète dans `cfg/secrets.cfg` :\n   `set sv_tebexSecret \"...\"` (voir docs.fivem.net → *Setting up a Tebex store*).\n2. Pour chaque package Tebex, commande à l'achat :\n   `gsstore_deliver {transaction} pack_neon_rider {id}` — la clé (`pack_neon_rider`) = une entrée de `Config.Packages`.\n   **[À VÉRIFIER dans le panel Tebex]** le nom exact des variables (`{transaction}`, et celle qui donne\n   l'identifiant Cfx.re de l'acheteur) ; ne PAS cocher « nécessite que le joueur soit en ligne » (la réclamation se fait en jeu).\n3. Commande au remboursement / chargeback : `gsstore_revoke {transaction}`.\n4. Déclarer packages, skins et tenues dans `gs_store/shared/config.lua` (les exemples actuels sont des placeholders vanilla).\n5. Tester avec un achat à 0 € / mode test Tebex sur le serveur de dev.\n\n## Impact / risques / rollback\n- Tables : `gs_store_orders`, `gs_store_unlocks`, `gs_store_prefs`.\n- Risques : conformité PLA (ci-dessus) ; noms d'API `[API]` (qbx_vehicles, illenium-appearance) à confirmer.\n- Rollback : `Config.Enabled = false` (les commandes continuent d'être enregistrées), ou retirer `ensure gs_store`.\n", "BOUTIQUE_LEGAL": "# Boutique : cadre légal (à valider AVANT d'ouvrir les ventes)\n\n> Ce document est un **modèle de travail**, pas un avis juridique. Les textes officiels (licence Cfx.re, conditions Tebex,\n> droit de la consommation) priment et changent : relis-les à chaque ouverture ou changement de la boutique.\n> `Config.Enabled = false` dans `gs_store/shared/config.lua` tant que cette liste n'est pas cochée.\n\n## 1. Licence de la plateforme (Cfx.re / FiveM)\n- [ ] Relire la **licence Cfx.re en vigueur** (PLA / conditions de monétisation) sur le site officiel, à la date du jour.\n- [ ] Vérifier que la boutique passe par le **prestataire autorisé** (Tebex intégré à Cfx.re) et nulle part ailleurs.\n- [ ] Vérifier la liste des **contenus interdits à la vente** (ce que la licence exclut à la date de lecture).\n- [ ] Noter ici la date de lecture et la version : `_____ / _____`.\n\n## 2. Règles maison (déjà appliquées dans le code)\n- Cosmétique et confort **uniquement** : tenues, skins, plaques / néons, pass de saison **cosmétique**, titres.\n- **Aucun** avantage de jeu : pas d'argent en jeu, pas d'armes, pas de véhicules plus performants que ceux du jeu,\n  pas de caisses aléatoires (loot box), pas de « boost » d'XP payant.\n- Aucun contenu Rockstar ni IP tierce (marques, personnages, logos, musiques).\n\n## 3. Conditions générales de vente (modèle à compléter)\n1. **Vendeur** : nom / pseudo de l'organisateur, contact (e-mail), pays.\n2. **Produits** : biens numériques cosmétiques liés à un compte FiveM ; aucune valeur monétaire, ni échange, ni revente.\n3. **Prix et paiement** : affichés TTC par Tebex, qui encaisse et émet la facture.\n4. **Livraison** : en jeu, commande `/boutique` → « Réclamer », sur le personnage de ton choix, sous 24 h au plus.\n5. **Droit de rétractation** (UE) : pour un contenu numérique fourni immédiatement, l'acheteur doit **renoncer\n   expressément** à son droit de rétractation au moment de l'achat (case à cocher dans Tebex). Sans cette case, rembourser\n   sur demande sous 14 jours.\n6. **Remboursements** : double paiement, produit non livré, erreur de notre part → remboursement. Contenu utilisé → non.\n   Rétrofacturation abusive → accès boutique suspendu (pas de sanction en jeu liée au paiement lui-même).\n7. **Bannissement** : un bannissement pour triche ne donne pas droit à remboursement ; le préciser clairement.\n8. **Fin du serveur** : les achats ne sont pas garantis au-delà de la vie du serveur ; prévenir 30 jours avant toute fermeture.\n9. **Mineurs** : achat avec l'accord d'un parent ; indiquer l'âge minimum du serveur.\n10. **Données** : ce que Tebex collecte, ce que nous gardons (identifiant FiveM, référence d'achat, date), durée.\n\n## 4. Radios, musiques, images\n- [ ] Toute musique diffusée (radio en jeu, écran de chargement, lives) doit être **libre de droits** ou **sous licence**.\n      Pas de titres du commerce sans licence.\n- [ ] Images de la boutique et du site : créations maison ou banques libres de droits (source notée).\n- [ ] Photos Vibe : hébergées chez un prestataire choisi ; modération (signalements) et suppression sur demande.\n\n## 5. Avant d'ouvrir\n- [ ] Sections 1 à 4 validées et datées, `Config.Enabled = true`, un achat test remboursé de bout en bout.\n", "IMPORTER_MODS": "# Importer des mods (véhicules, vêtements, maps / MLO, scripts)\n\n## En 3 gestes\n1. Sur ton Drive : clic droit sur le dossier **GTA** → **Télécharger** (Google fait un ou plusieurs .zip).\n   Ou plus simple : installe **Google Drive pour ordinateur** ; le script trouve tout seul `G:\\Mon Drive\\GTA`.\n2. Pose ces .zip tels quels dans `C:\\GTASOON\\mods-a-trier` (créé au premier lancement).\n3. Double-clic sur **IMPORTER-MODS.bat**.\n\nLe script décompresse tout (zip, rar, 7z, même imbriqués ; installe 7-Zip s'il manque), reconnaît chaque mod, le\ncontrôle et le range dans `C:\\GTASOON\\mods-tri\\` :\n- **vehicules / maps / vetements** prêts pour FiveM → installés dans `resources\\[addons]\\gsa_<nom>` + `cfg\\addons.cfg`\n  (jamais écrasé par METTRE-A-JOUR ; mets un `#` devant une ligne pour couper un mod) ;\n- **a-convertir** : mods « solo » (dlc.rpf, vêtements qui remplacent ceux du jeu) ;\n- **scripts-a-verifier** : scripts, jamais installés sans relecture ;\n- **rejetes** : scripts ESX seuls, code obfusqué, packs graphiques (reshade, oiv), **marques réelles**.\n\n## « Un mod ne passe pas à chaque fois » : corrigé en V12.59\nSept causes trouvées (reproduites par `tests/test_importer.sh`) :\n- **Zip Google Drive en plusieurs morceaux** (`GTA-20261014T101500Z-001.zip`, `-002.zip`…) : Drive coupe le dossier où il\n  veut, un mod pouvait être à cheval (modèles dans un zip, `.meta` dans l'autre) et chaque moitié était analysée seule ; le\n  2e morceau passait même pour un doublon. Les morceaux d'un même téléchargement sont maintenant décompressés **ensemble**.\n- **Mod sans fxmanifest** (voiture ou vêtement « stream » seul) rangé à côté de dossiers-ressources dans un même zip : il était\n  effacé sans un mot. Il devient un mod à part.\n- **Doublons** : deux mods différents de taille proche (`x_2` / `x_3`) passaient pour le même. Un doublon est désormais\n  identique à l'octet près (même taille exacte, même nombre de fichiers).\n- **Dossier déjà décompressé** posé dans mods-a-trier, ou **archive en volumes** (`x.7z.001`, `x.part1.rar`) : ignorés sans\n  message. Ils sont importés (ne mettre que le 1er volume n'est pas nécessaire : laisser tous les morceaux côte à côte).\n- **Import raté une fois = jamais retenté** : si IMPORTER-MODS tournait serveur allumé (fichiers verrouillés), la signature\n  était quand même enregistrée et METTRE-A-JOUR répondait « Mods : rien de nouveau ». Elle n'est plus enregistrée tant qu'un\n  mod n'a pas pu être installé : il est retenté à chaque fois.\n- **Voiture livrée avec un petit fichier de noms** (`vehicle_names.lua`, `AddTextEntry`) : rangée dans scripts-a-verifier et\n  jamais installée (rapport du 15/10 : Jester MK4, Bati 801, Sentinel GTS, Itali GTO). Si le code ne fait que nommer le modèle\n  (aucun événement réseau, commande, export, accès fichier ou web, rien côté serveur, moins de 30 Ko), c'est une voiture.\n- **Robe ou haut FiveM refusé « Franklin / Michael / Trevor »** : les fichiers `uppr_` existent aussi chez les persos FiveM.\n  Refusé seulement sans aucune trace de perso FiveM (`mp_f_freemode`, « for MP Female »…).\n\nRefus **voulus** (raison écrite dans RAPPORT-MODS.txt, à lire avant de conclure qu'un mod « ne passe pas ») : marque réelle,\nfichier > 16 Mo, pack > 300 Mo, script ESX / obfusqué, script payant sans sa map, map retirée (`mods-retires.txt`),\narchive incomplète, vêtement « solo » à convertir.\n\n## DIAGNOSTIC-MODS.bat (V12.60) : l'outil « magique » après un import\nDouble-clic : lit tous les mods démarrés et écrit `mods-tri\\DIAGNOSTIC-MODS.txt` : **fichiers abîmés** (crash « Invalid fixup »),\n**vêtements en conflit** (deux packs avec la même collection `dlcName` : l'un s'affiche cassé), **voitures en double** (même nom\nde spawn), **fichiers en double** (même nom, contenu différent), lignes de `addons.cfg` sans dossier, mods jamais démarrés, mods\ntrès lourds. Réponds **O** pour les corrections sûres : mod abîmé mis en pause (`#` + raison), ligne morte enlevée (copie\n`cfg\\addons.cfg.avant-diagnostic`). Les conflits ne sont jamais tranchés seuls : garde-en un, ou envoie-moi le rapport.\nPacks protégés (.fxap) : chiffrés, jamais lus ni signalés à tort. Blips en double : en jeu, F11 → Monde et lieux → Blips en double.\nV12.63 : **copies en double** (tous les fichiers déjà dans un autre mod) et **même map en deux versions** (`x` + `x_1`, archive\nretéléchargée : au moins la moitié des .ymap / .ytyp / .ybn aux mêmes noms) → la copie / la version `_1` passe en pause, l'original\ndéjà réglé en jeu reste ; jamais si l'original est retiré (RETIRED_MAPS de maps.js, `mods-retires.txt` : ex. Shadow Complex, dont\nla version `_1` est le retour). Section **textures / modèles ≥ 32 Mo** (mémoire réelle lue dans l'en-tête) : à remplacer si l'un\nne s'affiche pas en jeu (les .ytd > 48 Mo des mods non protégés sont déjà allégés à l'import).\n\n## Réparer un pack abîmé (« Map ARRÊTÉE … fichier abîmé », « Invalid fixup », « Unexpected end of archive »)\n1. portal.cfx.re → **Granted Assets** → retélécharger le pack (le zip complet, sans l'ouvrir).\n2. Le mettre dans `C:\\GTASOON\\mods-a-trier` en **remplaçant** l'ancien (même nom, pas de « (1) »).\n3. Double-clic **IMPORTER-MODS.bat** : le rapport doit dire « INSTALLÉ » et la console aucune ligne rouge « ARCHIVE INCOMPLÈTE ».\n4. **METTRE-A-JOUR-OVH.bat**, puis redémarrer. Console ~20 s après : « Intégrité des maps : … aucun fichier abîmé ».\n\n## Blips des maps sur la carte (V12.29)\nTous les joueurs voient un blip nommé par lieu (`PUBLIC` dans gs_admin/server/maps.js : nom, icône, couleur ; `false` = pas\nde blip pour les lieux secrets : QG de gang, labo, garage clandestin, villa privée). Une map arrêtée perd son blip.\nUne map d'activité sans son script (laser game, karting, auto-tamponneuses, foot, billard) a un blip « (bientôt) ».\n\n## Bâtiment invisible, ou aucun point pour jouer (V12.30)\n- **Pas de point pour jouer** : laser game, karting, auto-tamponneuses, foot, billard sont des **scripts** de l'auteur.\n  La map seule = le décor. Console du serveur : « DÉCOR SEUL ». Depuis la V12.31, le script livré dans le même pack est\n  installé avec sa map (voir « Scripts compagnons » ci-dessous).\n\n## Scripts compagnons des maps payantes (V12.31)\nAvant : la map s'installait, son script partait dans `scripts-a-verifier` → « les maps sont là mais les scripts ne\ndémarrent pas ». Maintenant, un script **chiffré (escrow)** dont le nom correspond à une map installée (même mot :\nplasmagame, bumpercar, villa_bunker…) est installé avec elle :\n- sous son **nom d'origine** (pas de préfixe `gsa_`) : ses exports et ses dépendances l'appellent par ce nom ;\n- seulement si **toutes ses dépendances** sont sur le serveur (`qb-core` = qbx_core, `qb-target` / `qtarget` = ox_target,\n  `mysql-async` = oxmysql) ou dans le même import (une librairie du vendeur est alors installée aussi) ;\n- jamais s'il est ESX seul. Un script lisible (non chiffré) reste à relire avant installation ;\n- jamais si sa map est retirée (`RETIRED_MAPS` / `RETIRED_PATTERNS`, V12.36) ou si son propre nom contient un motif retiré\n  (`patoche_plasmagame_script`) : rapport « retiré par le staff », ligne de addons.cfg enlevée même si son dossier existe encore.\nRapport : « INSTALLÉ (nom_du_script, avec gsa_map) » ou « il lui manque … sur le serveur ». Console du serveur :\n« Script de map activé mais NON démarré » si la licence, une dépendance ou le renommage bloque.\n- **Bâtiment invisible** sans erreur dans la console : en jeu, **F11 → Monde et lieux → Mappings installés → Contrôler les\n  maps chez moi**. Pour chaque map : « bâtiment chargé », « aucun modèle reçu » (fichiers absents → réimporter ; ou cache →\n  VIDER-CACHE-FIVEM), « reçus mais illisibles » (licence Cfx : pack acheté avec un autre compte que celui de la clé du\n  serveur, ou fichier abîmé → retélécharger), « pack incomplet ». Le résultat est aussi écrit dans la console du serveur.\n\n## Packs payants protégés (escrow Cfx, fichier `.fxap`) — V12.18\n- Ils ne marchent **que** s'ils ont été achetés avec le compte Cfx.re (keymaster) **lié à la clé de licence du serveur**.\n  Sinon la console du serveur affiche « You lack the required entitlement » et la map n'apparaît pas.\n- Télécharge-les depuis le portail Cfx (Granted Assets) et **vérifie que le zip s'ouvre** : « Unexpected end of archive »\n  dans la console d'IMPORTER-MODS = téléchargement coupé → à retélécharger.\n- Map / véhicule / vêtement protégé : installé tel quel (rien n'est modifié, pas d'optimisation de textures), même avec\n  un petit script chiffré dedans (portes, ascenseurs).\n- Script payant seul, sans map correspondante : rangé dans **scripts-a-verifier**, pas installé (dis-moi si tu le veux).\n  Script compagnon d'une map installée : installé avec elle (V12.31, voir plus haut).\n- **Maps retirées / remises** : `RETIRED_MAPS` (noms exacts) et, depuis la V12.36, `RETIRED_PATTERNS` (motifs : `plasmagame`,\n  `plasmakart`, `plasmatron`, `villa_01`, `redline`, cherchés dans le nom de chaque ressource de `[addons]`) dans maps.js :\n  le serveur les supprime au démarrage (dossier, ligne de addons.cfg, script compagnon) et les note dans `mods-retires.txt` ;\n  IMPORTER-MODS lit les deux listes : jamais réinstallées (ni leur script compagnon), même supprimées à la main avant le\n  redémarrage, rapport « retiré par le staff (motif « redline », RETIRED_PATTERNS) ». Avant la V12.36, « plasmagamedlc2 » et\n  le pack Redline revenaient à chaque import : seuls les noms exacts étaient refusés. `$Restored` (importer-mods.ps1) sort\n  une map de `mods-retires.txt` pour qu'elle revienne depuis son archive. 12/10 : villa moderne 01 retirée, **villa bunker remise**.\n- **Archive incomplète** (« Unexpected end of archive » à la décompression) : depuis la V12.27, le pack n'est PAS installé et\n  s'il l'était déjà, il est désactivé dans `cfg\\addons.cfg`. Un fichier tronqué fait planter chaque joueur qui le charge\n  (« Invalid fixup, address is neither virtual nor physical (in xxx.ydr) »). Retélécharger, puis relancer IMPORTER-MODS.\n- Console du serveur après installation : « Failed to verify protected resource » = fichier `.fxap` manquant (zip mal\n  extrait ou mal envoyé) → réimporter le zip d'origine.\n\nMods « solo » (dlc.rpf faits avec OpenIV) : ouverts automatiquement (archives non chiffrées), sans OpenIV.\nMods livrés avec un dossier « FiveM » : c'est cette version qui est installée.\nVéhicules : ajoutés au catalogue Qbox (`qbx_core/shared/vehicles.lua`, bloc « GTA SOON ADDONS ») → concession et\ngarages ; prix et noms réglés dans `importer-mods.ps1` ($Prices, $Labels), sinon selon la catégorie. Le catalogue\nest reconstruit depuis tous les mods actifs de `addons.cfg`. Véhicules de service (VC_EMERGENCY) : pas en concession,\nmais dans le garage du métier (visibles seulement si le mod est installé).\nPacks > 300 Mo : pas installés, sauf ceux de `$PackPick` réduits aux modèles choisis.\nKits de tuning > 16 Mo : retirés automatiquement avec leurs pièces liées, la voiture reste.\nVêtements « solo » : ceux pour le perso FiveM sont convertis par Claude (outil `tools/vetements/`, zips\nROADTRIP-*.zip) ; ceux pour Franklin / Michael / Trevor et les simples recolorations ne sont pas convertibles.\nLancé par METTRE-A-JOUR : l'import est sauté si rien n'a changé dans mods-a-trier (et si l'importeur n'a pas changé).\n\nTextures trop lourdes (« Oversized assets ») : optimiseur tools/textures actif (GTASOON_TEXOPT=0 pour le couper) :\nseulement les .ytd > 48 Mo, mipmaps retirés / réduction 2x, ~34 Mo max par .ytd, jamais sous 256-512 px.\nContrôles : textures > 16 Mo (disparition de textures / crash), mod > 150 Mo, noms de spawn des véhicules.\nÀ la fin : `RAPPORT-MODS.txt` s'ouvre → copie-colle-le moi : je branche les véhicules (concession, garages), les maps\n(coords, blips, portes) et je relis les scripts.\n\n## Où sont mes maps ? (F11, V12.10)\nPlus besoin de connaître les coordonnées : au démarrage, le serveur lit les fichiers `.ymap` de chaque map installée\n(ressource `gsa_*` ou marquée `this_is_a_map`) et en déduit son emplacement. En jeu, en mode staff :\n**F11 → Monde et lieux → Mappings installés** → chaque map avec son quartier → clic = téléportation dedans (au sol de\nl'intérieur, pas sur le toit). « Afficher leurs blips sur ma carte » : blips visibles par toi seul pour faire le tour.\nConsole au démarrage : `[gs_admin] Mappings : N installé(s), N situé(s), aucun conflit`.\n**Conflit** = deux maps qui remplacent le même fichier du jeu (`.ymap`, `.ybn`, `.ytyp`) : une seule des deux\ns'affiche correctement (trous, murs invisibles, textures qui clignotent). Le menu et la console donnent le fichier et\nles deux maps. Deux copies **identiques** du même fichier ne comptent pas (aucun effet).\n**Conflit d'occlusion** (`*_occl_*.ymap`, le cas le plus courant : chaque MLO retire du jeu ce qui cacherait son intérieur) :\n**réglé tout seul depuis la V12.13**. 15 s après le démarrage, `gs_admin` fusionne les versions (on garde ce qui est présent\ndans toutes, donc les deux intérieurs s'affichent), écrit le résultat dans la ressource `gsa_zz_fusion_occlusion` et la\nrelance pour qu'elle passe après toutes les maps. Console : ligne verte « fusion », puis « Conflit résolu ». Fusion\nimpossible (fichier abîmé) : la version du magasin d'alcool de Paleto est gardée (choix du 12/10). Rien à envoyer.\nOutil hors serveur, même algorithme : `tools/maps/fusion_occlusion.py`. Autre type de conflit :\nen garder une (mettre un `#` devant l'autre dans `cfg\\addons.cfg`).\nMap sans lieu dans la liste : soit un **habillage** d'objets du jeu (ex. `hp_fleeca` retexture les 6 agences Fleeca, normal),\nsoit une map **vide** (aucun fichier de jeu, ex. `moto_free_shell`), à supprimer.\n**Modèle trop lourd** : la mémoire réelle de chaque modèle / texture est lue dans son en-tête. Signalé (menu, console en jaune)\nseulement au-delà de la limite de FiveM, la même que l'importeur : **48 Mo de mémoire graphique ou 64 Mo de mémoire système**\n(V12.14 ; la V12.11 alertait à tort dès 16 Mo). Seuls les vrais fichiers de map comptent : vêtements et véhicules importés\nn'apparaissent pas dans la liste. **Monde et lieux est réservé au super-admin et au fondateur.**\n**Retirer une map** (V12.15, refait en V12.36) : F11 → Mappings installés → la map → « Retirer cette map » : arrêtée tout de\nsuite, **dossier supprimé** de `resources\\[addons]`, nom inscrit dans `C:\\GTASOON\\mods-retires.txt` (IMPORTER-MODS ne la\nréinstalle jamais), ligne **enlevée** de `cfg\\addons.cfg` ; l'archive reste dans mods-a-trier. Avant la V12.36, le retrait\narrêtait la ressource et commentait sa ligne, mais le dossier restait (et revenait à l'import) : d'où l'impression « on\narrête juste la ressource ». Dossier verrouillé au moment du retrait : noté quand même, supprimé au démarrage suivant (le\nserveur applique `mods-retires.txt` à chaque démarrage). Pour la remettre : enlever son nom de `mods-retires.txt`, relancer\nIMPORTER-MODS. À faire sur le PC puis METTRE-A-JOUR-OVH (le VPS la supprime à son démarrage grâce à `mods-retires.txt`\ns'il l'a reçu, sinon refaire le retrait en F11 sur le VPS). « Retirer TOUTES les maps » reste réversible (lignes commentées).\nUne fusion d'occlusion devenue inutile (une des deux maps retirée) est supprimée au démarrage suivant.\n**Supprimer définitivement** (V12.17) : F11 → Mappings installés → « Supprimer définitivement toutes les maps » (taper\nSUPPRIMER) : dossiers `[addons]\\gsa_*` des maps, leurs lignes de `addons.cfg`, leurs copies dans `mods-tri\\maps` et leurs\narchives dans `mods-a-trier` effacés ; noms ajoutés à `C:\\GTASOON\\mods-retires.txt`, que IMPORTER-MODS respecte (jamais\nréinstallés, même depuis une archive groupée ; enlever une ligne pour le permettre). Vêtements et véhicules non touchés.\n\n## Outils liés\n- `VIDER-CACHE-FIVEM.bat` : après un changement de mods ou un crash « Streamer crashed » — ferme FiveM, vide cache,\n  server-cache, server-cache-priv (garde cache\\game) et le cache du serveur s'il est arrêté.\n- Vêtements convertis (désactivés au départ dans cfg\\addons.cfg) : en boutique, à la FIN des listes (numéros les plus\n  hauts) — femme : Cheveux (6 coiffures).\n- `NETTOYER-MARQUES.bat` : supprime de ton PC les mods de marques réelles déjà installés, leurs archives et leurs\n  copies dans `mods-tri` (marque dans le nom du mod OU dans le nom d'un de ses fichiers, comme l'importeur).\n\n## Marques réelles : refusées\nVoitures, vêtements, boutiques et polices de marques ou d'organisations réelles sont **refusés** par l'importeur (liste\n`$BrandBlock` dans `importer-mods.ps1`) : risque de retrait du serveur par Cfx.re / Rockstar et de demandes DMCA\n(voir docs/BOUTIQUE_LEGAL.md, docs/VEHICULES_ADDON.md). Cherche des versions « lore GTA » (Pegassi, Grotti, Übermacht…).\n", "MLO": "# MLO, coquilles et mapping — ce qu'on installe, ce qu'on refuse, comment\n\nComment on ajoute des bâtiments entrables à RoadLine sans alourdir le téléchargement des joueurs, sans risquer\nun retrait par Cfx.re et sans payer ce qu'on peut avoir gratuitement.\n\nDocuments liés : `docs/BOB74_IPL.md` (l'audit des intérieurs gratuits déjà chargés),\n`docs/IMPORTER_MODS.md` (le fonctionnement de `IMPORTER-MODS.bat`),\n`docs/BOUTIQUE_LEGAL.md` et `docs/VEHICULES_ADDON.md` (la règle « pas de marques réelles »).\n\n---\n\n## 1. L'ordre dans lequel il faut chercher\n\nToujours dans cet ordre. On ne descend d'un cran que si le cran du dessus ne peut pas faire le travail.\n\n| Rang | Solution | Poids joueur | Prix | Quand |\n|---|---|---|---|---|\n| **1** | **`bob74_ipl`** — un intérieur du jeu déjà chargé | **0 Mo** | 0 € | presque toujours : ~85 intérieurs libres, voir `docs/BOB74_IPL.md` |\n| **2** | **Coquille** (*shell*) — un intérieur réutilisé derrière N façades | **0 Mo** (si l'intérieur vient du jeu) | 0 € | logements, ateliers, clubs, commerces : tout ce qui se répète |\n| **3** | **MLO gratuit** sous licence claire | 10-60 Mo | 0 € | un lieu précis qui n'existe pas dans le jeu |\n| **4** | **MLO payant** | 30-120 Mo | 25-45 € | **seulement** si le RP le justifie vraiment : commissariat, hôpital, tribunal, ring |\n\nLe rang 2 est celui qu'on sous-exploite. `gs_hideouts` le fait déjà : un appartement du jeu, un\n`routing bucket` par locataire (`Config.BucketBase = 5000`), trois motels différents à l'écran, **0 Mo** de\ntéléchargement. La même mécanique vaut pour les ateliers, les clubs, les bureaux.\n\n**Règle de décision** : si le joueur passe moins de 5 minutes par semaine dans un lieu, il ne mérite pas un MLO\npayant. Il mérite une coquille, ou rien.\n\n---\n\n## 2. Les 5 contrôles avant d'installer quoi que ce soit\n\nUn MLO qui rate un seul de ces contrôles ne rentre pas. `IMPORTER-MODS.bat` en automatise une partie, mais le\ncontrôle de licence et de marque se fait à l'œil avant le téléchargement.\n\n### Contrôle 1 — Poids\n\n| Mesure | Seuil | Pourquoi |\n|---|---|---|\n| Taille du mod | **≤ 60 Mo** idéalement, 150 Mo refusé par l'importeur | chaque Mo est téléchargé par **chaque** joueur à sa première connexion |\n| Une texture `.ytd` | **≤ 16 Mo** | au-delà : textures qui disparaissent, « Streamer crashed » |\n| Total des maps | **≤ 500 Mo** pour tout le serveur | au-delà, les premières connexions deviennent décourageantes |\n\n`IMPORTER-MODS.bat` refuse au-delà de 150 Mo, signale les `.ytd` > 16 Mo, et passe les `.ytd` > 48 Mo dans\nl'optimiseur de textures (`tools/textures`, retrait des mipmaps, jamais sous 256-512 px).\n\n### Contrôle 2 — Licence\n\n| Signe | Verdict |\n|---|---|\n| Licence explicite (MIT, CC, ou « free to use on your server ») | ✅ |\n| Acheté sur la boutique **officielle du créateur** (Tebex du créateur, Cfx.re asset store), facture au nom du serveur | ✅ |\n| « Open source » annoncé mais sans fichier de licence | ⚠️ demander au créateur, sinon refuser |\n| Pas de licence, pas d'auteur identifiable | ❌ |\n| Trouvé sur un site de fuites (voir § 5) | ❌ **jamais**, même « pour tester » |\n\n### Contrôle 3 — Marques réelles\n\nRefus automatique par l'importeur (liste `$BrandBlock` dans `importer-mods.ps1`). Un MLO « Starbucks », un\ncommissariat « LAPD » avec les vrais écussons, une boutique « Gucci » : **retrait du serveur possible par\nCfx.re / Rockstar et demandes DMCA**. On cherche les équivalents fictifs du jeu (Bean Machine, LSPD, Ponsonbys).\n\nAttention : les marques **fictives** de GTA (Maze Bank, Bahama Mamas, Vanilla Unicorn, Pegassi, Grotti) sont\nsans problème — ce sont des créations Rockstar présentes dans le jeu.\n\n### Contrôle 4 — Chiffrement (escrow)\n\nDeux cas très différents, à ne pas confondre :\n\n| Cas | Verdict |\n|---|---|\n| **Map** protégée par l'**escrow officiel Cfx** (fichier `.fxap`), achetée sur la boutique **officielle** du créateur | ✅ normal : Gabz, UncleJust et la plupart des créateurs payants protègent leurs maps ainsi. **Condition** : l'acheter avec le compte Cfx.re lié à la clé de licence du serveur, sinon elle ne se charge pas |\n| **Script compagnon** chiffré (escrow `.fxap`) livré avec une map du même vendeur (laser game, villa bunker…) | ✅ depuis la V12.31 : installé avec sa map, sous son **nom d'origine**, si toutes ses dépendances sont sur le serveur et s'il n'est pas ESX seul |\n| **Script** chiffré seul (aucune map installée ne lui correspond) | ⏸ rangé dans `scripts-a-verifier`, installé seulement sur demande |\n| **Script** obfusqué hors escrow (lignes illisibles) | ❌ refusé : on ne peut ni le relire, ni savoir ce qu'il envoie |\n\n`IMPORTER-MODS.bat` applique ces règles : une map escrow est installée avec un avertissement dans le rapport (V12.5) ;\nson script compagnon aussi (V12.31). Avant, le script restait dans `scripts-a-verifier` : la map était là, mais le jeu\n(laser game, auto-tamponneuses…) ne démarrait jamais.\n\n### Contrôle 5 — Performance, en jeu\n\nAprès installation, dans le lieu, `resmon` ouvert :\n\n| Mesure | Seuil |\n|---|---|\n| CPU de la ressource, à l'intérieur | **< 0,10 ms** (une map ne calcule rien, elle est streamée) |\n| FPS à l'intérieur vs dehors | perte **< 15 %** |\n| Console | **0 erreur**, 0 « failed to load » |\n| Collisions | pas de mur traversable, pas de sol manquant |\n\nUn MLO qui coûte des FPS est un MLO mal fait : il y en a toujours un autre. Et il faut vider le cache\n(`VIDER-CACHE-FIVEM.bat`) avant de conclure qu'un MLO est cassé.\n\n---\n\n## 3. Installer un MLO — la procédure\n\n1. Poser le `.zip` (ou `.rar`, `.7z`) **tel quel** dans `C:\\GTASOON\\mods-a-trier`.\n2. Double-clic sur **`IMPORTER-MODS.bat`**.\n3. Le script décompresse (même imbriqué), reconnaît une map, applique les contrôles 1, 3, 4, et l'installe\n   dans `resources\\[addons]\\gsa_<nom>` + une ligne dans `cfg\\addons.cfg`.\n4. `RAPPORT-MODS.txt` s'ouvre à la fin. **Copie-le-moi** : je branche les coordonnées, les blips, les portes\n   et les points d'interaction dans les ressources `gs_*`.\n5. `VIDER-CACHE-FIVEM.bat`, puis test en jeu avec `resmon` (contrôle 5).\n\nPour couper un mod sans le supprimer : mettre un `#` devant sa ligne dans `cfg\\addons.cfg`.\n`METTRE-A-JOUR.bat` n'écrase jamais `[addons]` ni `addons.cfg`.\n\n### Ce qui ne s'installe pas tout seul\n\n- **Un MLO qui remplace un bâtiment existant** a parfois besoin qu'on désactive l'IPL d'origine\n  (`EnableIpl(..., false)`). À me signaler : ça se fait en 2 lignes dans une petite ressource.\n- **Un MLO avec des PNJ, des portes à serrure ou des coffres** : les PNJ et les points viennent de nos\n  ressources (`gs_markers`, `gs_places`, `ox_doorlock`), jamais du pack.\n- **Un MLO « pour ESX »** : les fichiers de map sont réutilisables, les scripts livrés avec ne le sont pas.\n  L'importeur refuse un script ESX seul.\n- **Un script compagnon dont une dépendance manque** (ex. `pma-voice`, une librairie du vendeur pas téléchargée) :\n  pas installé, le rapport dit « il lui manque … ». Télécharger la dépendance chez le vendeur, la poser dans\n  `mods-a-trier`, relancer IMPORTER-MODS.\n\n---\n\n## 4. Où chercher — sources acceptables\n\n| Source | Type | Remarque |\n|---|---|---|\n| **`bob74_ipl`** (GitHub, MIT) | gratuit | déjà installé. **Commence toujours par là** : voir `docs/BOB74_IPL.md` |\n| **forum.cfx.re**, catégorie *Releases → Maps* | gratuit | la source de référence. Licence annoncée par l'auteur dans le fil, auteur joignable |\n| **GitHub**, avec un fichier `LICENSE` | gratuit | parfait pour les coquilles et les petits intérieurs |\n| **Cfx.re asset store** (store officiel dans le portail Cfx) | payant | facturé proprement, licence serveur claire |\n| **Tebex du créateur** (sa boutique officielle, lien depuis son fil forum ou son site) | payant | la seule façon correcte d'acheter. Vérifie que le lien vient **du créateur**, pas d'un tiers |\n\n**Avant d'acheter**, trois questions : (1) est-ce que `bob74_ipl` a déjà un intérieur qui fait le travail ?\n(2) est-ce que ce lieu sert au moins une heure par semaine à plusieurs joueurs ? (3) le poids annoncé tient-il\nsous 60 Mo ? Trois « oui » (ou un « non » à la première) et c'est un achat raisonnable.\n\nLes prix et la disponibilité bougent tout le temps : je ne les recopie pas ici pour ne pas te donner un chiffre\nfaux. Demande-moi au moment de l'achat, je vérifie la boutique officielle du créateur.\n\n---\n\n## 5. Sites à ne jamais utiliser\n\nLes sites de **fuites** (« leaks ») et les **revendeurs non autorisés** redistribuent le travail de créateurs\nsans licence, souvent avec du code ajouté. Les utiliser expose à :\n\n- le **retrait du serveur de la liste Cfx.re** (perte totale de visibilité, c'est la sanction la plus courante) ;\n- une **réclamation DMCA** du créateur, qui a votre nom de serveur dans ses logs ;\n- du **code ajouté** dans le pack (backdoor), impossible à repérer si c'est chiffré.\n\nSignes qu'un site est un revendeur non autorisé :\n\n- il vend le travail de **plusieurs** créateurs connus, bien moins cher que leurs boutiques officielles\n  (typiquement 10-15 $ ce qui coûte 30-45 € chez l'auteur) ;\n- il propose des packs « tout-en-un » de dizaines de MLO ;\n- aucun moyen de contacter un auteur, pas de licence, paiement par moyens détournés ;\n- les mots « leak », « free download » associés à des ressources normalement payantes.\n\n**Règle simple** : si le prix ou la gratuité semble trop beau pour le travail fourni, c'est volé. Le créateur\na presque toujours un fil sur forum.cfx.re avec le lien de **sa** boutique. C'est celui-là qu'on suit.\n\n---\n\n## 6. Ce que RoadLine a déjà, et ce qui manque vraiment\n\n### Maps payantes installées (12/10/2026, V12.34)\n\nUne quarantaine de packs escrow (achat Cfx.re lié à la clé du serveur), surtout Patoche, vérifiés à chaque démarrage\n(intégrité des fichiers, conflits d'occlusion fusionnés dans `gsa_zz_fusion_occlusion`). Blips publics : `PUBLIC` dans\n`gs_admin/server/maps.js`.\n\n| Lieu | Ressource | Remarque |\n|---|---|---|\n| Prison de Bolingbroke | `gsa_sub_patoche_prison_pack` | gardée à la place de Digital Den (même occlusion) ; coords de cellule à confirmer en jeu |\n| Benny's noir et blanc | `gsa_sub_patoche_benny_bw_pack` | gardé à la place du Benny's original |\n| Villa bunker | `gsa_patoche_villa_bunker_pack` | **V12.31 : gardée**, la villa moderne 01 est retirée (même villa) |\n| Karting | `gsa_patoche_plasmakart_pack` (+ DLC) | **retiré le 12/10** (V12.33, demande du fondateur) |\n| Laser game | `gsa_patoche_plasmagame_pack` (+ DLC, + DLC2) | **retiré le 12/10** (V12.33, demande du fondateur ; DLC2 par motif en V12.36) |\n| Pack Redline | `gsa_energy_redline_pack` | **retiré le 12/10** (V12.36, motif « redline », demande du fondateur) |\n| Auto-tamponneuses Del Perro / Pacific | `gsa_patoche_bumpercar_*` | activité = script compagnon |\n| Casino, concession, Ammu-Nation ×2, tabac, tacos, animalerie, billard, entrepôt, box de stockage | `gsa_patoche_*` | casino / concession / Ammu-Nation : doublons avec nos points sur les lieux du jeu, choix « nouveau / ancien » en attente |\n| QG gang 2, garage clandestin, labo weed, panneaux | `gsa_patoche_*` | sans blip (lieux secrets) |\n\nRetirées, par **nom exact** (`RETIRED_MAPS` dans `gs_admin/server/maps.js`) : supermarché Willie's, magasin d'alcool\nde Paleto, Moreo Gym, casse, Benny's original, villa moderne 01, Digital Den, Shadow Complex, laser game (+ DLC), karting\n(+ DLC), plasmatron. Retirées par **motif** (`RETIRED_PATTERNS`, V12.36 : sous-chaînes en minuscules cherchées dans le nom\nde chaque ressource de `resources\\[addons]`) : `plasmagame`, `plasmakart`, `plasmatron`, `villa_01`, `redline` — donc aussi\n`plasmagame_dlc2`, le pack Redline (`gsa_energy_redline_pack`) et toute variante future de ces packs, ainsi que leurs\nscripts compagnons (`patoche_plasmagame_script`…). Avant la V12.36, seuls les noms exacts comptaient : « plasmagamedlc2 »\net Redline restaient sur le disque et IMPORTER-MODS les réinstallait depuis mods-a-trier à chaque import.\n\nCe que fait le serveur 8 s après le démarrage (PC et VPS), pour chaque ressource de `[addons]` retirée par nom, par motif\nou inscrite dans `C:\\GTASOON\\mods-retires.txt` : arrêt, dossier supprimé, ligne enlevée de `cfg\\addons.cfg`, nom noté dans\n`mods-retires.txt` ; archive gardée dans mods-a-trier (packs payants). Console : `Map retirée (motif « redline ») :\ngsa_energy_redline_pack supprimée`, `Script compagnon retiré (motif « plasmagame ») : patoche_plasmagame_script supprimé`.\nIMPORTER-MODS lit les deux listes dans maps.js : jamais réinstallées, lignes de addons.cfg enlevées, script compagnon refusé.\nPour en retirer une autre : l'ajouter à `RETIRED_MAPS` (nom exact) ou à `RETIRED_PATTERNS` (motif, à choisir assez précis\npour ne pas attraper une map gardée : vérifier `tests/test_gs_maps.js`). Pour en remettre une : l'enlever des deux listes\net de `mods-retires.txt`, puis relancer IMPORTER-MODS (`RESTORED_MAPS` dans maps.js = `$Restored` de importer-mods.ps1\nprotège la villa bunker d'un ancien mods-retires.txt).\nDésactivées tant que l'archive n'est pas retéléchargée (téléchargement coupé, V12.27) : beach party, terrain de foot\n(soccer, soccer_cloth).\n\n### Lieux du jeu de base (audit du 11/10/2026)\n\n| Lieu | État |\n|---|---|\n| Commissariat de Mission Row | intérieur du jeu, utilisé (`gs_police`) |\n| Hôpital Pillbox | intérieur du jeu (`307.17, -590.81, 43.28`), chargé par `bob74_ipl`, **libre** |\n| Casino Diamond | porte `gs_interiors`, utilisé (`gs_casino`) |\n| Club-house Lost MC + 4 labos de gang | portes `gs_interiors`, utilisés |\n| Bahama Mamas, Vanilla Unicorn, Tequi-la-la | en place, utilisés (`gs_business`) |\n| Motels (3) | coquille + routing bucket, utilisés (`gs_hideouts`) |\n| Tribunal | **manque** — candidat n°1 à un MLO payant si le RP justice décolle (`gs_justice` existe) |\n| Ring de combat | **manque** — `gs_fightclub` existe ; voir le Freakshop ou le Vinewood Car Club en coquille d'abord |\n| Garage mécano jouable | **manque** — 5 ateliers tuner gratuits disponibles en coquille (voir `docs/BOB74_IPL.md` § 3) |\n| Logement haut de gamme | **manque** — 8 maisons de Vinewood + 3 villas gratuites, en place, rien à télécharger |\n\nConclusion de l'audit : **avant d'acheter le moindre MLO, il reste ~85 intérieurs gratuits à brancher.** Les\nseuls achats que je recommanderais à terme sont le **tribunal** et éventuellement un **commissariat plus grand** —\net seulement une fois que le serveur tourne et que le RP correspondant existe vraiment.\n\nLa sélection de MLO à consulter (20 gratuits, 10 payants) est dans `docs/SELECTION_MAPPINGS.md`.\n\n## 7. Une map ne marche pas : diagnostic (V12.27 → V12.34)\n\n| Symptôme | Où regarder | Cause / remède |\n|---|---|---|\n| Crash « Invalid fixup … (in xxx.ydr) » | console : « Map ARRÊTÉE … fichier abîmé » | archive coupée : retélécharger, IMPORTER-MODS |\n| Bâtiment absent, chargement sans fin | console : « Map activée mais NON démarrée » | licence Cfx (« entitlement ») ou `.fxap` manquant |\n| Bâtiment invisible, console muette | **F11 → Mappings installés → Contrôler les maps chez moi** | « aucun modèle reçu » (cache : VIDER-CACHE-FIVEM), « illisibles » (licence / fichier abîmé), « pack incomplet » |\n| Map visible mais aucun point pour jouer | console : « DÉCOR SEUL » ; F11 : « Activité : … décor seul » | script compagnon absent : il doit être dans le zip du pack ; sinon le télécharger chez le vendeur |\n| Script installé mais pas lancé | console : « Script de map activé mais NON démarré » | licence, dépendance manquante, ou script qui refuse d'être renommé (remonter dans la console) |\n| Deux maps au même endroit | console : « CONFLIT » | fusion automatique ; sinon en garder une (`RETIRED_MAPS` / `RETIRED_PATTERNS`) |\n| Map supprimée qui revient après METTRE-A-JOUR | `RAPPORT-MODS.txt` | corrigé en V12.34 : elle doit être dans `RETIRED_MAPS`, `RETIRED_PATTERNS` (V12.36) ou `mods-retires.txt` |\n| Map « retirée » en F11 mais toujours là (collisions, dossier présent) | console : « Map retirée en jeu (F11…) » | corrigé en V12.36 : avant, F11 arrêtait la ressource et commentait sa ligne, le dossier restait ; maintenant dossier supprimé + mods-retires.txt + ligne enlevée |\n| Variante d'une map retirée encore présente (plasmagame_dlc2, redline…) | console au démarrage : « Map retirée (motif « … ») » | corrigé en V12.36 : retrait par motif, plus seulement par nom exact |\n\n## 7b. PNJ et objets du staff reliés aux métiers et aux gangs (V12.37)\n\nQuand un mapping (poste, planque, garage) ne colle pas aux PNJ et objets prévus par la config : **F11 → Monde et lieux → PNJ et\nobjets** → « Ajouter un PNJ » (modèle, scénario, placement libre à l'aperçu : hauteur, rotation, pas fins) ou « Ajouter un objet »\n(catalogue gs_builder), puis **relier** l'entrée à un métier (`police`, `ambulance`…) ou à un gang (`gang:ballas`) : le point de\nmétier ou la planque reprend ce PNJ (un seul PNJ staff par cible), un PNJ « libre » n'est que de l'ambiance. Retrait depuis la même\nliste. Stockage : table SQL `gs_staff_peds` (par serveur : à refaire sur le VPS, ou à poser directement dessus) ; les **points**\ndéplacés, eux, voyagent du PC au VPS via `gs_bridge/points-deplaces.json` (V12.37).\n\n## 8. Après le téléchargement\n\n1. Tout dans `C:\\GTASOON\\mods-a-trier` (zips tels quels, même imbriqués).\n2. **IMPORTER-MODS.bat** → contrôle, installation dans `resources\\[addons]\\gsa_<nom>`, ligne dans `cfg\\addons.cfg`.\n3. Envoie-moi **`RAPPORT-MODS.txt`** : je branche les entrées, les blips, les PNJ et les points dans les `gs_*`, et je\n   règle les conflits (deux maps au même endroit, IPL du jeu à couper).\n4. **METTRE-A-JOUR-OVH.bat** envoie les nouveaux mods au VPS. Depuis la V12.5, un mod tout juste importé est bien\n   envoyé : avant, il gardait la date de son archive et pouvait être oublié.\n", "SELECTION_MAPPINGS": "# Sélection de mappings — 20 gratuits + 10 payants\n\n**À consulter, rien n'est installé.** Tu choisis, tu télécharges, tu passes le tout dans `IMPORTER-MODS.bat`, et tu\nm'envoies `RAPPORT-MODS.txt` : c'est là que je branche les lieux. Règles de contrôle et procédure : `docs/MLO.md`.\n\nRecherche du 11/10/2026, **uniquement sur le forum officiel Cfx.re, GitHub et les boutiques officielles des\ncréateurs** (aucun revendeur ni site de fuites). Chaque lieu est relié à un système RoadLine qui existe déjà : on ne\ntélécharge pas un décor, on donne un lieu à du RP qui n'en a pas.\n\n**Avant de télécharger, sur chaque page** : vérifie que la release est toujours en ligne, la date de dernière mise à\njour, le build minimum demandé, et (pour les « gratuits via Tebex ») que le panier est bien à 0 €. Certains fils ont\n2 à 5 ans : ils peuvent ne plus se charger proprement sur un build récent.\n\n**Budget poids** : l'ensemble dépasserait largement les 500 Mo conseillés (`docs/MLO.md` § 2). Installe d'abord les ★, teste en jeu\n(`resmon`), puis ajoute. Les doublons (deux laveries, deux salles de combat) sont là pour te laisser **choisir** un des\ndeux, pas pour installer les deux.\n\n### Gratuits (20)\n\n| # | Lieu | Branché sur | Pourquoi | Lien |\n|---|---|---|---|---|\n| 1 ★ | **Fight Club** (souterrain, 3 pièces) | `gs_fightclub` | les combats clandestins existent sans vrai lieu | [forum](https://forum.cfx.re/t/free-mlo-fight-club/5402796) — gratuit via Tebex |\n| 2 | **Fight club souterrain de Sandy Shores** (1 pièce, sans dépendance) | `gs_fightclub` (nord) | variante légère, au nord, pour le road trip | [forum](https://forum.cfx.re/t/mlo-sandy-shores-underground-fight-club/5371265) |\n| 3 ★ | **QG de gangs : Grove, Ballas, Vagos** (pack) | `gs_gangs` | trois QG d'un coup, cohérents avec nos gangs | [forum](https://forum.cfx.re/t/free-mlo-three-gang-war-mlo-bundle-grove-ballas-vagos-i-zerodazed/5369478) |\n| 4 ★ | **Armurier clandestin** (Secret Weapondealer) | `gs_blackmarket` | le marché noir a enfin une arrière-boutique | [forum](https://forum.cfx.re/t/free-mlo-secret-weapondealer/5177991) |\n| 5 | **Prêteur sur gages, Eclipse Boulevard** (salle, bureau, coffre au sous-sol) | recel / `gs_market` | revendre le butin à quelqu'un, pas à un menu | [forum](https://forum.cfx.re/t/40-free-pawn-shop-los-santos-mlo/5366787) — titre ambigu (« 40% »), vérifier la gratuité |\n| 6 | **Prêteur sur gages de Sandy Shores** | recel (nord) | même rôle, côté Blaine County | [forum](https://forum.cfx.re/t/free-mlo-sandy-pawnshop/5296578) |\n| 7 ★ | **Laverie ONE Laundromat** (près de Grove) | blanchiment (`gs_business`) | le cliché parfait du blanchiment, au cœur des gangs | [forum](https://forum.cfx.re/t/map-free-one-laundromat-free-mlo/5391980) |\n| 8 | **Bureau de poste PostOps** (19,9 Mo) | `gs_gigs` (livreur) | un vrai dépôt pour les tournées de livraison | [forum](https://forum.cfx.re/t/free-mlo-postops/5348302) |\n| 9 ★ | **Magasin d'alcool de Paleto Bay** | `gs_roadbook`, braquage de supérette | une étape de road trip, et une cible au bout du monde | [forum](https://forum.cfx.re/t/free-mlo-paleto-bay-liquor-store/5412728) |\n| 10 ★ | **Atelier FIX IT** (ancien MLO payant, offert) | mécano (`gs_tuning`) | atelier jouable ; complète les 5 ateliers tuner bob74 | [forum](https://forum.cfx.re/t/free-mlo-fix-it-workshop/5423357) |\n| 11 ★ | **Deer Diner** (Vinewood : bar, coin arcade, cuisine) | « Les habitués », `gs_business` | le diner où la ville se croise ; « sans copyright » selon l'auteur | [forum](https://forum.cfx.re/t/free-deer-diner-mlo-20-off/5307081) |\n| 12 | **Old Pub** (occlusion audio, musique intérieure) | « Les habitués », Radio Los Santos | un bar d'habitués avec une vraie ambiance sonore | [forum](https://forum.cfx.re/t/free-mlo-old-pub/5219659) |\n| 13 | **Salons de tatouage** (07/2025) | tatoueur | remplace le salon du jeu, plus jouable | [forum](https://forum.cfx.re/t/free-mlo-tattoo-parlors/5337863) |\n| 14 | **Barbier retexturé** (08/2025, sans support) | coiffeur (menu barbier V10.2) | rafraîchit un lieu déjà utilisé, sans changer les points | [forum](https://forum.cfx.re/t/mlo-free-release-barbershop-retextured-and-a-few-more/5347664) |\n| 15 | **Commissariat de Davis** | `gs_police` (sud) | un second poste au sud, là où ça chauffe | [forum](https://forum.cfx.re/t/mlo-free-davis-policestation/5178725) |\n| 16 | **Commissariat LSPD de Vinewood** | `gs_police` (nord de la ville) | poste de quartier pour Vinewood / Rockford | [forum](https://forum.cfx.re/t/free-mlo-lspd-vinewood-police-station/5161866) |\n| 17 | **Labo de meth dans le motel de Sandy Shores** | `gs_drugs` | atypique : un labo caché derrière une porte de motel | [forum](https://forum.cfx.re/t/free-methlab-in-sandy-shores-motel-mlo/4967109) |\n| 18 ★ | **Entrepôt (coquille, 3 emplacements)** | `gs_hideouts`, `gs_business` | une coquille, 3 entrées : exactement le modèle à suivre | [forum](https://forum.cfx.re/t/warehouse-free-mlo-shell/5377851) |\n| 19 | **Salle de sport de Los Santos** | activité sociale, `gs_fightclub` (entraînement) | un lieu de vie de jour, quand les combats sont la nuit | [forum](https://forum.cfx.re/t/free-mlo-los-santos-gym/5312943) |\n| 20 | **Lucky Plucker** (usine de volaille) | job ouvrier (`gs_gigs`), décor de braquage | atypique et très « lore GTA » | [forum](https://forum.cfx.re/t/free-mlo-lucky-plucker/5151950) |\n\nEn réserve : [Laverie de Jerry](https://forum.cfx.re/t/map-free-laundromat/5295643) (alternative au n°7, sur\nGitHub), [Atelier mécanique 3DMarket, 5 Mo](https://forum.cfx.re/t/free-mlo-mechanical-workshop/5261324) (alternative\nlégère au n°10), [Starlite Motel, 23 chambres](https://forum.cfx.re/t/release-mlo-starlite-motel-23-rooms/1126937)\n(ancien), [shérif moderne de Paleto, YMAP](https://forum.cfx.re/t/free-ymap-modern-paleto-bay-sheriffs-station/4816478)\n(ancien, extérieur seulement).\n\n### Payants (10)\n\nPrix relevés sur la page officielle quand elle était lisible ; sinon « voir la page ». Toujours acheter sur la\n**boutique du créateur** (lien depuis son fil Cfx), avec le compte Cfx.re lié à la clé du serveur (`docs/MLO.md` § 2, contrôle 4).\n\n| # | Lieu | Créateur | Prix | Branché sur | Pourquoi | Lien |\n|---|---|---|---|---|---|---|\n| 1 ★ | **Mairie + tribunal** (Townhall) | Gabz | 45 € | `gs_justice`, jurés | **le** manque n°1 de l'audit : la justice joue sans tribunal | [boutique Gabz](https://fivem.gabzv.com/category/standalones) |\n| 2 ★ | **Hôpital Pillbox** | Gabz | 30 € | EMS | l'hôpital du jeu est vide ; c'est le lieu le plus fréquenté du RP | [boutique Gabz](https://fivem.gabzv.com/category/standalones) |\n| 3 | **Bean Machine** (Legion Square) | Gabz | 30 € | « Les habitués », commerce joueur | le café central, juste à côté du spawn | [boutique Gabz](https://fivem.gabzv.com/category/standalones) |\n| 4 | **Prison** | UncleJust | 149 $ | prison vivante (V8) | cher, mais la prison vivante est une signature ; à n'acheter que si elle est jouée | [boutique](https://unclejust.tebex.io/package/4808803) |\n| 5 | **Tribunal** (alternative au n°1) | UncleJust | voir la page (deux annonces, 5 $ et 69 $ : vérifier laquelle est la bonne) | `gs_justice` | si tu préfères un tribunal seul plutôt que la mairie entière | [boutique](https://unclejust.tebex.io/package/4808758) |\n| 6 ★ | **Ciné en plein air** (Sandy Shores : 21 voitures, grand écran, snack, VIP) | — | voir la page | `gs_events`, `gs_roadbook` | atypique : soirées ciné, rendez-vous du week-end, étape de road trip | [forum](https://forum.cfx.re/t/paid-mlo-drive-in-cinema/5330466) |\n| 7 ★ | **Inferno Boxing Club & Black Market**
