une voiture puis l'ouvrir au calme ; les\n  57 propositions (signatures, modes, embellissement, gains rapides bêta) et les 12 questions de vision sont dans\n  `docs/PROPOSITIONS.md` (à trier par l'utilisateur). **Ouverture bêta officieuse prévue dans quelques jours** (mi-octobre),\n  officielle le 20/10/2026.\n- Le guide du joueur (PDF) n'a volontairement **pas été mis en ligne sur le site** : l'utilisateur veut en reprendre\n  le design lui-même avant publication.\n\n## 7. Règles permanentes à respecter (rappel, ne jamais oublier)\n\n- **Jamais de vraie marque** (risque de ban Cfx.re) : toujours des noms de véhicules/enseignes inventés ou ceux déjà\n  dans GTA V.\n- **Jamais de mot de passe ou secret en clair** dans les messages ni dans les fichiers commités (jetons, mots de\n  passe VPS, clés API...). Les outils Windows masquent la saisie et écrivent dans `secrets.cfg` (jamais poussé).\n- **Demander avant de supprimer quoi que ce soit.**\n- Toujours pousser sur les **deux branches** (`feature/phase1-bridge` et `claude/gta-rp-architecture-stack-pbvdxz`).\n- Zips de livraison : `livraison/ROADLINE-V12-installation.zip` (via `git archive --format=zip --prefix=gtasoon/ HEAD`)\n  et `livraison/ROADLINE-site.zip` (contenu de `docs/site/`, doit inclure `img/`).\n- Toujours faire tourner `bash tests/run.sh` avant de pousser (hook pre-push de toute façon bloquant).\n- Attribution des commits : trailers `Co-Authored-By` et `Claude-Session` donnés par le système à chaque session\n  (peuvent changer de modèle d'une session à l'autre : relire le system reminder du moment avant de committer).\n- Tout est en **français**, ton direct et concis, sans jargon anglais inutile.\n\n## 8. Repères techniques utiles pour repartir vite\n\n- Tests : `bash tests/run.sh` (luac, `check_cfg.py`, `check_labels.py`, `check_links`, perf, marques, tests Lua,\n  tests bot Discord Node). Mock Lua dans `tests/` : `CreateThread`/`Wait` no-op, horloge simulée, `W.players[src]`.\n- PDF : `python3 tools/pdf.py` (guide/fiche de test/carte des points), `python3 tools/backtest.py` (fiche backtest),\n  `python3 tools/bilan.py` (bilan de version), `python3 tools/guide_joueur.py` (guide joueur, lit\n  `tools/data/vehicules_concession.json`), `python3 tools/guide_staff.py` (guide staff, importe `guide_joueur.py`).\n- Site : `docs/site/index.html` (un seul fichier, tout inline). Carte : image `docs/site/img/carte-ls.webp`\n  (atlas du jeu, zoom 2, stitché/recadré/redimensionné, calibration `px/py` par régression sur points de repère).\n- Concession : réglages dans `scripts/windows/outils-communs.ps1` (fonction `Set-QboxOverrides`, tableau\n  `$QboxPatches`, nouveau type de patch `prices` lisant `prix-vehicules.json`) — appliqués uniquement côté Windows\n  (PowerShell), simulation de contrôle faite en Python dans ce conteneur faute d'environnement PowerShell.\n\n---\n\n## 9. PROMPT DE REPRISE — à coller dans une nouvelle conversation si celle-ci est perdue\n\n```\nJe reprends le projet RoadLine RP (serveur FiveM GTA RP 100 % français, Qbox/ox), dépôt harmoniev1/dddd,\nbranches feature/phase1-bridge et claude/gta-rp-architecture-stack-pbvdxz (toujours pousser sur les deux).\n\nLis d'abord docs/ETAT_PROJET.md à la racine du repo : il contient le récapitulatif complet et à jour de l'état\ndu projet (versions, infra, ce qui est livré, ce qui reste à faire, les règles permanentes). Prends-le comme\nsource de vérité pour le contexte, puis continue le travail à partir de la section « 6. Décisions en attente ».\n\nRègles permanentes à ne jamais oublier : jamais de vraie marque (risque de ban Cfx.re), jamais de mot de passe\nou secret en clair, toujours demander avant de supprimer quoi que ce soit, tout en français, faire tourner\nbash tests/run.sh avant de pousser, pousser sur les deux branches, régénérer les zips de livraison\n(livraison/ROADLINE-V12-installation.zip et livraison/ROADLINE-site.zip) après un changement livrable.\nSi une autre session Claude a travaillé en parallèle : comparer son colis au dépôt (en ignorant les fins de\nligne CRLF), fusionner sans rien perdre, vérifier les doublons, puis repartir de la version commune.\n\nContexte serveur : VPS OVH 57.129.170.173 (Ubuntu 24.04, mode txAdmin, profil privé pour l'instant), ouverture\nofficielle prévue le 20/10/2026 21h (Paris), version interne gs_version actuelle (voir server/server.cfg.example),\nversion publique affichée aux joueurs gs_public_version (actuellement « V4 · bêta », à ne pas réaligner sur la\nversion interne sans demande explicite).\n```\n\n---\n\n*Ce fichier doit être mis à jour à la fin de chaque session de travail significative (nouvelle version, décision\nimportante, changement de contexte). Ne pas le laisser dériver : il doit toujours refléter l'état réel.*\n", "PATCH_NOTE_V12.63": "# Patch note — session du 16/10/2026 (V12.63, depuis le matin)\n\n> Seulement ce qui a été fait pendant cette session (du correctif des Lives jusqu'à la journée North Yankton et au site).\n> Ce qui précède (nuit du 15 au 16/10 : appli staff externe, outils OVH, mur des légendes, trêves, figure du coin, diaporama du\n> site…) est dans `docs/PATCH_SESSION_15-10.md`. Version prête à coller sur Discord : `docs/PATCH_NOTE_V12.63_DISCORD.txt`.\n> Installation : METTRE-A-JOUR → DIAGNOSTIC-MODS (O) → VIDER-CACHE-FIVEM → METTRE-A-JOUR-OVH.\n> Rien n'a encore été vu en jeu : fiche de backtest, sections **4j** à **4n**.\n\n## 1. Pour les joueurs\n| Nouveauté | Comment ça marche |\n|---|---|\n| **Journée North Yankton** | Un jour sur deux, le vol régulier de l'aéroport (LSIA) part pour la ville enneigée du prologue de GTA V au lieu de Cayo Perico. Le comptoir et le site indiquent le vol du jour ; retour quand tu veux au comptoir d'arrivée. |\n| **Photomaton** (fête foraine) | À côté du guichet des jetons : une photo souvenir pour 3 jetons. Serrez-vous dans la cabine, chacun repart avec sa copie (à regarder ou accrocher au mur). |\n| **Hommage peint** (gangs) | Avec une bombe de peinture, choisir « Un hommage » : « R.I.P. » et le nom d'un membre disparu, aux couleurs du gang. 24 h, ou pour toujours contre 1 000 $ de la caisse du gang. Un rival peut l'effacer (le gang est prévenu). |\n| **Voisins vigilants** | `/voisins` dans ton quartier (hors gang) : prévenu des délits qui y sont signalés (sans position) ; plus vous êtes nombreux, plus le calme revient vite. |\n| **Alcootest du shérif** | La nuit, quand aucun policier n'est en service, le shérif tient parfois un barrage sur les routes hors de la ville. Positif à partir de 2 verres : amende et points de permis. Fuir = refus d'obtempérer. |\n| **Gestes selon l'objet** | Alt sur un lavabo (mains, visage), une douche, une fontaine (boire) ; dans la mer, E pour se rincer. Le sang et la saleté partent ; les secours peuvent nettoyer tes plaies. |\n| **Poubelles** | Une seule option : la fouille animée (l'ouverture de l'inventaire de la benne a disparu). |\n| **Courses sur mesure** | L'organisateur peut imposer un véhicule ; inscription à 15 m de lui ; sur la ligne, E relance le départ et X annule. |\n| **Neige et chasses au trésor** | Le staff peut faire tomber la neige sur Los Santos (traces de pas et de pneus) et cacher une mallette : zone sur la carte, le premier qui la trouve l'empoche. |\n| **Menus aux couleurs de RoadLine** | Menus, notifications, fenêtres et inventaire bordés de violet néon, titres en dégradé. |\n| **Courses refaites** | Plus d'écran noir ni de téléportation : voiture prêtée livrée à côté de l'organisateur, GPS jusqu'à la ligne, [E] sur la ligne pour partir, [X] pour annuler. |\n| **Vue d'ensemble sur C** | Caméra autour de ton perso, qui reste immobile. F6 reste le menu des métiers. |\n| **Avis de recherche papier** | Petite affiche crème « RECHERCHÉ » lisible de près ; une affiche arrachée disparaît vraiment. |\n| **Traces plus parlantes** | Couteau ou batte au sol selon l'arme, douilles par balle, flaques de sang par victime ; lieux de mémoire sans icône flottante. |\n| **Organisateur de courses réparé** | Au volant de ta voiture près de lui, [E] ouvre enfin son menu (avant, rien ne se passait) ; à pied, [E] à côté de lui. |\n| **Gangs** | Plus de gangs créés d'office (un gang naît d'un projet RP validé par le staff) ; territoires découpés en pâtés de maisons. |\n| **Cyclone** | Vitesse maximale ramenée à 210 km/h. |\n| **Coincé sous la carte** | Tu es ramené tout seul au dernier endroit sûr après 6 secondes. |\n| **Vols plus beaux** | L'avion vire en douceur pour s'aligner sur la piste, se pose et roule ; tu sors devant le pilote du comptoir. |\n| **North Yankton : sur place** | Location de 4x4, pick-up et berline enneigés à Ludendorff ; café chaud ; et personne ne te connaît : ta recherche y retombe plus vite. |\n| **Métier : animalerie** | Pôle Emploi → Animalerie : remplis les gamelles avec un carton de la réserve, nettoie les cages, toilette les chiens, sers les clients au comptoir. Payé à chaque tâche ; les animaux sont dans la boutique. |\n| **Site** | « ✈️ Vol du jour » dans « En ce moment en ville » (annonce dans le bandeau les jours North Yankton) ; journal « Nouveautés » mis à jour. |\n\n## 2. Pour le staff\n| Nouveauté | Où | Ce que ça change |\n|---|---|---|\n| **Lives : capture réparée** | F11 → Lives, appli → Lives | screenshot-basic patché pour les versions récentes de FiveM ; si la capture échoue, la raison s'affiche après 6 s au lieu d'une attente sans fin ; F8 `/livestest` teste la capture sur ton PC. |\n| **Appli staff : rangs** | GERER-OVH → 20 → A | Code personnel avec rang (5 = fondateur : agit sur tout le monde ; sinon seulement sur les rangs inférieurs). Le mot de passe collectif reste au rang modérateur. Bannir = admin minimum. |\n| **Carte des tickets** | appli → Carte | Anneau jaune sur l'auteur de chaque ticket ouvert. |\n| **Coincé sous la carte** | F11 → Joueurs, F10, appli | Bouton « Coincé : ramener au dernier endroit sûr » (helper et plus), en plus du retour automatique. |\n| **Destination du vol de l'île** | F11 → Monde et lieux | Alternance (un jour sur deux), Cayo ou North Yankton tous les jours ; les joueurs sur place sont rapatriés à l'aéroport ; soirée plage de Cayo seulement un jour Cayo. |\n| **Courses : véhicule imposé** | F11 → Monde et lieux → Courses | Sur un brouillon ou une course existante. |\n| **Forme des quartiers** | `/quartierforme <quartier> <angle> [taille] [allongement 0.4-2.5]` | Rectangles de pâtés de maisons. Créer un gang : F11 → Monde et lieux → Gangs. |\n| **Lives plus fluides** | F11 → Lives, appli | Une image par seconde, sans scintillement, écran entier. |\n| **Pistes des vols** | F11 → Déplacer un point | « Piste LSIA / Cayo Perico · toucher / arret » à caler si l'avion se pose à côté. |\n| **Animalerie : postes** | F11 → Monde et lieux → Déplacer un point | « Animalerie · Comptoir / Réserve / Gamelles / Cages / Toilettage » à placer dans la boutique (sinon rangés autour de la map). |\n| **North Yankton : points** | F11 → Déplacer un point | Location de Ludendorff, café, serveuse, shérif, comptoir du retour : à caler si besoin (seulement les jours North Yankton). |\n| **Journal staff** | F10 → Journal | Hommages peints, coincés ramenés, choix de destination du vol. |\n| **Mises en scène** (admin) | F11 → fiche → Mises en scène, F10 → fiche | Enlèvement en camionnette (= expulsion, écran noir) ; arrestation par un policier PNJ (plaqué, menotté, cellule de Mission Row). |\n| **Événements rangés** | F11 → Événements | Rassemblements (+ rassemblement auto, soirée en club, salon de l'emploi), chasse au trésor (prime au premier), neige, effets « sur moi » (feux d'artifice, confettis, fumée). |\n| **QG de gang** | F11 → Mappings installés → QG de gang | Changer les couleurs d'un QG de map (ex. Patoche Vagos → Ballas) chez tous les joueurs. |\n| **Mises en scène fiabilisées** | F11 → fiche | Camionnette « speedo » posée à côté (plus de conduite IA, burrito3 importé au handling illisible écarté), policier qui arrive à coup sûr. |\n| **Branding** | menus de base | Contour violet néon des Lives sur les menus F11, notifications, saisies, inventaire et F10 ; titres en dégradé RoadLine. |\n| **Appli installable** | appli → écran de connexion | Bouton « 📲 Installer l'appli » (PC, Android) ou Partager → « Sur l'écran d'accueil » (iPhone) : icône au logo RoadLine, plein écran. |\n| **Surveillance** (admin) | F11 → fiche, F10 → fiche, appli → fiche | Motif ; le staff en service est prévenu à chacune de ses arrivées ; 👁 dans les listes. |\n| **Fermer les arrivées** (super-admin) | F11 → Modération avancée, F10 → Serveur, appli → Sanctions | Raid ou attaque : seul le staff entre, 60 min maximum, rouvre seul. |\n| **Partis récemment → ban hors ligne** | mêmes endroits | Le joueur qui quitte juste après un RDM se bannit quand même (super-admin en jeu, admin dans l'appli). |\n| **Contournement de ban** | automatique | Un nouveau compte qui arrive avec le PC ou le Discord d'un banni = alerte au staff (ou refus : `Config.Moderation.evasion`). |\n\n## 3. Pour le fondateur (serveur, mods, docs)\n| Quoi | Ce que ça change |\n|---|---|\n| **Démarrage plus rapide** | Plus de gel de ~11 s après chaque démarrage : les maps en conflit ne sont relancées que si leur ordre de démarrage n'est pas déjà le bon. |\n| **DIAGNOSTIC-MODS** | **Même map en deux versions** (archive « _1 » retéléchargée) : la version _1 en pause, l'original déjà réglé reste ; section **textures / modèles ≥ 32 Mo** (IMPORTER-MODS allège déjà seul les .ytd > 48 Mo). |\n| **Nouvelles maps du jour** | Shadow Complex revient (archive _1 ; la raison de son retrait — Plasmakart — n'existe plus) ; animalerie _1 = copie d'un pack déjà réglé → mise en pause par DIAGNOSTIC-MODS. |\n| **Docs** | État des lieux avant l'ouverture (`docs/ETAT_DES_LIEUX_16-10.md`), propositions n° 167 à 246 (dont 45 nouvelles ce soir), guides, fiche de backtest (4j), documentation à jour. |\n\n## 4. Encore à faire / à vérifier\n- **Positions à caler en jeu** (F11 → Monde et lieux → Déplacer un point) : photomaton (gs_casino), postes de l'animalerie (gs_animalerie), location de Ludendorff (gs_rental), café et comptoir du vol retour à North Yankton (gs_world).\n- **À confirmer en jeu** : Lives (F11 et appli), animations des gestes « visage » et « boire », décor et neige de North Yankton, barrage du shérif, hommage peint.\n- **Code cfx.re** du serveur (txAdmin → tableau de bord, ou liste FiveM en mode public : GERER-OVH → 7) pour le bouton « Rejoindre » du site.\n- **Code personnel fondateur** pour l'appli : GERER-OVH → 20 → A, rang 5.\n", "ROADMAP": "# Roadmap · où on en est, où on va\n\n*Mis à jour le 09/10/2026 · **V12.0** prête (retours du backtest, bot Discord sécurisé, outils staff, la ville se souvient) (V11 en ligne sur le VPS OVH · bêta privée, 16 places).*\n\n## Où on en est\n| Brique | État |\n|---|---|\n| **Jeu** | Qbox/ox, 66 ressources RoadLine, **24 signatures**, 2 500+ tests automatiques au vert |\n| **Serveur officiel** | VPS OVH (Ubuntu 24.04, 12 Go RAM, 96 Go disque) ; démarrage auto, veille (alerte Discord + relance), redémarrage 6 h annoncé, sauvegardes 6 h + copie quotidienne sur le PC |\n| **Outils** | PC = test (METTRE-A-JOUR), VPS = officiel (METTRE-A-JOUR-OVH) ; GERER-OVH : 22 options, sans mot de passe |\n| **Modération** | Appli staff sur téléphone (https, codes par membre) pour les modérateurs ; menu F11 en jeu ; bot Discord ; txAdmin réservé au fondateur |\n| **Site** | Bêta ouverte, adresse de connexion, carte en direct + timelapse 24 h branchés sur le VPS, lien Espace staff |\n| **Docs** | Guide, fiche de backtest (81 tests, 26 bloquants), bilan V11, OVH / ADMIN / DISCORD / FEATURES à jour |\n\n## Où on va\n| Quand | Objectif | Contenu |\n|---|---|---|\n| **Cette semaine** | **Backtest** | Fiche PDF ; chaque jour : GERER-OVH → 3 (erreurs) + captures avec le n° du test ; je corrige au fil de l'eau |\n| **Semaine prochaine** | **V11.1 · Appli staff v2** | Voir ci-dessous (boutons, raccourcis, fiches joueurs, sanctions). Fait (V11.2 · V11.3) : écran de chargement, jurés, Gazette, black-out, vraie carte, salle Luxe et concession nettoyée, IP masquée jusqu'à l'ouverture, règlement, guides joueur et staff |\n| **Avant l'ouverture** | **V12 · Ouverture** | Corrections du backtest, passage en public (code cfx.re, liste FiveM), whitelist ou non, nom de domaine, 2 signatures « waouh » |\n| **Après l'ouverture** | **Saison 1** | Événements staff, élections, contenus du mois, boutique (après validation PLA) |\n\n## V11.1 · Appli staff v2 (proposition précise)\n**Accueil en tuiles** (gros boutons, pas une barre de recherche) :\n- **En ville** : nombre de joueurs, staff en service, tickets ouverts, alertes anti-triche.\n- **Tickets** : priorité (nouveau, pris, en retard), puis « Je prends », « Répondre » ou « Clore ».\n- **Alertes** : carkill, téléportation, argent suspect. Un appui ouvre la fiche du joueur concerné.\n- **Annonce** : modèles prêts (« redémarrage dans 10 min », « événement à Legion Square »…).\n\n**Fiche joueur** (un appui sur un joueur) : identité RP, temps de jeu, métier et gang, **historique des sanctions**, notes du staff. Actions en boutons de couleur :\n- **Geler** et **Message** ;\n- **Avertir**, avec les motifs fréquents déjà proposés ;\n- **Expulser** ;\n- **Bannir** (1 jour, 3 jours, 7 jours ou définitif), réservé aux admins.\n\n**Filtres en pastilles** : tous, nouveaux joueurs, police / EMS, gangs, signalés, gelés.\n\n**Journal** : qui a fait quoi, et quand (« Web · pseudo »), consultable par les admins.\n\n**Droits** : helper, modo et admin voient des boutons différents selon leur rang (le même rang qu'en jeu).\n\n**Confort** : thème RoadLine, vibration sur les nouveaux tickets, mode sombre, utilisable d'une main.\n\n## 20 idées de signatures (à trier)\nNote : 1 = rapide, 3 = gros chantier. ★ = branché sur ce qui existe déjà.\n\n**La ville raconte**\n1. ✅ **Les jurés de Los Santos** ★ (2) — pour un vrai procès, 5 citoyens tirés au sort reçoivent une convocation sur leur téléphone. Ils écoutent, ils votent, et le verdict tombe dans le fil de la ville.\n2. ✅ **La Gazette du dimanche** ★ (2) — un journal mis en page tout seul (faits divers, verdicts, légendes, plaques, photos Weazel), publié sur le site et sur Discord.\n3. **Le grand livre de Los Santos** ★ (2) — une page publique par personnage marquant (avec son accord) : biographie, légendes, plaques. Un « wiki » du serveur qui s'écrit en jouant.\n4. **La galerie Weazel** ★ (1) — les photos de presse choisies par les journalistes sont exposées sur le site, avec légende et signature.\n\n**La ville réagit**\n\n5. ✅ **Black-out de quartier** (2) — saboter un transformateur plonge un quartier dans le noir (lumières, feux, caméras). C'est une occasion pour le crime, et les électriciens de la ville réparent.\n6. **La ville a peur** ★ (1) — après une fusillade ou un gros casse, les PNJ fuient la zone, les commerces baissent le rideau une heure et la radio en parle.\n7. **Files d'attente vivantes** ★ (1) — des PNJ font la queue devant les commerces qui marchent. Le succès se voit dans la rue.\n8. **Avis clients** ★ (2) — les clients (joueurs et PNJ) notent les commerces dans le téléphone. Les étoiles font venir ou fuir la clientèle PNJ.\n\n**La rue et la justice**\n\n9. **Les objets ont un passé** ★ (2) — bijoux, montres et armes gardent leur historique. Le receleur paie moins cher un objet « trop connu », et c'est une preuve au tribunal.\n10. **Le portrait-robot** ★ (2) — un témoin joueur compose le visage d'un suspect (coiffure, couleurs, signes distinctifs), et la police l'affiche au commissariat.\n11. **La bourse aux tuyaux** (2) — les indics vendent des informations (convoi, planque, rendez-vous) avec un indice de fiabilité. Certaines sont fausses.\n12. **Convois officiels** (3) — transferts de fonds ou de prisonniers annoncés à l'avance. La police les protège, les braqueurs les préparent.\n\n**La vie civile**\n\n13. **Élections municipales** (3) — campagne, débats Weazel, vote. Le maire actionne 3 vrais leviers : taxe des commerces, couvre-feu, budget de la police.\n14. **Appels d'offres de la mairie** ★ (2) — chaque semaine, un chantier public est mis aux enchères. L'entreprise de joueurs qui le décroche le construit vraiment sur la carte (gs_builder).\n15. **Courrier et lettres** (2) — des lettres papier (objet) avec cachet, un facteur joueur, des lettres anonymes et des colis suspects.\n16. **Pompes funèbres et héritage** (3) — un métier de croque-mort, des cérémonies, le testament, une tombe avec son épitaphe (et la page au grand livre).\n\n**Le jeu dans le jeu**\n\n17. **Fantômes de la route** ★ (2) — la voiture fantôme du meilleur temps de la semaine sur le road trip et les courses.\n18. **Réputation de quartier** ★ (2) — chaque joueur est « connu » dans certains quartiers : les PNJ le saluent, se méfient de lui ou appellent la police plus vite.\n19. **Caméra de plateau Weazel** (3) — un mode réalisateur pour les directs : plans fixes, ralentis, bandeau, à suivre sur Twitch.\n20. **Soirées à thème du serveur** ★ (1) — une nuit par mois avec une règle spéciale (années 80, tempête, coupure générale), annoncée sur le site et dans l'écran de chargement.\n\n**Notre sélection pour l'ouverture** : ✅ les jurés (1), ✅ la Gazette (2), ✅ le black-out de quartier (5) ; restent la ville a peur (6) et les objets ont un passé (9).\n\n## Rappels\n- Jamais de vraie marque, ni de mot de passe dans les fichiers ou les messages.\n- PC = test, VPS = officiel : METTRE-A-JOUR, test rapide, puis METTRE-A-JOUR-OVH (il vérifie la version et répare ce qu'il faut).\n", "STRATEGIE": "# Stratégie V1 : ce qu'ont les gros serveurs, ce qu'on a, ce qu'on ajoute\n\nAnalyse [DEV] (à affiner avec Alpha, qui connaît la concurrence FR de l'intérieur).\n\n## 1. L'essentiel attendu par les joueurs FR (hygiène de base)\n| Brique | Chez nous | Action proposée |\n|---|---|---|\n| Création de perso + vêtements | illenium-appearance (V1_RESOURCES) | installer, magasins de vêtements |\n| Téléphone | ❌ | **priorité 1** : téléphone open-source audité (ou payant type lb-phone, décision budget) ; Néon s'y intègre comme app |\n| Logement / planques | ❌ | **priorité 2** : qbx_properties (Qbox) à auditer |\n| Gangs / territoires | ❌ | **priorité 3** : étendre gs_jobs (les gangs = jobs « illégaux » avec caisse, grades, planque) + territoires liés à gs_wanted |\n| Économie illégale (drogue, recel) | recel partiel (ferrailleur) | boucle drogue maison branchée sur gs_economy (prix) + gs_wanted (témoins) |\n| Braquages | ❌ | supérettes → bijouterie → banque, branchés sur gs_wanted + gs_duo |\n| Entreprises joueurs (resto, bar, concession) | jobs + caisses ✅ | ajouter des jobs « entreprise » + commerces qui s'approvisionnent via gs_economy |\n| HUD | ❌ | **HUD néon maison** (vie, faim, argent, étoiles, météo) |\n| Garages / concession / carburant | qbx_* + ox_fuel | installer (V1_RESOURCES) |\n| Police/EMS gameplay (menottes, fouille, réa) | qbx_policejob / qbx_ambulancejob | installer, brancher le dispatch gs_wanted |\n| Staff / modération | ✅ txAdmin + gs_admin | — |\n| Anti-triche | ✅ validation serveur partout + durcissement cfg | évaluer un anticheat reconnu avant l'ouverture publique |\n\n## 2. Là où on est déjà devant (à mettre en avant dans la com)\n- **Recherche intelligente** (témoins / heure / météo) : la plupart des serveurs n'ont que des alertes « tir détecté » systématiques.\n- **Économie vivante** (offre/demande + événements météo) : rare en FR.\n- **Duo lié** façon GTA 6 : quasi inexistant.\n- **Météo événementielle + golden hour** : identité visuelle forte.\n- **Néon + miroir Discord** : la vie de la ville visible hors du jeu, gros levier communautaire.\n- **Transparence des sanctions** : argument de confiance face aux serveurs à « main team ».\n- **Qualité** : 360+ tests automatiques, CI, rate-limit partout. Les crashs et dupes sont la 1re cause d'abandon d'un serveur.\n\n## 3. Idées signature (à valider par Alpha)\n1. **Braquages dynamiques** : la réussite dépend de l'heure, de la météo, des témoins et du niveau de duo ; les flics reçoivent un dispatch plus ou moins précis.\n2. **Territoires** : chaque quartier a une « chaleur » (crimes signalés) ; gangs = influence, police = patrouilles bonus.\n3. **Journalistes Weazel-like maison** : job qui publie des « flash infos » officiels sur Néon (badge vérifié) et sur Discord.\n4. **Courses de rue** : départs clandestins, paris en argent in-game, signalement aux flics selon les témoins.\n5. **Influence Néon** : abonnés, posts tendance, badge « vérifié » ; sponsoring RP entre joueurs.\n6. **Nuits de Vice** : événements du vendredi soir (golden hour prolongée, néons, clubs, DJ).\n7. **Companion web** : fiche perso, fil Néon sur mobile, sanctions publiques, roadmap.\n\n## 4. Ordre recommandé\nTest en jeu V1 → **téléphone** → **HUD néon** → **gangs + territoires** → **braquages** → **drogue** → logement → companion web.\n", "PROPOSITIONS": "# RoadLine RP · Propositions V13+ (10/10/2026)\n\nListe à trier par le fondateur : coche ce que tu retiens, raye le reste. Effort indicatif : ✚ = quelques heures, ✚✚ = 1 à 2 jours,\n✚✚✚ = une semaine. « S'appuie sur » = système déjà en place dans la base (donc moins de risque).\n\nRègles de la maison qui s'appliquent à tout : cohérence RP, pas de pay-to-win, tout en français, aucune marque réelle,\nrien qui casse l'existant, tests verts avant livraison.\n\n## A. Déjà proposées (réponse du 10/10, matin)\n\n| # | Proposition | Effort | S'appuie sur |\n|---|---|---|---|\n| 1 | **Le casier qui parle** : un PNJ détective te reconnaît en ville selon ton casier et commente tes anciens coups | ✚ | casier, passants de gs_memoire |\n| 2 | **Quartier sous tension** : après une guerre de gang, 24 h de patrouilles PNJ, prix et rumeurs modifiés | ✚✚ | quartiers, gangs, rumeurs |\n| 3 | **Procès en direct** sur Weazel, jurés joueurs tirés au sort, verdict qui pèse sur la réputation | ✚✚ | justice, jury, Weazel live |\n| 4 | **Dernières volont rival), cicatrice de bâtiment brûlé | ✚✚✚ | jobs, business, scars |\n| 42 | **Blessures qui marquent** : après une grave blessure, boiterie 10 min et cicatrice visible jusqu'au chirurgien | ✚✚ | details (tatouages), EMS |\n| 43 | **Intoxication et pharmacie** : manger périmé rend malade (vomissements, vision), médicaments à la pharmacie, pharmacien = commerce joueur | ✚ | degrade, business |\n| 44 | **Fadettes et alibis** : le juge autorise la police à lire appels et déplacements d'un téléphone ; un alibi se prouve par ses déplacements | ✚✚ | phone, justice |\n| 45 | **Documents compromettants** : objets volés dans un commissariat ou un bureau, publiables par la presse, achetables par le courtier | ✚✚ | heists, Weazel, 17 |\n| 46 | **Vol à la tire** : portefeuille et téléphone volés discrètement dans la foule ; téléphone volé = ton numéro aux mains d'un autre | ✚✚ | phone, wanted |\n| 47 | **Marques de gang** : tatouages débloqués par grade, identifiés par la scientifique, cachés par les manches | ✚ | gangs, details |\n| 48 | **Familles** : nom partagé, garage familial, héritage, arbre sur Vibe | ✚✚ | civil, 4 |\n| 49 | **Actions des commerces** : investir dans un commerce joueur, dividendes sur sa recette, bourse locale | ✚✚ | business, econstats |\n| 50 | **Squats** : les maisons abandonnées se squattent (gangs), la police expulse sur plainte des voisins | ✚✚ | hideouts, 22 |\n| 51 | **Aéroclub** : permis pilote, location de petits avions, vols touristiques payés, Cayo en pilote joueur | ✚✚ | driving, rental |\n| 52 | **Le Nord compte** : Paleto avec sa propre tension de quartier, son métier de ranger, sa gazette, pour répartir les joueurs | ✚✚ | standing, jobs, gazette |\n\n### B4. Gains rapides pour la bêta (quelques heures chacun)\n\n| # | Proposition | Effort | S'appuie sur |\n|---|---|---|---|\n| 53 | **/bug** : capture coordonnées, ressource, dernière action, vers #bugs Discord, en un clic | ✚ | /report, Discord |\n| 54 | **Commis d'office IA** : sans avocat ns la base\n(vérifié contre `docs/FEATURES.md`, `docs/ETAT_PROJET.md` § 5 et les descriptions des 66 ressources `gs_*`).\nEffort : ✚ = quelques heures · ✚✚ = 1 à 2 jours · ✚✚✚ = une semaine. « S'appuie sur » = système déjà en place.\nRègles de la maison : tout validé serveur, zéro pay-to-win, tout en français, aucune marque réelle, rien qui casse l'existant.\n\n## D1. Signatures — « la ville se souvient » (introuvables ailleurs)\n\n| # | Proposition | Effort | S'appuie sur |\n|---|---|---|---|\n| 58 | **Les témoins ont un visage** : le passant qui a signalé ton crime reste 24 h près des lieux ; la police l'interroge (détails, plaque partielle), toi tu peux l'intimider ou l'acheter : il « oublie » | ✚✚✚ | gs_wanted (témoins), gs_evidence, gs_stickup (peur) |\n| 59 | **Le droit à l'oubli** : 30 jours sans crime → demande à la mairie, le juge tranche : casier allégé, les passants et la radio ne parlent plus de toi, les plaques gardent « un inconnu » | ✚✚ | gs_justice, gs_memoire, gs_police (casier), gs_civil |\n| 60 | **Surnom de rue** : la ville baptise ceux qui répètent un schéma (même quartier, même crime) : « le Fantôme de Vespucci » dans le dispatch, à la radio, chez les passants ; indépendant des titres de niveau et des légendes de cavale | ✚✚ | gs_memoire, gs_wanted (dispatch), gs_lsradio |\n| 61 | **Pedigree des objets** : comme le carnet du véhicule, mais pour armes, bijoux et objets de valeur (« a servi au casse de Vangelico ») ; le labo le lit, le marché noir paie plus une pièce « à histoire », une arme vierge devient rare | ✚✚ | ox_inventory (metadata), gs_evidence, gs_blackmarket, gs_auction |\n| 62 | **Mes lieux** : appli du téléphone avec tes propres souvenirs (1re arrestation, 1re voiture, mariage, 1er coup) ; sur place la nuit, un écho de toi-même rejoue la scène | ✚✚ | gs_memoire (échos), gs_phone, gs_stats (bio) |\n| 63 | **Croix de bord de route** : un mort au volant hors ville laisse une croix et des fleurs 7 jours à l'endroit exact ; les PNJ ralen réalistes avant l'ouverture.\n", "V1_CHECKLIST": "# Checklist de lancement V1\n\nCocher dans l'ordre. Chaque ligne rouge en console = on s'arrête et on l'envoie à [DEV].\n\n## A. Installation (Alpha) — outils à la racine du dossier GTA SOON\n- [x] FiveM se lance (docs/FAQ_FIVEM.md, outil `scripts/windows/diagnostic-fivem.bat`)\n- [x] MariaDB installé + `REPARER-MARIADB.bat`\n- [x] `INSTALLER.bat` (Qbox officiel + GTA SOON) → `C:\\GTASOON\\server-data`\n- [x] Licence : `CHANGER-LICENCE.bat` (lit la clé copiée, répare un double collage)\n- [ ] `DEVENIR-ADMIN.bat` après une première connexion (écrit ton `license:` en group.god)\n- [ ] Mises à jour suivantes : `METTRE-A-JOUR.bat` (sauvegarde auto dans `C:\\GTASOON\\sauvegardes`)\n\n## B. Premier démarrage (envoyer la console à [DEV])\n- [x] `Server license key authentication succeeded`\n- [x] `[gs_jobs] prêt : 6 jobs chargés`, les 16 `gs_*` démarrés\n- [x] Corrigé : `;` dans les cfg (« No such command les »), `onesync`, `hardcap`, `sv_endpointPrivacy`, item `scrapmetal`\n- [ ] Aucune ligne `[gs_bridge] ... a échoué` à la première connexion (sinon : un nom d'API Qbox à corriger)\n- [ ] Écran de chargement néon visible à la connexion\n- [x] Corrigé : `qbx_idcard` non démarré → création de perso bloquée (écran noir, chargement infini)\n- [x] Corrigé : écran noir après création (qbx_core attend un choix d'appartement absent) → gs_bridge bascule sur le spawn centre-ville + création d'apparence\n- [x] Build du jeu 3570 (véhicules récents connus de qbx_core)\n- [ ] Connu, sans effet : `Table 'properties' does not exist` (logement Qbox = V2)\n\n## C. Tests en jeu ([TEST], plans détaillés dans docs/tests/)\n- [ ] Jobs : docs/tests/phase1-jobs.md\n- [ ] Météo, recherche, économie, duo : docs/tests/phase2-signature.md\n- [ ] Néon : pseudo, post, like, mention, suppression, miroir Discord\n- [ ] `resmon 1` : chaque `gs_*` < 0,5 ms au repos, 0 erreur console (client F8 + serveur)\n- [ ] Test à 2 joueurs minimum (duo, embauche, facture, dispatch)\n\n## D. Avant ouverture publique\n- [ ] Coords calées en jeu (points de service, garages, commerces, étapes de mission)\n- [ ] Équilibrage : salaires, prix, chances de signalement\n- [ ] Profil prod (`cfg/prod.cfg`) + durcissement validé en dev\n- [ ] Webhooks Discord remplis (staff, jobs, annonces, social, boutique)\n- [ ] Backups automatiques (`scripts/backup_db.sh` / backups txAdmin) + test de restauration\n- [ ] Boutique : PLA Cfx 2026 lu et validé (docs/BOUTIQUE.md) avant `Config.Enabled = true`\n- [ ] Merge `feature/phase1-bridge` → `main` (validation Alpha)\n\n## V2 — à tester en jeu (Alpha)\n- [ ] F11 : mode staff ON, vol libre, invisible, invincible, animal puis forme humaine, spectate, TP marqueur, noms/ID\n- [ ] F11 : me mettre police grade 2, puis un gang ; items (fondateur) : donner / retirer / poser au sol\n- [ ] Nouveau perso homme → Max (mairie) → Big Sal ; nouveau perso femme → Mama Rosa (chaînes différentes)\n- [ ] Livraison chronométrée (Big Sal) ; Nuit Néon refusée le jour, OK après 20 h\n- [ ] F5 : barre d'XP, abandon de quête ; un paquet caché ; annonce NIVEAU SUPÉRIEUR\n- [ ] Location : louer une citadine, la rendre, laisser expirer\n- [ ] Drogue : vente avec choix du produit + échange animé ; `/deal` (un client vient)\n- [ ] Caler les coords (F11 → Copier mes coordonnées) : personnages, comptoirs, paquets, labo coke\n\n## V2.1 — à tester en jeu\n- [ ] HUD sans cadre (texte néon seul)\n- [ ] Supérette : acheter téléphone, bière (effet), cigarettes + briquet ; caviste ; quincaillerie\n- [ ] À terre sans EMS : [G] secours IA, paiement ; réapparition possible après 70 s, hôpital 500 $, inventaire gardé\n- [ ] Crime sans policier en service : étoiles GTA, puis « la police a perdu ta trace »\n- [ ] Choix du lieu d'apparition (persos existants) : Mairie, Legion, Pôle Emploi, Del Perro, Motels, Sandy, Paleto\n- [ ] F5 : titre, série, 3 défis du jour, badges ; Néon : titre à côté du pseudo ; F10 : progression dans la fiche\n\n## V2.2 — à tester en jeu\n- [ ] Police / EMS / mécano en service : cercles violets (service, armurerie, coffre, direction, garage) ; armurerie = équipement gratuit selon le grade\n- [ ] F11 → Points de métier : déplacer l'armurerie / le coffre LSPD dans une partie ouverte du commissariat\n- [ ] Gangs par défaut (Families, Ballas, Vagos, Marabunta, Lost MC) : F11 → Me mettre dans un gang ; blip QG + planque\n- [ ] Transformation animal (nouveaux animaux) → « Reprendre forme humaine » : on retrouve exactement son perso\n- [ ] Max le Guide : « Parler à Max » visible même de loin (zone fixe), PNJ posé au sol\n\n## V2.3 — à tester en jeu\n- [ ] [E] près de Max, d'un comptoir de location, d'une supérette, d'un point de métier, d'une planque : le menu s'ouvre\n- [ ] (ox_target : appui sur ALT gauche, choisir à la souris, rappuyer sur ALT pour fermer ; V12.36 : F8 sans erreur native 0xfcdff7b72d23a1ac)\n- [ ] Vendeur PNJ derrière chaque comptoir (sinon noter les coords avec F11 → Copier mes coordonnées)\n- [ ] F11 cliquable à la souris : chaque ligne fait bien ce qu'elle dit (TP marqueur ≠ soin)\n- [ ] Menus ox_lib noir-violet néon, accents roses (ligne verte « menus ox_lib en noir néon » dans METTRE-A-JOUR)\n\n## V3 — à tester en jeu\n- [ ] F4 police : menotter, escorter, véhicule, fouiller, casier, prison, fourrière, cônes / herse, /radar\n- [ ] F4 EMS : réanimer (trousse), soigner (bandage), porter, ambulance\n- [ ] Z en véhicule (portes, moteur, places, vitres), B ceinture, X mains en l'air, /me /do\n- [ ] Kits : réparation (moteur), avancé (complet), nettoyage — utilisables sans métier\n- [ ] Gang : bombe de peinture → tag ; [G] effacer ; garage du gang ; receleur la nuit ; porte du labo → préparation ×2\n- [ ] F10 : tiroir compact à droite ; F11 inchangé\n- [ ] Inventaire : vraies icônes (cigarettes, drogues, snacks, colis)\n", "FEATURES": "# Features signature (Phase 2)\n\nToutes : validées côté serveur, rate-limitées, loggées, testées (`./tests/run.sh`), 0 boucle client au repos.\nRéglages dans `shared/config.lua` de chaque ressource ([CONFIG]).\n\n## gs_wanted — recherche intelligente\nUn crime n'existe pour la police **que s'il est signalé**.\n- **Chance de signalement** = base du crime + 12 %/témoin (PNJ vivants et joueurs dans 40 m),\n  × heure (nuit ×0,6), × météo (brouillard ×0,6, orage ×0,7), × blackout ×0,6, × silencieux ×0,3,\n  × notoriété (un visage connu se fait reconnaître). Un policier en service à 60 m = signalement certain.\n- **Précision** : zone floue de ±250 m (aucun témoin, nuit) à ±20 m (foule, plein jour), plaque partielle\n  (`GSO****`), délai d'appel de 40 s à 5 s.\n- **Chaleur** (0-100) : étoiles néon affichées au suspect seulement quand il est signalé ; redescend si on se fait oublier.\n- **Police** : alerte + zone sur la carte (90 s), `/dispatch` = 20 derniers signalements avec GPS.\n- **Détection** : tirs et car-jacking (client, revérifiés serveur : arme réellement en main, rate-limit),\n  explosions (serveur, invisible au client), + `exports.gs_wanted:ReportCrime(src, 'robbery', coords)` pour les futurs scripts.\n- Stand de tir = zone sûre. Staff : `/effacerrecherche <id>`.\n\n## gs_economy — économie dynamique\n- Chaque achat fait monter le prix (demande), chaque revente le fait baisser (offre) ; retour progressif à l'équilibre.\n- Bornes min/max par produit, prix affichés avec tendance ▲ / ▼.\n- **Événements** : canicule → eau +60 %, tempête → kits de réparation +50 %… V12.37 : les interventions de tempête (véhicule en\n  détresse, arbre, barrière) sont créées à l'approche (< 150 m), posées sur la route la plus proche (≤ 60 m, collision chargée,\n  sinon ligne console « point à caler ») ; blip et [E] sur la vraie position ; retirées au-delà de 250 m.\n- **Anti-arbitrage** : revente toujours strictement sous le prix d'achat (testé sur toutes les pressions).\n- Supérettes, quincaillerie, ferrailleurs (ferraille, cuivre). Items absents d'ox_inventory désactivés au démarrage.\n- API : `GetBuyPrice`, `GetSellPrice`, `RecordBuy`, `RecordSell` pour brancher d'autres commerces. Staff : `/marche`.\n\n## gs_duo — duo criminel lié\n- Duo formé avec consentement, persistant, un seul par personnage, 1 h de délai après une rupture.\n- **Partenaire visible sur la carte** partout (position envoyée par le serveur, seulement au partenaire).\n- **Contrats à deux** (F7 / `/duo`) : récupérer puis livrer une marchandise ; les **deux** doivent être sur chaque\n  étape, anti-TP, le vol est signalé via gs_wanted (témoins, heure, météo).\n- **Lien** : XP (contrats + temps passé ensemble) → 5 niveaux (Complices → Légendes) : paie +30 %,\n  chaleur transmise au complice proche 50 % → 15 %.\n- Nom de duo personnalisable (nettoyé).\n\n## gs_social — Vibe, réseau social in-game (app du téléphone F1, ou `/vibe`)\n- Pseudo @unique et définitif par personnage, fil en temps réel, likes, mentions (@pseudo → notification).\n- Anti-abus : cooldown 30 s par post, 280 caractères, balises retirées, liens et invitations Discord remplacés par `[lien]`.\n- Modération : suppression par l'auteur ou le staff (ACE `gs.social.moderate`), bouton « Signaler » → webhook staff.\n- **Miroir Discord** : chaque post copié sur un salon public (`gs_webhook_social`) → la vie de la ville visible hors du jeu.\n- Confidentialité : les clients ne reçoivent jamais d'identifiant de personnage, seulement le pseudo.\n- Interface React + Vite (71 Ko gzip), DA néon ; notifications coupables (🔔).\n- Dev de l'UI sans le jeu : `cd gs_social/web && npm install && npm run dev` (données de démo). Après modif : `npm run build` et commiter `web/dist`.\n\n## gs_loadscreen — écran de chargement\nSoleil couchant rétro, titre néon, astuces tournantes (FR), touches utiles, vraie progression du chargement. 100 % local, aucune ressource externe.\n\n## gs_heists — braquages\n- **Sites** : 4 supérettes (1 policier requis), bijouterie Vangelico (6 vitrines, 3 policiers), Fleeca Legion Square (3 coffres, 4 policiers).\n- **Conditions** : arme en main, nombre de policiers en service, cooldown par site, pas de braquage par un policier en service.\n- **Signalement** : alarme silencieuse (chance par site, 100 % bijouterie/banque) = police prévenue à coup sûr et précisément ;\n  sinon ce sont les témoins / l'heure / la météo (gs_wanted) qui décident.\n- **Butin** calculé serveur, en argent sale (`black_money`) : × nuit (22h-5h), × événement météo, × lien de duo (partenaire à < 25 m),\n  × quartier tenu par ton gang (+ influence gagnée). Durée d'action vérifiée serveur (impossible de sauter la barre).\n- Staff : `/braquages` (état, cooldowns).\n\n## gs_drugs — drogue (cannabis, cocaïne, extensible)\n- **Boucle** : récolte au champ (Grapeseed) → préparation (Sandy Shores, 3 feuilles → 1 sachet) → vente aux passants (ox_target « Proposer quelque chose »).\n- **Vente** : 1 fois par PNJ (state bag serveur), prix calculé serveur :\n  × nuit, × quartier (ton gang +20 %, rival −15 %), × **saturation** (−4 % par vente récente dans le quartier, plancher 55 %, se remet en 1 h).\n- **Risque** : refus 25 % (+15 % sous la pluie), refus systématique si un policier est à < 60 m ; un refus comme une vente peut être signalé (gs_wanted).\n- Gangs : chaque vente donne de l'influence dans le quartier.\n- **Items à déclarer** dans `ox_inventory/data/items.lua` (sinon la drogue est désactivée proprement au démarrage) :\n  ```lua\n  ['weed_leaf'] = { label = 'Feuille de cannabis', weight = 50, stack = true },\n  ['weed_bag']  = { label = 'Sachet de cannabis', weight = 20, stack = true },\n  -- ['black_money'] existe déjà dans ox_inventory (argent sale)\n  ```\n\n## gs_quests — progression et quêtes de départ (V2, touche F3)\n- **XP et niveaux** (1 → 50) : quêtes, missions de métier, braquages, ventes de drogue. Chaque niveau rapporte un bonus en banque.\n  Les annonces plein écran (« NIVEAU 4 », « MISSION RÉUSSIE ») sont faites façon anciens GTA.\n- **Personnages récurrents** repérables au **losange vert** au-dessus de la tête (façon Sims) : Max le Guide (mairie),\n  Big Sal (chaîne **homme**), Mama Rosa (chaîne **femme**), Lenny, Kiki Starlight, DJ Nova, le Contact du port,\n  et **la Voix** (cabine téléphonique, dès le niveau 3).\n- Types d'étapes : aller à, conduire (chrono), livrer, ramasser, parler. Tout est vérifié par le serveur ; le véhicule\n  et les items prêtés sont repris à la fin, à l'abandon ou à la déconnexion.\n- **20 paquets cachés** sur la carte : +50 XP chacun, et 2 500 XP + 5 000 $ quand on les a tous.\n- Autres ressources : `exports.gs_quests:Reward(src, 'job_mission' | 'drug_sale' | 'heist')` ou `AddXP(src, n, raison)`.\n\n### Défis du jour, série de connexions, titres, badges (V2.1)\n- **3 défis par jour** tirés au sort par personnage (mission de métier, quête, paquet caché, location, 3 achats,\n  revente, 30 min en ville, ventes discrètes, butin) : 150 XP chacun, et +300 XP + 500 $ quand les 3 sont faits.\n- **Série de connexions** : 50 XP × jours d'affilée (7 max), 1 000 $ et le badge « Fidèle » tous les 7 jours.\n- **Titres** selon le niveau (Nouveau venu → Mythe), affichés sur **Néon** à côté du pseudo et dans la fiche du **panel staff**.\n- **Badges** : Premier contrat, Ami de la famille, Le cercle de Rosa, Au bout du fil, Collectionneur, Fidèle, Assidu.\n\n## gs_services — secours IA (V2.1)\nAucun EMS joueur en service → à terre, **[G] Appeler les secours** : un secouriste PNJ arrive, fait un massage\ncardiaque et te relève (300 $, banque puis liquide ; gratuit si tu n'as rien). Dès qu'un EMS joueur prend son\nservice, le secours IA s'efface. Réglages Qbox posés par METTRE-A-JOUR : à terre 90 s, réapparition après 70 s,\nhôpital 500 $, inventaire conservé.\n\n## gs_wanted — police IA (V2.1)\nMoins de `Config.NpcPolice.minCops` policiers joueurs en service → un crime signalé déclenche la police du jeu\n(1 à 4 étoiles selon la gravité). La ville n'est jamais sans police ; les vrais policiers reprennent la main dès qu'ils sont en service.\n\n## gs_economy — commerces (V2.1)\n12 supérettes, 6 cavistes, 2 quincailleries aux vrais comptoirs du jeu (blip + cercle au sol) : boissons, snacks,\nalcool (effet d'ivresse), cigarettes (briquet requis), téléphone, bandages, jerricans… Les magasins ox_inventory\npar défaut (vides) sont retirés par METTRE-A-JOUR.\n\n## gs_rental — location de véhicules (V2)\n- 13 comptoirs (V12.37 : mairie, Legion Square, Del Perro, Sandy Shores (devant le 24/7, plus dans le poste du shérif), Paleto,\n  Grapeseed, Harmony, Vinewood, Vespucci, aéroport, hôpital Pillbox + 2 pontons bateaux) signalés par un blip et un cercle au sol ;\n  les nouveaux sont marqués « à caler » dans la config (F11 → Déplacer un point).\n- BMX 15 $, vélo 20 $, scooter 45 $, mini citadine 90 $, petite décapotable 140 $ : 30 à 60 min, une location à la fois.\n  Le véhicule est rendu à n'importe quel comptoir et récupéré à l'échéance (avec un délai de grâce si le joueur est encore dedans).\n\n## gs_markers — marqueurs unifiés (V2)\nUn seul fil pour tous les cercles au sol et icônes (location, quêtes, entrées, commerces, métiers) : 0 coût loin des points.\n`exports.gs_markers:Add(id, { coords, style = 'rental' | 'quest' | 'entry' | 'shop' | 'job' | 'objective', label })`.\n\n## gs_drugs (V2) — vente directe et mode deal\n- Viser un passant (ox_target) → **Proposer quelque chose**. Si tu as plusieurs produits, tu choisis lequel.\n  L'échange est animé (main à main).\n- **`/deal`** : reste à un coin de rue, des passants viennent à toi toutes les 20 à 40 s. Le mode se coupe si tu montes en véhicule.\n\n## gs_police — interventions (V3, F4, en service)\n- **Police** : menotter (menottes requises), escorter, mettre / sortir du véhicule, fouiller (menotté, à terre ou mains en l'air),\n  casier judiciaire (lecture / ajout), prison RP (grade ≥ 1, 1-60 min, persistante, évasion ramenée), fourrière,\n  cônes / barrières / **herse** (crève les pneus), **radar de vitesse** (`/radar`, en véhicule).\n- **EMS** : réanimer (trousse), soigner (bandage), porter le patient, le mettre dans l'ambulance.\n\n## gs_details — petits détails (V3)\nRadial véhicule (**W** sur clavier français, Z en QWERTY, en véhicule : moteur, portes, places, vitres, ceinture), `/me` `/do` (texte au-dessus de la tête,\nvisible à 20 m), **mains en l'air** (X), **ceinture** (B, éjection en cas de choc sans ceinture), kits utilisables par tous :\nréparation de fortune (moteur 75 %), réparation avancée (complète), nettoyage.\n\n## gs_gangs — gangs vivants (V3)\n- **Tags** : bombe de peinture (quincaillerie), 15 tags max par gang, 25 m entre deux tags, +influence de quartier ;\n  n'importe qui peut effacer un tag ([G]), le gang est prévenu.\n- **Garage du gang** au QG : véhicules aux couleurs du gang, un par membre.\n- **Receleur** (grade ≥ 1, la nuit, lieu qui change toutes les heures) : vente en gros (10 à 50 pochons), prix ×1,35, argent sale.\n- **Labos** (gs_interiors) : intérieurs cachés du jeu derrière une porte réservée au gang ; préparation ×2.\n\n## V3.2 — finitions (casino, plantations, récolte, logement, Vibe)\n- **gs_casino** : porte publique du **Casino Diamond** (gs_interiors, blip), **roue de la fortune** au casino (1 tour gratuit / jour / perso :\n  argent, XP, tickets, kits ; tirage serveur, comptée avant paiement), **tickets à gratter** (supérettes 100 $, +1 offert quand les 3 défis\n  du jour sont faits ; 10 / jour max, gain moyen ≈ 70 $ : pas une machine à cash).\n- **Plantations de cannabis (gs_drugs)** : graine (vendeur louche près de Grapeseed, ou trouvée au champ / sur les plants) + pot (quincaillerie)\n  → on plante **dehors, où on veut**. 3 stades visibles de tous, arrosage (bouteille d'eau), engrais (×1,5), meurt sans eau.\n  Mûr : **n'importe qui peut récolter** (vol signalé à la police) ; le propriétaire arrache, la **police saisit** (+150 $).\n  Ensuite : transformation (Sandy ou labo de gang ×2) et vente, comme avant. 6 plants max / perso, survivent au redémarrage.\n- **Labos / club-house** : le marqueur n'apparaît plus qu'aux membres autorisés (fini la « ferme de cannabis » au milieu de Grove).\n- **gs_harvest** (libre, sans embauche ; V12.36 : ferraille en deux phases avec carcasses variées, clé à molette en main, trouvailles décrites,\n  carcasse dépouillée qui reste visible et repousse ; contremaître PNJ à chaque vestiaire) : **pêche** (pontons), **mine** (carrière), **bûcheron** (Paleto), **ferme** (Grapeseed),\n  **chasse** (animaux créés par le serveur, dépeçage au couteau). Outils en quincaillerie, casse 3 %, acheteurs dédiés, défi du jour « récolte ».\n- **Nouveaux métiers gs_jobs** : **routier** (entrepôts, au km), **chauffeur de bus** (5 arrêts), **agent immobilier Dynasty 8** (whitelist).\n  V12.37 : un point = une interaction (le PNJ porte l'option, [E] reste), prise de service par état voulu + anti-rebond (plus de\n  double bascule ni de garage « hors service » à tort), messages exacts du garage, **équipement de l'armurerie repris** à la fin du\n  service / changement de métier / licenciement / déconnexion (quantités fournies seulement).\n- **Logement : qbx_properties** (recipe Qbox, audité) : choix d'un **appartement de départ** au 1er perso, **achat / location** de biens créés\n  par les agents immobiliers (`/createproperty` : prix, loyer, intérieur, garage), coffre, garde-robe, déco.\n- **Vendeurs PNJ** : armurier derrière chaque comptoir Ammu-Nation, vendeur aux boutiques de vêtements / coiffeur / tatoueur (illenium, ox_target).\n- **Vibe** (ex-Néon) : le réseau social est une **app du téléphone** (F1), en temps réel. `/vibe` garde la version grand écran.\n- **Correctifs** : retour humain après un animal (menu staff), F5 n'ouvre plus la progression (ancienne commande supprimée).\n\n## V3.4 — RoadLine, permis, Cayo Perico, densité\n- **Nom** : RoadLine RP, sous-titre « new generation » (écran de chargement, liste des serveurs).\n- **Permis** : port d'arme obligatoire pour les armes de poing d'Ammu-Nation (déjà en place) ; **permis de chasse** (750 $ au pavillon\n  de chasse de Paleto) obligatoire pour le fusil ; dépecer sans permis = **braconnage** signalé. La police (grade ≥ 2) délivre / retire\n  les deux permis depuis le contrôle d'identité (F4).\n- **Cayo Perico** (gs_world) : l'île du jeu se charge seulement à moins de 2,2 km (zéro coût en ville). Vols réguliers LSIA ↔ île (350 $).\n- **Moins de PNJ** : piétons 60 %, circulation 65 %, voitures garées 75 % (réglable dans gs_world/shared/config.lua).\n\n## V3.5 — Vibe 2, petits boulots, filtre Vice\n- **Vibe 2** : profils publics (clic sur un pseudo), **abonnements** (notif à la personne suivie), badge **vérifié** posé par la\n  modération (ACE gs.social.moderate), badge **influenceur** dès 25 abonnés, onglet **Top semaine** (posts, créateurs les plus aimés\n  sur 7 jours, plus suivis ; cache 60 s). Aucun citizenid n'est envoyé aux clients.\n- **App Boulots** (gs_gigs) : 3 offres tirées par le serveur, renouvelées toutes les 5 min. **Livraison express** (légal, liquide)\n  ou **Passeur** (illégal, argent sale, 35 % de chance d'être signalé au chargement). GPS vers A puis B, [E] sur place, temps de trajet\n  crédible exigé, 15 min max, 1 min entre deux boulots.\n- **Filtre Vice** : réglage du téléphone, couleurs saturées + léger vignettage (mémorisé par joueur).\n\n## V3.6 — banque et base de données police\n- **gs_bank** : distributeurs (ox_target sur les props du jeu, partout) et guichets Fleeca / Pacific / Blaine (marqueur [E], blip).\n  Menu : solde, retrait, dépôt, historique. Plafonds : distributeur 5 000 $ / opération et 15 000 $ / jour, guichet 100 000 $ / 250 000 $.\n  Virements entre joueurs : app Banque du téléphone.\n- **Dossiers LSPD** (F4 → Dossiers) : recherche d'un citoyen par nom (même hors ligne), casier, **mandats** (grade ≥ 1 pour délivrer,\n  ≥ 2 pour clore, 5 actifs max par agent), **rapports** (tous les agents lisent, l'auteur ou un gradé ≥ 3 supprime).\n  Le contrôle d'identité affiche « mandat actif ». Amendes : facture (gs_jobs), déjà en place.\n\n## V3.7 — courses de rue classées, guerres de territoire\n- **gs_races** : 3 circuits (points à caler en jeu). **Chrono solo** ou **course à mise** (500 $ liquide, 45 s pour rejoindre, ≥ 2 pilotes ;\n  cagnotte − 10 %, répartie 70/30 à 2, 60/30/10 à 3+). Le serveur chronomètre et valide chaque point (ordre, position, vitesse crédible,\n  au volant). Mise remboursée si moins de 2 pilotes ou pilote hors ligne. Une course à plusieurs peut être signalée à la police.\n  **Classement par circuit** dans Vibe → Top semaine → « Courses de rue ».\n- **Guerres de territoire** (gs_gangs, menu F9 → Guerres) : un cadre déclare la guerre au gang qui tient un quartier (5 000 $ de la caisse,\n  2 membres en ligne min., 1 en face). Préavis 10 min (police prévenue), puis 20 min : chaque adversaire mis à terre dans le quartier\n  rapporte 3 points (détection serveur : coup d'arme + état « à terre »). Écart ≥ 3 : l'attaquant prend le quartier, sinon le défenseur le garde.\n  Repos : 6 h pour l'attaquant, 1 h pour le défenseur.\n\n## V3.8 — gros coups en duo, police plus maligne, assurance auto\n- **Gros coup en duo** (gs_heists, Fleeca Legion : marqueur au site, partenaire de duo F7 obligatoire, 4 policiers min.) :\n  **Pirate** (pirate le terminal 20 s : coupe l'alarme, 15 % d'échec bruyant, aveugle les caméras 10 min) → **Conducteur** (vide 2 coffres, 15 s chacun)\n  → **Fuite** (conducteur au volant à 900 m du site, pirate à moins de 80 m, 4 min). Butin 9–14 k$ en argent sale, 50/50. Échec si l'un est à terre / parti.\n- **Police IA plus maligne** : **caméras de surveillance** (10 points de la ville) : crime filmé = signalement quasi certain, zone précise, plaque\n  lisible, caméra nommée dans le dispatch. Après avoir semé les policiers du jeu, ils **fouillent la dernière zone connue** 2 min :\n  y rester ou y retourner relance la recherche (cercle jaune sur la carte).\n- **Assurance auto** (gs_insurance, Mors Mutual) : 4 % du prix du véhicule pour 7 jours (28 max d'avance) ; un véhicule   reconnexion. `/permis` : valide ou retiré.\n- **Justice** (gs_justice, `/tribunal`) : juge (ouvre une affaire, prévenu présent, avocat), verdicts appliqués (amende facturée,\n  prison, casier, mandats clos), avocat qui consulte le casier **avec l'accord** de son client.\n- **Presse** : journalistes Weazel News, badge presse sur Vibe, **flash info** envoyé à toute la ville.\n- **Mairie** (gs_civil) : mariage (accord + frais, célébré par un agent de la mairie en service), divorce, conjoint au contrôle.\n- **Commerces tenus par des joueurs** (gs_business) : bar Le Néon, Horny's Burgers. Préparation à partir de la réserve\n  (ingrédients du jeu : alcools, viande de chasse, légumes de la ferme), caisse client, prix fixés par le patron,\n  libre-service +20 % sans employé, comptabilité.\n- **Santé** : pharmacies (antidouleurs), psychologue (métier) ; blessures par zone / saignements : qbx_medical.\n- Nouveaux métiers gs_jobs : moniteur, avocat, juge, Weazel News, bar, restaurant, mairie, psychologue.\n\n**Staff** : `/economie` (argent créé / détruit par source, masse monétaire, inflation 7 j, indice des prix, top fortunes,\nrapport quotidien Discord et alerte si création anormale) ; budget de performance vérifié à chaque test (docs/PERFORMANCE.md).\nTraductions françaises manquantes des scripts Qbox ajoutées par METTRE-A-JOUR (server/locales-fr).\n\n**Signatures** :\n1. **Carnets de route** (`/carnet`) : 3 itinéraires panoramiques, anecdotes, spots photo, bonus duo, titres, classement.\n2. **Saisons** (`/saison`) : 8 semaines, pass gratuit + premium **cosmétique** (paquet Tebex `season_pass`), classement, palmarès.\n3. **Vibe influence la ville** : #rassemblement (point de rendez-vous + XP), #promo (commerces −15 %), #course (courses sans mise).\n4. **Photos et stories** : appareil photo du téléphone, stories 24 h, bonus heure dorée (docs/PHOTOS.md).\n5. **Réputation** (`/reputation`) : rue / légale / média → remise fidélité, meilleurs prix « discrets », vendeurs qui te saluent.\n6. **Contrats dynamiques** : l'app Boulots suit la météo, la nuit, les événements et les quartiers sous tension.\n7. **Bodycam et preuves vidéo** : capture jointe aux rapports police, crimes filmés par les caméras consultables.\n8. **Bourse de la ville** : onglet de Vibe avec les indices (prix, carburant, métaux, immobilier, richesse) et leur évolution.\n\n## V5 — touches sans doublon, staff à 5 rangs, radio, métiers plus profonds\n- **Départ en ville** : plus d'appartement gratuit à la création (réglage qbx_core `startingApartment = false` posé par\n  METTRE-A-JOUR). Le nouveau perso apparaît devant la mairie, guidé vers Max (« Ton premier jour »). Les logements\n  s'achètent / se louent auprès de l'agent immobilier.\n- **Touches** : progression F2 → **F3** (F2 = inventaire), mains en l'air X → **H** (à pied), radio **Verr. Maj**,\n  emotes scully sans doublon (X annuler, J pointer, ragdoll coupé). **I** ou `/touches` : aide de toutes les touches.\n- **Inventaire** : **double-clic** sur un objet = l'utiliser (en plus d'Alt + clic).\n- **Staff** : helper, modo, admin, **super-admin**, fondateur. Seul le fondateur promeut / rétrograde (en jeu, immédiat,\n  enregistré). Argent et items : super-admin minimum, motif obligatoire. Raccourcis en mode staff : Ctrl+Y TP marqueur,\n  Ctrl+U vol libre, Ctrl+O noms. Section **Fun** : course rapide, super saut, endurance, nage rapide, gravité lunaire,\n  visions nocturne et thermique.\n- **Décor** (super-admin et fondateur, `/builder`) : placer des objets (poubelles, bancs, lampadaires…) et **retirer\n  ceux de la map d'origine** pour tout le monde, réversible.\n- **gs_radio** : W → Radio ou `/radio` : canal de son métier, canal privé de son gang, fréquence libre. On règle une fois,\n  on parle en maintenant Verr. Maj. Canaux réservés vérifiés par pma-voice côté serveur. Fréquence reprise à la connexion.\n- **Métiers** : salaires réglables par la direction (entreprises privées, 0,5× à 2× la base), **primes** depuis la\n  caisse, mécano : pneus, remettre sur ses roues, réparation capot ouvert (animations plus naturelles), « Établi et\n  outillage » au lieu d'« Armurerie » (EMS : « Matériel médical »), **double des clés** des véhicules de service.\n- **Marqueurs** : plus de cercle violet sur les points de métier (chevron blanc discret), cercles restants plus fins.\n\n## V5.1 — économie illégale, solo annexe, Cayo Perico\n- **gs_stickup — braquage solo de PNJ** (annexe ; les gros coups restent en duo / groupe) : vise un passant, un caissier\n  ou un guichetier Fleeca avec une arme → [E]. La **peur** monte avec l'arme pointée et **la voix** : chuchoter < parler\n  < **crier** (portée ², touche N pour parler). Arme baissée : il s'enfuit. Toujours signalé (gs_wanted) : police\n  joueurs, sinon **police IA**. Anti-farm : cooldowns (joueur, caisse), 6 par heure, 5 000 $ par jour. Caisse / guichet\n  = argent sale.\n- **gs_blackmarket — marché noir** : `/contact` (gang, ou réputation de rue ≥ 15) → planque qui change toutes les 2 h,\n  la nuit. Munitions de tous calibres, armes non déclarées (1 par jour, armes lourdes réservées aux gangs), silencieux,\n  crochets, gilets. Stock du jour, **prix qui montent avec la rareté**, -10 % sur son territoire, argent sale (ou liquide\n  +40 %), signalement possible.\n- **Munitions cohérentes** : Ammu-Nation = pistolet, pistolet compact, fusil à pompe, munitions 9 mm / .45 / cartouches,\n  **permis obligatoire** pour armes et munitions, **120 munitions et 1 arme à feu par jour**. L'ancien « Black Market »\n  absurde d'ox_inventory (1 000 $ la balle) est retiré.\n- **Cayo Perico** : accès libre (vol gratuit à LSIA, ou bateau / avion) ; le braquage de l'île a été retiré (V5.2).\n- **Clés** : voitures PNJ moins souvent verrouillées (garées 50 %, en circulation 35 %), fouille (H) 65 %.\n- **Métiers** : animations de mission (carton porté, sac poubelle, bloc-notes routier), petit geste de fin de service,\n  **mécano : livraison de pièces** (tâche payée), **carnet de commandes** : `/depanneur` et `/taxi` pour les joueurs,\n  `/commandes` pour les employés en service (prendre → GPS, clôturer → facture).\n- **Radio** : canal 11 « Urgences » (police, EMS, mécanos en service), « Qui est sur le canal ? ».\n- **Staff — événements en un clic** (F11, admin) : chute lunaire (V12.36 : course à super vitesse et concours de super saut retirés),\n  soirée boxe (armes rangées dans la zone), course de rue (inscription gratuite). Annonce + GPS à tous.\n- **gs_hideouts — planques de départ** : chambres de motel (Pink Cage, Sandy, Paleto) louées à la semaine (1 à 4),\n  coffre perso, garde-robe, monde séparé par locataire. Pour un vrai logement : l'agent immobilier.\n\n## V5.2 — économie de l'ombre, blanchiment, import de mods\n- **Blanchiment** (menu Direction des entreprises privées : garage, concession, bar, restaurant, agence…) : argent sale\n  → caisse de l'entreprise, -30 %, 30 min de traitement. Plafond = 1,5 × le **chiffre d'affaires légal du jour**\n  (factures payées, ventes) : une entreprise qui ne travaille pas ne blanchit pas. **Contrôle fiscal** possible (plus\n  risqué quand on blanchit beaucoup par rapport au chiffre) → signalement police.\n- **Contrats entre joueurs** (`/contrats`, gang ou réputation de rue) : vol, braquage, livraison, vente, élimination\n  (scène RP obligatoire). Récompense en argent sale **bloquée** à la publication, versée à la validation, commission 5 %.\n- **Munitions artisanales** : nouvelle activité **Ferrailleur** (casses de La Mesa, Sandy, Rogers) → ferraille + cuivre\n  → atelier de la planque du gang (F9) : 9 mm, .45, cartouches, 5,56 (grade 2). 600 munitions par gang et par jour.\n  Échelle des prix : artisanal (récolte) < Ammu-Nation (permis, plafond) < marché noir (rare, cher).\n- **Motels** un peu plus chers (450 / 300 / 320 $ la semaine) : pousse vers l'agent immobilier.\n- **IMPORTER-MODS.bat** : tri et installation automatiques des mods téléchargés (docs/IMPORTER_MODS.md).\n\n## V5.4 — Cayo vivant, vols animés, import de mods automatique\n- **Vol LSIA ↔ Cayo** : petit film (avion au-dessus de l'océan, [Espace] = transfert rapide), gratuit.\n- **Soirée DJ plage de Cayo** (F11 → Événements en un clic) : sono, lumières, danseurs, musique de l'île, 1 h.\n- **Location de bateaux** : marina de LS et jetée de Cayo (jet-ski, semi-rigide, hors-bord).\n- **Staff** : « Noms et ID » jusqu'à 150 m avec PV et indicateur « parle » (rouge), activé automatiquement en spectate.\n- **IMPORTER-MODS** : ouvre les dlc.rpf (mods solo), préfère les dossiers FiveM, détecte les packs chiffrés, ajoute\n  les véhicules au catalogue Qbox (concession) avec prix.\n\n## V6 — flotte des gangs, Weazel automatique, import chaîné, guides PDF\n- **Flotte du gang** (F9, chef) : jusqu'à 4 modèles choisis dans une liste (lowriders, muscle, motos, utilitaires) +\n  **1 véhicule personnalisé** (modèle + 2 couleurs), au garage du gang.\n- **Weazel News automatique** : brèves dans Vibe (@WeazelNews) pour les braquages, gros coups, courses, loto et\n  événements staff ; jamais de nom de suspect ; anti-spam.\n- **METTRE-A-JOUR** lance aussi l'import des mods posés dans `C:\\GTASOON\\mods-a-trier`.\n- **IMPORTER-MODS** : un mod avec un fichier > 16 Mo n'est plus installé (à optimiser d'abord).\n- Derniers cercles violets / roses (missions de métier, duo) remplacés par un cercle bleu discret.\n- **PDF** (`docs/pdf`, régénérés par `tools/points.lua` + `tools/pdf.py`) : guide complet, fiche de tests, carte des\n  points (419 points + maps importées).\n\n## Liens entre features\n`gs_weather` → visibilité de `gs_wanted` + prix de `gs_economy` ;\n`gs_duo` → crimes vers `gs_wanted`, chaleur partagée ; `gs_jobs` → police en service pour le dispatch.\n`gs_heists` / `gs_drugs` → `gs_wanted` (signalements), `gs_weather` (nuit, météo), `gs_duo` (bonus), `gs_gangs` (territoires, influence).\n\n## Impact / risques / rollback\n- Tables : `gs_economy`, `gs_duos` (créées au démarrage). gs_wanted : mémoire uniquement.\n- Risques : coords et noms d'items à caler en jeu ; équilibrage des prix/chances à ajuster après la bêta.\n- Rollback : retirer l'`ensure` concerné (gs_duo dépend de gs_wanted : les retirer dans l'ordre inverse).\n\n## V6.20 — les 3 signatures RoadLine RP\n\n- **Los Santos réactif** (`gs_city`) : chaque crime signalé (gs_wanted) fait monter la tension du quartier où il a lieu\n  (9 quartiers : centre, South LS, East LS, Vespucci, Rockford, Vinewood, port, Sandy, Paleto). Elle retombe seule\n  (~45 min sans nouveau crime). Quartier **tendu** / **chaud** : passants et trafic plus rares, témoins plus prompts à\n  appeler, police IA plus nombreuse (sans LSPD en ligne), message en entrant, brèves Weazel automatiques (« sous tension »,\n  « retour au calme »). `/quartiers` : ambiance de chaque quartier. Réglages : `gs_city/shared/config.lua`.\n- **Weazel News joué par les joueurs** (`/journal`) : les journalistes en service (métier weazel) écrivent des articles\n  (titre + texte, liens bloqués), annoncés à toute la ville, relayés dans Vibe ; chaque article rapporte 400 $ à la\n  rédaction (8 payés par jour max), 1 article / 10 min par journaliste. Tout le monde lit `/journal`. Le flash info Vibe\n  et les brèves automatiques restent.\n- **Road trip du mois** (`/carnet`) : un carnet en vedette chaque mois (rotation côte Ouest → Nord de Blaine → Vinewood).\n  Premier fini du mois : XP x2 + 2 500 $ ; bonus convoi +25 % par équipier arrivé juste avant, à côté (4 max) ;\n  classement du mois dans `/carnet`. Staff : F11 → Événements → « Départ du road trip du mois » (GPS pour tous, brève\n  Weazel).\n\n\n## V7 — retours du beta test (fiche de test + retour général)\n- **Confort** : F3 progression (nom de commande neuf : l'ancien F5 ne double plus les emotes), F11 staff pour tous ;\n  images de tous nos objets (`tools/icons/make_icons.py`, posées dans ox_inventory) ; magasins qui restent ouverts ;\n  plus de coup de poing après un double-clic ; retour en civil sans perso chauve ; marqueurs discrets (petit cercle, 15 m) ;\n  création de perso : « Visage de base / Teint / Origines » ; commandes / masquées aux joueurs (liste dans `gs_onboarding/shared/commands.lua`).\n- **Points déplaçables en jeu** (`gs_bridge/shared/points.lua`) : toute position de `Config` de nos ressources se règle en jeu\n  (F11 → Monde et lieux → Déplacer un point), sauvegardée (KVP), ressource relancée. Remise à l'origine possible.\n  **V12.37 : les déplacements voyagent** : gs_bridge les écrit aussi dans `gs_bridge/points-deplaces.json` (toutes les minutes, ou\n  `/pointsexport`) ; METTRE-A-JOUR garde le fichier, METTRE-A-JOUR-OVH l'emporte, le VPS l'importe au démarrage (une fois par\n  version du fichier). Le PC est la référence : un point calé sur le PC se retrouve sur le VPS à la mise à jour suivante.\n- **V12.37 · Placement libre et PNJ / objets du staff** (F11 → Monde et lieux, super-admin et fondateur) : Déplacer un point →\n  « Placement libre » : aperçu (anneau + bille jaune = sens du cap), flèches ou pavé 8/5/4/6 = 10 cm, PgUp/PgDn = hauteur 5 cm,\n  Q/E = ±5°, Maj = pas ×5, G = au sol, Tab = viser à la souris, Entrée = valider (même sauvegarde et « ✅ Vérifié »), Retour =\n  annuler. « PNJ et objets posés par le staff » : PNJ (modèle par catégorie, scénario) ou objet (catalogue du Mapping) relié à un\n  métier (accueil, direction, garage : il remplace le PNJ de la config et porte son interaction), à un gang (il garde la planque)\n  ou libre (ambiance) ; retrait « celui que je vise » ou par la liste ; table `gs_staff_peds`, `GlobalState.gsStaffPeds`, 200 max,\n  un seul PNJ staff par cible, pose vérifiée côté serveur (≤ 60 m du staff).\n- **Récolte** (gs_harvest) : nœuds (arbres, rochers, carcasses, légumes) qui s'épuisent et repoussent, outil en main, vestiaire, PNJ aux points (V12.36 : champ `ped` de gs_markers, aussi pour l'accueil, la direction et le garage de chaque métier et le Pôle Emploi),\n  revente loin de la récolte (test automatique), un seul ferrailleur (Cypress Flats), permis et fusil de chasse à l'Ammu-Nation de Paleto.\n- **Lieux** : coiffeurs / tatoueurs / chirurgien / boutiques avec vendeur et [E] ; permis de port d'arme (Ammu-Nation, 500 $ ;\n  V12.37 : plus vendu 50 $ à la mairie / au Pôle Emploi) ;\n  pharmacies accessibles ; Rob's Liquor en supérettes ; fourrière et garages en français ; plus de logo police en double ;\n  logos des motels ; dépôts des métiers libres (« Prendre le poste ici ») ; marina : retour sur le ponton.\n- **Bars** (gs_business) : Tequi-la-la, Vanilla Unicorn, Bahama Mamas ; barman PNJ en libre-service ; PNJ d'ambiance (gs_world).\n- **Illégal** : braquage de caisse qui démarre seul, argent sale en sacs au sol ; patrouilles de police IA créées par le serveur ;\n  téléphone → Inconnu (contact + contrats) ; gangs : Families, Ballas, Vagos, Lost MC + Cartel Madrazo, Triades.\n- **Monde** : roue du casino recollée, PNJ du casino ; Cayo : vol retour visible ; bandeau Weazel News ; secours IA envoyé par un EMS.\n- **Grandes nouveautés** : tenues en objets (gs_details), menu radial (W) « Moi », courses avec organisateur PNJ et voitures prêtées (gs_races),\n  personnalisation complète par le mécano (gs_tuning/client/mechanic.lua) ; V12.36 : client descendu et à côté (moins de 30 m),\n  réglages appliqués par le jeu du propriétaire et gardés au garage, chaque refus a son message.\n\n## V10.1 · Justice, presse et staff mobile\n- **gs_cctv** : caméras de surveillance (passages de véhicules, recherche de plaque au terminal police), aveuglées à la bombe de peinture.\n- **gs_justice** : mandat de perquisition (`/mandat`, signalement des voisins, juge de permanence, coffre ouvert sur place) ;\n  pièces au dossier (`/tribunal` → affaire : photo, scellé analysé, le juge retient / écarte).\n- **gs_evidence** : chantage avec une photo (payer = photo remise, refuser = fuite Weazel + rumeur).\n- **gs_auction** : enchères de la fourrière (`/encheres`, samedi 21 h) — saisies police, voitures abandonnées, mises bloquées, recette police.\n- **gs_social** : Direct Weazel (grosse poursuite : bandeau, hélicoptère local, journalistes payés, brève de fin).\n- **gs_admin / gs_discord** : modération à distance (commandes staff du bot, panneau web `/gs_admin/`).\n- **Outils** : CAPTURER-ERREURS.bat, PREPARER-OVH.bat, METTRE-A-JOUR-OVH.bat, commande `roadline` sur le VPS (docs/OVH.md).\n\n## V10.2 · Retours du backtest et deux villes en une\n- **Objets** : noms en français (objets et armes de base) et une image pour chaque objet (générées, ajoutées si manquantes).\n- **gs_places** : vendeurs PNJ dans chaque coiffeur / boutique / tatoueur (braquables), menu de barbier, tenue achetée = objet Tenue.\n- **gs_wanted** : alertes LSPD systématiques (tirs, arme blanche : rue + GPS) ; **gs_security** : anti carkill.\n- **gs_dossier** : `/dossier` — une fiche par citoyen, vue police / juge / presse.\n- **gs_rumors** : faire courir un bruit chez un barman ; assez de voix = il se réalise (tempête, fait divers, sac de billets caché).\n- **gs_nightcity** : la nuit, noctambules devant les clubs et marchés de nuit ; le jour, musiciens et pêcheurs (rien ne ferme).\n- **gs_city** : `/gs_city/ville.json` pour la carte en direct du site (quartiers, rendez-vous, légendes).\n- **gs_rumors** : les joueurs écrivent leurs propres rumeurs (validées par le staff avant d'être racontées).\n- **gs_discord** : le fil de la ville, un résumé court chaque soir sur Discord.\n- **Alt** : ciblage en appui simple (plus besoin de maintenir la touche).\n\n## V11 · Bêta ouverte : la ville se raconte\n- **gs_scars** : lieux de mémoire — plaque (couronne, bougie, texte doré de près) après un casse banque / bijouterie, la fin d'une\n  cavale légendaire, ou posée par le staff (`/plaque <texte>`, `/plaqueretirer`) ; 30 jours ; [E] Lire la plaque : un passant raconte.\n- **gs_city** : la ville en timelapse — 24 h de photos de tension (toutes les 10 min) et de faits marquants, dans `/gs_city/ville.json` ;\n  le site les rejoue en 30 s (« Rejouer les dernières 24 h »). Jamais de position ni d'identité.\n- **gs_admin** : panneau staff mobile refait (onglets Joueurs / Tickets / Ville, cartes cliquables, recherche, état du serveur, bouton txAdmin),\n  installable comme une appli (manifeste, icônes, https via `roadline https`), codes par membre (`roadline staffweb`) ;\n  redémarrage quotidien annoncé en jeu 15, 5 et 1 min avant.\n- **VPS** : veille (alerte Discord + relance), redémarrage quotidien 06:00 heure de Paris, vérification Discord, copie quotidienne des\n  sauvegardes sur le PC, profil public `sv_pureLevel 1` (docs/OVH.md).\n- **Correctif** : traduction des objets sans casse (apostrophes), réparation automatique sur le PC et sur le VPS, test `tests/check_labels.py`.\n\n## V11.1 · Écran de chargement\n- **gs_loadscreen** refait aux couleurs du site : coucher de soleil façon côte de Vice (soleil rayé, océan, palmiers, skyline), cartes\n  « bande-annonce » des signatures, astuces, touches, progression réelle en %.\n- **« Précédemment à Los Santos »** (`gs_city/server/recap.lua`) : à la connexion, le serveur envoie (handover) le résumé des 24 h\n  (incidents et quartier le plus touché, faits divers, rumeurs vérifiées, verdicts, cavales, plaques, légendes), les quartiers chauds,\n  les joueurs en ville, la météo et le prochain rendez-vous. Rien de privé.\n- **PUBLIER-SITE.bat** : ouvre le dossier du site et Netlify pour le mettre en ligne par glisser-déposer.\n\n\n## V11.2 · La ville se raconte\n- **Les jurés de Los Santos** (`gs_justice/server/jury.lua`) : 5 citoyens tirés au sort pour un vrai procès, convocation sur le téléphone,\n  vote coupable / non coupable, le verdict suit la majorité ; indemnité de 100 $.\n- **La Gazette du dimanche** (`gs_city/server/gazette.lua`) : un journal composé seul à partir de la semaine (faits divers, verdicts, jurys,\n  légendes, plaques, rumeurs, black-out), publié le dimanche à 20 h sur Discord, sur le site (section Gazette) et en
