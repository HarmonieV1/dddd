## Réglages des ressources. [API] = nom de convar à confirmer dans la doc de la ressource à l'install.

## oxmysql
set mysql_slow_query_warning 150                # log des requêtes > 150 ms (chasse aux lenteurs)

## ox_lib
setr ox:locale "fr"
setr ox:primaryColor "pink"                     # accents néon des menus (fond noir-violet posé par METTRE-A-JOUR)
setr ox:primaryShade 6

## ox_inventory [API] overextended.dev/ox_inventory
setr inventory:framework "qbx"
setr inventory:slots 40
setr inventory:weight 30000
setr inventory:target true
setr inventory:police ["police"]

## pma-voice [API]
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly false     # recommandé par pma-voice
setr voice_defaultCycle "GRAVE"
setr voice_enableRadioAnim 1
setr voice_syncData 1

## Qbox (repris de la recipe officielle, adapté à gs_jobs / gs_gangs)
set resources_useSystemChat true
setr qb_locale "fr"
setr qbx:enableBridge "true"               # compat scripts QBCore (à couper si aucun script qb : perf)
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:max_jobs_per_player 1              # Qbox ne connaît que le job ACTIF, les contrats sont dans gs_jobs
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "false"          # IMPORTANT : sinon Qbox efface au démarrage nos jobs / gangs déclarés à la volée
set qbx:acknowledge "true"
setr qbx:enableVehiclePersistence "false"

## Emotes (scully_emotemenu) : F5 = menu, B est déjà la ceinture (gs_details) → pointer du doigt sur J
setr scully_emotemenu:menuKeybind "F5"
setr scully_emotemenu:pointKey "J"
