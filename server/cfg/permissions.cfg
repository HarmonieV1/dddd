## Permissions ACE : moindre privilège. Les identifiants du staff vont dans secrets.cfg, jamais ici.
## txAdmin a ses propres comptes admin (panel web), indépendants de ces groupes.

## Hiérarchie : god (fondateur) > superadmin > admin > mod > helper (chaque groupe hérite du précédent)
add_principal group.mod group.helper
add_principal group.admin group.mod
add_principal group.superadmin group.admin
add_principal group.god group.superadmin

## Panel staff gs_admin (F10) + menu rapide (F11) : tickets, fiches, isolement, économie, jobs
add_ace group.helper gs.admin.helper allow          # tickets, fiche joueur, aller au joueur
add_ace group.mod gs.admin.mod allow                # + soigner, figer, amener, avertir, isoler, expulser, notes, vol libre
add_ace group.admin gs.admin.admin allow            # + contrats, annonces, météo, métier/gang de test, véhicules, section Fun
add_ace group.superadmin gs.admin.superadmin allow  # + argent et items (motif obligatoire), objets du décor
add_ace group.god gs.admin.founder allow            # fondateur : promouvoir / rétrograder le staff, items sans motif

## Rangs donnés en jeu par le fondateur (menu staff → Joueurs → Rang) : gs_admin ajoute / retire les principals
add_ace resource.gs_admin command.add_principal allow
add_ace resource.gs_admin command.remove_principal allow

## Mapping en jeu (gs_builder, /builder)
add_ace group.superadmin gs.builder allow         # (super-admin et fondateur)
add_ace group.admin gs.events.manage allow      # /gsevent (événements staff : double XP, soirée chanceuse)

## Modération du réseau social Néon (supprimer n'importe quel post)
add_ace group.mod gs.social.moderate allow

## Commandes
add_ace group.admin command allow              # toutes les commandes en jeu (dont /gsjob, /meteo)
add_ace group.admin command.quit deny           # personne ne coupe le serveur depuis le jeu
add_ace group.god command.quit allow

## ox_lib doit pouvoir créer les ACE des commandes restreintes (lib.addCommand) [API]
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow
