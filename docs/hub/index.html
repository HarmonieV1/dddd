\\GTASOON\\logs\\erreurs.txt (erreurs + 80 dernières lignes) : à envoyer en cas de souci. |\n| IMPORTER-MODS.bat | Véhicules, vêtements, maps (zip / rar / dlc.rpf) : tri, contrôle des marques, installation, concession. Lit aussi « Mon Drive\\GTA ». |\n| SAUVEGARDER-BDD.bat · RESTAURER-BDD.bat | Sauvegarde maintenant (30 gardées) · retour en arrière de toute la base ou d'un seul joueur (l'état actuel est sauvegardé avant). |\n| CONFIGURER-DISCORD.bat | Webhooks (statut, annonces), jeton du bot, identifiant du Discord : écrit secrets.cfg et ouvre l'invitation du bot. |\n| PREPARER-OVH.bat | Mise en ligne sur le VPS OVH en un clic : base + serveur envoyés, installation automatique (docs/OVH.md). |\n| METTRE-A-JOUR-OVH.bat | Envoie la nouvelle version sur le VPS sans toucher sa base (sauvegardée avant) ; met d'abord le PC à jour si besoin. |\n| GERER-OVH.bat | Le VPS depuis le PC, sans mot de passe : état + diagnostic, console, erreurs, marche / arrêt, public / privé, sauvegardes (et copie quotidienne sur le PC), réglages Discord, heure du redémarrage, txAdmin, vérification Discord, codes et adresse https du panneau staff. À l'ouverture : met à jour le VPS et répare les fichiers d'objets si besoin. |\n| DEVENIR-ADMIN · REPARER-LANCEUR · REPARER-MARIADB · VIDER-CACHE-FIVEM | Te mettre fondateur · « chemin introuvable » au démarrage · base qui ne démarre plus · ancien menu encore affiché. |\n| REPARER-BDD | « Unable to establish a connection to the database » (ECONNRESET) : redémarre MariaDB, lit son journal, répare, la relance seule si elle plante, relance le serveur. |\n\n\n## Intégrations\n\n| Quoi | Comment ça marche |\n|---|---|\n| Discord · bot RoadLine | Intégré au serveur (rien à installer) : présence « 12/48 citoyens », /statut, /rejoindre, /rdv, /site ; commandes staff /joueurs, /geler, /expulser, /isoler, /liberer, /reanimer, /annonce (titre, mention, en_jeu)… (rôle staff ou admin du Discord RoadLine) ; joueurs : /aide (/help), /ip, /ticket, /fermer. Discord RoadLine détecté tout seul s'il est le seul du bot. Message de bienvenue des nouveaux membres. |\n| Discord · salons | Statut en direct (un message mis à jour chaque minute), annonces (ouverture, redémarrages, rendez-vous), sanctions publiques (staff anonyme), miroir de Vibe, logs staff / métiers / boutique / anti-triche. |\n| Discord · rôles de métier | Le rôle Discord suit le métier en jeu (gs_discord_roles dans secrets.cfg : police=ID,ambulance=ID…). |\n| txAdmin | http://IP:40120 — pour le fondateur : console, bannissements, joueurs. Mise en route : GERER-OVH → 15 (PIN, « Existing server data » → /home/fivem/server-data, OneSync On) ; mauvais compte Cfx.re : GERER-OVH → 22. Ne pas activer ses redémarrages programmés. |\n| VPS OVH | Commande « roadline » (ou GERER-OVH.bat) : etat, diagnostic, erreurs, discord, redemarrer, public / prive, sauvegarde(s), restaurer(-joueur), maj, retour, mode simple / txadmin, redemarrage-auto. Veille toutes les 2 min (alerte Discord + relance). |\n| Panneau staff (appli) | https://57-129-170-173.sslip.io/gs_admin/ (GERER-OVH → 21 une fois) : à installer sur le téléphone (Chrome : Installer l'application ; iPhone : Sur l'écran d'accueil). Joueurs, tickets, annonce. Sans console : c'est l'outil des modérateurs. Un code par membre : GERER-OVH → 20 ; 5 essais ratés = 15 min de blocage. Lien « Espace staff » en bas du site. |\n| Site · carte en direct | https://57-129-170-173.sslip.io/gs_city/ville.json : quartiers, rendez-vous, légendes, timelapse 24 h (CONFIG.cityUrlB64, déjà réglé, adresse encodée). |\n| Sauvegardes | Toutes les 6 h (PC : tâche Windows ; VPS : cron), 30 gardées, avant chaque mise à jour, retour d'un seul joueur possible. |\n| Téléphone | Fait maison : Que faire, Messages, Contacts, Appel, Banque, Factures, Emploi, Urgences, Vibe, Weazel, Plans, Ville, Notes, Boulots, Inconnu. |\n| Photos (option) | screenshot-basic + hébergeur d'images (gs_photo_* dans secrets.cfg) : vraies photos dans Vibe, l'appareil photo et la bodycam. |\n| Weazel · Radio LS | Brèves automatiques et bandeau, journal écrit par les joueurs, Direct Weazel ; Radio Los Santos en voiture (sous-titres). |\n| Boutique Tebex | Cosmétiques seulement (zéro pay-to-win), réclamés en jeu avec /boutique (sv_tebexSecret dans secrets.cfg). |\n| Liste blanche | gs_whitelist \"true\" : candidature sur Discord avant d'entrer (gs_discord_invite). |\n\n\n## 2. Touches\n\n| Touche | Action | Remarque |\n|---|---|---|\n| F1 | Téléphone | Vibe, banque, boulots, Carnet, Weazel, Commandes (pros), Inconnu (marché noir, contrats) |\n| F2 · TAB · 1 à 5 | Inventaire · barre rapide · objets rapides | Double-clic ou Alt + clic = utiliser |\n| K | Inventaire proche | coffre, boîte à gants |\n| F3 | Progression, quêtes, niveau | même touche pour fermer |\n| F4 | Intervention | police / EMS en service (EMS : envoyer un secouriste IA) |\n| F5 · X · J · G | Emotes · annuler · pointer · effets | G = effets seulement pendant une emote à effets |\n| F6 | Métiers | service, tenue, factures, direction, missions |\n| F7 | Duo |  |\n| F9 | Gang | caisse, membres, territoires, atelier, flotte |\n| F10 · F11 | Panel staff · menu staff rapide | staff uniquement |\n| I | Aide des touches |  |\n| W (clavier français) | Menu radial | Moi (tenue en objet, chapeau, lunettes, masque, animations, factures…), Radio, Véhicule |\n| Alt gauche (appui simple) | Viser / interagir (ox_target) | choisir à la souris ; rappuie sur Alt pour fermer |\n| E | Interagir sur un point [E] · racketter un passant visé | caisse / guichet : le braquage démarre seul en visant |\n| N · ² | Parler · portée de la voix | crier (²) fait peur aux PNJ braqués |\n| Verr. Maj (maintenu) | Parler à la radio | après avoir réglé une fréquence |\n| H | Mains en l'air (à pied) · démarrer sans clé (en voiture) |  |\n| L · B | Verrouiller le véhicule · ceinture |  |\n| Ctrl gauche | S'accroupir |  |\n| G | Effacer un tag adverse (gangs) · appeler les secours à terre |  |\n| Ctrl+Y · Ctrl+U · Ctrl+O | TP marqueur · vol libre · noms et ID | staff en mode staff |\n| Espace / Retour | Passer le film du vol · annuler |  |\n\n\n## 3. Commandes utiles\n\n| Commande | Pour quoi |\n|---|---|\n| /touches · /regles · /report | aide des touches · règlement · ticket au staff |\n| /me · /do | actions RP affichées |\n| /radio [fréquence/off] | radio (aussi W → Radio) |\n| /taxi · /depanneur | appeler un taxi / un mécano |\n| /factures · /reputation · /saison · /quartiers | factures · réputation · passe de saison · ambiance des quartiers |\n| /retoucheperso | retoucher son perso (une seule fois) |\n| /boutique | boutique cosmétique (réclamer ses achats) |\n| /permis · /histoire | permis valide ou retiré par la police · carnet du véhicule où tu es assis |\n| /mentor · /rencontres · /rumeurs | parrainage · collection des rencontres de la route · où entendre les rumeurs |\n| /droits · /cinema · /ralenti | garde à vue (avocat, silence, aveux) · mode cinéma pour les clips · ralenti pendant le tournage |\n| /cavale · /livrer · /legendes | fugitifs recherchés (primes) · livrer un fugitif · panthéon des cavales |\n| /contrat · /recap · /rdv | contrats signés (prêt, salaire, location) · ton récap du mois · rendez-vous de la semaine |\n| /racket | gang : réclamer une protection à la caisse d'un commerce · patron : voir / arrêter de payer |\n| /quefaire · /radiols | tout ce qu'on peut faire maintenant (aussi dans le téléphone : Que faire) · couper / rallumer Radio Los Santos |\n| /mandat · /tribunal | police / juge : signalements de planques et mandats · affaires, pièces au dossier, verdicts |\n| /encheres | enchères de la fourrière (samedi 21 h) : lots, mises, dépôt des saisies (police) |\n| /dossier | police, juges, presse en service : la fiche d'un citoyen (chacun sa vue) |\n| Staff | /whitelist · /gsjob · /gsgang · /gsevent · /meteo · /builder · /economie · /faitdivers (les joueurs ne les voient pas) |\n| Staff · rumeurs | /rumeurvraie storm/stash/crime · /rumeurfausse … (quand une rumeur est prête) |\n| Staff · mémoire | /plaque : poser un lieu de mémoire (mariage, concert…) · /plaqueretirer : la plus proche (admin+) |\n| /jury · /gazette | rouvrir ta convocation de juré · lire la Gazette de la semaine |\n| Staff · Gazette | /gazettepublier : publier la Gazette tout de suite (admin+), sinon dimanche 20 h tout seul |\n| Staff sur Discord | /joueurs · /geler · /degeler · /avertir · /expulser · /message · /annonce (rôle staff, réponses privées) |\n\n\n## ★ V12.4 → V12.13 · Sécurité, fiabilité, mappings\n- **Pièges anti-triche** : 27 faux événements que seuls les menus de triche déclenchent → bannissement définitif automatique, staff jamais banni.\n- **Bannissements en jeu** (super-admin) : F11 → Joueurs → Bannir (durée, motif) et F11 → Bannissements (liste, débannir même hors ligne) ; le banni voit motif, date de fin et lien Discord à la connexion.\n- **Arrivée en bus** réparée : sol chargé avant le bus, dépose sur le trottoir réel de la mairie, GPS vers Max ; bus bloqué → dépose directe.\n- **Bot Discord** : /help, /ip, /annonce qui publie vraiment, Discord détecté tout seul, message de bienvenue.\n- **Déplacer un point** (F11) : vérifié en jeu 6 s après (« la ressource a redémarré avec la nouvelle position ») ; cabines et Max déplaçables.\n- **Alertes police cohérentes** (docs/ALERTES.md) : un seul central, 25 types de crimes, chasse légale sans alerte, vols de voiture au central, /911p réservé au staff, shérif inclus ; seul en ville, un crime sérieux est signalé au moins 6 fois sur 10 (police IA, /policeia pour le staff).\n- **Mappings** : F11 → Monde et lieux → Mappings installés (emplacement lu dans les fichiers de chaque map, téléportation, blips staff), conflits entre maps et modèles trop lourds signalés en console ; conflits d'occlusion **fusionnés automatiquement** au démarrage (gsa_zz_fusion_occlusion).\n- **Site V13** : météo et heure de la ville en direct, son en option, affichage corrigé sur téléphone.\n\n## ★ V12 · La ville se souvient\n- **La mémoire des lieux** (gs_memoire) : chaque endroit accumule ce qui s'y est passé (crimes signalés, arrestations, mariages, courses gagnées, braquages, guerres de gang). Les passants en parlent quand on passe, Radio Los Santos le rappelle, une plaque naît au 10e événement.\n- **Les échos** (signature) : la nuit, près d'un lieu chargé, des silhouettes translucides rejouent le passé quelques secondes.\n- **Le registre des véhicules disparus** : une voiture volée jamais retrouvée refait surface après 48 h (casse, garage louche ou enchères), carnet intact ; rumeur et tuyau au propriétaire ; s'il la reprend, l'assurance récupère l'indemnité sans pénalité.\n- **Faux papiers** (marché noir) : fausse carte d'identité, faux permis, fausse PPA, identité inventée ; présentés 10 min ; crus au contrôle visuel, démasqués par le scanner du commissariat (casier).\n- **Témoin protégé** : en garde à vue, dénoncer un gang divise la peine par deux ; le gang apprend que quelqu'un a parlé, la police protège le témoin 7 jours ; s'il tombe, le gang est dans le viseur.\n- **Guerre de l'information** (gangs, F9 → Opérations) : brouiller les caméras d'un quartier ou pirater le scanner police 10 min, payé par la caisse ; la police remonte la source depuis le commissariat.\n- **Site** : « En ce moment en ville » (météo, heure, joueurs, quartier chaud, rendez-vous, rumeur, lieux de mémoire), candidature en trois questions vers Discord, Weazel News en direct, SMS en jeu pendant la visite, mode cinéma.\n\n## ★ V11.5 · Retours du backtest\n- **Un seul personnage** par joueur (deux pour le staff et les VIP) ; plus de choix du lieu : on réapparaît où on s'est déconnecté ; un nouveau personnage **arrive en bus** à la mairie.\n- **Téléphone** : impossible menotté, mort ou dans le coma ; ouvert = caméra figée, aucun coup. Aucune touche de jeu ne passe pendant une saisie.\n- **Prise de service par téléphone** (appli Emplois ou /service), de n'importe où, avec un téléphone sur soi.\n- **Permis de conduire** : plus de points ; la police le retire ou le rend (motif au casier, carte reprise). **Port d'arme** : la carte PPA est remise et reprise.\n- **Tout en français** : armes, munitions, accessoires. **F11** : items par catégorie avec image, catalogue de véhicules, mapping par catégorie, retrait / réactivation des points. **Armes longues dans le dos**, nourriture périssable, /porter (cartons, caisses…).\n- Food truck de Legion Square, caméras accrochées aux murs, PNJ acheteurs de la récolte.\n\n## ★ V11.2 · Jurés, Gazette, black-out\n- **Les jurés de Los Santos** : pour un vrai procès, le juge convoque un jury. 5 citoyens tirés au sort reçoivent la convocation sur leur téléphone (**/jury** pour la rouvrir), votent coupable ou non coupable, et le verdict suit la majorité. Indemnité : 100 $.\n- **La Gazette du dimanche** : chaque dimanche à 20 h, la semaine de la ville en une page (faits divers, verdicts, légendes, plaques, black-out), publiée sur Discord, sur le site et en jeu (**/gazette**).\n- **Black-out de quartier** : un transformateur par quartier. Saboté (avec un crochet), il plonge le quartier dans le noir 15 min : lumières, néons et caméras coupés, police prévenue. N'importe qui peut le réparer, payé par la mairie.\n- **Écran de chargement** : accueil à ton nom (« Bon retour… absent depuis 3 jours »), décor de nuit après 21 h, bandeau Weazel News avec les faits du jour et la une de la Gazette.\n\n## ★ V11 · Bêta ouverte : la ville se raconte\n- **Lieux de mémoire** : un casse de la banque ou de la bijouterie, la fin d'une cavale légendaire, un mariage posé par le staff… une **plaque** (couronne et bougie) reste sur place 30 jours. De près, le texte apparaît ; **[E] Lire la plaque** : un passant raconte.\n- **La ville en timelapse** : sur le site, « Rejouer les dernières 24 h » montre en 30 secondes la tension des quartiers et les faits marquants (incidents, faits divers, rumeurs confirmées, verdicts, cavales, plaques). Jamais de position de joueur.\n- **Précédemment à Los Santos** : le nouvel écran de chargement (coucher de soleil, cartes des signatures) résume ce qui s'est passé en 24 h (incidents, faits divers, rumeurs vérifiées, verdicts, légendes), les quartiers chauds et le prochain rendez-vous.\n- **Serveur officiel** : en ligne 24 h/24 sur le VPS, redémarrage chaque matin à 6 h (annoncé en jeu 15, 5 et 1 min avant), veille toutes les 2 min (alerte Discord et relance si besoin), sauvegardes toutes les 6 h (et copie sur le PC).\n- **Staff mobile** : une vraie appli sur le téléphone (https), onglets Joueurs / Tickets / Ville, cartes cliquables, bouton txAdmin. Les modérateurs n'ont ni console ni argent : txAdmin reste réservé au fondateur.\n\n## ★ V3 · Tout frais : deux villes en une\n- **Ville de jour, ville de nuit** : la nuit (22 h → 5 h), noctambules devant les clubs, feu de camp à Vespucci et **marchés de nuit** (food truck de Legion Square, jetée de Del Perro, Vinewood) ; le jour, musiciens et pêcheurs. Rien ne ferme : c'est du plus.\n- **Les rumeurs deviennent vraies** : chez un barman, « Faire courir un bruit » (50 $). Assez de monde le répète ? Ça arrive : tempête, sale coup en ville (fait divers), ou un **sac de billets caché** quelque part (un seul gagnant). Tu peux aussi **raconter ta propre histoire** (100 $) : si le staff la retient, tous les barmans la racontent… et la scène peut se jouer.\n- **Le fil de la ville** : chaque soir, un court résumé de la journée sur le Discord (crimes, arrestations, verdicts, légendes).\n- **Alt** : un simple appui ouvre le ciblage (choisis à la souris), un deuxième le referme.\n- **Le dossier du citoyen** (/dossier) : une seule fiche, trois regards. Police : casier, mandats, véhicules, gang ; juges : casier, affaires ; presse : verdicts publics, métiers, notoriété, articles.\n- **Retours du backtest** : objets en français avec une image chacun, menu de barbier, vendeurs PNJ partout (braquables), tenue achetée = objet, alertes police (rue + GPS), aucun dégât en fonçant sur un joueur à pied.\n\n## ★ V3 · Justice, presse et staff mobile\n- **Caméras de surveillance** : 20 caméras en ville. La police consulte les passages (plaque, type de véhicule, heure) aux terminaux du commissariat ; une bombe de peinture aveugle une caméra (les gangs adorent).\n- **Mandat de perquisition** (/mandat) : trop d'allées et venues dans une planque de gang ou une chambre de motel = les voisins préviennent la police. Demande au juge (ou juge de permanence si aucun juge en service), puis perquisition sur place : le coffre s'ouvre.\n- **Preuves au tribunal** (/tribunal → l'affaire) : police et avocats versent une photo ou un scellé analysé, le juge retient ou écarte chaque pièce ; le verdict mentionne les pièces retenues.\n- **Chantage à la photo** : une photo où l'on voit quelqu'un peut lui être montrée face à face contre de l'argent. Il paie : la photo lui est remise. Il refuse (ou ne répond pas) : elle fuite dans Weazel et les rumeurs.\n- **Enchères de la fourrière** (/encheres, fourrière de Davis) : le samedi à 21 h, saisies de la police et voitures abandonnées envoyées à la fourrière. Mise bloquée en banque, remboursée si on te dépasse ; recette à la caisse de la police.\n- **Direct Weazel** : une grosse poursuite passe en direct (bandeau pour toute la ville, hélicoptère de la chaîne au-dessus du suspect, journalistes en service payés sur place, brève de fin, Radio Los Santos).\n- **Staff sur téléphone** : bot Discord (/joueurs, /geler, /degeler, /avertir, /expulser, /message, /annonce, rôle staff) et panneau web **/gs_admin/** (codes dans secrets.cfg). Bannissements : txAdmin.\n- **Serveur officiel OVH** : PREPARER-OVH.bat (mise en ligne en un clic), METTRE-A-JOUR-OVH.bat (sans toucher la base), commande « roadline » sur le VPS. Guide : docs/OVH.md. **CAPTURER-ERREURS.bat** : enregistre les erreurs du démarrage.\n\n## ★ V3 · Une ville qui vit sans toi\n- **Que faire ?** (téléphone, ou /quefaire) : un seul point d'entrée. « En ce moment » (rendez-vous, ring ouvert, fugitifs, quartiers chauds, services en service, faits divers pour la police) puis Gagner ma vie / Côté obscur / Me détendre / Ma vie / Aide : chaque ligne est un bouton (GPS ou action), plus besoin de retenir 30 commandes.\n- **Téléphone** : nouvelles applis Que faire, Plans (lieux favoris, partager sa position par SMS, bouton Itinéraire dans les messages), Ville (ambiance et standing des quartiers, météo), Notes ; notifications sur l'accueil (SMS, appels manqués, urgences), appels récents, 6 fonds d'écran, option « marcher téléphone ouvert » (le perso ne bouge pas quand on écrit). Plus léger : Vibe et Boulots chargés seulement à l'ouverture, aucun flou coûteux, zéro boucle téléphone rangé.\n- **Le quartier évolue** : chaque quartier a un standing (à l'abandon → huppé). Les ventes des commerces et les vitrines réparées le font monter ; crimes, tags et trafics le font baisser. En déclin : déchets dans la rue, à ramasser (payé par la mairie). La recette des commerces suit (-15 % à +10 %). Brèves Weazel quand un quartier change.\n- **La ville a ses propres criminels** : quand les joueurs ne commettent pas de crimes et qu'un policier est en service, des faits divers PNJ (cambriolage, corps retrouvé, délit de fuite, vandalisme) arrivent au central : GPS, scène, constatations payées (police, EMS si besoin), brève Weazel. Staff : F11 → Événements → Fait divers.\n- **Radio Los Santos** (signature) : en voiture radio allumée, l'animateur raconte la ville en sous-titres (rendez-vous, fugitifs, faits divers, tempêtes, ring de la nuit sans adresse, météo, astuces). /radiols pour couper.\n- **Les commerçants se souviennent** (signature) : 5 jours d'achats dans la même supérette = habitué (salué par son prénom, -5 %). Braquer à visage découvert = reconnu et refusé au comptoir 48 h ; masqué, personne ne te reconnaît.\n- **Bot Discord** : intégré au serveur, rien à installer (voir docs/DISCORD.md : 5 étapes, une seule fois).\n\n## ★ V2 · La ville porte ses cicatrices\n- **Cicatrices de la ville** : bougies et ruban là où quelqu'un est tombé (quelques heures), vitrine brisée après un braquage (réparée par un joueur, payé comme ouvrier de la ville, jamais par l'auteur), fresque du gang qui gagne une guerre de quartier.\n- **La cavale** : très recherché, tu deviens fugitif (affiches, prime qui grimpe). /cavale pour la liste, /livrer pour remettre un fugitif menotté à la police (prime au policier qui l'incarcère). Tenir assez longtemps = /legendes.\n- **Appareil photo argentique** (quincaillerie) : la photo devient un objet (qui, quelles plaques, quel quartier) ; à accrocher au mur du commissariat ou à faire analyser au labo.\n- **Cabines téléphoniques** : les missions « voix au téléphone » se passent maintenant à une vraie cabine ou un téléphone mural.\n- **Fraude à l'assurance** : déclarer sa voiture volée (assurée depuis 24 h) ; l'expert recoupe avec le carnet : revu au volant ou voiture revendue = fraude (remboursement +50 %, casier, police prévenue). La police voit « déclaré volé » sur la plaque.\n- **Combats clandestins** : un ring caché qui change d'adresse chaque jour (rumeurs), ouvert la nuit ; mise des deux combattants, paris des spectateurs, arbitrage serveur (K.-O., arme sortie = disqualifié, sortie du ring), la maison prend 10 %.\n- **Racket** (/racket) : un gang propose une protection au patron d'un bar ; accepté = prélèvement chaque semaine ; refusé ou impayé = 30 min pour casser la vitrine (dégâts sur la caisse, témoins).\n- **La doublure** (bars uniquement) : au comptoir, le patron laisse un PNJ à son apparence qui sert quand personne n'est en service (50 % de la recette au lieu de 30 %). On peut la braquer arme en main (une fois toutes les 2 h).\n- **Contrats signés** (/contrat) : prêt avec intérêts, salaire privé, location (le mariage reste à la mairie). Signature face à face, prélèvements automatiques, argent mis de côté si le bénéficiaire est absent, retard = +10 %, 2 retards = litige transmis aux juges et avocats en service.\n- **Récap du mois** (/recap) : heures en ville, km, argent gagné, crimes, arrestations, combats, rencontres, photos, ton titre et ton classement ; le 1er du mois, « ton récap est prêt ».\n- **Rendez-vous fixes** (/rdv) : mercredi des métiers, vendredi des courses, nuit des combats (samedi), road trip du dimanche ; rappel 30 min avant en jeu et sur Discord.\n- **Staff** : anti-triche serveur (alertes seulement, staff exempté : vol libre et TP intacts) dans F11 → Anti-triche ; F11 → Statistiques de rétention (nouveaux, retour J+1 / 7 jours, abandon à la 1re session, durée des sessions, pic).\n\n## ★ V2 · La ville a une mémoire (signatures)\n- **La ville se souvient** : les témoins décrivent le suspect à la police, en texte brut (homme / femme, masqué, couvre-chef, sac, gilet, armé, type et couleur du véhicule, plaque partielle). Recroisé avec la même tenue ou la même voiture (plaque + couleur), il est reconnu plus vite. Changer de tenue, repeindre ou changer de véhicule brouille la piste. Un visage connu (réputation) peut être nommé.\n- **Enquêtes avec preuves** : douilles (arme, n° de série), sang, empreintes (sans gants), traces de pneus, éclats de peinture. Police : lampe torche en visant → [E] mettre sous scellé → labo du commissariat (3 min). Nom seulement si la personne est fichée (F4 → Relever empreintes et ADN, ou incarcération) ; sinon un profil inconnu P-XXXXX qui relie les scènes. Gants et javel en quincaillerie, la pluie lave le sang et les pneus.\n- **Rencontres de la route** : hors de la ville, rarement, une scène au bord de la route (auto-stoppeur, panne, accident, animal blessé, portefeuille, vendeur ambulant, contrôle du shérif). Rien n'est signalé : on s'arrête ou pas. Parfois dangereux (auto-stoppeur braqueur, fausse panne). L'auto-stoppeur aidé peut revenir. Collection dans F3 → Carnet de route.\n- **La ville parle** : barmans, pompiste, patronne du Hen House racontent les vrais événements (gratuit : vague ; payant : détails des témoins). **L'indic'** (pont de Davis, docks) vend les activités d'un autre gang (livraisons au receleur, atelier, coups, position du receleur)… et peut balancer l'acheteur.\n- **Chaque voiture a une histoire** : kilomètres, accidents, propriétaires, peintures (/histoire au volant) ; la police voit aussi les crimes.\n- **Prison vivante** (Bolingbroke) : petits boulots (peine réduite + tickets de cantine), cantine, trafiquant (outils contre tickets et cigarettes), évasion seulement à plusieurs, la nuit, avec des outils de fortune.\n- **Météo événementielle** : pendant la tempête, routes fermées (barrières, logo) et interventions payées (arbres, véhicules en détresse).\n- **Mentors** (/mentor) : un ancien (niveau 5+) parraine un nouveau ; s'il reste 7 jours, primes pour les deux.\n- **Permis** : retiré ou rendu par la police (F4 → Contrôle d'identité → Permis), motif au casier, carte reprise ; le permis à points reste désactivable (Config.Points.enabled).\n- **Signes distinctifs** : les témoins décrivent aussi les tatouages visibles (visage sans masque, bras nus, torse nu).\n- **Fausses plaques** (marché noir) : la voiture n'est plus reliée à ses signalements ni à son carnet pendant 45 min ; mais « Vérifier une plaque » révèle que le châssis ne correspond pas. Remettre la vraie plaque avant de garer.\n- **Shérif du comté** (Sandy Shores, Paleto) : métier distinct du LSPD, mêmes outils (F4, dispatch, preuves, prison).\n- **Garde à vue et interrogatoire** (F4) : cellule du commissariat, salle d'interrogatoire ; le suspect a ses droits (/droits) : avocat, silence, aveux (peine réduite de 30 %). Interrogatoire sans l'avocat demandé = vice de procédure noté au rapport.\n- **Chien K9** (F4 → Chien K9, grade 1+) : renifle un véhicule (coffre, boîte à gants, passagers) ou une personne : drogue, argent sale.\n- **Contrebande maritime** : le docker du port de Paleto (la nuit, gang ou réputation de rue) confie une cargaison à repêcher en mer en bateau puis à décharger sur une plage ; radar côtier, garde-côtes IA s'il n'y a pas de police.\n- **Mode cinéma** (/cinema) : interface masquée, bandes noires, filtres (cinéma, néon, noir et blanc), /ralenti : pour les clips.\n- **Halloween sur la route** (du 24 octobre au 1er novembre) : rencontres plus fréquentes, auto-stoppeur fantôme, 13 citrouilles cachées (récompense).\n\n## 4. Vie légale (V1 et suivantes)\n- **Arrivée** : pas d'appartement gratuit, apparition devant la mairie, quête « Ton premier jour » avec Max. Règlement à accepter.\n- **Logement** : chambres de motel à la semaine (logo motel : Pink Cage 450 $, Sandy 300 $, Paleto 320 $ ; coffre + garde-robe), vrais logements chez l'agent immobilier (Dynasty 8).\n- **Métiers** (F6) : LSPD, EMS, mécano LS Customs, concession PDM, agence immobilière, auto-école, avocats, juge, Weazel News, mairie, psy, routier, bus, taxi, livreur, éboueur. Dépôts (bus, voirie, Post OP, routier) : « Prendre le poste ici » en un clic.\n- **Bars** tenus par des joueurs : **Tequi-la-la**, **Vanilla Unicorn**, **Bahama Mamas** (préparation, caisse, prix du patron). Sans employé : un barman PNJ sert la carte de base. PNJ sur scène (danseuses, groupe, DJ).\n- **Direction** : recruter (avec accord), grades, licencier, caisse, **salaires réglables** (entreprises privées), **primes**, **blanchiment** (plafonné au chiffre d'affaires légal du jour, contrôle fiscal possible).\n- **Mécano** : réparer (capot ouvert), pneus, remettre sur ses roues, nettoyer, livraisons de pièces, **personnalisation complète** du véhicule d'un client (Alt → Personnaliser : performances, carrosserie, peinture, jantes, vitres, xénon). Double des clés des véhicules de service pour tous les métiers.\n- **Récolte** : pêche, mine (pioche), bûcheron (hache), ferme, ferraille, chasse (permis à l'Ammu-Nation de Paleto). Plusieurs arbres / rochers / tas par zone qui s'épuisent et repoussent, vestiaire (tenue de travail), revente loin de la récolte (logos sur la carte).\n- **Tenues en objets** : W → Moi → Vêtements → Plier ma tenue ; double-clic sur l'objet pour l'enfiler (échangeable, rangeable).\n- **Armes légales** : permis de port d'arme au comptoir Ammu-Nation (5 000 $, permis de conduire, casier propre).\n- **Permis de conduire** (acquis pour tous à la connexion, retiré / rendu par la police), **justice** (tribunal, avocat, verdicts), **mairie** (mariage, divorce), **banque** (guichets, distributeurs, plafonds), **bourse de la ville**.\n- **Location** : vélos, scooters, citadines ; **bateaux** à la marina de LS et à la jetée de Cayo.\n\n## 5. Vie illégale\n- **Braquage solo** : vise un caissier / guichetier Fleeca : ça démarre seul ; un passant : [E]. La peur monte avec l'arme et la voix (crier = plus vite). L'argent sale tombe en **sacs plastique à ramasser**. Police joueurs, sinon **patrouilles IA** qui te poursuivent.\n- **Braquages** : supérettes, bijouterie Vangelico, Fleeca (police requise). **Gros coup en duo** : Fleeca Legion (pirate + conducteur).\n- **Marché noir** (téléphone → Inconnu → Appeler le contact : RDV GPS, la nuit) : munitions, armes non déclarées, silencieux, crochets, gilets.\n- **Munitions** : artisanales (gang, ferraille + cuivre) < Ammu-Nation (permis, 120 / jour) < marché noir.\n- **Contrats** (téléphone → Inconnu → Contrats) : vol, braquage, livraison, vente, élimination (scène RP).\n- **Gangs** (F9) : Families, Ballas, Vagos, Lost MC + organisations Cartel Madrazo et Triades. Caisse, territoires, tags, receleur, labo, atelier de munitions, flotte + garage (logo sur la carte pour les membres).\n- **Drogues** : plantations, labos, vente. **Recherche intelligente** : témoins, caméras, précision, chaleur, police IA de relais, description du suspect et mémoire de la ville (V8).\n\n## 6. Social, loisirs, événements\n- **Vibe** (réseau social) : posts, photos, stories, tendances, badges ; **Weazel News automatique** (braquages, courses, loto, événements).\n- **Courses de rue** : organisateur PNJ (Legion Square) : chrono solo ou course à mise, voiture prêtée ou la tienne, grille de départ.\n- **Casino** (roue, loto, tickets ; barman, croupiers), **carnet de route** et **Weazel** (téléphone), **saisons** (paliers, titres).\n- **Cayo Perico** en accès libre : vol gratuit animé depuis LSIA, **vol retour** au comptoir de la piste (pilote, logo avion).\n- **Événements staff en un clic** : chute lunaire, soirée boxe, course de rue gratuite, soirée plage Cayo, départ du road trip (V12.36 : super vitesse et super saut retirés).\n\n## 7. Staff\n- Rangs : helper, modo, admin, super-admin, fondateur (seul le fondateur promeut, en jeu : F11 → Joueurs → Rang).\n- F10 panel (tickets, fiches, sanctions publiques, isolement, journal) · F11 menu rapide en 5 catégories : Joueurs, Moi (pouvoirs, persos GTA, animaux, argent, items), Véhicules, Monde et lieux, Événements.\n- **Déplacer un point** (F11 → Monde et lieux) : n'importe quel point mal placé (récolte, magasins, bars, PNJ, courses…) se pose à ta position.\n- Raccourcis : Ctrl+Y TP marqueur, Ctrl+U vol libre, Ctrl+O noms et ID (150 m, PV, « parle »), auto en spectate.\n- Argent / items : super-admin minimum, motif obligatoire, tout est journalisé.\n- Bannir / débannir (super-admin) : F11 → Joueurs → Bannir · F11 → Bannissements. Pièges anti-triche : ban automatique, staff seulement signalé.\n- Mappings installés (F11 → Monde et lieux) : y aller, blips staff, conflits ; /policeia pour tester la police IA (admin).\n\n## 8. Mods importés (Drive)\n- Marques réelles (voitures, mode, police) refusées par l'importeur : risque de retrait du serveur par Cfx.re / Rockstar. Préférer des versions « lore GTA ».\n- Maps : toutes retirées le 12/10 (bugs, maps absentes, crashs) en attendant un pack acheté. Pour vérifier un nouveau pack : F11 → Monde et lieux → Mappings installés (emplacement, conflits, poids, retrait en un clic).\n- Vêtements : bikini (haut + bas), robe d'été, 6 coiffures femme.\n- NETTOYER-MARQUES.bat : supprime les mods de marques réelles (nom du mod ou de ses fichiers) et leurs copies.\n\n562 points de carte configurés : voir « ROADLINE_Carte_points.pdf ».\n", "GUIDE_STAFF": "**STAFF**\n\n# Le micro-guide du staff\n\nTout ce qu'il faut pour modérer RoadLine en 10 minutes de lecture. Notre boulot : que les joueurs passent une bonne soirée et que les règles soient les mêmes pour tous. **Calme, neutre, rapide, et toujours avec une trace.**\n\n## 1. Les rangs\n\n| Rang | Ce que tu peux faire |\n|---|---|\n| Helper | Tickets (prendre, répondre, clore), aller au joueur, lire sa fiche, mode staff (noms et ID). |\n| Modérateur | + amener, soigner, réanimer, figer, spectate, vol libre, invisible, réparer / supprimer un véhicule, effacer une recherche, note staff, **avertir, isoler, expulser**. Valider les rumeurs (/rumeurvraie, /rumeurfausse). |\n| Admin | + métiers et gangs (soi ou un joueur), apparition de véhicules, points de métier, météo, annonces, événements, /plaque, /gazettepublier, statistiques. |\n| Super-admin | + donner de l'argent (100 000 $ max) ou des objets (100 max), **motif obligatoire** ; objets du décor. |\n| Fondateur | + rangs du staff, txAdmin (console, bans longs), VPS (GERER-OVH). |\n\n\nUn rang se donne en jeu par le fondateur : F11 → Joueurs → le joueur → Rang staff. On ne sanctionne jamais un staff de rang égal ou supérieur (le serveur refuse et le journalise).\n\n## 2. Tes outils\n\n| Outil | À quoi il sert |\n|---|---|\n| F11 · menu staff rapide | Le couteau suisse en jeu : Joueurs, Moi, Véhicules, Monde et lieux, Événements, Anti-triche. Les pouvoirs ne marchent qu'en **mode staff** (1re ligne) ; le couper coupe tout. |\n| Raccourcis (mode staff) | Ctrl+Y : TP au marqueur · Ctrl+U : vol libre · Ctrl+O : noms et ID · Retour : quitter le spectate |\n| F10 · panel | Tickets, fiches joueurs complètes, sanctions, journal, et **Carte** : tous les joueurs en direct (V12.63). |\n| Appli staff (tablette, téléphone, PC) | Adresse /gs_admin/ du serveur (« Ajouter à l'écran d'accueil » = une appli). Ton **pseudo** + le **mot de passe collectif** (donné par le fondateur). Tableau de bord, carte en direct, fiches, Lives (écrans des joueurs, replays des tickets), soigner, réanimer, réparer, téléporter, geler, isoler, avertir, expulser, **bannir** (1 à 30 jours ou définitif), débannir, tickets, annonce. Tout est signé « Web · ton pseudo » dans le journal. 5 mauvais mots de passe = 15 min de blocage. |\n| Bot Discord | /joueurs, /geler, /degeler, /avertir, /expulser, /message, **/annonce** (texte, titre, mention @everyone / @here, en_jeu pour l'afficher aussi en ville), **/isoler, /liberer, /reanimer** (rôle staff ou admin du Discord) quand tu n'es pas en jeu. Joueurs : /aide (/help), /ip, /ticket, /fermer. |\n| txAdmin | Réservé au fondateur. |\n\n\n## 3. Traiter un /report\n\n**1.** Passe **en service** (/staff) : tu reçois les tickets avec un son.\n\n**2.** **Prends** le ticket (les autres voient qu'il est pris) et réponds au joueur : « Je regarde ça ».\n\n**3.** **Observe avant d'agir** : spectate ou mode staff invisible, fiche du joueur, demande les clips. Ne coupe pas une scène qui tourne bien.\n\n**4.** **Décide** : rien à signaler, rappel à l'ordre, ou sanction (motif obligatoire, voir barème).\n\n**5.** **Clos** le ticket avec une phrase claire. Un cas compliqué : passe la main à un rang au-dessus, sans débattre devant les joueurs.\n\n> **Astuce** · En scène : intervenir en HRP le moins possible. Un message privé ou une pause demandée poliment vaut mieux qu'une téléportation.\n\n## 4. Sanctions\n\n| Faute | Première fois | Récidive |\n|---|---|---|\n| Écart léger (HRP en scène, micro, conduite irréaliste) | Rappel / avertissement | Avertissement |\n| Freekill, carkill, metagaming, powergaming | Avertissement ou isolement | Ban 1 à 3 jours (fondateur) |\n| Déconnexion pour fuir une scène, règles de braquage contournées | Isolement + avertissement | Ban 3 à 7 jours |\n| Harcèlement, propos haineux | Expulsion + rapport au fondateur | Ban définitif |\n| Triche, exploitation de bug, argent réel, double compte | Ban définitif (fondateur) | — |\n\n- **Motif obligatoire**, précis et neutre (« Freekill sur un PNJ du Vanilla, 21 h 40, clip de X »).\n- Les sanctions sont publiées dans #sanctions **sans ton nom**. Tout est journalisé (F10 → Journal).\n- **Isolement** : cour de Bolingbroke, compte à rebours, il tient même après une déconnexion.\n- Jamais de sanction sur un ami, un membre de ta faction, ou un joueur avec qui tu es en scène : passe la main.\n- Une contestation ne se règle pas en jeu : « Fais un ticket Discord avec ton clip ».\n\n### Anti-triche (F11 → Anti-triche)\n\nLe serveur signale (téléportation, vitesse impossible, arme interdite, argent anormal, carkill probable) mais **ne sanctionne jamais seul**. Toi, tu vérifies : spectate, Aller à, fiche, journal. Doute = fondateur. Le staff en mode staff est exempté (vol, invisible, TP).\n\n**Seule exception : les pièges.** 27 faux événements qu'aucun script ne déclenche, mais que les menus de triche essaient : les toucher = **bannissement définitif automatique** (« PIÈGE » dans #logs-staff). Un membre du staff n'est jamais banni, seulement signalé. Pendant les tests, le fondateur peut passer en simple signalement (*gs_honeypot \"log\"*).\n\n### Bannir et débannir (super-admin)\n- **F11 → Joueurs → le joueur → Bannir** : durée en jours (0 = définitif), motif obligatoire, double confirmation. Publié dans #sanctions.\n- **F11 → Bannissements** : liste des bans en cours, recherche par pseudo ou licence, **Débannir** (même hors ligne).\n- Le banni voit à la connexion son motif, la date de fin et le lien Discord. Les peines écoulées s'effacent seules.\n\n## 5. Faire vivre la ville\n\n| Quoi | Comment | Rang |\n|---|---|---|\n| Événements prêts | F11 → Événements (soirée plage à Cayo, départ du road trip, météo, Halloween…) | Admin |\n| Bonus serveur | /gsevent start double_xp 60 · /gsevent start lucky 60 (minutes) | Admin |\n| Fait divers PNJ | F11 → Événements → Fait divers PNJ (police en service obligatoire) | Admin |\n| Rumeurs qui deviennent vraies | Alerte reçue → /rumeurvraie storm/stash/crime ou /rumeurfausse (10 min pour décider) | Modo |\n| Rumeurs des joueurs | F11 → Événements → Rumeurs des joueurs → Valider, Valider + brève Weazel, ou Écarter | Modo |\n| Lieux de mémoire | /plaque Mariage de X et Y (sur place) · /plaqueretirer | Admin |\n| Gazette | /gazettepublier : publie tout de suite (sinon dimanche 20 h tout seul) | Admin |\n| Enchères | /encheres : ouvrir ou clore une vente (sinon samedi 21 h 30) | Admin |\n| Gangs | /gsgang create… après validation du projet RP en ticket | Admin |\n\n\nUn point mal placé (transformateur, ring, vendeur, PNJ…) : F11 → Monde et lieux → **Déplacer / retirer un point** (filtre par ressource ; super-admin : retirer du jeu, réversible). Points de métier : menu dédié. Tout est gardé aux mises à jour.\n\n## 6. Nouveautés V11.4 → V12.63 pour le staff\n\n| Quoi | Comment |\n|---|---|\n| Lives (V12.60) | F11 → Lives ou /lives : liste des joueurs, WATCH = son écran dans une fenêtre déplaçable (4 au plus). ✕ = jouer en gardant les fenêtres. Chaque visionnage est écrit dans le journal staff. |\n| Appli staff externe (V12.63) | Modérer sans être en jeu (tablette) : voir ci-dessus. Mot de passe collectif changé par le fondateur : GERER-OVH → 20 → M (efface les anciens codes). |\n| Lives grille / TP / replay (V12.62) | ▦ = toutes les fenêtres en grille ; « ⇢ TP » sur une fenêtre = se téléporter près du joueur. ⏪ (joueurs liés à un ticket ouvert : l'auteur, et le joueur nommé par « /report 12 … ») = ses 30 dernières secondes d'écran, gardées en mémoire tant que le ticket est ouvert, effacées à la fermeture. |\n| Poursuite filmée (V12.62) | Police IA à 3 étoiles : un hélico tourne au-dessus du suspect. Le site affiche « EN DIRECT » (quartier seulement, jamais le nom). /policeia 3 pour tester. |\n| Jetons de fête foraine (V12.62) | Guichet à la salle de jeu de Del Perro (à caler : F11 → Déplacer un point, gs_casino) et à la caisse du casino. Ticket d'un script d'activité (auto-tamponneuses…) : l'ajouter dans Config.Fair.exchange (gs_casino) pour l'échanger 1 pour 1. |\n| Mort RP (V12.60) | F11 → Joueurs → le joueur → Mort RP : tombe au cimetière + avis de décès (Weazel, Gazette). Le personnage n'est PAS supprimé. F11 → Monde et lieux → Cimetière : poser / retirer. |\n| Mods (V12.60) | DIAGNOSTIC-MODS.bat : fichiers abîmés, vêtements en conflit, voitures en double ; O = corrections sûres. F11 → Monde et lieux → Blips en double. |\n| Nouveautés V12.63 | Mur des légendes (gs_wanted, Config.Fugitive.legendWall, devant Mission Row : F11 → Déplacer un point). Affiches de cavale arrachables (300 $ hors police). Trêves de gangs (menu Gang → Trêves ; rupture = −15 influence partout, journal staff). Figure du coin (gs_city, Config.Figure). Avis du commerçant après un braquage filmé (gs_stickup, 24 h). Police : /faussealerte [n°] sur un appel anonyme de cabine. |\n| Appli staff : rangs (V12.63) | Mot de passe collectif = modérateur. GERER-OVH → 20 → A : code personnel avec rang (5 = fondateur : agit sur tout le monde ; sinon seulement sur les rangs inférieurs). Bannir = admin minimum. |\n| Courses sur mesure (V12.63) | F11 → Monde et lieux → Courses : « Véhicule imposé » (brouillon ou course existante). Sur la ligne : E relance le départ, X annule. |\n| Quartiers de gangs (V12.63) | Rectangles de pâtés de maisons. /quartierforme [taille] [allongement 0.4-2.5]. Plus de gangs créés d'office : F11 → Monde et lieux → Gangs. |\n| Modération avancée (V12.63, admin et plus) | F11 → Modération avancée (aussi F10 → Serveur et fiche joueur, appli → Sanctions et fiche). Surveillance d'un joueur (motif) : le staff en service est prévenu à chacune de ses arrivées, 👁 dans les listes. Fermer les arrivées (super-admin, 60 min max, rouvre seul) : seul le staff entre. Partis récemment → bannir hors ligne (super-admin ; admin dans l'appli). Contournement de ban : un compte qui arrive avec une empreinte (PC, Discord…) d'un banni = alerte (Config.Moderation.evasion = 'block' pour refuser). |\n| Mises en scène (V12.63, admin et plus) | F11 → Joueurs → le joueur → Mises en scène (aussi F10 → fiche). Enlèvement en camionnette = EXPULSION à la fin de la scène (motif publié). Arrestation par un policier PNJ = cellule de Mission Row pour X minutes (isolement). La sanction tombe toujours, même si la scène rate. |\n| Événements (V12.63) | F11 → Événements, rangé par usage : Rassemblements (auto, club, boxe, emploi, course, road trip, plage), Chasse au trésor (mallette cachée là où tu es, zone pour tous, prime 100 à 1 500 $, au-delà super-admin), Bonus serveur, Météo et saisons (neige, tempête, canicule, brouillard, Halloween), Police : fait divers PNJ, Rumeurs, Effets sur moi (+ feux d'artifice, confettis, fumée). |\n| QG de gang (V12.63) | F11 → Monde et lieux → Mappings installés → QG de gang : choisir le gang d'un QG (variantes .ymap de la map, ex. Vagos → Ballas), appliqué chez tous les joueurs et gardé au redémarrage. « Comme installé » remet tout. |\n| Appli staff installable (V12.63) | En https : bouton « 📲 Installer l'appli » (PC Chrome / Edge, Android) ou Partager → « Sur l'écran d'accueil » (iPhone). Icône au logo RoadLine. Pas de site à part : le VPS la sert. |\n| Coincé sous la carte (V12.63) | Automatique après 6 s sous la carte. Sinon F11 → Joueurs → le joueur → « Coincé : ramener au dernier endroit sûr » (aussi F10 et l'appli). Le jeu retient la dernière position au sol ; sinon Legion Square. Appli → Carte : anneau jaune = auteur d'un ticket ouvert. |\n| Idées du 16/10 (V12.63) | Hommage peint par un gang (bombe → « Un hommage », 24 h ou permanent 1 000 $ de la caisse ; journal staff). /voisins (voisins vigilants, hors gang). Alcootest du shérif la nuit quand aucun policier n'est en service (Config.Breath, gs_roadside). Photomaton à côté du guichet des jetons (à caler : F11 → Déplacer un point, gs_casino). |\n| Journée North Yankton (V12.63) | Un jour sur deux (6 h → 6 h), le vol de l'aéroport mène à North Yankton au lieu de Cayo Perico (même emplacement : jamais les deux). F11 → Monde et lieux → Destination du vol de l'île : alternance, Cayo ou North Yankton tous les jours (les joueurs sur place sont rapatriés). Soirée plage : seulement un jour Cayo. Comptoir du retour à caler (F11 → Déplacer un point, gs_world). |\n| Vols : pistes (V12.63) | L'avion se pose sur la piste de LSIA ou de Cayo puis le joueur sort devant le pilote du comptoir. Piste mal placée : debout au début de la piste, F11 → Monde et lieux → Déplacer un point → « Piste LSIA · toucher » (ou « Piste Cayo Perico »), puis au bout du roulage → « … · arret ». |\n| Lives (V12.63) | Une image par seconde, sans scintillement, écran entier (plus rogné). Même fonctionnement dans F11 et dans l'appli staff. |\n| Animalerie (V12.63) | Métier public (Pôle Emploi), ressource gs_animalerie. Une fois : F11 → Monde et lieux → Déplacer un point → « Animalerie · Comptoir », puis Réserve, Gamelles, Cages, Toilettage, dans la boutique (sinon ils se rangent autour de la map). Payé à la tâche par la ville. |\n| North Yankton : sur place (V12.63) | Location de véhicules enneigés (gs_rental, « Location · Ludendorff »), café de Ludendorff et habitants (gs_world) : seulement les jours North Yankton, positions à caler avec F11 → Déplacer un point. La recherche des joueurs retombe plus vite là-bas. |\n| Mods (V12.63) | DIAGNOSTIC-MODS : même map en deux versions (archive « _1 ») → la version _1 en pause, l'original reste. Section textures ≥ 32 Mo : à remplacer si l'une ne s'affiche pas. Démarrage : plus de gel de 11 s si l'ordre des maps est déjà bon. |\n| Lives : tester seul (V12.63) | F8 → /livestest : teste la capture sur TON PC (sans le serveur). F11 → Lives : ta propre ligne « (toi : test) ». Si l'image ne vient pas, la fenêtre (et l'appli) dit pourquoi ; console : « [gs_lives] capture impossible ». |\n| Cabines (V12.61) | Appels anonymes (police, Weazel, numéro masqué) es du site : webhook #candidatures. |\n| Isolement à distance | Bot : /isoler id minutes motif · /liberer id · /reanimer id. Appli staff : boutons Isoler / Libérer / Réanimer. Publié dans #sanctions, journalisé. |\n| Déplacer un point | F11 → Monde et lieux → Déplacer / retirer un point : 6 s après « Placer ce point ici », message « Vérifié : la ressource a redémarré avec la nouvelle position » (sinon un avertissement précis). |\n| Mappings : conflits | Console au démarrage : les conflits d'occlusion (*_occl_*) sont fusionnés tout seuls (vert = résolu). Rouge = autre conflit : à signaler à Claude ou garder une des deux maps. Jaune = modèle au-delà de la limite FiveM (48 Mo graphique / 64 Mo système). |\n| Contrôler les maps | F11 → Mappings installés → « Contrôler les maps chez moi » : bâtiment chargé, aucun modèle reçu (réimporter / VIDER-CACHE-FIVEM), reçus mais illisibles (licence Cfx du pack ou fichier abîmé), pack incomplet. Copie dans la console du serveur. Activité sans son script (laser game, karting…) : « décor seul ». |\n| Supprimer les maps | F11 → Mappings installés → « Supprimer définitivement toutes les maps » (taper SUPPRIMER) : dossiers, lignes de addons.cfg, copies et archives effacés, noms dans mods-retires.txt (jamais réinstallés). Sur le PC ET sur le VPS. |\n| Retirer une map | F11 → Monde et lieux → Mappings installés → « Retirer TOUTES les maps » ou la map → Retirer cette map : arrêtée, dossier supprimé du disque, ligne enlevée de cfg/addons.cfg, notée dans mods-retires.txt, jamais réimportée (V12.36). À faire sur le serveur du PC, puis METTRE-A-JOUR-OVH. |\n| /optin (Qbox) | Bascule le « service admin » de Qbox, exigé par ses commandes (/tp, clés de véhicule…). Fonctionne pour admin et plus depuis la V12.15. |\n| Monde et lieux | Toute la catégorie F11 (lieux publics, points, points de métier, gangs, décor, mappings, coordonnées) est réservée au **super-admin et au fondateur**, aussi côté serveur. |\n| Alertes police | Toutes les alertes passent par le central (docs/ALERTES.md) : tirs, armes blanches, vols de voiture, braquages… Chasseur avec permis en zone de chasse : pas d'alerte. /911p réservé au staff. |\n| Police IA | Seul en ville : un crime sérieux est signalé au moins 6 fois sur 10. **/policeia 1-5** (admin) la déclenche sur toi pour la tester. |\n| Discord | Message de bienvenue des nouveaux membres (salon réglé dans CONFIGURER-DISCORD, option « Server Members Intent » du portail Discord). |\n| Placement libre | F11 → Monde et lieux → Déplacer un point → Placement libre : flèches / pavé 8-5-4-6 = 10 cm, PgUp-PgDn = hauteur 5 cm, Q-E = ±5°, Maj = ×5, G = au sol, Tab = viser à la souris, Entrée = valider, Retour = annuler (V12.38). |\n| PNJ et objets du staff | F11 → Monde et lieux → PNJ et objets posés par le staff : Ajouter un PNJ (modèle, scénario) ou un objet (catalogue), relié à un métier (accueil / direction / garage : il remplace le PNJ prévu et porte l'interaction), à un gang (planque) ou libre ; Retirer celui que je vise. 200 max, un seul PNJ staff par cible (V12.38). |\n| Points : PC → VPS | V12.37 : les points déplacés sont gardés aux mises à jour ET copiés sur le VPS par METTRE-A-JOUR-OVH (fichier gs_bridge/points-deplaces.json, écrit toutes les minutes ou /pointsexport). Cale tout sur le PC : OVH suit. |\n| /dosreglage | Armes dans le dos : règle en direct la position (±1 cm, ±2°, os 24818 / 24816), « Copier le bloc Config.Back » puis coller dans gs_details/shared/config.lua et restart gs_details. Plus d'arme qui flotte après une mort ou un changement de tenue (V12.38). |\n| Dégâts adoucis | V12.37 : armes à feu −25 %, corps à corps −20 %, véhicules −30 % (gs_details/client/health.lua, DAMAGE). 1.0 = valeurs du jeu. |\n| Tempête | Interventions (véhicule en détresse, arbre, barrière) créées à l'approche, posées sur la route la plus proche. Console « aucune route à moins de 60 m du point » = point à déplacer (F11 → Points, nommés « Véhicule · … »). |\n| Concessions | V12.40 : F11 → Monde et lieux → Concessions : véhicules d'exposition (admin+) : place-toi, « Exposer un véhicule ICI », puis « Départ des essais ICI » sur la route. Les joueurs essaient 2 min et achètent ; le vendeur en service change le modèle. |\n| Courses sur mesure | V12.40 : F11 → Courses de rue sur mesure : points posés à ta position (30 m mini), 3 à 30 points, éphémère (1 à 168 h) ou permanente. |\n| Portes verrouillées | V12.40 : F11 → Portes verrouillées : ouvre /doorlock (ox_doorlock). Groupes : police + sheriff (cellules, commissariat), ambulance, mechanic, cardealer, le gang pour son QG. |\n| Territoires | V12.40 : visibles des seuls membres de gang ; niveaux 0-3 selon l'influence, 3 territoires max par gang ; /territoire id -3..3 (admin) ajoute un bonus (perdu au redémarrage). |\n| Mobilier | V12.42 : bancs, chaises, lits, matelas, fauteuil roulant posés au F11 (ou de la ville) : Alt → S'asseoir / S'allonger / Rouler. Mauvaise hauteur : pendant la pose PgUp/PgDn et flèches, la ligne à recopier dans Config.Furniture (gs_furniture) s'affiche en F8. |\n| Boutique et RoadCoins | V12.41 : /boutique = vitrine en jeu. Test console : gsstore_deliver TEST-1 roadcoins_500 (crédit immédiat). Remboursement : gsstore_revoke TEST-1. Jamais de commande boutique en jeu (refusée même admin). |\n| Base injoignable | V12.47 : console « [oxmysql] Unable to establish a connection to the database » (ECONNRESET) sur le PC : REPARER-BDD.bat (redémarre MariaDB, explique la cause, la relance seule si elle plante, relance le serveur). |\n| Forme des territoires | V12.56 : /quartierforme [taille 40-200 m] (admin) : tourne les cases pour suivre les rues (carte des gangs), gardé au redémarrage. Ex. /quartierforme canals 37 |\n| Prison : musculation | V12.53 : Pompes, Abdos, Haltères, Tractions dans la cour (détenus). Mal placés : F11 → Déplacer un point (gs_police). |\n| Arrivée protégée | V12.50 : 30 s fantôme à la connexion et après une réapparition ; points d'apparition = zones sans coups ni tirs (Config.SpawnProtection dans gs_onboarding). Un troll qui frappe ailleurs : sanction normale. |\n| Voix | V12.51 : portées 2 / 6 / 14 m (gs_radio, Config.VoiceRanges). Spam de coups : 1 coup / 0,8 s. Un joueur qui n'entend plus le jeu quand on parle : REPARER-SON.bat (réglage Windows Communications). |\n| Récolte | V12.45 : champs d'orge, houblon, maïs, plantation de tabac (Grapeseed, revente au marché) ; pavot sans blip (crime « culture illicite », receleur du port). Champ mal placé : F11 → Déplacer un point (ressource gs_harvest). |\n| Nouveaux vêtements | V12.45-46 : 9 collections ROADTRIP (coupes homme / femme, robes, jeans) en plus de celles du jeu : IMPORTER-MODS les installe. Un joueur ne les voit pas : VIDER-CACHE-FIVEM. |\n| Caméras en direct | V12.41 : terminal de vidéosurveillance (police en service) → une caméra → Voir en direct. Peinte à la bombe ou black-out : image noire. |\n| Location | 13 comptoirs (Sandy devant le 24/7, plus dans le poste du shérif ; Grapeseed, Harmony, Vinewood, Vespucci, aéroport, Pillbox ajoutés, « à caler » via F11 → Déplacer un point). |\n\n\n## 7. La déontologie du staff\n- **Le mode staff, c'est pour modérer.** Jamais de pouvoir (vol, TP, argent, objets) pour ton personnage ou tes amis.\n- **Neutralité** : en jeu, tu es un joueur comme les autres. Tes infos de staff (fiches, journal, positions) ne servent jamais à ton RP.\n- **Confidentialité** : codes, captures du panel, discussions staff et identités restent entre nous. Ton code d'appli est personnel.\n- **Ton calme** : on explique, on ne se moque pas, on ne menace pas. Un joueur énervé reçoit une réponse courte et polie.\n- **En cas de doute, on demande.** Un ticket qui attend 5 minutes vaut mieux qu'une mauvaise sanction.\n\n## 8. Quand ça casse\n- Serveur tombé : l'alerte arrive dans le salon staff au bout de 4 min et il se relance tout seul. Sinon : fondateur.\n- Bug qui rapporte de l'argent ou des objets : on note qui, quand, combien, et on prévient le fondateur (retour en arrière d'un seul joueur possible).\n- Joueur bloqué (sous la carte, dans un mur) : mode staff → Amener, ou le TP à un lieu sûr. Notez-le dans le ticket.\n\n*« La ville se souvient » : le staff aussi. Chaque action laisse une trace, et c'est ce qui protège tout le monde, toi compris.*\n", "ETAT_PROJET": "# État du projet RoadLine RP — récapitulatif complet (à jour au 15/10/2026, V12.61)\n\nCe document sert de **point de sauvegarde** : si une conversation avec Claude est perdue, compressée ou doit reprendre\nailleurs, tout ce qu'il faut savoir est ici. Il est versionné avec le code (`git log` en garde aussi l'historique).\nEn bas de ce fichier : un **prompt prêt à coller** dans une nouvelle conversation pour repartir sans rien perdre.\n\n---\n\n## 0. Où on en est (12/10/2026, V12.25) — récapitulatif global\n\n**Phase** : bêta fermée en cours (des testeurs sont en ville et d'autres arrivent cette semaine), ouverture officielle le\n**20/10/2026 à 21 h**. Décision du 11/10 : pas de gel des nouveautés, mais désormais **surtout du correctif, de la\nconfiguration et de l'optimisation** ; l'utilisateur se consacre à la promotion.\n\n**Le serveur en chiffres** : 72 ressources maison (V12.63), 40 systèmes exclusifs (« signatures »), 40 mappings payants installés,\n3 770 tests automatiques, tous verts ; 27 pièges anti-triche ; 25 types de crimes reliés au central police ; budget de performance\ntenu (136 boucles client, 6 permanentes par image).\n\n**Documentation** : `docs/hub/index.html` (double-clic) = toute la doc en un site hors ligne, par catégories, recherche,\nbacktest et priorités à cocher (sauvegardés dans le navigateur, export / import .json, rapport texte, impression).\nRégénéré par `python3 tools/doc_hub.py` (aussi lancé par tests/run.sh). Les priorités cochables sont dans `PRIORITIES`.\n\n| Domaine | État |\n|---|---|\n| Base Qbox/ox, installation PC + VPS (scripts .bat) | ✅ Stable, mises à jour en un clic, sauvegardes BDD programmées |\n| Gameplay (métiers, économie, illégal, police, EMS, justice) | ✅ Complet, cohérence des alertes auditée (V12.7) |\n| Signatures (ville qui se souvient, rumeurs, Gazette, black-out, échos…) | ✅ Livrées, à éprouver avec du monde |\n| Sécurité (anti-triche, pots de miel, bans F11, verrous Discord) | ✅ En place ; `entityLockdown strict` après l'ouverture |\n| Staff (F11, appli web, txAdmin, bot Discord) | ✅ Complet ; déplacement des points réparé et vérifié en jeu |\n| Bot Discord (statut, tickets, modération, annonces, bienvenue) | ✅ À valider sur le VPS (fiche de recette 1b et 1d) |\n| Site (Netlify) | ✅ V13 : météo et heure de la ville en direct, son opt-in, IP masquée jusqu'au 20/10 |\n| Arrivée en bus | ✅ Réparée (sol chargé avant le bus, dépose au sol réel, secours si bloqué) |\n| Mappings / MLO | ⏳ **40 maps payantes (packs Patoche, escrow)** installées le 12/10, doublons retirés (`RETIRED_MAPS`). Reste : tour en jeu de chaque intérieur (certains « chargent sans fin » : la console signale en rouge les maps activées mais non démarrées = licence Cfx ou .fxap), dernier conflit concession + gang 2 (fusion V12.24 à confirmer) |\n| Crash FiveM du fondateur (erreur 506) | ⏳ Côté PC (launcher Rockstar / droits admin / OneDrive) : `REPARER-FIVEM.bat` livré, à lancer |\n| Cabines téléphoniques (refonte « vraies cabines de la map ») | ⏳ À discuter |\n| Recette en jeu | ⏳ Fiche `ROADLINE_Backtest_complet.pdf` (sessions 0 → 6, dont 1b / 1c / 1d prioritaires) |\n\n**Avant l'ouverture, dans l'ordre** (cochable dans `docs/hub/index.html` → Priorités) : 1) FiveM réparé sur le PC du\nfondateur (REPARER-FIVEM) ; 2) tour en jeu des 40 maps, désactiver celles qui chargent sans fin ; 3) backtest (56 tests,\n★★★ d'abord) → corrections ; 4) vêtements / coiffures en plus (packs FiveM ready, sans marque) ; 5) Discord finalisé ;\n6) annonce de recrutement ; 7) passage du profil privé au public (code cfx.re) le jour J. **Pas de nouveau gros système\navant l'ouverture** : correctifs, configuration, optimisation.\n\n---\n\n## 1. Identité du projet\n\n**RoadLine RP** : serveur FiveM GTA RP **100 % français**, bâti sur **Qbox/ox** (qbx_core, ox_inventory, ox_lib,\nox_target...). Dépôt : `harmoniev1/dddd`. Ressources maison dans `server/resources/[gtasoon]/gs_*` (66 ressources).\nPositionnement : **Free Access, zéro pay-to-win**, une ville qui vit même sans les joueurs, beaucoup de systèmes\nexclusifs (« ce que tu ne trouveras nulle part ailleurs »).\n\n**Branches à jour** (toujours pousser sur les deux) :\n- `feature/phase1-bridge`\n- `claude/gta-rp-architecture-stack-pbvdxz`\n\n**Dernier commit poussé** : « V12.58 : bancs réglables pour tous, arme dans le dos, caméras peignables » (hash exact :\n`git log -1 origin/feature/phase1-bridge`). Les deux branches pointent sur le même commit.\n\n**Deux sessions Claude en parallèle** (poste Windows et session web) : elles ne se voient pas. Toujours synchroniser\npar un colis (zip de l'installation ou de la session) + ce fichier, et comparer les arbres en ignorant les fins de ligne\n(CRLF) avant de fusionner. La V12.9 est le point de rencontre commun : toute nouvelle session repart de là.\n\n## 2. Versions : interne vs publique (important, piège classique)\n\nDepuis la V11.3, il y a **deux numéros de version différents**, volontairement :\n- `gs_version` (convar, `server.cfg.example`) = **V12.61** → version technique interne, vue par le staff (F11, console,\n  METTRE-A-JOUR). Continue d'avancer à chaque mise à jour (V11.2, V11.3...).\n- `gs_public_version` (convar) = **« V4 · bêta »** → version vue par les **joueurs** (écran de chargement, statut\n  Discord, Gazette). Le site affiche son propre journal (V1 à V4, V5 « classé confidentiel »).\n\n**Pourquoi** : le développement local a pris de l'avance (V11.x en interne) alors que, officiellement, le serveur n'a\neu que 4 grosses sorties publiques. Pour que la numérotation reste cohérente aux yeux des joueurs, on affiche V4.\n**Ne jamais réaligner les deux** sans que l'utilisateur le demande explicitement.\n\n## 3. Infrastructure\n\n- **VPS OVH** : Ubuntu 24.04, IP **57.129.170.173**, user `ubuntu`, connexion SSH par clé (jamais de mot de passe\n  envoyé en clair). Port jeu **30120**, txAdmin **40120**.\n- **Mode actuel : txAdmin** (pas le mode « simple »). Le watchdog du serveur surveille le port 40120 dans ce mode.\n- **Profil actuel : privé** (caché de la liste FiveM, 16 places) — donc **pas encore de code cfx.re** (il n'apparaît\n  qu'au passage en public). Adresse de connexion directe en attendant : `57.129.170.173:30120`.\n- **Site** : hébergé sur **Netlify** (roadlinerp), mis à jour en glissant tout le dossier `docs/site/` (voir\n  `PUBLIER-SITE.bat`). Carte en direct branchée sur `https://57-129-170-173.sslip.io/gs_city/ville.json`.\n- **Ouverture officielle prévue** : **20/10/2026 à 21 h (heure de Paris)** — réglée dans `CONFIG.opening` du site.\n- **Discord** : bot RoadLine intégré au serveur (`gs_discord/server/bot.js`, Node pur, pas de dépendance npm externe),\n  démarre avec le serveur FiveM dès que le jeton est renseigné. Statut actuel : **bot connecté**, webhooks\n  `gs_webhook_status` et `gs_webhook_annonces` **OK** ; `gs_staff_webhook` et `gs_webhook_sanctions`\n  **non réglés** (à faire : créer les webhooks dans ces salons Discord, les coller dans CONFIGURER-DISCORD, puis\n  GERER-OVH → 12).\n  - **V11.4** : commandes staff du bot (`/joueurs /geler /degeler /avertir /expulser /message /annonce`) réservées\n    au **rôle `gs_discord_staff_role` + propriétaire du Discord**, et **uniquement sur le Discord `gs_discord_guild`**\n    (passe-droit « Administrateur » retiré : faille, le bot pouvait être invité sur un autre Discord). Commandes\n    enregistrées sur ce Discord seulement. Nouveau : `/aide`, `/ticket sujet` (fil privé dans `#tickets`,\n    `gs_discord_ticket_channel`) et `/fermer`. `gs_discord_tickets \"false\"` = bot de tickets externe.\n  - V12.1 : `sv_maxclients` = 48 en privé (`dev.cfg`) comme en public (`prod.cfg`) : bot et site affichent X/48. 64 = Element Club Argentum.\n\n## 4. Outils d'installation / exploitation (PC Windows + VPS)\n\nTout est scripté, zéro mot de passe affiché en clair :\n- `INSTALLER.bat` / `METTRE-A-JOUR.bat` (PC = environnement de test)\n- `METTRE-A-JOUR-OVH.bat` (envoie la version du PC vers le VPS, sauvegarde la base avant, ~30 s de coupure)\n- `GERER-OVH.bat` (menu à 22 options : état/diagnostic, console, erreurs, marche/arrêt, public/privé, sauvegardes,\n  mode simple/txAdmin, retour arrière, Discord, codes staff, adresse https...)\n- `CONFIGURER-DISCORD.bat` (jeton bot, webhooks, adresse de connexion — voir piège ci-dessous)\n- `POUSSER-GITHUB.bat` (V12.34 : envoyer les commits du PC sur GitHub après les tests, récupérer ceux de l'autre session ; `docs/GITHUB.md`)\n- `PREPARER-OVH.bat`, `CAPTURER-ERREURS.bat`, `SAUVEGARDER-BDD.bat` / `RESTAURER-BDD.bat`, `IMPORTER-MODS.bat`,\n  `DEVENIR-ADMIN.bat`, `PUBLIER-SITE.bat`, `REPARER-FIVEM.bat` (erreur 506 / déconnexions Rockstar, côté joueur),\n  `VIDER-CACHE-FIVEM.bat`, `NETTOYER-MARQUES.bat`\n\n**Piège vécu cette session** : l'utilisateur a demandé « c'est quoi mon adresse cfx » en croyant qu'elle existait déjà\n— elle n'existe pas tant que le serveur n'est pas passé en public au moins une fois. Résolu en utilisant l'IP directe\nen attendant.\n\n## 5. Ce qui a été livré, dans l'ordre (V1 → V12.9)\n\nRésumé très condensé (le détail complet est dans `docs/ROADMAP.md`, `docs/FEATURES.md`, `tools/bilan.py`) :\n- **V1-V2** : la rue et les métiers de base, la ville a une mémoire (témoins, preuves, carnet véhicule).\n- **V3** : une ville qui vit sans le joueur (quartier réactif, radio, justice/presse, ville de jour/nuit, rumeurs).\n- **V7 à V10.2** : vagues de confort, staff, récolte, illégal, EMS/casino, tenues objets, cicatrices de la ville,\n  cavale/légendes, anti-triche, bot Discord, sauvegardes, téléphone, caméras/mandats, preuves recevables, enchères,\n  Direct Weazel, objets en français, anti-carkill, V12.6), 77 tests dont 31 bloquants ; flèches\n    « → » enfin lisibles (Helvetica ne les avait pas).\n  - Tests : +11 (scénario cabine / Max / confirmation), 2674 Lua, 65 bot Discord.\n\n- **V12.5** (11/10/2026) — bot Discord réparé (retours du backtest) :\n  - **Cause commune** de 3 symptômes : `gs_discord_guild` vide ou faux sur le VPS (l'outil le présentait comme facultatif).\n    Résultat : `/ticket` et les commandes staff refusés avec « uniquement sur le Discord RoadLine » alors qu'on y était, et\n    les anciennes commandes (`/help`, `/ip`) jamais nettoyées. **Correctif** : à la connexion, le bot lit la liste de ses\n    Discords (READY) ; s'il n'est que sur un seul, c'est forcément RoadLine → adopté et signalé en console. Plusieurs\n    Discords et réglage vide/faux → refus de deviner (protection conservée). Message d'erreur qui dit quoi corriger.\n  - **`/help`** (alias de `/aide`) et **`/ip`** (adresse + `connect` F8) ajoutées. Toute commande inconnue répond l'aide,\n    plus le site (c'était la cause de « /help donne le site »).\n  - **`/annonce` publie enfin sur Discord** : `#annonces` (webhook), sinon le salon courant ; titre, `@everyone`/`@here`,\n    1 800 caractères ; `en_jeu` pour l'afficher aussi en ville. Avant, elle n'envoyait qu'une annonce en jeu.\n  - Réponses sorties dans `createAnswer()` (testable) : +21 tests (65 au total). `CONFIGURER-DISCORD` marque l'identifiant\n    du serveur comme INDISPENSABLE ; diagnostic GERER-OVH : « réglé / NON RÉGLÉ » pour guild, rôle staff, #tickets, adresse.\n  - Revérifié sans changement : statut en direct, annonces de redémarrage, résumé du soir (6 événements bien émis), Gazette,\n    rendez-vous.\n\n- **V12.4** (11/10/2026) — sécurité sur mesure et arrivée réparée :\n  - **Pots de miel** (`gs_security/server/honeypot.lua`) : 27 appâts (23 events + 4 callbacks) enregistrés côté serveur et\n    déclenchables par personne. Deux familles : des noms de frameworks qu'on n'utilise pas (ESX, vieux scripts fuités) que les\n    menus de triche tentent en aveugle, et de fausses failles alléchantes (« donne-moi de l'argent », « passe-moi admin »).\n    Toucher l'un des deux ne s'explique pas en jouant → bannissement définitif automatique. Réglage par convar `gs_honeypot`\n    = `ban` (défaut) / `kick` / `log`. **Le staff n'est jamais banni** : il est signalé dans `#logs-staff` (erreur ou test).\n  - **Zéro faux positif garanti par un test** (`tests/check_honeypot.py`, dans `tests/run.sh`) : aucun nom de piège ne doit\n    apparaître ailleurs dans le dépôt. Si un jour on nomme un vrai event comme un piège, les tests refusent le push.\n  - **Bannissements RoadLine, posés ET levés en jeu** (nouvelle table `gs_admin_bans`, par licence) : `F11 → Joueurs → Bannir`\n    (durée en jours, 0 = définitif, motif obligatoire, double confirmation) et `F11 → Bannissements` (liste des bans actifs,\n    recherche par pseudo ou licence, déban **même sur un joueur hors ligne**). Réservé au super-admin ; l'anti-abus s'applique\n    (pas de sanction sur un staff de rang égal ou supérieur). txAdmin reste en place, mais ne sait pas débannir depuis le jeu.\n  - **Message de refus clair à la connexion** (`gs_onboarding`) : un banni voit son motif, la date de fin et le lien Discord —\n    vérifié **avant** la liste blanche, donc un banni whitelisté est bien refusé. Les peines écoulées s'effacent toutes seules.\n  - **Bus d'arrivée corrigé** (`gs_onboarding/client/arrival.lua`) : la cause des deux bugs signalés était la même ligne —\n    le perso était posé à `stop.z - 1.0`, soit **1 m sous le trottoir** : il traversait la map et réapparaissait n'importe où\n    (donc jamais devant la mairie). On attend maintenant la sortie réelle du bus, le chargement des collisions, puis on cale\n    sur le sol (`GetGroundZFor_3dCoord`). Bonus : itinéraire GPS tracé vers Max « le Guide » + notification d'accueil.\n  - **`entityLockdown strict` : audité, documenté, PAS basculé** (`server/cfg/prod.cfg` et `dev.cfg`). 4 créations d'entités\n    réseau côté client casseraient : garde du gros coup (`gs_heists`), téléphone en main (`gs_phone`), chien K9 (`gs_police`),\n    garde-côtes (`gs_smuggling`). Le chemin de migration (les passer côté serveur) est écrit dans les deux cfg. `relaxed`\n    bloque déjà les entités créées hors script : le gain est réel mais marginal, et le risque de casse à ~9 jours de\n    l'ouverture ne l'est pas. **À faire après l'ouverture.**\n  - **Audit `bob74_ipl`** (`docs/BOB74_IPL.md`, source 2.7.1 lue fichier par fichier) : RoadLine exploite **6 intérieurs\n    sur ~90**. Inventaire complet avec les coordonnées exactes, 3 familles (sous la carte → porte `gs_interiors` ; en place\n    → rien à téléporter ; coquille → routing bucket comme `gs_hideouts`), 12 portes recommandées branchées sur des\n    ressources existantes (faux papiers, primes, Car Meet, casse, studio radio, agence, boîte de nuit…), blocs prêts à\n    coller (`inside` exacts, `outside` à relever en jeu — déplaçables par F11 car `gs_interiors` inclut `points.lua`).\n    **Rien n'est branché** : en attente du choix des portes.\n  - **`docs/MLO.md`** : ordre de recherche (bob74 → coquille → MLO gratuit → MLO payant), les 5 contrôles (poids,\n    licence, marques, chiffrement, performance), procédure `IMPORTER-MODS.bat`, sources acceptables, sites à proscrire.\n  - **`check_honeypot.py` durci** : ne lit plus que les fichiers suivis par Git et ignore les copies de `honeypot.lua`.\n    Avant, un colis de synchronisation dézippé dans le dépôt (ou `livraison/`) bloquait le push à tort.\n  - **Pots de miel testés à l'exécution** (`tests/test_gs_honeypot.lua`, 16 vérifications) : piège → ban définitif,\n    staff jamais banni ni expulsé, déclenchement côté serveur ignoré, modes `kick` / `log`, expulsion de secours si\n    `gs_admin` est en panne. Les noms de pièges y sont relus depuis `GSSec.Honeypot`, jamais écrits en clair.\n  - **Tests** : +23 assertions `gs_admin` (niveaux, durées, anti-abus, déban, liste, peine écoulée, ban auto staff/joueur).\n    Suite complète verte : 2664 tests Lua, 44 tests bot Discord, 27 pièges vérifiés.\n\n- **V12.3** (10/10/2026) :\n  - **Bot Discord** : les administrateurs du Discord RoadLine ont les commandes staff (le serveur est vérifié avant, donc sûr) ;\n    nouvelles commandes `/isoler id minutes motif`, `/liberer id`, `/reanimer id` (`Admin.remote` : jail / unjail / revive).\n  - **Appli staff (web)** : boutons Isoler (minutes), Libérer, Réanimer ; même journal, mêmes sanctions publiques.\n  - **Site** : `CONFIG.slots = 48` (0 = valeur annoncée par le serveur), titre de mission « Rejoindre » retiré (gardé pour\n    Signatures), bandeau Weazel en direct (rumeur confirmée, quartier chaud, prochain rendez-vous, légende, fugitifs, lieux de\n    mémoire en tête du bandeau), SMS en jeu pendant la visite (Max, Weazel, Inconnu, LSPD ; une fois par session). Seul le\n    titre « recherché » reste en bas de page (demande utilisateur).\n  - **Site, fluidité et police** (V12.3b) : grain animé par `transform` (plus de repaint plein écran), aurora `blur(44px)` +\n    `will-change`, aurora et fenêtres de la skyline en pause quand l'accueil n'est plus à l'écran, étoiles dessinées avec un\n    halo pré-calculé (plus de `shadowBlur` par étoile et par image). Police des titres de mission : Pricedown si déposée dans\n    `docs/site/fonts/` (`pricedown.woff2` / `.ttf`), sinon **Bowlby One** (Google Fonts, préchargée), sinon Anton.\n  - **Audit statique de la base** (script de session, lecture seule, 341 fichiers Lua, 66 ressources) : événements déclenchés\n    sans récepteur, callbacks jamais enregistrés, exports absents ou appelés du mauvais côté, `Bridge:` / `Security:`\n    inexistants, commandes et touches en double, fonctions globales définies deux fois, objets inconnus, fichiers hors\n    fxmanifest, `Config.*` non définis, tables par joueur sans nettoyage, natives client en serveur et inversement,\n    `%d` sur division. **Résultat : 0 bug, 0
