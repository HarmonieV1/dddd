## Profil DEV : petit, caché, verbeux. Sert aussi à valider le durcissement avant la prod.
sv_maxclients 16                                # backtest : jusqu à 16 testeurs (caché de la liste)
sv_master1 ""                                   # caché de la liste publique FiveM
set mysql_ui true                               # interface de debug oxmysql

## Durcissement anti-triche [À VALIDER par TEST en dev, puis copier dans prod.cfg]
## Noms et valeurs à confirmer sur docs.fivem.net (server-manual/server-commands).
set sv_entityLockdown "relaxed"                 # bloque les entités créées hors script par les clients
set sv_filterRequestControl 2                   # limite les prises de contrôle d'entités par les clients
set sv_enableNetworkedSounds false              # sons réseau (souvent abusés)
set sv_enableNetworkedPhoneExplosions false     # explosions à distance via téléphone
