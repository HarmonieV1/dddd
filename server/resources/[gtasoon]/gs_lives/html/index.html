<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lives</title>
<style>
  /* gs_lives · V12.60 (V12.62 : grille, TP, replay) : panneau LIVES (liste) + fenêtres d'écran déplaçables / redimensionnables / fermables. Couleurs du site. */
  :root { --bg: rgba(16, 10, 28, .94); --line: #6d3bd8; --accent: #b048ff; --txt: #ece6ff; --muted: #9a8fb8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: Segoe UI, Arial, sans-serif; color: var(--txt); user-select: none; }
  #panel { position: absolute; left: 12px; top: 70px; width: 300px; max-height: calc(100% - 140px); display: none; flex-direction: column;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  body.focus #panel { display: flex; }
  #panel header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
  #panel header button, .win .bar button, #panel .tools button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
  #panel header button:hover, .win .bar button:hover { color: #fff; }
  #search { margin: 0 12px 6px; padding: 7px 9px; border-radius: 6px; border: 1px solid #3a2a5c; background: #120c20; color: var(--txt); outline: none; }
  #panel .tools { display: flex; justify-content: space-between; padding: 0 12px 6px; font-size: 11px; color: var(--muted); }
  #list { overflow-y: auto; padding: 0 6px 8px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; }
  .row:hover { background: rgba(176, 72, 255, .12); }
  .row .av { width: 26px; height: 26px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .row .nm { flex: 1; min-width: 0; }
  .row .nm b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm small { color: var(--muted); font-size: 11px; }
  .row .watch { border: 1px solid #3a2a5c; border-radius: 5px; padding: 3px 8px; font-size: 11px; background: none; color: var(--muted); cursor: pointer; }
  .row .watch.on { border-color: #5aff8c; color: #5aff8c; }
  .row .replay { border: 1px solid #ffb020; color: #ffb020; border-radius: 5px; padding: 3px 6px; font-size: 11px; background: none; cursor: pointer; }
  .row .tk { color: #ffb020; font-size: 10px; margin-left: 4px; }
  .win.rp { border-color: #ffb020; }
  .win.rp .bar .dot { background: #ffb020; animation: none; }
  .win { position: absolute; width: 480px; height: 300px; min-width: 240px; min-height: 160px; background: #000; border: 2px solid var(--line); border-radius: 6px;
    overflow: hidden; resize: both; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  body:not(.focus) .win { pointer-events: none; resize: none; opacity: .92; }
  .win .bar { position: absolute; inset: 0 0 auto 0; height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 12px;
    background: linear-gradient(180deg, rgba(16,10,28,.95), rgba(16,10,28,.6)); cursor: move; z-index: 2; }
  .win .bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff2340; animation: blink 1.2s steps(1) infinite; }
  .win .bar .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win .bar .fps { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; } /* V12.64 : images par seconde */
  .win img { width: 100%; height: 100%; object-fit: contain; display: block; background: #08050f; } /* V12.63 : écran entier, pas rogné */
  .win .wait { position: absolute; inset: 26px 0 0 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  @keyframes blink { 50% { opacity: .2; } }
</style>
</head>
<body>
<div id="panel">
  <header><span>◉ LIVES</span><span><button id="grid" title="Ranger les fenêtres en grille">▦</button> <button id="refresh" title="Actualiser">⟳</button> <button id="release" title="Jouer (les fenêtres restent)">✕</button></span></header>
  <input id="search" placeholder="Rechercher un joueur (nom ou ID)" autocomplete="off">
  <div class="tools"><span id="count">0 joueur</span><span id="slots"></span></div>
  <div id="list"></div>
</div>
<script>
  const RES = (window.GetParentResourceName && GetParentResourceName()) || 'gs_lives';
  const post = (name, data) => fetch(`https://${RES}/${name}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data || {}) }).catch(() => {});
  let players = [], max = 4, every = 400, z = 10;
  const wins = new Map(); // id → { el, img, pending, timer }
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function render() {
    const q = $('#search').value.trim().toLowerCase();
    const list = players.filter((p) => !q || p.name.toLowerCase().includes(q) || String(p.id) === q || (p.account || '').toLowerCase().includes(q));
    $('#count').textContent = `${players.length} joueur${players.length > 1 ? 's' : ''}`;
    $('#slots').textContent = `${wins.size} / ${max} fenêtres`;
    $('#list').innerHTML = list.map((p) => `<div class="row"><div class="av">${esc((p.name[0] || '?').toUpperCase())}</div>
      <div class="nm"><b>${esc(p.name)}</b><small>#${p.id}${p.account ? ' · ' + esc(p.account) : ''}${p.ticket ? `<span class="tk">ticket #${Number(p.ticket)}</span>` : ''}</small></div>
      ${p.replay ? `<button class="replay" data-id="${p.id}" title="Revoir les 30 dernières secondes">⏪</button>` : ''}
      <button class="watch ${wins.has(p.id) ? 'on' : ''}" data-id="${p.id}">${wins.has(p.id) ? 'LIVE' : 'WATCH'}</button></div>`).join('');
  }

  function ask(id) { const w = wins.get(id); if (!w || w.pending) return; w.pending = true; w.askedAt = Date.now(); post('frame', { id }); setTimeout(() => { if (wins.get(id)) wins.get(id).pending = false; }, 8000); }

  function openWin(p) {
    if (wins.has(p.id)) return closeWin(p.id);
    if (wins.size >= max) return;
    const el = document.createElement('div');
    el.className = 'win';
    const n = wins.size;
    el.style.left = (330 + (n % 2) * 500) + 'px'; el.style.top = (70 + Math.floor(n / 2) * 320) + 'px'; el.style.zIndex = ++z;
    el.innerHTML = `<div class="bar"><i class="dot"></i><span class="t">${esc(p.name)} · #${p.id}</span><small class="fps"></small><button class="tp" title="Me téléporter près de lui">⇢ TP</button><button class="x" title="Fermer">✕</button></div><div class="wait">Connexion à l'écran…</div><img alt="">`;
    document.body.appendChild(el);
    const w = { el, img: el.querySelector('img'), pending: false, fps: el.querySelector('.fps'), times: [] };
    w.timer = setInterval(() => ask(p.id), every);
    wins.set(p.id, w);
    el.querySelector('.x').onclick = () => closeWin(p.id);
    el.querySelector('.tp').onclick = () => post('tp', { id: p.id }); // V12.62 : action « goto » de gs_admin
    el.addEventListener('mousedown', () => { el.style.zIndex = ++z; });
    drag(el, el.querySelector('.bar'));
    ask(p.id);
    post('windows', { n: wins.size }); render();
  }
  function closeWin(id) {
    const w = wins.get(id); if (!w) return;
    clearInterval(w.timer); w.el.remove(); wins.delete(id);
    post('close', { id }); post('windows', { n: wins.size }); render();
  }
  function drag(el, handle) {
    handle.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
      const move = (m) => { el.style.left = Math.max(0, m.clientX - sx) + 'px'; el.style.top = Math.max(0, m.clientY - sy) + 'px'; };
      const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
    });
  }

  // V12.62 · Grille (proposition n° 136) : toutes les fenêtres (lives et replays) rangées à droite de la liste, 2 colonnes
  function grid() {
    const all = [...document.querySelectorAll('.win')]; if (!all.length) return;
    const x0 = 330, y0 = 70, W = window.innerWidth - x0 - 12, H = window.innerHeight - y0 - 12;
    const cols = all.length === 1 ? 1 : 2, rows = Math.ceil(all.length / cols), w = Math.floor(W / cols) - 8, h = Math.floor(H / rows) - 8;
    all.forEach((el, i) => { el.style.left = (x0 + (i % cols) * (w + 8)) + 'px'; el.style.top = (y0 + Math.floor(i / cols) * (h + 8)) + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px'; });
  }
  // V12.62 · Replay (proposition n° 137) : les dernières images gardées par le serveur, rejouées en boucle dans une fenêtre
  const replays = new Map();
  function openReplay(id, frames, step) {
    if (!Array.isArray(frames) || !frames.length) return;
    if (replays.has(id)) replays.get(id).close();
    const p = players.find((x) => x.id === id) || { name: 'Joueur', id };
    const el = document.createElement('div');
    el.className = 'win rp'; el.style.left = '360px'; el.style.top = '100px'; el.style.zIndex = ++z;
    el.innerHTML = `<div class="bar"><i class="dot"></i><span class="t">⏪ REPLAY · ${esc(p.name)} · #${id} · <b class="n"></b></span><button class="x" title="Fermer">✕</button></div><img alt="">`;
    document.body.appendChild(el);
    const img = el.querySelector('img'), n = el.querySelector('.n');
    const ok = frames.filter((f) => typeof f === 'string' && f.startsWith('data:image/'));
    let i = 0;
    const show = () => { if (!ok.length) return; img.src = ok[i]; n.textContent = `${i + 1}/${ok.length}`; i = (i + 1) % ok.length; };
    const timer = setInterval(show, Math.max(250, Number(step) || 1500)); show();
    const r = { close: () => { clearInterval(timer); el.remove(); replays.delete(id); } };
    replays.set(id, r);
    el.querySelector('.x').onclick = r.close;
    el.addEventListener('mousedown', () => { el.style.zIndex = ++z; });
    drag(el, el.querySelector('.bar'));
  }

  $('#list').addEventListener('click', (e) => {
    const rp = e.target.closest('.replay'); if (rp) return post('replay', { id: Number(rp.dataset.id) });
    const b = e.target.closest('.watch'); if (!b) return; const p = players.find((x) => x.id === Number(b.dataset.id)); if (p) openWin(p);
  });
  $('#grid').onclick = grid;
  $('#search').addEventListener('input', render);
  $('#release').onclick = () => post('release');
  $('#refresh').onclick = () => post('refresh');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') post('release'); });

  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.action === 'players') { players = d.players || []; max = d.max || 4; every = Math.max(250, d.every || 400); render(); }
    else if (d.action === 'focus') { document.body.classList.toggle('focus', !!d.on); if (d.on) $('#search').focus(); }
    else if (d.action === 'replay') openReplay(d.id, d.frames, d.every);
    else if (d.action === 'frameError') { // V12.63 : message clair au lieu d'une attente sans fin
      const w = wins.get(d.id); if (!w) return;
      w.pending = false;
      const wait = w.el.querySelector('.wait'); if (wait) wait.textContent = d.text || 'Pas d\'image pour le moment, nouvel essai…';
    }
    else if (d.action === 'frame') {
      const w = wins.get(d.id); if (!w) return;
      w.pending = false;
      if (typeof d.src === 'string' && d.src.startsWith('data:image/')) {
        // V12.63 : image décodée AVANT d'être affichée (plus de scintillement ni d'image à moitié dessinée), puis la suivante
        // est demandée tout de suite si l'intervalle est déjà passé (plus de temps mort entre deux images)
        const next = new Image();
        next.onload = () => {
          const cur = wins.get(d.id); if (!cur) return;
          cur.img.src = next.src;
          const wait = cur.el.querySelector('.wait'); if (wait) wait.remove();
          // V12.64 : image suivante demandée TOUT DE SUITE (le serveur la prépare déjà : flux continu), compteur d'images/s
          const now = Date.now();
          cur.times.push(now); while (cur.times.length > 6) cur.times.shift();
          if (cur.times.length > 1) cur.fps.textContent = `${((cur.times.length - 1) * 1000 / (now - cur.times[0])).toFixed(1).replace('.', ',')} img/s`;
          ask(d.id);
        };
        next.src = d.src;
      }
    }
  });
</script>
</body>
</html>
