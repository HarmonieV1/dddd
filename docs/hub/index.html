tés"}, {"key": "PHOTOS", "title": "Photos et captures"}]}, {"name": "Technique", "desc": "Serveur, installation, hébergement", "items": [{"key": "INSTALL", "title": "Installation"}, {"key": "OVH", "title": "VPS OVH"}, {"key": "PERFORMANCE", "title": "Performance"}, {"key": "ARCHITECTURE", "title": "Architecture"}, {"key": "V1_RESOURCES", "title": "Ressources V1"}, {"key": "AGENTS", "title": "Règles pour les agents (Claude)"}, {"key": "PROMPT_REPRISE", "title": "Reprendre dans une autre session (Claude)"}, {"key": "AUDIT_V12_35", "title": "Audit global (12/10)"}]}, {"name": "Autres", "desc": "Documents pas encore classés", "items": [{"key": "APPLI_STAFF", "title": "Appli Staff"}, {"key": "ETAT_DES_LIEUX_16-10", "title": "Etat Des Lieux 16-10"}, {"key": "GITHUB", "title": "Github"}, {"key": "PATCH_SESSION_14-10", "title": "Patch Session 14-10"}, {"key": "PATCH_SESSION_15-10", "title": "Patch Session 15-10"}, {"key": "TEST_DE_CHARGE", "title": "Test De Charge"}]}], "docs": {"GUIDE_JOUEUR": "**SOMMAIRE**\n\n# Bienvenue à Los Santos\n\nCe guide te dit **explicitement** ce qu'il y a sur le serveur et comment le faire, comme un tuto : tu cherches une activité, tu regardes ce qu'il faut (outil, permis, argent, horaire), où aller, et ce que ça rapporte. Les prix sont ceux **de base** : l'économie de RoadLine est vivante, ils montent quand tout le monde achète la même chose et redescendent quand ça se calme.\n\n|  | Chapitre | Ce que tu y trouves |\n|---|---|---|\n| 1 | Premiers pas | Arrivée, papiers, permis (acquis pour tous), téléphone, touches, commandes |\n| 2 | L'argent | Banque, salaires, économie vivante, réputation, remises |\n| 3 | Véhicules | Concession, crédit, essais, assurance, tuning, location, fourrière (catalogue complet en annexe) |\n| 4 | Métiers libres | Routier, bus, taxi, livreur, éboueur : sans entretien, payés à la course |\n| 5 | Métiers sous contrat | Police, shérif, EMS, mécano, concession, immobilier, presse, bars, justice… |\n| 6 | Récolte | Pêche, mine, bûcheron, ferraille, ferme, chasse : outils, lieux, butin, revente |\n| 7 | Recettes et fabrication | Cocktails, munitions artisanales, transformation, plantations |\n| 8 | Commerces | Supérettes, cavistes, quincailleries, pharmacies, Ammu-Nation, marchés de nuit |\n| 9 | Activités et loisirs | Petits boulots, quêtes, défis, courses, road trips, casino, combats, logement |\n| 10 | Le côté obscur | Marché noir, drogue, braquages, duo, contrebande, gangs, blanchiment |\n| 11 | Justice et police | Comment la police te trouve, amendes, garde à vue, procès, jurés, prison |\n| 12 | Une ville qui vit sans toi | Quartiers, black-out, rumeurs, Gazette, faits divers, nuit, événements |\n| A | Annexe · catalogue | Tous les véhicules en vente, avec leur prix |\n\n\n### Les règles d'or\n- **Roleplay avant tout** : un personnage crédible, pas de tuerie gratuite (freekill), pas d'infos hors jeu (metagaming).\n- **Valeur de la vie** : sous la menace d'une arme, ton personnage obéit.\n- **Zones calmes** : pas de crime à l'hôpital, au commissariat, à la mairie ni au Pôle Emploi.\n- **Zéro pay-to-win** : la boutique ne vend que du style. Tout le reste se gagne en jouant.\n- Un souci ? **/report** en jeu : le staff le reçoit tout de suite. Un joueur en cause ? Commence par son numéro : **/report 12 il me fonce dessus**. Tant que le ticket est ouvert, le staff peut revoir les 30 dernières secondes de ton écran et du sien (modération, rien n'est gardé après).\n\n**CHAPITRE 1**\n\n# Premiers pas\n\nTu arrives en ville **en bus**, à l'arrêt de la mairie (un seul personnage par joueur), sans voiture mais **avec ton permis de conduire** : tout le monde l'a. **Pas de téléphone à l'arrivée** : il s'achète à la supérette. En une heure de jeu, tu peux avoir tes papiers, une voiture de location, un premier boulot et ton téléphone. Suis Max « le Guide » : il t'attend devant la mairie.\n\n### Ton premier jour (quête de Max)\n\n**1.** Parle à **Max « le Guide » Delgado** devant la mairie (Rockford Hills).\n\n**2.** **Mairie** : papiers et état civil.\n\n**3.** **Location** (à côté de la mairie) : loue un véhicule pour la suite.\n\n**4.** **Banque Fleeca de Legion Square** : viens-y en voiture et ouvre ton compte. Les distributeurs sont partout en ville.\n\n**5.** **Pôle Emploi** (centre-ville, près de Legion Square) : choisis un premier boulot (F6).\n\n**6.** **Supérette de Strawberry** : achète ton **téléphone** au comptoir (puis F1).\n\n**7.** Reviens voir Max : **300 XP et 500 $**.\n\n> **Astuce** · L'arrivée en bus ne se joue qu'une fois par personnage (Espace pour la passer). À la descente, le GPS est déjà tracé vers Max. Pas de voiture ? La **location de la mairie**, à deux pas de Max, prête vélos et scooters pour quelques dollars (chapitre 3).\n\n### Cabines téléphoniques et cimetière (V12.60)\n- **Cabines** (Alt sur une cabine ou un téléphone mural, 1 $) : appel anonyme à la police, tuyau à Weazel News, ou appel vers un numéro (il voit « Numéro masqué »). X pour raccrocher. Attention : la police peut mettre une cabine **sur écoute**.\n- **Cimetière** (blip, Hill Valley) : chaque mort RP y laisse une tombe et une épitaphe. Alt sur une tombe : la lire, ou déposer des fleurs (25 $).\n- **Les traces** : après une fusillade, sang et douilles restent au sol ; après un braquage, des barrières de police. Tout s'efface en 24 h. Photographiées (appareil photo argentique), elles deviennent une **scène de crime** que la police verse au dossier (V12.62).\n- **Grosse cavale** (3 étoiles de la police IA) : un hélicoptère te suit, projecteur la nuit, et le site annonce la poursuite « en direct » (le quartier, jamais ton nom).\n\n### Nouveautés de la ville (V12.63)\n- **Mur des légendes** devant le commissariat de Mission Row : les noms de ceux qui ont tenu une cavale. Le dernier est écrit au-dessus du mur.\n- **Avis de recherche** : pendant une cavale, une affiche est aussi collée là où elle a commencé. L'arracher coûte 300 $ d'amende (gratuit pour la police) ; elle est recollée 30 min plus tard.\n- **Figure du coin** : tes missions, achats et ventes dans un quartier y font monter ta cote. Au-delà d'un seuil, les habitants te saluent et les commerces du quartier te font 5 % de remise.\n- **Avis du commerçant** : un commerce braqué filmé par sa caméra affiche 24 h un avis avec une image floue du braqueur (deux détails de sa tenue, jamais son nom).\n- **Fausse alerte** : un faux appel à la police depuis une cabine peut coûter 2 500 $ si l'appel est retrouvé (cabine sur écoute ou filmée).\n- **Gangs : trêve** (menu Gang → Trêves, cadres) : 48 h sans guerre entre deux gangs. Mettre l'un des leurs à terre la rompt, et la réputation du gang fautif s'effondre dans toute la ville.\n- **Gestes** (Alt sur l'objet) : lavabo (mains, visage), douche, fontaine (boire), et dans la mer : E pour se rincer. Le sang et la saleté partent. Les secours peuvent nettoyer tes plaies.\n- **Hommage** (gangs) : avec une bombe de peinture, choisis « Un hommage » pour peindre « R.I.P. » et le nom d'un membre disparu, aux couleurs du gang. 24 h, ou pour toujours (1 000 $ de la caisse du gang).\n- **Voisins vigilants** : **/voisins** dans ton quartier (hors gang). Tu es prévenu des délits qui y sont signalés, et plus vous êtes nombreux, plus le calme revient vite.\n- **Alcootest** : la nuit, quand aucun policier n'est en service, le shérif peut tenir un barrage sur la route. Positif (deux verres ou plus) : amende et points de permis. Ne bois pas si tu conduis.\n- **North Yankton** : un jour sur deux, le vol de l'aéroport (LSIA) ne va pas à Cayo Perico mais dans la ville enneigée du prologue de GTA V. Le comptoir (et le site, « En ce moment en ville ») indique la destination du jour ; retour quand tu veux au comptoir d'arrivée.\n- **Sur place à North Yankton** : location de 4x4 enneigés, café de Ludendorff, et personne ne te connaît : ta recherche retombe plus vite. GTA n'a pas de grande carte de North Yankton (Échap) : la minimap suffit.\n- **Vols** : l'avion se pose sur la piste, et tu sors devant le pilote du comptoir.\n- **Métier : animalerie** (Pôle Emploi) : remplis les gamelles avec un carton de la réserve, nettoie les cages, toilette les chiens et sers les clients au comptoir. Payé à chaque tâche.\n- **Photomaton** à la fête foraine (à côté du guichet des jetons) : une photo souvenir pour 3 jetons ; serrez-vous dans la cabine, chacun repart avec sa copie (à regarder ou accrocher au mur).\n\n### Le permis de conduire\n\n| Étape | Prix | Comment |\n|---|---|---|\n| Obtention | Gratuit | Tout le monde a son permis dès l'arrivée : la carte **Permis de conduire** est dans ton sac (F2). Pas d'auto-école, ni code ni examen. |\n| Retrait | Police | Pas de points : une infraction grave et la police te **retire le permis** (carte reprise, motif au casier). Seule la police peut te le rendre. |\n| Vérifier | /permis | Te dit si ton permis est valide ou retiré. |\n\n\n### Les touches\n\n| Touche | À quoi ça sert |\n|---|---|\n| F1 | Téléphone : Que faire ?, messages, banque, factures, Vibe, Weazel, boulots, plans, ville… |\n| F2 · TAB · 1 à 5 | Inventaire · barre rapide (double-clic = utiliser) |\n| F3 | Progression : niveau, quêtes, défis du jour, badges |\n| F5 · X | Animations (emotes) · annuler · Pavé num. 1 à 5 : tes emotes rapides (F5 → Raccourcis) |\n| M | Tomber au sol (ragdoll) · rappuie pour te relever |\n| F6 | Métiers : prise de service (aussi par téléphone, de n'importe où, ou /service), tenue, factures, missions, direction |\n| F7 · F9 | Duo criminel · Gang |\n| W (clavier français) | Menu rapide : tenue, accessoires, radio, véhicule, factures |\n| Alt (appui simple) | Interagir avec ce que tu regardes (PNJ, portes, véhicules, objets) |\n| E | Action sur un point [E] |\n| N · ² | Parler · portée de la voix (chuchoter, normal, crier) |\n| H · L · B | Mains en l'air · verrouiller le véhicule · ceinture |\n| Crochet / fils | Mini-jeu : quand le curseur passe dans la zone claire, appuie sur la touche CHIFFRE affichée (1, 2, 3 ou 4) ; 3 à 4 fois de suite, rater = recommencer |\n| U | Garde-robe : ton personnage en grand, retirer / enfiler chaque vêtement (objets du sac) |\n| I | Aide des touches en jeu |\n\n\n### Les commandes utiles\n\n| Commande | Ce qu'elle fait |\n|---|---|\n| /quefaire | Tout ce qui se passe maintenant en ville, avec le GPS (aussi dans le téléphone) |\n| C ou /vue | Vue d'ensemble : la caméra tourne autour de ton personnage, qui reste immobile (molette : distance ; rappuie pour quitter) |\n| /rdv | Le programme des rendez-vous de la semaine |\n| /factures | Payer tes factures et amendes |\n| /recap · /reputation | Ton récap du mois · tes trois réputations |\n| /quartiers | L'ambiance de chaque quartier |\n| /gazette | La Gazette de la semaine |\n| /histoire | Au volant : l'historique public de la voiture (avant d'acheter une occasion) |\n| /rumeurs · /legendes | Ce qui se raconte · les légendes de Los Santos |\n| /mentor | Choisir un parrain (nouveaux joueurs) |\n| /droits | En garde à vue : avocat, silence, aveux, dénoncer un gang (témoin protégé) |\n| /porter | Porter un carton, une caisse, une pizza… (aussi W → Moi → Porter) |\n| /permis | Ton permis est-il valide ? |\n| /retoucheperso | Retoucher ton apparence une fois après la création (visage, coiffure) |\n| /garderobe · /tenue | Ouvrir la garde-robe (U) · plier ta tenue en objet Tenue |\n| /jury | Rouvrir ta convocation de juré |\n| /report | Prévenir le staff (/report 12 … : nommer le joueur n° 12) |\n\n\n### Secours et urgences\n\n| Situation | Ce que tu fais |\n|---|---|\n| Tu es à terre | **[G]** : « Demander de l'aide » si un ambulancier est en service (il reçoit ta position), sinon « Appeler les secours » : un secouriste arrive et te réanime (payant). |\n| Tu es mort | Maintiens **[E]** 2 secondes : tu te réveilles à l'hôpital le plus proche (500 $, gratuit si tu n'as rien). |\n| Témoin d'un accident ou d'un crime | Téléphone → appli **Urgences** : police, ambulance ou dépanneuse, avec ta position. |\n| Menotté ou à terre | Le téléphone est bloqué : c'est voulu (pas d'appel à l'aide en pleine arrestation). /911p est réservé au staff. |\n\n\n### Le Discord RoadLine\n- **/aide** (ou /help) : toutes les commandes du bot · **/ip** : l'adresse du serveur et la commande à taper dans F8.\n- **/ticket sujet** : ouvre un fil privé avec le staff (une question, un remboursement, une plainte) ; /fermer quand c'est réglé.\n- Annonces, statut du serveur en direct, résumé de la nuit à 23 h 30 et Gazette du dimanche sont publiés automatiquement.\n\n**CHAPITRE 2**\n\n# L'argent\n\nTrois poches : le **liquide** (dans l'inventaire), la **banque** (carte, téléphone) et l'**argent sale** (un objet, issu du crime). La police peut saisir l'argent sale ; il se blanchit ou se dépense au marché noir.\n\n| Où | Plafond | Remarque |\n|---|---|---|\n| Distributeur | 5 000 $ par retrait · 15 000 $ par jour | Partout en ville |\n| Guichet de banque | 100 000 $ par opération · 250 000 $ par jour | Fleeca (Legion Square, Hawick, Burton, Rockford Plaza, Chumash, Route 68, Sandy Shores), Pacific Standard, Blaine County (Paleto) |\n| Téléphone (Banque) | virements jusqu'à 1 000 000 $ | Entre joueurs, avec historique |\n\n\n### Comment on gagne sa vie\n- **Salaire** : versé **toutes les 15 minutes** si tu es en service (et que tu bouges : pas de paie pour un joueur AFK).\n- **Allocation** : 50 $ par paie pour les sans-emploi.\n- **Missions** (métiers libres) : payées à l'étape et au kilomètre, plus un bonus de fin.\n- **Niveau** : chaque niveau gagné rapporte 150 $ × le niveau atteint (niveau 10 = 1 500 $), jusqu'au niveau 50.\n- **Connexion quotidienne** : 50 XP par jour d'affilée (jusqu'à 7), et 1 000 $ par semaine complète.\n\n### L'économie vivante\n\nChaque achat fait monter le prix d'un produit, chaque revente le fait baisser, et le marché revient doucement à l'équilibre (toutes les 10 min). La météo s'en mêle : pendant une **canicule**, l'eau coûte jusqu'à 60 % de plus ; pendant une **tempête**, les kits de réparation et les bandages s'envolent. L'appli **Bourse** du téléphone suit l'indice des prix, le carburant, les métaux, l'immobilier et la richesse de la ville.\n\n### La réputation (trois jauges de 0 à 1 000)\n\n| Jauge | Comment elle monte | Ce qu'elle t'apporte |\n|---|---|---|\n| Légale | Missions (+5), quêtes (+10), récolte (+2), achats, locations, reventes | Remise en magasin : 3 % (300), 6 % (600), 10 % (900). Les vendeurs te saluent par ton prénom dès 300. |\n| Rue | Ventes discrètes (+3), braquages (+10), courses (+5) | Drogue mieux payée : +5 % (300), +10 % (600), +15 % (900). Accès au marché noir dès 15. |\n| Média | +1 par like reçu sur Vibe | Badge influenceur (25 abonnés), visage connu… les témoins te reconnaissent plus vite ! |\n\n\nPaliers : Inconnu (0), Connu (100), Respecté (300), Réputé (600), Légende (900).\n\n> **Astuce** · **Les commerçants se souviennent** : achète dans le même magasin plusieurs jours différents et tu deviens un habitué (5 % de remise, jusqu'à 25 %). Un braqueur à visage découvert est reconnu et se fait refuser au comptoir pendant 48 h.\n\n**CHAPITRE 3**\n\n# Véhicules\n\nPas de voiture au départ : location, puis concession quand tu as les moyens (le permis, tu l'as déjà). Chaque voiture a son carnet (kilomètres, accidents, propriétaires) : on sait ce qu'on achète.\n\n| Boutique | Ce qu'on y trouve | Nombre de modèles |\n|---|---|---|\n| Premium Deluxe Motorsport (Pillbox Hill) | Vélos, compactes, berlines, coupés, muscle cars, sportives classiques, SUV, tout-terrain, vans, motos, la **salle Luxe** (sportives et supercars) et la catégorie **★ Imports RoadLine** (modèles exclusifs du serveur) | 557 + imports |\n| Marina (bateaux) | Jet-skis, semi-rigides, hors-bords, yachts, voilier, remorqueur | 12 |\n| Aéroport (avions et hélicoptères) | ULM, avions de tourisme, hydravions, jets d'affaires, hélicoptères civils | 31 |\n\n\n### Acheter une voiture, pas à pas\n\n**1.** Va à la concession. Regarde les modèles exposés ou ouvre le catalogue au comptoir (Alt).\n\n**2.** **Essai gratuit** : quelques minutes au volant, puis la voiture revient seule.\n\n**3.** Paie comptant (banque) ou à **crédit** : 10 % d'apport minimum, jusqu'à 24 échéances, au bureau des financements.\n\n**4.** La voiture arrive à ton nom avec ses clés, et une **clé dans ton sac** (double-clic près de la voiture : verrouiller ; la donner = prêter la voiture). Range-la dans un **parking public** (garages sur la carte).\n\n**5.** Un **vendeur de la concession** (joueur) peut te conseiller, faire une reprise ou une remise : c'est son métier.\n\n### Après l'achat\n\n| Service | Prix | Détail |\n|---|---|---|\n| Assurance Mors Mutual (Rockford Hills) | 4 % du prix par semaine | Entre 300 $ et 25 000 $. Assuré : fourrière à 25 % du tarif. Vol déclaré : 60 % du prix remboursé après 45 min d'enquête (assuré depuis 24 h, une fois toutes les 2 semaines). Fausse déclaration = remboursement + 50 % d'amende. |\n| Néons (LS Customs, Burton, aéroport, Beeker's Paleto) | 800 $ | 9 couleurs (Rose Vice, Cyan, Violet, Or sunset…) |\n| Plaque personnalisée | 2 500 $ | 2 à 8 caractères (pas de préfixe de service, pas d'insulte) |\n| Réparation | facture du mécano | Moteur et carrosserie (kit), pneus, remettre sur ses roues, nettoyage |\n| Kit de réparation · avancé | 250 $ · 900 $ | En quincaillerie : pour te dépanner seul |\n\n\n### Location\n\n| Véhicule | Prix | Durée |\n|---|---|---|\n| BMX | 15 $ | 30 min |\n| Vélo de ville | 20 $ | 45 min |\n| Scooter | 45 $ | 45 min |\n| Mini citadine (2 places) | 90 $ | 60 min |\n| Petite décapotable | 140 $ | 60 min |\n| Jet-ski (marinas) | 80 $ | 30 min |\n| Semi-rigide (marinas) | 150 $ | 45 min |\n| Hors-bord (marinas) | 260 $ | 45 min |\n\n\nPoints de location : mairie, Legion Square, Del Perro, Sandy Shores, Paleto Bay ; bateaux : marina de Los Santos et jetée de Cayo Perico. Rends le véhicule au comptoir avant la fin (alerte 5 min avant).\n\n### Fourrière et enchères\n\nVéhicule mal garé ou saisi : il part à la fourrière de Davis. **Chaque samedi à 21 h 30, pendant 30 minutes**, la fourrière vend aux enchères les véhicules abandonnés (mise de départ : 25 % du prix catalogue) et les saisies de la police. Surenchère : +5 % (50 $ minimum) ; la mise est bloquée sur ton compte. Les invendus reviennent à 80 % la semaine suivante.\n\n> **Astuce** · Avant d'acheter une occasion à un joueur : monte au volant et tape **/histoire**. Kilomètres, accidents, repeintures et anciens propriétaires s'affichent.\n\n### Aller à Cayo Perico\n\nVol régulier **gratuit** au comptoir de l'aéroport de Los Santos (LSIA), retour au comptoir de la piste de l'île. Ou en bateau (location à la jetée de Cayo).\n\n### Voiture volée : le registre des disparus\n- Déclare le vol à **Mors Mutual** (véhicule assuré depuis 24 h). Si elle n'est pas retrouvée en **48 h**, elle refait surface : à la casse, dans un garage louche, ou aux enchères de la fourrière du samedi. Une rumeur circule et tu reçois un tuyau.\n- Va la chercher : son **carnet** (kilomètres, accidents, propriétaires) est intact. Si tu reprends le volant, l'assurance récupère l'indemnité versée, **sans pénalité**. Rouler avec une voiture « volée » sans la déclarer retrouvée reste une fraude.\n\n**CHAPITRE 4**\n\n# Métiers libres\n\nSans entretien : tu prends le métier au **Pôle Emploi** (centre-ville), tu sors le véhicule de service au dépôt, tu prends ton service (F6) et tu enchaînes les missions. Tu peux cumuler **3 contrats** en même temps.\n\n| Métier | Dépôt | Véhicule | Mission | Paie |\n|---|---|---|---|---|\n| Routier | Port de Los Santos (Elysian) | Porteur | 2 étapes : charger, décharger | 150 $ à 250 $ par étape + 180 $/km + 150 $ de bonus |\n| Chauffeur de bus | Dépôt de bus (Mission Row) | Bus | 5 arrêts | 70 $ à 110 $ par arrêt + 40 $/km + 120 $ |\n| Taxi | Downtown Cab Co. (Mirror Park) | Taxi | Prendre et déposer un client | 140 $/km + 60 $ |\n| Livreur Post OP | Dépôt Post OP (port) | Fourgon | 3 colis chez les commerçants | 180 $ à 260 $ par colis + 100 $ |\n| Éboueur | Dépôt de la voirie (Strawberry) | Benne | 4 sacs : poubelle → benne ([E] ou Alt), payé au dépôt | 120 $ à 180 $ par sac + 80 $, au dépôt |\n\n- 20 secondes de pause entre deux missions ; le véhicule de service doit rester près de toi (40 m).\n- Chaque mission terminée : **25 XP** et +5 de réputation légale.\n- Le **mercredi de 21 h à 23 h** (Mercredi des métiers) : +25 % d'XP.\n- Taxi et dépanneuse : les clients joueurs peuvent t'appeler (/taxi, /depanneur) : tu vois la demande avec /commandes.\n\n> **Astuce** · Le taxi rapporte surtout sur les longues courses (140 $ du kilomètre) ; le livreur, sur les tournées rapides en ville.\n\n**CHAPITRE 5**\n\n# Métiers sous contrat\n\nCes métiers se décrochent auprès de la **direction** (joueurs) : candidature, entretien, embauche. Le salaire tombe toutes les 15 minutes en service ; la direction peut le régler de 0,5 à 2 fois la base et donner des primes.\n\n| Métier | Grades et salaire (par paie) | Ce que tu fais |\n|---|---|---|\n| LSPD (Mission Row) | Cadet 350 · Officier 450 · Sergent 550 · Lieutenant 650 · Capitaine 800 | Patrouilles, contrôles, enquêtes (preuves, labo), amendes jusqu'à 25 000 $, garde à vue, mandats, chien K9, radar, herses. |\n| Shérif du comté (Sandy Shores) | Adjoint stagiaire 350 → Shérif 800 | Le même travail que la LSPD, dans le comté. |\n| EMS (Pillbox) | Stagiaire 350 · Ambulancier 450 · Infirmier 550 · Médecin 650 · Chef 750 | Réanimer, soigner, factures de soins jusqu'à 5 000 $, interventions sur les faits divers. |\n| Mécano Benny's | Apprenti 250 · Mécanicien 350 · Chef d'atelier 450 · Patron 550 | Réparer, pneus, remorquage (dépanneuse, plateau), commandes par téléphone, factures jusqu'à 15 000 $, tuning complet. |\n| Concession PDM | Stagiaire 200 · Vendeur 300 · Chef des ventes 400 · Directeur 500 | Vendre, reprendre, faire essayer (factures jusqu'à 500 000 $). |\n| Dynasty 8 (immobilier) | Agent stagiaire 200 · Agent 300 · Directeur 450 | Créer et vendre ou louer des logements. |\n| Auto-école | Moniteur 250 · Directeur 400 | Leçons et stages de conduite en RP (le permis est acquis pour tous : seule la police le retire ou le rend). |\n| Cabinet d'avocats | Stagiaire 200 · Avocat 350 · Associé 500 | Défendre en garde à vue et au tribunal, honoraires jusqu'à 50 000 $. |\n| Tribunal | Juge 450 · Président 600 | Procès, verdicts, mandats, jurys de citoyens, litiges de contrats. |\n| Weazel News | Pigiste 150 · Journaliste 280 · Rédacteur en chef 450 | Articles (/journal : 400 $ à la rédaction par article), flash info, direct pendant les poursuites (150 $/min sur place). |\n| Bars : Tequi-la-la, Vanilla Unicorn, Bahama Mamas | Serveur 150 · Barman 220 · DJ / danse 260 · Gérant 350 à 400 | Préparer les cocktails (chapitre 7), encaisser, animer. Sans employé : libre-service PNJ. |\n| Mairie | Agent d'état civil 250 · Adjoint 400 · Maire 600 | Mariages, papiers, vie de la ville. |\n| Psychologue | Psychologue 250 · Psychiatre 400 | Séances (jusqu'à 5 000 $). |\n\n\nLes patrons (menu Direction) gèrent les embauches, les salaires, les primes et la caisse. Les commerces peuvent aussi **blanchir** de l'argent (chapitre 10)… à leurs risques.\n\n**CHAPITRE 6**\n\n# Récolte\n\nLibre, sans embauche : achète l'outil en **quincaillerie** (La Mesa ou Senora), va sur place, appuie sur [E] devant un arbre, un rocher, un tas ou un rang de légumes. Chaque point s'épuise après quelques récoltes et repousse en 5 minutes : bouge d'un point à l'autre. L'outil casse parfois (3 %).\n\n| Activité | Outil (prix) | Où | Ce que tu récoltes | Où revendre |\n|---|---|---|---|---|\n| Pêche | Canne à pêche (120 $) | Jetée de Del Perro, Chumash, Alamo Sea, Paleto | Poisson (1-2), parfois thon ou ferraille | Poissonnerie de Del Perro |\n| Mine | Pioche (180 $) | Carrière Davis Quartz (désert de Senora) | Pierre (2-4), minerai de fer (1-2), cuivre, pépite d'or (rare) | Ferrailleur de Cypress Flats |\n| Bûcheron | Hache (160 $) | Forêt de Paleto | Bûches (2-3) | Scierie de Paleto |\n| Ferraille | aucun | Rogers Salvage (La Puerta) et casse de Sandy Shores | Ferraille (2-4), cuivre (1-2) | Ferrailleur de Cypress Flats |\n| Ferme | aucun | Champs de Grapeseed | Tomates (2-4), pommes de terre (2-4) | Marché de Grapeseed |\n| Céréales | aucun | Champs de Grapeseed | Orge, houblon, maïs | Marché de Grapeseed |\n| Tabac | aucun | Plantation de Grapeseed | Feuilles de tabac | Marché de Grapeseed |\n| Chasse | Couteau de chasse (140 $) + fusil et permis | Forêts au sud de Paleto | Viande (2-4), cuir | Boucherie de Paleto |\n\n\n### Prix de revente (par unité)\n\n| Produit | Prix | Produit | Prix |\n|---|---|---|---|\n| Poisson | 25 $ à 40 $ | Ferraille | env. 12 $ (marché) |\n| Thon | 90 $ à 140 $ | Cuivre | env. 30 $ (marché) |\n| Bûche | 20 $ à 28 $ | Pierre | env. 8 $ (marché) |\n| Tomate | 6 $ à 9 $ | Minerai de fer | env. 34 $ (marché) |\n| Pomme de terre | 5 $ à 8 $ | Pépite d'or | env. 170 $ (marché) |\n| Viande | 40 $ à 60 $ | Cuir | 55 $ à 80 $ |\n\n\nLes métaux suivent le marché : si tout le monde revend du cuivre, son prix baisse (jusqu'à 30 % de sa valeur). Le ferrailleur est loin des casses exprès : prévois un véhicule.\n\n### La chasse, en détail\n\n**1.** Achète le **permis de chasse (750 $)** au comptoir de l'Ammu-Nation de Paleto.\n\n**2.** Achète le **mousquet** (1 500 $) et ses munitions (8 $) à l'Ammu-Nation, et un couteau de chasse.\n\n**3.** Va dans les forêts au sud de Paleto : cerfs et sangliers apparaissent autour de toi.\n\n**4.** Abats l'animal, approche-toi et dépèce-le au couteau (6 s).\n\n**5.** Revends à la boucherie de Paleto, ou garde la viande pour les restaurants des joueurs.\n\n> **Attention** · Dépecer sans permis, c'est du **braconnage** : un crime qui peut être signalé à la police.\n\n> **Astuce** · La récolte compte pour les **défis du jour** (« Pêche, mine, coupe du bois ou chasse 5 fois ») et donne de la réputation légale. Une tenue de travail est disponible au vestiaire de chaque activité.\n\n**CHAPITRE 7**\n\n# Recettes et fabrication\n\nTout ce qui se fabrique en ville, avec ce qu'il faut, où et combien de temps.\n\n### Cocktails (bars des joueurs)\n\nAu plan de travail du bar (employé en service). Les ingrédients sont dans la réserve du bar, achetés en supérette ou chez les cavistes.\n\n| Boisson | Ingrédients | Temps | Prix de vente (Tequi-la-la · Vanilla · Bahama) |\n|---|---|---|---|\n| Cocktail Vice | 1 vodka + 1 Sprunk | 5 s | 45 $ · 60 $ · 55 $ |\n| Whisky-cola | 1 whisky + 1 Sprunk | 4 s | 40 $ · 50 $ · 45 $ |\n| Bière (revendue telle quelle) | 1 bière achetée en gros | — | 15 $ · 18 $ · 16 $ |\n\n\nSans employé en service, un barman PNJ sert la carte de base (bière, Sprunk, eau) au prix fort. Le patron peut aussi laisser sa **doublure** (un PNJ à son image) tenir le comptoir : meilleure recette… mais elle peut être braquée.\n\n### Munitions artisanales (atelier des gangs)\n\nDans la planque du gang, à partir de la ferraille et du cuivre récoltés. Moins cher que le marché noir ; plafond de 600 cartouches par gang et par jour.\n\n| Munitions | Ferraille | Cuivre | Temps | Grade minimum |\n|---|---|---|---|---|\n| 9 mm (×20) | 6 | 2 | 15 s | Membre |\n| .45 (×20) | 7 | 3 | 15 s | Membre |\n| Cartouches (×10) | 6 | 2 | 15 s | Membre |\n| 5,56 (×30) | 12 | 5 | 25 s | Bras droit |\n\n\n### Transformation (drogue)\n\n| Produit | Récolte (où) | Transformation | Vente (par sachet) |\n|---|---|---|---|\n| Cannabis | Champ sauvage près de Grapeseed : 1 à 3 feuilles | 3 feuilles → 1 sachet (8 s), arrière-boutique de Sandy Shores | 70 $ à 120 $ |\n| Cocaïne | Serre de Grapeseed : 1 à 2 feuilles de coca | 4 feuilles → 1 sachet (12 s), dans un labo | 160 $ à 240 $ |\n\n\nLes gangs qui possèdent un **labo** produisent deux fois plus. Récolter au champ sauvage donne parfois une graine (30 %).\n\n### Plantations\n\n**1.** Achète une **graine** (150 $) au vendeur louche près du champ de Grapeseed, un **pot** (20 $) et de l'**engrais** (45 $) en quincaillerie.\n\n**2.** Plante dehors (pas en intérieur, pas sur la route) ; 6 plants au maximum.\n\n**3.** **Arrose** (une bouteille d'eau) : un arrosage tient 25 min ; sans eau pendant 30 min, le plant meurt.\n\n**4.** Il pousse en 45 min (3 stades visibles de tous), 1,5 fois plus vite avec engrais.\n\n**5.** Récolte : 8 à 12 feuilles et 1 ou 2 graines.\n\n> **Attention** · Tout le monde peut récolter un plant mûr (vol possible), et un policier en service qui le détruit touche une prime.\n\n**CHAPITRE 8**\n\n# Commerces\n\nLes vendeurs sont derrière le comptoir : approche-toi et appuie sur Alt. Prix de base ci-dessous ; ils bougent avec la demande.\n\n| Rayon | Articles (prix de base) |\n|---|---|\n| Supérettes (12 en ville et dans le comté) | Eau 5 · Sprunk 7 · café 6 · boisson énergisante 9 · burger 12 · sandwich 9 · chips 5 · donut 6 · bière 8 · vin 25 · cigarettes 15 · briquet 5 · bandage 40 · téléphone 450 · ticket à gratter 100 |\n| Cavistes Rob's Liquor (6) | Bière 8 · vin 25 · vodka 35 · whisky 45, et l'essentiel de la supérette |\n| Pharmacies (Pops Pills, hall de Pillbox) | Antidouleurs 60 · bandage 40 · eau · boisson énergisante |\n| Quincailleries (La Mesa, Senora) | Kit de réparation 250 · avancé 900 · kit de nettoyage 25 · gants 60 · javel 45 · appareil photo argentique 350 · jerrican 60 · bombe de peinture 40 · pot 20 · engrais 45 · canne à pêche 120 · pioche 180 · hache 160 · couteau de chasse 140 · crochet 150 · radio 300 · jumelles 150 · téléphone 450 |\n| Marchés de nuit (22 h-5 h) : Legion Square, jetée de Del Perro, Vinewood | Sandwich 35 · café 15 · donut 12 · chips 10 · énergisante 20 · bière 18 |\n| Vendeur ambulant (sur la route, hors de la ville) | Sandwich 20 · eau 8 · café 12 · bandage 90 · kit de réparation 320 · gants 80 |\n\n\n### Ammu-Nation (9 en ville et dans le comté)\n\n| Article | Prix | Il faut |\n|---|---|---|\n| Couteau · batte · lampe torche | 200 · 100 · 80 $ | rien |\n| Pistolet compact · pistolet | 1 800 · 2 500 $ | permis de port d'arme |\n| Fusil à pompe | 5 500 $ | permis de port d'arme |\n| Munitions 9 mm · .45 · cartouches (l'unité) | 6 · 7 · 12 $ | permis de port d'arme |\n| Lampe pour arme | 350 $ | permis de port d'arme |\n| Mousquet · munitions (l'unité) | 1 500 · 8 $ | permis de chasse |\n\n- **Permis de port d'arme : 5 000 $** au comptoir de n'importe quel Ammu-Nation. Il faut le permis de conduire et un casier propre (pas recherché, pas de crime récent). La police peut le retirer.\n- Plafond légal : **1 arme et 120 munitions par jour** et par personnage. Les armes du comptoir sont enregistrées à ton nom.\n- Stands de tir (Pillbox, Cypress Flats) : tu peux t'entraîner sans être signalé.\n\n### Vêtements, coiffeur, tatoueur\n\nBoutiques de vêtements, coiffeurs (menu de barbier : coupe, couleur, barbe, sourcils, maquillage — 150 $) et tatoueurs sont sur la carte. Une tenue achetée ou **enregistrée en boutique** devient un **objet Tenue** dans l'inventaire : tu t'habilles où tu veux (double-clic).\n\n### La garde-robe (touche U)\n- Ton personnage en grand au centre, tes vêtements tout autour : chapeau, lunettes, boucles d'oreilles, masque, collier, montre, bracelet, haut, t-shirt, gilet, sac, pantalon, chaussures. ← → pour le faire tourner, vues Corps / Visage / Jambes.\n- Clic sur une pièce portée : elle part dans ton sac en **objet Vêtement**. Clic sur un vêtement ou une tenue du sac : tu l'enfiles, la pièce remplacée revient dans le sac.\n- Les vêtements s'échangent, se donnent, se rangent dans un coffre comme n'importe quel objet (double-clic dans l'inventaire = l'enfiler).\n- Coiffure, visage et tatouages ne bougent jamais : c'est le coiffeur et le tatoueur.\n\n**CHAPITRE 9**\n\n# Activités et loisirs\n\nPas besoin de métier pour gagner de l'argent ou de l'XP : la ville propose toujours quelque chose. Le réflexe : **téléphone → Que faire ?**\n\n### Petits boulots (appli Boulots)\n\n| Boulot | Principe | Paie |\n|---|---|---|\n| Livraison express | Récupérer un colis en A, le livrer en B (au moins 700 m), avec ton propre véhicule | 80 $ + 110 $/km |\n| Passeur (illégal) | Même chose avec de la marchandise louche ; signalé à la police 1 fois sur 3 | 200 $ + 260 $/km, en argent sale |\n\n\n3 offres toutes les 5 min, 15 min pour finir. Les offres s'adaptent : tempête (×1,5), nuit (×1,25 pour les passeurs), événement (×1,3), quartier chaud (×1,6, plus risqué).\n\n### Quêtes, défis et progression (F3)\n\n| Quoi | Comment | Récompense |\n|---|---|---|\n| Ton premier jour | Max devant la mairie | 300 XP · 500 $ |\n| Big Sal (3 quêtes : pizza, recouvrement, le port) | Personnages masculins, après le premier jour | jusqu'à 500 XP · 1 000 $ · badge |\n| Mama Rosa (3 quêtes : look, ragots, nuit néon) | Personnages féminins, après le premier jour | jusqu'à 500 XP · 1 000 $ · badge |\n| La Voix au bout du fil | Niveau 3 : une cabine de Legion Square sonne… | 800 XP · 1 500 $ · badge |\n| Défis du jour | 3 défis tirés au sort chaque jour | 150 XP chacun ; les 3 : +300 XP, 500 $, 1 ticket à gratter |\n| Paquets cachés | 20 colis dans tout l'État, invisibles sur la carte | 50 XP chacun ; tous : 2 500 XP et 5 000 $ |\n| Saison (8 semaines) | L'XP gagnée remplit la piste de saison | Argent, tickets, titres (piste gratuite pour tous) |\n\n\nTitres par niveau : Nouveau venu, Habitué (3), Débrouillard (5), Figure locale (8), Pointure (12), Vétéran (18), Légende urbaine (25), Icône de Los Santos (35), Mythe (50).\n\n### Courses de rue\n\nL'**organisateur** attend à Legion Square. Trois circuits : Sprint centre-ville, Boucle des plages, Descente de Vinewood. Chrono solo gratuit, ou course à plusieurs : **500 $ de mise**, 90 % de la cagnotte redistribuée (70/30 à deux, 60/30/10 à trois et plus). Il prête une voiture identique à tous (Sultan, Futo, Elegy, Banshee) ou tu prends la tienne. Une course à plusieurs est signalée à la police 3 fois sur 10.\n\n### Road trips et rencontres de la route\n- **Carnets de route** : La côte Ouest (400 XP), Vinewood au coucher du soleil (350 XP), Le grand Nord de Blaine (500 XP). Étapes, anecdotes et spots photo. Titres : Routard, Explorateur, Globe-trotteur.\n- **Road trip du mois** : un carnet différent chaque mois ; le premier fini rapporte XP ×2 et 2 500 $, +25 % par équipier en convoi.\n- **Rencontres de la route** (hors de Los Santos, en roulant) : auto-stoppeur (150-450 $), voiture en panne (250-600 $), accident (300-700 $), animal blessé, portefeuille perdu (le rendre : 400-900 $), vendeur ambulant, contrôle du shérif. Certaines sont des pièges, surtout la nuit.\n\n### Casino Diamond\n- **Roue de la fortune** : 1 tour gratuit par jour. Lots de 750 $ à 25 000 $ (jackpot), XP, tickets, kits.\n- **Ticket à gratter** (100 $, supérettes) : jusqu'à 10 000 $ ; 10 tickets par jour au plus.\n- **Loto** : ticket à 100 $ à la caisse (10 par semaine), tirage le **dimanche à 20 h**, 3 gagnants (60/25/15 % de la cagnotte).\n- **Jetons de fête foraine** (V12.62) : une seule monnaie pour les jeux de la ville. 5 $ le jeton au guichet de la salle de jeu (Del Perro) ou à la caisse du casino, repris 4 $. Au casino, 10 jetons = 1 ticket à gratter. Les manèges installés (auto-tamponneuses…) s'échangent 1 jeton pour 1 ticket au guichet.\n\n### Combats clandestins\n\nUne adresse différente chaque jour, la nuit (21 h-5 h), que les barmans et les rumeurs laissent filer. Mises des combattants : 500, 1 000, 2 500 ou 5 000 $ ; les spectateurs parient (100 à 10 000 $) pendant 60 s. K.-O. ou sortie du ring = défaite ; la maison prend 10 %. Grande soirée le **samedi de 22 h à minuit**.\n\n### Se loger\n\n| Où | Prix | Détail |\n|---|---|---|\n| Motel Pink Cage (Vinewood) | 450 $ / semaine | Chambre, coffre (40 places), garde-robe ; jusqu'à 4 semaines d'avance |\n| Motor Motel (Sandy Shores) | 300 $ / semaine | Idem |\n| Dream View Motel (Paleto Bay) | 320 $ / semaine | Idem |\n| Appartements et maisons | selon le bien | Achat ou location auprès des agents Dynasty 8 |\n\n\n### Vie civile\n- **Mariage** à la mairie : 1 000 $ chacun (divorce : 2 500 $).\n- **Contrats signés** (face à face) : prêt d'argent, salaire privé, location. Le serveur prélève les échéances ; retard = +10 %, deux retards = litige devant un juge.\n- **Mentors** : dès le niveau 5, deviens parrain ; un nouveau qui reste 7 jours vous rapporte 2 500 $ (parrain) et 1 000 $ (filleul).\n- **Vibe** (réseau social) : un hashtag repris par 5 personnes déclenche un rassemblement en ville (150 XP) ; les photos à la golden hour (18-20 h) donnent 100 XP.\n- **Prison** : même là, on peut travailler (cour, laverie, cuisine) pour réduire sa peine et gagner des tickets de cantine.\n\n**CHAPITRE 10**\n\n# Le côté obscur\n\nLe crime paie… si personne ne le signale. À RoadLine, la police ne sait que ce que les témoins, les caméras et les preuves lui disent (chapitre 11). Tout ici rapporte de l'**argent sale**.\n\n> **Attention** · Respecte le règlement : une scène RP avant toute violence, jamais dans les zones calmes, et la valeur de la vie de ton personnage.\n\n### Le marché noir\n- **Accès** : membre d'un gang, ou réputation de rue ≥ 15.\n- **Quand** : la nuit seulement (20 h-6 h, heure du jeu). **Où** : le contact change de planque toutes les 2 heures (entrepôts, ruelles, casses…) : demande à la rue, ou par l'appli **Inconnu** du téléphone.\n- Payé en argent sale ; en liquide propre, c'est 40 % plus cher. Stock limité, réapprovisionné à 4 h ; plus il part, plus c'est cher. Une arme non déclarée par jour et par personne. -10 % si la planque est dans ton territoire.\n\n| Article | Prix de base | Article | Prix de base |\n|---|---|---|---|\n| Munitions 9 mm (×20) | 220 $ | Pistolet compact | 4 500 $ |\n| Munitions .45 (×20) | 260 $ | Pistolet | 6 000 $ |\n| Cartouches (×10) | 300 $ | Micro-SMG (gangs) | 18 000 $ |\n| Munitions 5,56 (×30) | 650 $ | Fusil à canon scié (gangs) | 14 000 $ |\n| Munitions 7,62 (×30) | 750 $ | Silencieux (pistolet) | 8 000 $ |\n| Crochet · avancé | 150 · 900 $ | Chargeur grande capacité | 3 000 $ |\n| Gilet pare-balles | 2 500 $ | Fausse plaque | 3 500 $ |\n\n\n### Vendre de la drogue\n- Vise un passant et propose (3 sachets maximum par vente), ou tape **/deal** à un coin de rue : les clients viennent à toi (un toutes les 20 à 40 s).\n- Refus 1 fois sur 4 (plus sous la pluie) ; **refus systématique** si un policier en service est à moins de 60 m.\n- Bonus : nuit (+15 %), ton territoire (+20 %), réputation de rue (jusqu'à +15 %). Malus : territoire rival (-15 %), quartier saturé (jusqu'à -45 % si tout le monde y vend).\n\n### Les braquages\n\n| Cible | Policiers en service | Butin | Pause entre deux |\n|---|---|---|---|\n| Supérettes (Strawberry, Grove, Mirror Park, Sandy) | 1 | 700 à 1 400 $ (Sandy : 800 à 1 600 $) | 30 min |\n| Bijouterie Vangelico (6 vitrines) | 3 | 900 à 1 500 $ par vitrine | 1 h |\n| Fleeca Legion Square (3 coffres) | 4 | 2 500 à 4 200 $ par coffre | 1 h 30 |\n| Gros coup en duo : Fleeca (pirate + conducteur) | 4 | 9 000 à 14 000 $, partagés 50/50 | 2 h |\n\n- **Comment** : aucun objet spécial. Une **arme en main** (Ammu-Nation avec le permis, ou marché noir), puis **Alt** (ciblage) sur la caisse, la vitrine ou le coffre → « Braquer la caisse » / « Briser la vitrine » / « Forcer le coffre ». Sans assez de policiers en service (colonne ci-dessus), le braquage est refusé.\n- Butin +15 % la nuit, +20 % pendant une tempête ou le brouillard, +15 % dans ton territoire.\n- **Braquage solo** : vise un caissier (supérette) ou un guichetier (6 agences Fleeca) : le braquage démarre seul. L'argent tombe en sacs sur le comptoir. Caisse : 280-650 $ ; guichet : 550-1 100 $ ; racket d'un passant : 25-140 $.\n- **La peur** : plus tu cries (²), plus la victime cède vite. Si tu baisses ton arme, elle s'enfuit et appelle la police.\n- Plafond : 6 braquages solo par heure, 5 000 $ par jour.\n- **Gros coup en duo** : le pirate coupe l'alarme au terminal (20 s, échec 15 %), le conducteur vide les deux coffres, puis fuite : 900 m en 4 min, ensemble.\n\n### Duo criminel (F7)\n\nDeux personnages se lient. Le lien progresse avec le temps passé ensemble et les contrats : Complices → Associés → Partenaires → Inséparables → Légendes (jusqu'à +30 % de paie, chaleur moins partagée). Contrats à deux : 900 à 1 400 $ chacun, les deux doivent être sur chaque étape (docks, hangar, entrepôt → Paleto, Grapeseed, Chumash).\n\n### Contrebande maritime\n\nLe contact du port de Paleto (21 h-5 h ; gangs ou réputation de rue ≥ 300) te confie une cargaison à repêcher en mer **en bateau** puis à décharger sur une plage, en 25 min : **3 500 à 5 500 $**. Au chargement, le radar côtier donne l'alerte une fois sur deux ; sans police joueur, les garde-côtes prennent le relais.\n\n### Les gangs (F9)\n- Les gangs sont créés par le staff. Six existent : Families (Grove Street), Ballas (Davis), Vagos (Rancho), Lost MC (East Vinewood), Cartel Madrazo et Triades (organisations).\n- Grades : Recrue, Membre, Bras droit (recrute), Chef (caisse). 25 membres au plus.\n- **Territoires** : présence, tags (bombe de peinture) et crimes font monter l'influence ; la police la fait baisser. Le gang qui tient un quartier touche **600 $ par heure**.\n- **Guerres** déclarées : 5 000 $, 10 min de préavis, 20 min de combat ; le vainqueur prend le quartier (et sa fresque).\n- **Racket** des commerces de joueurs : 500 à 5 000 $ par semaine ; refus = vitrine cassée.\n- **Receleur** : vente en gros la nuit (10 à 50 objets), +35 %, adresse qui change toutes les heures.\n- Atelier de munitions (chapitre 7), garage et flotte aux couleurs du gang.\n\n### Blanchir et brouiller les pistes\n- **Blanchiment** : par le menu Direction d'un commerce. 30 % de commission, délai de 30 min, plafond lié au chiffre d'affaires légal du jour, et un risque de contrôle fiscal.\n- **Fausse plaque** (marché noir) : la voiture n'est plus reliée à ses signalements pendant 45 min… mais un policier qui vérifie le numéro de châssis voit la fraude.\n- **Gants** (pas d'empreintes), **javel** (effacer des traces), changer de tenue ou repeindre la voiture : la ville oublie au bout de 2 h.\n- **Contrats** entre joueurs (/contrats) : vol, livraison, élimination (scène RP obligatoire)… récompense bloquée à la publication, 5 % de commission.\n\n### La cavale\n\nTrès recherché, tu peux entrer en **cavale** (/cavale) : avis de recherche placardés, prime pour qui te livre. Tiens 2 heures de jeu sans te faire prendre et tu deviens une **légende** de Los Santos (et peut-être une plaque).\n\n### Faux papiers\n- Au marché noir : fausse **carte d'identité**, faux **permis de conduire**, faux **permis de port d'arme**, chacun avec une identité inventée.\n- Double-clic pour le **présenter** (10 min) : les joueurs à côté voient le faux nom, et un contrôle de police **loin du commissariat** le croit.\n- Au **commissariat**, le scanner démasque tout : vraie identité, mention au casier, et le papier ne sert plus. Choisis où tu te fais contrôler.\n\n### Gangs : la guerre de l'information\n- F9 → Opérations (bras droit ou chef, payé par la caisse du gang) : **brouiller les caméras** du quartier 10 min (5 000 $), ou **pirater le scanner police** 10 min (8 000 $) : tous les membres en ligne entendent les signalements et les appels au 911.\n- Chaque opération laisse une **trace** : depuis l'ordinateur du commissariat, la police remonte jusqu'au gang après 5 minutes d'analyse.\n\n**CHAPITRE 11**\n\n# Justice et police\n\nComment la ville apprend un crime, et ce qui t'attend ensuite.\n\n### Comment la police te trouve\n- Un crime n'est connu que s'il est **signalé** : témoins (PNJ et joueurs à 40 m), caméras (10 lieux sensibles), policier à portée.\n- Les **coups de feu** et les coups d'arme blanche sont toujours signalés (rue et GPS, sans description). Un silencieux réduit le risque.\n- La nuit, le brouillard, la pluie et les **black-out** réduisent la visibilité.\n- Les témoins décrivent ce qu'ils ont vu : sexe, véhicule, masque, chapeau, sac, gilet, tatouages visibles. Jamais ton nom… sauf si tu es célèbre.\n- Les **preuves** restent sur place : douilles, sang, empreintes (sans gants), traces de pneus, éclats de peinture. La police les relève à la lampe et les analyse au labo.\n- Sans policier joueur en service, la **police IA** prend le relais (1 à 4 étoiles). Seul en ville ne veut pas dire tranquille : un crime sérieux (braquage, banque, bijouterie, explosion, sabotage) est signalé au moins **6 fois sur 10**, même sans témoin.\n- Les **vols de voiture** (serrure forcée, fils, conducteur sorti de force) arrivent au central comme les autres crimes.\n- Exceptions : un **chasseur avec permis** dans la zone de chasse ne déclenche pas d'alerte en tirant sur le gibier ; les stands de tir Ammu-Nation non plus.\n- Le **shérif** du comté reçoit les mêmes alertes que le LSPD.\n\n### Ce que risque un suspect\n\n| Étape | Ce qui se passe |\n|---|---|\n| Contrôle | Identité (contrôle visuel ; au commissariat, le scanner démasque les faux papiers), fouille, retrait de permis, amende (/factures). Refuser d'obtempérer est un délit. |\n| Témoin protégé | En garde à vue, /droits → **dénoncer un gang** : peine divisée par deux. Le gang apprend que « quelqu'un a parlé », jamais qui ; la police te protège 7 jours (lieu sûr sur le GPS). Si tu tombes pendant ce temps, le gang est dans le viseur. |\n| Garde à vue | Jusqu'à 30 min à Mission Row. /droits : avocat, silence, aveux (peine réduite de 30 %). |\n| Procès | Devant un juge, avec avocat. Pour un vrai procès, le juge peut convoquer un **jury de 5 citoyens** tirés au sort : le verdict suit leur vote (les jurés touchent 100 $). |\n| Prison | Bolingbroke, jusqu'à 60 min. Petits boulots pour réduire la peine, cantine payée en tickets, évasion possible la nuit, à plusieurs. |\n\n\n> **Astuce** · Témoin d'un crime ? Raconte-le à la police : à RoadLine, les joueurs aussi sont des témoins, et leur description compte.\n\n**CHAPITRE 12**\n\n# Une ville qui vit sans toi\n\nCe qu'on ne trouve nulle part ailleurs : la ville a une mémoire, une humeur et un emploi du temps.\n\n| Système | Ce que ça change pour toi |\n|---|---|\n| Quartiers | Chaque crime fait monter la tension d'un quartier : passants qui fuient, trafic, police IA plus présente. Un quartier propre et calme monte en standing ; sale et violent, il coule. Ramasser les déchets est payé par la mairie. |\n| Black-out | Saboter un transformateur (avec un crochet, 20 s) plonge tout un quartier dans le noir 15 min : lumières, néons et caméras coupés. N'importe qui peut le réparer, payé 300 à 500 $ par la mairie. |\n| Cicatrices | Mémorial là où quelqu'un est tombé, vitrine brisée après un braquage (un ouvrier la répare : 250 à 450 $), fresque du gang vainqueur. |\n| Lieux de mémoire | Un grand casse, une cavale légendaire, un mariage : une plaque reste 30 jours. [E] : un passant raconte. |\n| La mémoire des lieux | Chaque endroit accumule ce qui s'y est passé (crimes, arrestations, mariages, courses, braquages, guerres). Les **passants en parlent** quand tu passes, Radio Los Santos le rappelle, et une plaque naît toute seule au 10e événement. |\n| Les échos | La nuit, près d'un lieu chargé, des **silhouettes translucides** rejouent le passé quelques secondes : deux danseurs là où il y a eu un mariage, des guetteurs là où il y a eu un braquage… |\n| Rumeurs | Les barmans racontent ce qui s'est passé (250 $ pour le détail). Paie un verre (50 $) pour lancer un bruit : si 3 personnes répètent le même, il arrive (tempête, sac de billets caché, sale coup). |\n| Faits divers | Quand la ville est calme, elle a ses propres criminels : cambriolage, corps retrouvé, délit de fuite, vandalisme. Police, EMS et presse sont payés pour les traiter. |\n| Ville de nuit | De 22 h à 5 h : noctambules, feu de camp à Vespucci, marchés de nuit, marché noir, ring. |\n| Météo | Canicule, tempête, brouillard : prix, refus de vente, butins et visibilité changent. |\n| Presse | Brèves Weazel automatiques, Direct pendant les grosses poursuites, Radio Los Santos en voiture, et la **Gazette du dimanche** à 20 h (site, Discord, /gazette). |\n| Le site | Carte en direct de la vraie Los Santos : tension des quartiers, rendez-vous, légendes, les 24 dernières heures rejouées, « En ce moment en ville », et une candidature en trois questions. |\n\n\n### Le calendrier\n\n| Quand | Rendez-vous | Bonus |\n|---|---|---|\n| Mercredi 21 h-23 h | Mercredi des métiers | +25 % d'XP |\n| Vendredi 21 h-23 h 30 | Vendredi des courses | +15 % d'XP |\n| Samedi 21 h 30 | Enchères de la fourrière (Davis) | 30 min |\n| Samedi 22 h-minuit | Nuit des combats | +10 % d'XP, un tour de roue en plus |\n| Dimanche 17 h-19 h | Dimanche road trip | +15 % d'XP, plus de rencontres de la route |\n| Dimanche 20 h | Gazette de la semaine et tirage du loto |  |\n| 24 oct. - 1er nov. | Nuits d'Halloween | +25 % d'XP, un tour de roue en plus, auto-stoppeur fantôme, 13 citrouilles cachées (6 666 $) |\n| 20 déc. - 2 janv. | Fêtes de fin d'année | +25 % d'XP, un tour de roue en plus |\n| 21 juin - 22 sept. | Été à Los Santos | +10 % d'XP |\n\n\nHeures du jeu pour le jour et la nuit ; heures réelles (Paris) pour les rendez-vous. Rappel 30 min avant, en jeu et sur Discord.\n\n**ANNEXE**\n\n# Catalogue de la concession\n\nTous les véhicules en vente, par catégorie, du moins cher au plus cher. Les **★ Imports RoadLine** (modèles exclusifs ajoutés au serveur) sont présentés directement à la concession.\n\n## Premium Deluxe Motorsport (Pillbox Hill)\n\n### ★ Luxe · Sportives · 117 modèles · de 64 000 $ à 180 500 $\n\n| Modèle | Marque | Prix | Modèle | Marque | Prix |\n|---|---|---|---|---|---|\n| Veto Classic | Dinka | 64 000 $ | Hotring Sabre | Declasse | 119 500 $ |\n| Veto Modern | Dinka | 68 000 $ | V-STR | Albany | 119 500 $ |\n| Khamelion | Hijak | 80 000 $ | 8F Drafter | Obey | 120 000 $ |\n| Raiden | Coil | 96 500 $ | Hotring Everon | Karin | 120 000 $ |\n| Neon | Pfister | 98 500 $ | Envisage | Bollokan | 120 00
