## Ordre de démarrage. Les ressources qui déclarent leurs dépendances (fxmanifest) se réordonnent
## d'elles-mêmes à l'intérieur d'un bloc, les blocs, eux, doivent rester dans cet ordre.
## Jamais de point-virgule dans un .cfg, même en commentaire : FiveM le lit comme séparateur de commandes.
## Chaque ressource tierce passe la checklist d'audit (docs/SECURITY.md) AVANT d'être ajoutée ici.
## Ne JAMAIS ajouter : qbx_management (gs_jobs), qbx_weathersync / Renewed-Weathersync (gs_weather), qbx_hud (gs_hud),
## npwd (gs_phone), qbx_drugs / qbx_weed / qbx_storerobbery / qbx_jewelery / qbx_bankrobbery (gs_drugs / gs_heists).

## ---- 0. Ressources Cfx par défaut ----
ensure mapmanager
ensure chat                 # chat système FiveM (resources_useSystemChat)
ensure spawnmanager
ensure baseevents
ensure bob74_ipl            # intérieurs de la map (commissariat, etc.)

