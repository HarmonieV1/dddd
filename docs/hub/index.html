ive directement sur Discord (webhook), sans bot externe.\n- **La mémoire des lieux** (`gs_memoire`) : chaque endroit accumule ce qui s'y est passé (crimes, arrestations, mariages, courses, braquages,\n  guerres de gang). Les passants en parlent quand tu passes, Radio Los Santos le rappelle, une plaque naît au 10e événement.\n- **Les échos** (signature) : la nuit, près d'un lieu chargé, des silhouettes translucides rejouent le passé quelques secondes.\n- **Le registre des véhicules disparus** : une voiture volée jamais retrouvée refait surface après 48 h (casse, garage louche ou enchères),\n  carnet intact. Une rumeur circule, le propriétaire enquête ; s'il la reprend, l'assurance récupère son indemnité, sans pénalité.\n- **Le marché des faux papiers** : fausse carte d'identité, faux permis, fausse PPA. Ils passent un contrôle visuel, pas le scanner du commissariat.\n- **Le témoin protégé** : en garde à vue, dénoncer un gang divise la peine par deux ; le gang apprend que « quelqu'un a parlé », la police\n  protège le témoin 7 jours. S'il tombe, le gang est dans le viseur.\n- **La guerre de l'information** : un gang peut brouiller les caméras d'un quartier ou pirater le scanner police 10 minutes (payé par la\n  caisse) ; la police remonte la source depuis l'ordinateur du commissariat.\n- **V12.2 · Site en mode cinéma** : grain de film, bandes letterbox, caméra qui pousse sur l'accueil, parallaxe au défilement, rail de chapitres,\n  mots révélés un à un, page qui tangue avec la vitesse, réticule qui suit la souris, barre qui se cache en descendant. Sans toucher au contenu.\n- **V12.3 · Staff à distance et site vivant** : `/isoler`, `/liberer`, `/reanimer` sur le bot et l'appli staff (admins du Discord acceptés) ;\n  bandeau Weazel en direct, SMS en jeu pendant la visite du site, places affichées = 48 ; site plus fluide (grain, aurora, étoiles) et police GTA de secours.\n- **V12.4 · Pots de miel et bannissements en jeu** : 27 events et callbacks « appâts » qu'aucun script RoadLine ne déclenche jamais (noms de\n  frameworks qu'on n'utilise pas, fausses failles alléchantes) — les toucher ne s'explique que par un menu de triche, donc zéro faux positif\n  (vérifié par un test automatique). Bannissement **posé ET levé depuis le jeu** (F11 → Joueurs → Bannir, F11 → Bannissements pour la liste,\n  la recherche et le déban, même sur un joueur hors ligne), ce que txAdmin ne sait pas faire. Le staff n'est jamais banni automatiquement :\n  il est signalé. Et l'arrivée en bus dépose enfin devant la mairie, itinéraire tracé vers Max « le Guide ».\n\n## V12.59 → V12.63 · La ville du 15-16/10 (détail : `docs/PATCH_SESSION_15-10.md`)\n- **Mémoire de la rue** : sang et douilles après une fusillade, barrières après un braquage (24 h) ; scène de crime photographiée versée\n  au dossier ; mur des légendes devant Mission Row ; affiches de cavale arrachables ; avis du commerçant après un braquage filmé ;\n  hommages « R.I.P. » peints par les gangs ; cimetière (tombes, épitaphes, avis de décès, fleurs).\n- **Police** : police IA qui poursuit vraiment (sans policier joueur en service), hélico au-dessus des grosses cavales (« en direct »\n  sur le site), rodéo du samedi, barrage d'alcoolémie du shérif la nuit, cabines téléphoniques (appels anonymes, écoute, fausse alerte).\n- **Quartiers et gangs** : figure du coin, voisins vigilants, trêves entre gangs, territoires en pâtés de maisons, gangs sur projet RP.\n- **Ailleurs** : journée North Yankton un jour sur deux (vol de l'aéroport, à la place de Cayo Perico), jetons de fête foraine et\n  photomaton, courses sur mesure avec véhicule imposé, gestes selon l'objet (lavabo, douche, fontaine, mer).\n- **Staff** : Lives (écrans des joueurs, replays des tickets), appli staff externe installable (PC, téléphone, tablette, logo RoadLine), carte en direct, rapport de fin de soirée ; modération avancée (surveillance, arrivées fermées, contournement de ban, ban hors ligne).\n\n", "JOBS": "# gs_jobs — système multi-job\n\n## Fonctionnalités\n| Feature | Détail |\n|---|---|\n| Multi-job | jusqu'à `Config.MaxJobs` contrats par perso, bascule via **F6 / `/job`** |\n| Service | au point de service (LSPD/EMS/Mécano) ou partout (jobs publics) ; changer de job = hors service |\n| Direction | recrutement avec **consentement** (offre 60 s), grades, licenciement, caisse (dépôt/retrait) |\n| Caisses société | table `gs_societies`, retraits atomiques (pas de solde négatif, pas de course) |\n| Paie | toutes les 15 min, en service uniquement, par l'État ou la caisse ; anti-AFK ; allocation chômage |\n| Garages | véhicule spawn **côté serveur**, 1 max par joueur, plaque au préfixe du job, clés auto, rendu en fin de service |\n| Coffres | ox_inventory, restreints par job + grade + distance |\n| Armurerie | équipement de service **prêté** (V12.37) : repris à la fin du service, au changement de métier, au licenciement / à la démission et à la déconnexion ; seulement les quantités fournies (ce qu'on avait avant reste, ce qui a été consommé n'est pas réclamé) ; reconnexion : repris 5 s après le chargement |\n| Points (V12.37) | une seule interaction par point (le PNJ porte l'option ox_target, [E] reste), verrou anti-double-clic 1 s, prise de service par **état voulu** + anti-rebond 1,5 s (plus de « Prise » puis « Fin de service » en double), garage : messages exacts (pas de métier actif / autre métier / hors service) et verrou pendant la sortie |\n| Factures / amendes | stockées en BDD, `/factures` pour payer, 10 % à l'émetteur, reste à la caisse |\n| Missions | taxi, livreur, éboueur : étapes choisies par le serveur, anti-TP, véhicule de service exigé |\n| Actions véhicule | mécano : réparer (kit consommé), nettoyer ; durée vérifiée côté serveur |\n| Pôle Emploi | rejoindre les jobs publics |\n| Staff | `/gsjob add|remove|grade|list <id> [job] [grade]` (group.admin) |\n| Audit | toutes les actions sensibles en table `gs_job_audit` + webhook Discord `gs_webhook_jobs` |\n\n## Animalerie (V12.63, ressource `gs_animalerie`)\nEmploi public `animalerie` (Pôle Emploi, service n'importe où, payé à la tâche par la ville, sur le compte en banque). Dans la\nboutique de la map Patoche : animaux exposés (visibles de tous), **Réserve** (carton de croquettes porté) → **Gamelles**,\n**Cages** (balai), **Toilettage**, **Comptoir** (un client toutes les 2 min 30 à 5 min pour l'employé en service, pourboire possible).\nAttente entre deux mêmes tâches, distance et service vérifiés par le serveur ; XP de métier au plus toutes les 10 min.\nPostes : F11 → Monde et lieux → Déplacer un point → « Animalerie · … » (tant qu'ils ne sont pas placés, ils se rangent autour de\nla position de la map lue par gs_admin). Réglages : `gs_animalerie/shared/config.lua` (paies, durées, animaux, clients).\n\n## Ajouter un job ([CONFIG])\nTout se passe dans `shared/jobs.lua` : copier un bloc, changer le nom, les grades, les points, les véhicules.\nAucun code à toucher. Les coords sont à caler en jeu (`Config.Debug = true` affiche les zones).\n\n## Installation\n1. `ensure gs_security`, `gs_bridge`, puis `gs_jobs` après qbx_core / ox_* (voir `server.cfg.example`).\n2. Les tables se créent au démarrage (`sql/gs_jobs.sql` fourni pour une install manuelle).\n3. **Qbox** (à vérifier sur docs.qbox.re à l'installation) :\n   - retirer de `qbx_core/shared/jobs.lua` les jobs qu'on redéfinit (police, ambulance, mechanic, taxi…) sinon leurs salaires Qbox s'ajoutent aux nôtres ;\n   - `maxJobsPerPlayer` dans la config qbx_core ≥ `Config.MaxJobs` + 1 ;\n   - **ne pas installer `qbx_management`** (doublon avec notre menu Direction) ;\n   - réserver le `/setjob` natif au fondateur : passer par `/gsjob` (sinon la réconciliation au login retire le job).\n4. Item `repairkit` à déclarer dans `ox_inventory/data/items.lua` s'il n'existe pas :\n   ```lua\n   ['repairkit'] = { label = 'Kit de réparation', weight = 2500, stack = true, close = true },\n   ```\n\n## API pour les autres ressources (serveur)\n```lua\nexports.gs_jobs:HasJob(src, 'police', 2)      -- contrat police grade ≥ 2\nexports.gs_jobs:IsOnDutyAs(src, 'ambulance')  -- job actif + en service\nexports.gs_jobs:GetMemberships(src)           -- { police = 2, taxi = 0 }\nexports.gs_jobs:AddSocietyMoney('mechanic', 500)\n```\n\n## Sécurité\nChaque event/callback : rate-limit → personnage chargé → job/grade/service → distance serveur → montants entiers bornés.\nLe client n'envoie que des intentions (index de garage, id de facture) ; prix, salaires, étapes et gains sont calculés côté serveur.\n\n## Tests\n`./tests/run.sh` : syntaxe, linters (config, liaisons entre ressources) et tests de logique serveur (simulateur, pas le vrai jeu). Lancé aussi par la CI GitHub.\n\n## Impact / risques / rollback\n- Impact : nouvelle ressource, 4 tables préfixées `gs_`, aucune table Qbox modifiée.\n- Risques : noms d'API Qbox/ox marqués `[API]` dans `gs_bridge` à confirmer ; coords approximatives.\n- Rollback : retirer `ensure gs_jobs` ; tables conservées (backup avant `DROP`, voir `sql/gs_jobs.sql`).\n", "REGLEMENT": "# Règlement RoadLine RP · à copier sur Discord\n\nMode d'emploi : un bloc = un message Discord (chacun fait moins de 2 000 caractères, la limite de Discord). Copie ce qu'il y a\n**entre les lignes de tirets**, dans l'ordre, dans le salon #règlement. Le résumé en jeu (accepté à la première connexion) renvoie ici.\nSi tu changes une règle importante : augmente `Config.RulesVersion` dans `gs_onboarding/shared/config.lua` (tout le monde ré-accepte).\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n# 📜 RÈGLEMENT DE ROADLINE RP\n\nBienvenue à Los Santos. Ici, la ville a une mémoire : chaque acte laisse une trace, chaque histoire peut faire la une.\nCe règlement existe pour une seule raison : **que tout le monde passe une bonne soirée**, flics comme braqueurs.\n\n> En rejoignant le serveur, tu acceptes ce règlement dans son intégralité. Ne pas l'avoir lu n'est pas une excuse.\n> L'esprit des règles compte plus que leur lettre : si tu cherches la faille, tu as déjà enfreint la règle.\n\n**Sommaire**\n1️⃣ Respect et comportement\n2️⃣ Les bases du roleplay\n3️⃣ Valeur de la vie et combats\n4️⃣ Crime et illégal\n5️⃣ Gangs et territoires\n6️⃣ Police, justice et prison\n7️⃣ Métiers, économie et véhicules\n8️⃣ Communication et Discord\n9️⃣ Staff, tickets et sanctions\n🔟 Boutique : zéro pay-to-win\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n## 1️⃣ RESPECT ET COMPORTEMENT\n\n**1.1** Aucun propos ou comportement haineux : racisme, sexisme, homophobie, transphobie, harcèlement, menaces réelles. En jeu, en vocal, sur Discord. **Tolérance zéro.**\n**1.2** Le RP peut être sombre, pas le joueur. Un personnage peut être odieux ; la personne derrière l'écran reste correcte.\n**1.3** Pas de sujets interdits en RP : agression sexuelle, actes sur mineurs, terrorisme réel, suicide joué pour choquer.\n**1.4** Consentement pour les scènes lourdes (torture, séquestration longue) : on en parle d'abord (OOC discret ou ticket), on s'arrête si l'autre le demande.\n**1.5** Pas de pub pour un autre serveur, ni en jeu ni en privé.\n**1.6** Pseudo et nom de personnage corrects : prénom + nom crédibles, pas de célébrité, pas de nom insultant.\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n## 2️⃣ LES BASES DU ROLEPLAY\n\n**2.1 Reste en personnage.** Le hors-jeu (HRP) se limite au strict nécessaire, et jamais en pleine scène.\n**2.2 Metagaming interdit.** Utiliser une info obtenue hors du jeu (stream, Discord, vocal externe) est sanctionné. Ton personnage ne sait que ce qu'il a vu ou entendu en jeu.\n**2.3 Powergaming interdit.** Pas d'action impossible ou imposée (« je t'assomme d'un coup », « je sors de la voiture en flammes sans rien »). Laisse une chance à l'autre.\n**2.4 Pas de bug volontaire, ni de glitch d'animation, ni de déconnexion en pleine scène** (déco/reco pour fuir une arrestation = sanction lourde).\n**2.5 Les témoins, c'est du RP.** À RoadLine, les PNJ et les joueurs témoins décrivent ce qu'ils ont vu. Tu peux jouer sur ta tenue, ton masque, ta voiture… mais pas mentir HRP au staff.\n**2.6 Le téléphone est en jeu.** Ce que tu écris sur Vibe, en SMS ou au journal Weazel est un acte de ton personnage.\n**2.7 Zones calmes** : hôpital, commissariat, mairie et Pôle Emploi. **Aucun crime** dedans ni juste devant (sauf scène validée par le staff).\n**2.8 Lieux de mémoire et cicatrices** : on ne vandalise pas une plaque ou un mémorial pour troller. On peut en parler, en rire en RP, pas les détruire.\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n## 3️⃣ VALEUR DE LA VIE ET COMBATS\n\n**3.1 Valeur de la vie.** Ton personnage tient à sa vie. Sous la menace d'une arme, **tu obéis** (pas de « je sors mon arme plus vite »).\n**3.2 Freekill (RDM) interdit.** Tuer ou blesser sans raison RP et sans interaction préalable est sanctionné.\n**3.3 Carkill (VDM) interdit.** Une voiture n'est pas une arme. Le serveur détecte les écrasements volontaires.\n**3.4 Interaction avant violence.** Une agression commence par une interaction : menace claire, ultimatum, raison. « Hands up » puis 2 secondes, ce n'est pas une interaction.\n**3.5 Après une mort (réanimation impossible)** : ton personnage oublie la scène qui a mené à sa mort. Pas de vengeance immédiate, pas de retour sur les lieux pendant **30 minutes**.\n**3.6 Combats clandestins** : sur le ring, on tape à mains nues. Sortir du ring = forfait. Pas d'arme, pas d'intervention du public.\n**3.7 Pas de combat dans les zones calmes**, ni au spawn, ni contre un joueur qui vient de se connecter (laisse-lui 5 minutes).\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n## 4️⃣ CRIME ET ILLÉGAL\n\n**4.1** Le crime fait partie du jeu, **à condition de jouer la scène**. Le butin n'est pas le but : l'histoire l'est.\n**4.2 Braquages : effectifs** (le minimum de policiers est aussi vérifié par le serveur)\n• Supérette : 1 policier en service · max 4 braqueurs\n• Bijouterie : 3 policiers · max 5 braqueurs\n• Banque Fleeca / gros coup en duo : 4 policiers · max 6 braqueurs\n**4.3 Otages** : un otage doit être joué (dialogue, exigences). Pas d'otage « complice » (ton ami) ni d'otage pris juste pour bloquer la police.\n**4.4 Négociation** : quand la police négocie, on négocie. Les accords passés en négociation sont respectés des deux côtés.\n**4.5 Black-out** : saboter un transformateur est un crime RP, pas un moyen de gâcher la soirée. Pas plus d'un sabotage par heure et par groupe.\n**4.6 Rackets et vols entre joueurs** : on ne vide pas entièrement quelqu'un. Laisse-lui de quoi repartir (téléphone, papiers, objets de métier).\n**4.7 Contrats (/contrats)** : un contrat d'élimination exige une **scène RP** et un préavis ; pas d'élimination d'un nouveau joueur (niveau ≤ 3).\n**4.8 Cavale** : un fugitif peut fuir, se cacher, se déguiser. Il ne se déconnecte pas pour échapper à la capture.\n**4.9 Argent sale** : le blanchiment passe par les commerces et leurs risques ; pas de transfert à un ami « propre » pour contourner.\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n## 5️⃣ GANGS ET TERRITOIRES\n\n**5.1** Les gangs sont **créés par le staff** (demande en ticket avec un projet RP : nom, histoire, quartier, membres). Pas de gang sauvage.\n**5.2** 25 membres maximum. Un gang = une identité : tenues, couleurs, véhicules du gang, façon de parler.\n**5.3 Guerres de territoire** : uniquement déclarées par le menu du gang (F9). Hors guerre déclarée, pas de fusillade gratuite entre gangs : une embrouille se joue (règle 3.4).\n**5.4** Pendant une guerre, le combat reste **dans le quartier disputé**. Pas de « poursuite » jusqu'au spawn ou à l'hôpital.\n**5.5 Tags** : sur les murs du quartier, pas sur les commerces des joueurs ni dans les zones calmes.\n**5.6 Racket des commerces** : une demande, une réponse, une conséquence RP (vitrine). Pas de harcèlement d'un même commerce plusieurs fois par jour.\n**5.7** Les organisations (Cartel, Triades) jouent le haut de la pyramide : discrétion, business, pas de fusillade de rue.\n**5.8** Quitter un gang, c'est en RP aussi : les secrets du gang ne passent pas « magiquement » à la police.\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n## 6️⃣ POLICE, JUSTICE ET PRISON\n\n**6.1** Les forces de l'ordre (LSPD, Shérif) jouent une police **crédible**, ni toute-puissante ni corrompue par défaut. La corruption se joue, ne s'impose pas.\n**6.2 Refus d'obtempérer** = délit RP (points, poursuite). Une poursuite s'arrête si elle devient dangereuse pour les civils ou si le staff le demande.\n**6.3 Garde à vue** : le suspect a des droits (/droits : avocat, silence, aveux). Les policiers les respectent ; ignorer une demande d'avocat est un vice de procédure.\n**6.4 Preuves** : les douilles, empreintes, photos et vidéos servent au procès. Fabriquer une fausse preuve se fait en RP (avec les risques), jamais par un bug.\n**6.5 Procès** : un juge préside. Pour un vrai procès, il peut convoquer un **jury de 5 citoyens**. Juré convoqué ? Tu votes selon ce que tu as entendu, pas selon tes amis.\n**6.6 Prison** : la peine est faite en jeu (boulots possibles pour la réduire). L'évasion se joue à plusieurs, de nuit. Pas de déconnexion pour « purger » sa peine.\n**6.7** Policiers et EMS ne profitent pas de leur métier (armes, véhicules, coffres) pour un usage personnel.\n**6.8 EMS** : neutres. On ne tire pas sur un ambulancier en intervention, on ne prend pas un EMS en otage pour se faire soigner.\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n## 7️⃣ MÉTIERS, ÉCONOMIE ET VÉHICULES\n\n**7.1** On gagne sa vie **en jouant** : missions, récolte, commerces, métiers. Pas d'AFK farm, pas de macro (le serveur ne paie pas les joueurs immobiles).\n**7.2** En service, tu joues ton métier : un mécano répare, un taxi conduit, un journaliste enquête. Pas de prise de service juste pour toucher la paie.\n**7.3 Factures et contrats signés** : une dette RP se rembourse. Les litiges vont devant un juge (en RP), pas en ticket.\n**7.4 Arnaques** : autorisées en RP entre adultes consentants au jeu (fausse affaire, faux vendeur), **interdites** sur l'argent réel, la boutique ou les comptes.\n**7.5 Échanges et dons** : transférer de l'argent ou des objets à son autre personnage, ou en faire contre de l'argent réel = **ban**.\n**7.6 Véhicules** : conduite crédible. Pas de sport en hors-piste avec une citadine, pas de saut de toit en hyper-car. Les véhicules d'entreprise restent au service.\n**7.7 Bugs** : un bug qui rapporte de l'argent ou des objets se **signale** (/report). L'exploiter = ban, même « juste pour tester ».\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n## 8️⃣ COMMUNICATION ET DISCORD\n\n**8.1** Micro correct et réglé : pas de musique, pas de souffle, pas de cri gratuit dans l'oreille des autres.\n**8.2 Radio en jeu** : fréquences des services réservées aux services. Pas de spam ni d'écoute illégitime (le scanner se joue en RP).\n**8.3 /me et /do** : pour décrire ce que le jeu ne montre pas, honnêtement et brièvement.\n**8.4 Discord** : on reste poli, on n'envoie pas en MP non sollicité, pas de spam, pas de mention @staff pour rien.\n**8.5 Streamers** : bienvenue ! Les spectateurs ne transmettent pas d'infos aux joueurs (c'est du metagaming, règle 2.2). Le stream en différé est conseillé pendant les scènes criminelles.\n**8.6** Les annonces, rendez-vous et la Gazette du dimanche sont publiés sur Discord : active les notifications de #annonces.\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n## 9️⃣ STAFF, TICKETS ET SANCTIONS\n\n**9.1** Un problème en jeu : **/report**. Le staff le reçoit tout de suite (même sur téléphone). Ne quitte pas la scène en cours sans qu'on te le demande.\n**9.2** Les décisions du staff s'appliquent **immédiatement**. Une contestation se fait **après**, calmement, par ticket Discord, avec des preuves (clip).\n**9.3** Le staff ne joue pas au détriment des joueurs : un membre du staff en jeu est un joueur comme les autres, et passe en service pour modérer.\n**9.4 Barème indicatif** (le staff adapte selon la gravité et l'historique)\n• Avertissement : écart léger, premier oubli\n• Expulsion : récidive dans la soirée, comportement qui bloque une scène\n• Ban 1 à 3 jours : freekill, carkill, metagaming, powergaming, déco en scène\n• Ban 7 jours : récidive, contournement des règles de braquage, harcèlement\n• Ban définitif : triche, exploitation de bug, haine, argent réel, double compte pour contourner un ban\n**9.5** Les sanctions publiques sont annoncées dans #sanctions sans nom du membre du staff.\n**9.6** Les vidéos font foi : enregistre tes scènes (ShadowPlay, OBS, Medal). Pas de clip, pas de plainte.\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n## 🔟 BOUTIQUE : ZÉRO PAY-TO-WIN\n\n**10.1** La boutique ne vend **que du style** : tenues, skins, pass de saison cosmétique. Aucun argent de jeu, aucune arme, aucun véhicule plus rapide.\n**10.2** Un achat n'achète ni passe-droit, ni immunité, ni grade.\n**10.3** Revendre un objet de la boutique contre de l'argent réel ou un compte = ban définitif.\n\n---------------------------------------------------------------------------------------------------------------------------------\n\n## ✅ POUR FINIR\n\n• Le règlement peut évoluer : les changements sont annoncés dans #annonces, et le serveur te demande de ré-accepter les règles importantes.\n• Un doute ? Demande avant d'agir : un ticket coûte moins cher qu'une sanction.\n• Et surtout : **joue pour l'histoire**. Les meilleures soirées de Los Santos ne sont pas celles où l'on gagne, ce sont celles qu'on raconte.\n\n**Réagis avec ✅ pour accéder au serveur.**\n*L'équipe RoadLine RP*\n\n---------------------------------------------------------------------------------------------------------------------------------\n", "VEHICULES": "# RoadLine RP · Catalogue des véhicules en vente\n\n600 véhicules (source : qbx_core + qbx_vehicleshop avec les réglages RoadLine (scripts/windows/outils-communs.ps1, prix-vehicules.json)). Prix en $ en jeu. Généré le 11/10/2026 depuis tools/data/vehicules_concession.json.\n\n\n## Aéroport (avions et hélicoptères) · helicopters (14)\n\n| Marque | Véhicule | Modèle (spawn) | Prix |\n|---|---|---|---|\n| Nagasaki | Havok | `havok` | 380 000 $ |\n| Western | Maverick | `maverick` | 950 000 $ |\n| Maibatsu | Frogger | `frogger` | 1 100 000 $ |\n| Buckingham | Conada | `conada` | 1 350 000 $ |\n| Buckingham | SuperVolito | `supervolito` | 1 600 000 $ |\n| Buckingham | Swift | `swift` | 1 800 000 $ |\n| Buckingham | SuperVolito Carbon | `supervolito2` | 1 900 000 $ |\n| Buckingham | Swift Deluxe | `swift2` | 2 400 000 $ |\n| Buckingham | Volatus | `volatus` | 2 900 000 $ |\n|  | Sea Sparrow | `seasparrow` | 6 293 144 $ |\n| Maibatsu | Frogger (Trevor Philips Enterprises) | `frogger2` | 6 367 865 $ |\n| Nagasaki | Buzzard | `buzzard2` | 6 462 758 $ |\n|  | Sparrow | `seasparrow2` | 7 760 028 $ |\n|  | Sparrow (Prop) | `seasparrow3` | 7 760 028 $ |\n\n## Aéroport (avions et hélicoptères) · planes (17)\n\n| Marque | Véhicule | Modèle (spawn) | Prix |\n|---|---|---|---|\n| Nagasaki | Ultraligh gacy**. Enhanced est inclus dans le même achat, mais FiveM ne sait pas l'utiliser.\nFais les étapes **dans l'ordre**, sans en sauter. À chaque étape, relance FiveM pour tester.\n\n---\n\n## Étape 1 — Vérifier QUELLE version est vraiment installée (2 min)\nC'est la cause n°1 : la version qui « reste » est souvent Enhanced, pas Legacy.\n\n1. Ouvre le dossier du jeu :\n   - **Steam** : Bibliothèque → clic droit sur le jeu → *Gérer* → *Parcourir les fichiers locaux*\n   - **Epic** : Bibliothèque → `…` sur le jeu → *Gérer* → icône dossier\n   - **Rockstar Launcher** : Paramètres → *Mes jeux installés* → GTA V → *Ouvrir le dossier*\n2. Regarde les `.exe` du dossier :\n\n| Tu vois | C'est | FiveM marche ? |\n|---|---|---|\n| `GTA5.exe` + `PlayGTAV.exe` | **Legacy** | ✅ oui |\n| `GTA5_Enhanced.exe` | Enhanced | ❌ non → installer Legacy (étape 2) |\n\n3. Note le chemin complet du dossier (ex : `C:\\Program Files (x86)\\Steam\\steamapps\\common\\Grand Theft Auto V`).\n\n## Étape 2 — Installer Legacy si besoin\n- **Steam** : dans la bibliothèque, cherche **« Grand Theft Auto V Legacy »** (entrée séparée d'Enhanced). Installer.\n- **Epic** : sur la page du jeu, choisir l'édition **Legacy** à l'installation.\n- **Rockstar Launcher** : GTA V → choisir **Legacy**.\n- Lance **une fois** GTA V Legacy normalement jusqu'au menu (ça finit l'installation et le Social Club), puis ferme-le.\n\n## Étape 3 — Faire oublier l'ancien chemin à FiveM (cause n°2)\nDésinstaller FiveM **ne supprime pas** ses réglages : il garde le chemin d'Enhanced.\n1. Ferme FiveM **et** vérifie dans le Gestionnaire des tâches (Ctrl+Maj+Échap) qu'aucun `FiveM` ne tourne.\n2. Touche Windows + R → colle `%localappdata%\\FiveM\\FiveM.app` → Entrée.\n3. Supprime le fichier **`CitizenFX.ini`** (c'est lui qui contient `IVPath=…`, le chemin du jeu).\n4. Relance FiveM → il demande le dossier du jeu → donne **le dossier noté à l'étape 1** (celui avec `GTA5.exe`).\n\n## Étape 4 — Réparer les fichiers du jeu (cause n°3 : installation incomplète)\n- **Steam** : clic droit → *Propriétés* → *Fichiers installés* → *Vérifier l'intégrité des fichiers du jeu*\n- **Epic** : `…` → *Gérer* → *Vérifier*\n- **Rockstar** : Paramètres → GTA V → *Vérifier l'intégrité*\nPuis refaire l'étape 3.\n\n## Étape 5 — Réinstallation propre de FiveM (si toujours bloqué)\n1. Désinstaller FiveM.\n2. Supprimer **tout** le dossier `%localappdata%\\FiveM`.\n3. Retélécharger FiveM depuis **fivem.net** uniquement.\n4. Le lancer en tant qu'administrateur la première fois, donner le dossier Legacy.\n\n## Étape 6 — Cas particuliers\n- **Jeu sur un disque externe / réseau** ou dans un dossier synchronisé OneDrive : déplacer le jeu sur un disque interne.\n- **Antivirus** qui bloque FiveM : ajouter `%localappdata%\\FiveM` en exception.\n- **Deux versions installées en même temps** : ça marche, mais il faut bien donner le dossier Legacy à l'étape 3.\n\n## Toujours bloqué ? Envoie ces 4 infos à [DEV]\n1. Le **message d'erreur exact** (capture d'écran idéale)\n2. La plateforme : Steam, Epic ou Rockstar\n3. La **liste des `.exe`** du dossier du jeu (étape 1)\n4. Le contenu de `CitizenFX.ini` s'il existe encore (ligne `IVPath=`)\n\nPendant ce temps, rien n'empêche d'avancer côté serveur : FXServer, txAdmin, MariaDB et nos ressources\ntournent **sans** GTA installé (docs/INSTALL.md). Le client ne sert qu'à se connecter pour tester.\n", "JOUER_A_PLUSIEURS": "# Faire venir 1 ou 2 amis sur le serveur hébergé chez toi\n\nOui, c'est possible depuis ton PC. Trois façons, de la plus simple à la plus « propre ».\n\n## A. Réseau privé virtuel (le plus simple, sans toucher la box)\n1. Toi et tes amis installez **Tailscale** (ou ZeroTier / Radmin VPN), gratuit, et rejoignez le même réseau.\n2. Tu lances le serveur comme d'habitude.\n3. Tes amis ouvrent FiveM → F8 → `connect 100.x.y.z:30120` (l'adresse Tailscale de ton PC).\nAucune redirection de port, rien d'exposé sur Internet. Idéal pour tester à 2-3.\n\n## B. Redirection de port sur ta box\n1. Donne une IP fixe locale à ton PC (réglages de la box, « bail DHCP statique »).\n2. Redirige le port **30120 en TCP et UDP** vers cette IP.\n3. Pare-feu Windows : autorise FXServer (ou le port 30120 TCP/UDP) en entrée.\n4. Tes amis : F8 → `connect TON_IP_PUBLIQUE:30120` (ton IP publique : recherche « quelle est mon IP »).\n⚠️ Ton IP est visible par ceux qui se connectent : ne la partage qu'avec des proches. Pour du public, passe par un hébergeur\navec anti-DDoS (voir docs/SECURITY.md).\n\n## C. Lien cfx.re (liste des serveurs)\nAvec une clé de licence valide et le port ouvert (B), le serveur apparaît dans la liste FiveM et a un lien `cfx.re/join/xxxx`.\nPour des tests entre amis, garde plutôt `sv_master1 \"\"` (serveur non listé) dans un fichier cfg privé.\n\n## Avant d'inviter\n- `DEVENIR-ADMIN.bat` pour toi ; tes amis n'ont rien à installer à part FiveM.\n- Liste blanche : laisse `gs_whitelist \"false\"` pour les tests, ou ajoute-les avec `/whitelist add <id>`.\n- Si ton PC se met en veille, le serveur se fige (« Loop svMain seems hung ») : désactive la veille pendant les sessions.\n", "ADMIN": "# Administration : txAdmin + gs_admin\n\n| Outil | Pour quoi | Accès |\n|---|---|---|\n| **txAdmin** (web, `http://localhost:40120`) | restarts, console, backups, **bans** (base anti-contournement), whitelist, stats | comptes txAdmin |\n| **Menu txAdmin en jeu** (`/tx`) | noclip, god, TP, spectate, freeze, véhicules, warn/ban, IDs au-dessus des têtes | permissions txAdmin |\n| **gs_admin** (F10 / `/admin`) | tout ce qui est propre à notre RP : tickets, fiches, isolement, économie, contrats, météo, annonces | ACE `gs.admin.*` |\n\n## gs_admin\n- **Tickets** : les joueurs font `/report <message>` (1 ticket ouvert max, cooldown 2 min) ; le staff **en service** (`/staff` ou bouton) est notifié avec un son ; prendre, aller au joueur, ouvrir sa fiche, clôturer.\n- **Fiche joueur** branchée sur tous nos systèmes : job actif + contrats, recherche (étoiles), duo, pseudo Néon, isolement, ping, durée de session ; + licence et historique staff (modo) ; + argent (admin).\n- **Actions** (le serveur revérifie tout, motif obligatoire pour les sanctions) :\n  - Helper : tickets, aller au joueur, fiche\n  - Modo : amener, soigner, réanimer, réparer véhicule, figer, effacer la recherche, note staff, **avertir, isoler, expulser**\n  - Admin : ajouter/retirer contrat, météo, annonce, section Fun\n  - Super-admin : donner/retirer argent (plafond 100 000 $), donner item (plafond 100) — **motif obligatoire**, journalisé\n  - Fondateur : promouvoir / rétrograder le staff, items sans motif, retirer / poser des items\n- **Anti-abus staff** : impossible de sanctionner un staff de niveau égal ou supérieur ; toute tentative sans le niveau est loggée.\n- **Isolement (jail admin)** : cour de Bolingbroke, compte à rebours à l'écran, retour automatique en cellule en cas de fuite, **persiste à la déconnexion** (par licence).\n- **Transparence** : avertissements, isolements, expulsions **et bans/warns/kicks txAdmin** publiés sur un salon public (`gs_webhook_sanctions`), staff anonyme.\n- **Journal** : toutes les actions staff en BDD (`gs_admin_log`) + webhook staff + onglet Journal (modo+).\n\n## Menu staff rapide (F11) — V7\n\nV7 : 5 catégories — **Joueurs**, **Moi** (pouvoirs, persos GTA, animaux, métier / gang de test, argent et items super-admin),\n**Véhicules**, **Monde et lieux** (lieux publics, **Déplacer un point**, points de métier, gangs, décor, **Mappings installés**\n(V12.10 : chaque map ajoutée avec son quartier, téléportation, blips staff, conflits entre maps), coordonnées),\n**Événements** (événements en un clic + bonus serveur double XP / soirée chanceuse + effets sur soi). Ancienne description :\n\n## Menu staff rapide (F11) — V2\n\nMenu **cliquable à la souris** (chaque ligne porte sa propre action, sous-menus avec flèche, retour en haut à gauche). Les pouvoirs ne marchent **qu'en mode staff** (1re ligne),\net le couper coupe tout : vol, invisibilité, invincibilité, animal, spectate.\n\n| Fonction | Niveau |\n|---|---|\n| Mode staff, noms et ID au-dessus des joueurs, aller à un joueur, copier ses coordonnées | Helper |\n| Vol libre, invisible, invincible, se transformer en animal, TP au marqueur, spectate, amener, soigner, figer, supprimer un véhicule | Modérateur |\n| Se mettre (ou mettre un joueur) un **métier et un grade**, dans un **gang**, faire apparaître un véhicule | Admin |\n| **Points de métier** : déplacer service / coffre / armurerie / direction / garage à sa position (bâtiments fermés, futurs MLO) | Admin |\n| **Placement libre** d'un point (V12.37) : aperçu, flèches 10 cm, PgUp/PgDn hauteur, Q/E rotation, Maj ×5, G au sol, Tab viser, Entrée / Retour. **PNJ et objets posés par le staff** : relié à un métier (remplace le PNJ du point), à un gang (planque) ou libre ; retrait en visant | Super-admin |\n| **Points déplacés : gardés aux mises à jour** (KVP du serveur) et, depuis la V12.37, **copiés sur le VPS** par METTRE-A-JOUR-OVH (fichier `gs_bridge/points-deplaces.json`, écrit toutes les minutes ou par `/pointsexport`). Le PC est la référence : cale tout sur le PC, OVH suit à la mise à jour suivante | Super-admin |\n| **`/dosreglage`** : position des armes longues dans le dos (±1 cm, ±2°, os), « Copier le bloc Config.Back » à coller dans `gs_details/shared/config.lua` puis `restart gs_details` | Staff |\n| **Fun** (sur soi, events) : course rapide, super saut, endurance infinie, nage rapide, gravité lunaire, visions nocturne / thermique | Admin |\n| **Items** : donner (motif obligatoire) · **Objets du décor** (placer / retirer une poubelle, un banc…) | Super-admin |\n| **Items** sans motif, retirer, poser au sol · **Rang staff** d'un joueur (Joueurs → joueur → Rang) | Fondateur (`group.god`) |\n\n**Raccourcis du mode staff** (Ctrl gauche maintenu) : `Ctrl+Y` TP au marqueur · `Ctrl+U` vol libre · `Ctrl+O` noms et ID.\nModifiables : Échap → Paramètres → Raccourcis clavier → FiveM.\n\nChaque action est revérifiée par le serveur (niveau, mode staff, cible) et journalisée (F10 → Journal, webhook staff).\nVol libre : ZQSD, Espace/Ctrl pour monter/descendre, Shift vite, Alt lent. Spectate : Retour pour arrêter.\n\n## Donner les droits (V5)\n- **Fondateur** : `DEVENIR-ADMIN.bat` (te met en `group.god`), ou `add_principal identifier.license:XXXX group.god` dans `cfg/secrets.cfg`.\n  Un fondateur ne se crée jamais depuis le jeu.\n- **Tout le reste, en jeu** : menu staff (F11) → Joueurs → le joueur → **Rang staff (fondateur)** → Helper / Modérateur / Admin /\n  Super-admin / Joueur. Effet immédiat, enregistré en base (`gs_admin_ranks`), réappliqué à chaque démarrage.\n  Seul le fondateur voit cette ligne ; super-admin et admin ne peuvent promouvoir personne.\n- Hiérarchie : god (fondateur) > superadmin > admin > mod > helper (voir `cfg/permissions.cfg`).\n- Un rang écrit à la main dans `secrets.cfg` ne peut pas être retiré depuis le jeu : préfère le menu.\n- **`/optin` (service admin Qbox, V12.15 / V12.36)** : à taper une fois par personnage pour activer les commandes Qbox d'admin\n  (`/tp`, clés, etc.) ; c'est une bascule (un second `/optin` te remet « hors service »). Réponse attendue : « Service staff : in. »\n  (un second `/optin` → « Service staff : out. »). Si ça répond « Service staff : out. » à chaque fois, l'ACE `admin` manque sur le serveur qui tourne : `cfg/permissions.cfg`\n  ancien (VPS pas à jour → METTRE-A-JOUR-OVH, envoyé depuis la V12.36 ; ou METTRE-A-JOUR pas relancé sur le PC). Si ça répond\n  « Access denied » : tu n'es pas dans `group.admin` ou plus (DEVENIR-ADMIN.bat, puis GERER-OVH → 12). Les modérateurs et\n  helpers n'y ont pas droit, c'est voulu.\n\n## Tests\n`tests/test_gs_admin.lua` (50 tests) : niveaux, anti-abus, motifs, plafonds, tickets, isolement persistant, publication des sanctions.\n\n## Mapping en jeu : gs_builder (`/builder` ou menu staff → Objets du décor, super-admin et fondateur)\nPlacer n'importe quel objet du jeu, le déplacer, le tourner, le dupliquer, le supprimer. Sauvegardé en BDD, visible par tous.\n- **Placer** : nom du modèle (ex. `prop_bench_01a`) ou favoris → l'objet suit ton viseur.\n- **Contrôles** : `TAB` mode viser/précis · flèches déplacer · `PgUp/PgDn` hauteur · `Q/E` tourner · molette rotation fine ·\n  `X` remettre droit · `G` poser au sol · `Shift` rapide · `Ctrl` précis · `Entrée` valider · `Retour` annuler.\n- **Modifier** : « Modifier l'objet visé » ou « Objets à proximité » → déplacer / dupliquer / supprimer.\n- **Retirer un objet de la map d'origine** (poubelle, banc, barrière…) : vise-le → « Retirer l'objet de la map visé » ; il\n  disparaît pour tous. « Objets de la map retirés » les remet (500 max).\n- **Planque de gang** : « Placer une planque de gang ici » (le coffre du gang est créé à ta position).\n- Perf : chaque joueur ne crée localement que les objets à moins de 150 m (aucune entité réseau), 3000 objets max.\n- Sécurité : tout est revalidé serveur (permission, nom de modèle, position, distance < 60 m), chaque action loggée.\n- Noms des objets : bibliothèque en ligne « GTA V prop list » (ex. gta-objects.xyz) ou favoris dans `gs_builder/shared/config.lua`.\n\n## V8 · Ajouts au menu F11\n- Événements → **Météo événementielle** (tempête, canicule, brouillard, arrêt) et **Halloween sur la route** (activer, désactiver, automatique).\n- Joueurs → [joueur] → **Effacer sa recherche (étoiles)**.\n\n## V9 · Staff, sécurité, Discord, sauvegardes\n- **F11 → Anti-triche** : dernières alertes (téléportations répétées, vitesse impossible à pied / en voiture, arme interdite, gains d'argent anormaux sur 5 min, rafale d'objets). **Aucune sanction automatique** : on vérifie (spectate, Aller à) puis on décide. Tout le staff (niveau 1+) et les ACE `command` sont exemptés : vol libre, invisible, TP, dons d'argent du staff ne déclenchent rien. Alertes aussi dans Discord (`gs_webhook_anticheat`, sinon `gs_staff_webhook`). Désactiver : `set gs_anticheat \"false\"` ; seuil d'argent : `set gs_anticheat_money \"250000\"`.\n- **F11 → Statistiques de rétention** (admin, niveau 3+) : nouveaux joueurs sur 7 jours, retour le lendemain, retour dans la semaine, abandon à la première session (< 15 min), durée moyenne, joueurs et pic par jour. Console : `gsstats`.\n- **Discord** : `CONFIGURER-DISCORD.bat` remplit `secrets.cfg` (webhooks #statut et #annonces, adresse `gs_connect`, jeton du bot et serveur Discord, saisis masqués). Le message #statut est modifié chaque minute ; « La ville est ouverte » au démarrage ; redémarrages txAdmin annoncés (15, 5, 1 min). Rôles de métier : identifiants des rôles dans `gs_discord/shared/config.lua` (`Config.Roles`), le bot doit être au-dessus de ces rôles avec « Gérer les rôles ». Le **bot RoadLine tourne dans le serveur** (`gs_discord/server/bot.js`, présence + /statut /rejoindre /rdv /site) : rien à installer, il démarre avec le serveur (local ou hébergeur) dès que le jeton est rempli ; CONFIGURER-DISCORD ouvre le lien pour l'ajouter à ton Discord. `METTRE-A-JOUR.bat` sauvegarde la base avant chaque mise à jour et programme les sauvegardes toutes les 6 h tout seul.\n- **Sauvegardes** : `SAUVEGARDER-BDD.bat` → programmer **toutes les 6 h** (30 gardées, ~1 semaine). **Retour en arrière** : `RESTAURER-BDD.bat` → 1. toute la base (serveur arrêté) ou 2. **un seul joueur** (citizenid : perso, argent, inventaire, métier + véhicules) pendant que le serveur tourne (joueur déconnecté). L'état actuel est toujours sauvegardé avant (« avant-restauration ») pour pouvoir annuler. Hébergeur Linux : `scripts/linux/roadline-bdd.sh` (`sauvegarde`, `liste`, `restaurer`, `restaurer-joueur`, `programmer`).\n- **Rendez-vous fixes** (`gs_events/shared/config.lua`, `Config.Weekly`) : mercredi des métiers, vendredi des courses, nuit des combats (le ring reste ouvert), road trip du dimanche. Rappel en jeu + Discord 30 min avant. `/gsevent` reste prioritaire.\n- **Nouveaux systèmes à surveiller** : racket (`/racket`, crimes `racket` signalés aux témoins), fraude à l'assurance (casier « Fraude à l'assurance »), contrats en litige (juges / avocats prévenus), doublure des patrons (bars uniquement).\n\n## V10 · Ville vivante, téléphone, quartiers\n- **Faits divers PNJ** (`gs_faitsdivers`) : créés seulement si un policier est en service ET que les joueurs n'ont presque pas commis de crimes depuis 20 min (2 affaires ouvertes max, classées après 25 min). Staff : F11 → Événements → **Fait divers PNJ** (au hasard ou par type), ou `faitdivers [burglary|body|hitrun|vandalism]` en console. Lieux déplaçables (F11 → Monde → Déplacer un point).\n- **Le quartier évolue** (`gs_city`, `Config.Standing`) : standing -100 → +100 par quartier, sauvegardé. Monte avec les vraies ventes des commerces et les vitrines réparées, baisse avec crimes, tags, trafics ; revient vers 0 d'1 point par heure. Visible dans `/quartiers` et l'appli Ville. Déchets à ramasser en déclin (payés, 30 par heure et par joueur max).\n- **Radio Los Santos** (`gs_lsradio`) : ne relaie pas les brèves Weazel (elles ont déjà leur bandeau) ; ajoute des lignes via `exports.gs_lsradio:Say('texte')`.\n- **Les commerçants se souviennent** (`gs_economy`, `Config.Regulars`) : habitué = 5 jours d'achats (-5 %), braqueur à visage découvert refusé 48 h dans ce magasin.\n- **Téléphone** : notes, lieux favoris, appels récents et réglages sont gardés sur le PC du joueur (rien en base) ; « Que faire ? » vient de `gs_onboarding/shared/guide.lua` (lignes faciles à ajouter : libellé, description, commande ou point GPS).\n- **Bot Discord** : installation pas à pas dans `docs/DISCORD.md` (5 étapes, une seule fois).\n\n## V10.1 · Justice, presse, staff à distance, OVH\n- **Caméras** (`gs_cctv`) : 20 caméras (déplaçables), 3 terminaux police ; passages gardés 60 min ; une bombe de peinture aveugle une caméra 30 min.\n- **Mandat** (`gs_justice`, `Config.Warrant`) : planques de gang et chambres de motel signalent leurs visites ; seuil → signalement police ; juge de permanence si aucun juge en service.\n- **Pièces au tribunal / chantage** (`gs_justice` + `gs_evidence`, `Config.Pieces`, `Config.Blackmail`) : 12 pièces max par affaire ; chantage 100 à 50 000 $, une photo ne sert qu'une fois.\n- **Enchères de la fourrière** (`gs_auction`) : samedi 21 h (30 min) ; staff : `/encheres` → ouvrir / clore une vente à tout moment ; gagnant hors ligne livré à sa connexion.\n- **Direct Weazel** (`gs_social`, `Config.Live`) : chaleur ≥ 45 ; un direct toutes les 20 min max ; journalistes payés 150 $/min (1 500 $ max).\n- **Staff à distance** : bot Discord (docs/DISCORD.md) et panneau web `/gs_admin/` (codes `gs_admin_web` dans secrets.cfg, docs/OVH.md § 5). Mêmes actions, journalisées.\n- **CAPTURER-ERREURS.bat** : lance le serveur 2 min et ouvre `C:\\GTASOON\\logs\\erreurs.txt` (erreurs + 80 dernières lignes) — à m'envoyer en cas de souci au démarrage.\n- **Serveur officiel** : docs/OVH.md (PREPARER-OVH.bat, METTRE-A-JOUR-OVH.bat, **GERER-OVH.bat**, commande `roadline`).\n- **Backtest sur le VPS** : `GERER-OVH.bat` → 3 « Erreurs de scripts » chaque jour (regroupées par ressource), → 11 copie de la base sur le PC. Profil privé : 16 places, caché de la liste.\n\n## V10.2 · Retours du backtest, rumeurs, nuit, dossier\n- **Objets** : METTRE-A-JOUR.bat traduit les noms (server/locales-fr/items.json, weapons.json) et ajoute les images manquantes (server/item-icons, généré par `python3 tools/item_icons.py`).\n- **Anti carkill** (`gs_security`) : dégâts d'un véhicule sur un joueur à pied annulés ; alerte « carkill probable » dans F11 → Anti-triche. Désactivable : `set gs_anticarkill false`.\n- **Alertes LSPD** (`gs_wanted`, `Config.Alerts`) : coups de feu (sauf silencieux) et arme blanche toujours signalés aux policiers en service (rue + GPS, sans description).\n- **Coiffeur** (`gs_places`, `Config.Barber`) : 150 $ ; `enabled = false` pour revenir au menu d'illenium.\n- **Rumeurs qui deviennent vraies** (`gs_rumors`, `Config.Seeds`) : 3 personnes différentes
