er un point.\n- ~~Serveur figé ~11 s une fois après chaque démarrage~~ **corrigé (soir du 16/10)** : les packs en conflit ne sont relancés que\n  si leur ordre de démarrage n'est pas déjà le bon (console : « ordre de démarrage déjà bon, aucune relance »).\n- **Textures trop lourdes** signalées par la console (48 Mo : police.ytd du pack LSPD, sultanrsv8.ytd ; 32 Mo : nombreuses livrées).\n  IMPORTER-MODS allège déjà seul les .ytd de plus de 48 Mo (mods non protégés). DIAGNOSTIC-MODS liste maintenant tout ce qui\n  dépasse 32 Mo ; les modèles (.yft) et les packs chiffrés ne se réduisent pas sans risque : à remplacer si l'un ne s'affiche pas.\n- **Shadow Complex** : l'archive `patoche_shadow_complex_pack_1` réimportée le remet en service (l'ancien nom reste retiré, la raison\n  du retrait — Plasmakart — n'existe plus). Animalerie `_1` : copie d'un pack déjà réglé → DIAGNOSTIC-MODS la met en pause.\n- **Clients FiveM Canary** : version de test de FiveM, plus instable. Conseiller la version normale aux joueurs.\n- **Test de charge jamais fait** (fiche section 5) : 10 joueurs ou plus, 45 min, `/perfserveur` et resmon.\n- **Boutique désactivée** (`Config.Enabled = false`) tant que prix et conformité PLA ne sont pas validés.\n- **Sauvegarde / restauration de la base** : à tester une fois de bout en bout avant l'ouverture.\n\n## 3. Optimisations possibles (sans toucher à ce qui tourne)\n1. ~~Démarrage : plus de gel de 11 s~~ fait (16/10 soir).\n2. Textures > 32 Mo : repérées par DIAGNOSTIC-MODS (les .ytd > 48 Mo sont déjà allégés à l'import).\n3. 81 boucles client « par image » : toutes sont conditionnelles (à proximité, pendant une action). À contrôler pendant le\n   test de charge avec resmon (objectif : aucune ressource gs_ au-dessus de 0,5 ms en continu).\n4. Téléchargement des joueurs : 103 mods démarrés ; retirer les voitures jamais utilisées allège la première connexion.\n   À décider après une semaine de jeu (on saura lesquelles sont achetées / sorties) : rien n'est retiré sans ton accord.\n5. Appli staff : la page se recompile avec le panneau F10 (Vite) ; rien à optimiser côté serveur (réponses immédiates).\n\n## 4. Manques avant / juste après l'ouverture\n- Bande-annonce YouTube officielle (le site lit déjà une vidéo YouTube dès qu'on lui donne l'identifiant).\n- Code cfx.re du serveur (liste FiveM, compteur de joueurs sur le site, bouton « Rejoindre » direct).\n- Code personnel fondateur pour l'appli staff (GERER-OVH → 20 → A, rang 5).\n- Positions à caler (voir 2), guichet des jetons et cimetière en premier.\n- Fusion des derniers changements dans `feature/phase1-bridge` (sur accord).\n\n## 5. Cartes : ce qui est autorisé\n- **Los Santos, Blaine County, Cayo Perico, North Yankton** : contenu de GTA V, aucun risque de licence. North Yankton occupe\n  les mêmes coordonnées que Cayo Perico : on ne peut pas charger les deux en même temps → « journée North Yankton » un jour sur\n  deux (F11 → Monde et lieux → Destination du vol de l'île). À vérifier en jeu : comptoir du vol retour à Ludendorff (à caler).\n- **Maps achetées (Patoche, packs .fxap)** : licences Cfx liées au compte du serveur, autorisées.\n- **Interdit** : contenu d'autres jeux (portages de Vice City, Liberty City, San Andreas), et de façon générale tout ce qui\n  reprend la propriété d'un tiers (marques réelles, logos) : risque de fermeture du serveur par Cfx / Rockstar.\n", "GITHUB": "# GitHub : pousser et synchroniser entre les deux postes (V12.34)\n\nDeux postes travaillent sur le même dépôt (`HarmonieV1/dddd`, branches `feature/phase1-bridge` et\n`claude/gta-rp-architecture-stack-pbvdxz`, toujours identiques) : le **PC Windows** (clone local, pas d'identité GitHub\nenregistrée au départ) et la **session distante** (clone avec accès GitHub). Trois outils, zéro commande à retenir.\n\n## 1. `POUSSER-GITHUB.bat` (PC Windows, à la racine du clone)\n\nUn clic. Dans l'ordre :\n1. trouve Git (ou dit comment l'installer : `winget install --id Git.Git -e --source winget`) ;\n2. lit GitHub et affiche : commits à envoyer d'ici, commits de l'autre session pas encore là ;\n3. fichiers modifiés non enregistrés → propose de les mettre dans un commit (message demandé) ;\n4. si l'autre session a avancé et pas toi → **récupère** (avance rapide, sans risque) et s'arrête ;\n   si les deux côtés ont avancé → **s'arrête** : « demande la fusion à Claude ». Jamais de `--force` ;\n5. lance `tests/run.sh` (si bash, lua5.4 et python sont installés sur ce PC ; sinon le dit et demande confirmation) ;\n6. pousse sur les deux branches. **Première fois** : une fenêtre GitHub s'ouvre (Git Credential Manager, livré avec Git),\n   tu t'identifies une fois, c'est mémorisé par Windows. Si ça échoue : `gh auth login --web` puis `gh auth setup-git`.\n\nIl se lance depuis le **clone** (dossier qui contient `.git`), pas depuis le zip d'installation.\n\n## 2. Paquet de commits pour la session distante (`ROADLINE-commits.bundle`)\n\nQuand le PC ne peut pas pousser, Claude livre un **paquet git** (`livraison/ROADLINE-commits.bundle`) : les commits du PC\n**avec leur historique**, pas une copie des fichiers. Plus de commit « Synchronisation » géant, plus de conflits de fins\nde ligne, plus de doublons. À envoyer à la session distante avec cette consigne :\n\n```bash\nbash scripts/linux/recevoir-bundle.sh ROADLINE-commits.bundle\n```\n\nLe script vérifie le paquet, le fusionne (avance rapide si possible, vraie fusion sinon), relance les tests et pousse les\ndeux branches. Claude peut le faire lui-même là-bas : lui donner le fichier et la ligne ci-dessus.\n\n## 3. Règles qui évitent les bugs de synchronisation\n\n- **Avant de travailler** sur un poste : `POUSSER-GITHUB.bat` (ou `git fetch origin`) pour voir si l'autre a avancé.\n- **Une version par livraison** : `gs_version` dans `server/server.cfg.example` et `VERSION` dans `tools/pdf.py`\n  (les autres outils l'importent), une entrée en tête de l'historique de `docs/ETAT_PROJET.md`.\n- Les **zips d'installation** servent au serveur (METTRE-A-JOUR, METTRE-A-JOUR-OVH), **pas** à synchroniser le code entre\n  postes : pour ça, GitHub ou le paquet de commits. Un zip dézippé puis commité crée un commit géant sans historique et\n  des conflits partout (c'est ce qui est arrivé le 11/10).\n- Les deux branches doivent rester identiques : l'outil et le script poussent toujours les deux.\n- Secrets (`cfg/secrets.cfg`, jetons, webhooks) : jamais dans le dépôt.\n", "PATCH_SESSION_14-10": "# Patch récap — session web du 14/10/2026 (V12.40 → V12.49)\n\n> À garder pour le récap global de fin. Détail technique de chaque version : `docs/ETAT_PROJET.md` (historique).\n> Rien de cette session n'a encore été essayé en jeu : backtest sections **6d, 6e, 6f, 6g** (site de doc).\n\n## V12.40 — concessions, Benny's, courses, portes, gangs\n| Quoi | Où | Ce que ça change |\n|---|---|---|\n| **Concessions** (nouvelle ressource) | `gs_showroom` · F11 → Monde et lieux → Concessions | Le staff pose les véhicules d'exposition et le départ des essais ; Alt : prix, essai 2 min, achat ; le vendeur change le modèle |\n| **Mécano Benny's** | `gs_tuning` | Menu complet (perfs, carrosserie, peinture RVB, jantes, néons…), le **client voit en direct**, animations réelles, **facture automatique** |\n| **Courses sur mesure** | `gs_races` · F11 | Points posés par le staff, course éphémère (1 à 168 h) ou permanente |\n| **Portes verrouillées** | F11 → ox_doorlock | Procédure + groupes conseillés (police, EMS, Benny's, concession, QG de gang) |\n| **Territoires de gang** | `gs_gangs` | Visibles des seuls membres, couleur du gang, niveaux 0-3, 3 territoires max par gang, `/territoire`, **PNJ du gang** dans ses zones |\n| Tempête | `gs_weather` | Véhicules et arbres posés au sol (plus en l'air) |\n| Cayo | `gs_world` | Billet en espèces ou argent sale seulement |\n| Benny's / blips / carte | `gs_jobs`, `maps.js`, `gs_hud` | Métier « Mécano Benny's », blips des maps devinés (plus de ronds blancs), « RoadLine RP » sur la carte Échap |\n| Propositions | `docs/PROPOSITIONS.md` | n°98 à 107 (section D5) |\n\n## V12.41 — achat concession, tir à la tête, caméras, boutique\n| Quoi | Où | Ce que ça change |\n|---|---|---|\n| **Achat concession** | `gs_showroom`, `gs_bridge` | Comme Qbox : véhicule à ton nom, **sorti** avec ses **clés**, toi au volant ; le staff change le modèle de loin |\n| **Balle dans la tête** | `gs_details/client/health.lua` | À terre en un tir (casque = protégé), le reste inchangé |\n| **Caméras LSPD en direct** | `gs_cctv` | Terminal du commissariat → « Voir en direct » (souris, zoom, REC) |\n| **Boutique en jeu** | `gs_store` · `/boutique` | Interface aux couleurs du site + **RoadCoins** (Tebex, monnaie de boutique seulement). Toujours désactivée : prix et PLA à valider |\n\n## V12.42 — labo, mobilier, arme dans le dos\n| Quoi | Où | Ce que ça change |\n|---|---|---|\n| **Labo** | `gs_evidence` | Scellés gardés en base et lus dans le sac (même ceux d'un collègue, même après redémarrage) |\n| **Mobilier utilisable** (nouvelle ressource) | `gs_furniture` | Alt : s'asseoir, s'allonger, **rouler en fauteuil roulant** (objets du mapping F11 et de la ville) |\n| **Arme dans le dos** | `gs_details/client/holster.lua` | Attache rigide : ne se balance plus, ne tombe plus |\n\n## V12.43 — retours console et import du 14/10\n| Quoi | Où | Ce que ça change |\n|---|---|---|\n| Erreur `lastVehicleCrime` | `gs_wanted/server/main.lua` | Variable déclarée avant usage (plus d'erreur à la déconnexion) |\n| Erreur `GetPedDrawableVariation` | `gs_wanted` (client + `server/memory.lua`), `gs_economy` | Le serveur n'a pas ces fonctions : chaque joueur publie un résumé de sa tenue (`gsLook`), lu par les témoins et les commerçants |\n| Erreur `Renewed-Banking` (soins) | retouche Qbox (`outils-communs.ps1`) | L'argent des soins va à la caisse EMS de gs_jobs |\n| **Pop-up « prise de service / véhicule » en boucle** | retouche Qbox `qbx_police/client/job.lua` | Les zones service / garage de qbx_police (nouvelle version) sont neutralisées : un seul système (gs_jobs) |\n| Conflits de maps Patoche | `gs_admin/server/maps.js` (`KEEP_ON_CONFLICT`) | Herbe → entrepôt, décor → billard (relancés en dernier) ; le stand de jeux perd un peu d'herbe / de décor |\n| **Pack LSPD importé** | `gs_jobs/shared/jobs.lua` | 12 véhicules au garage de police, par grade (Scout, K9, moto, banalisées, blindé, Stalker) |\n| Severo, Hachura | IMPORTER-MODS | Ajoutées seules au catalogue (catégorie « roadtrip ») : à exposer via F11 → Concessions |\n\n## V12.44 — 2e import du 14/10\n| Quoi | Où | Ce que ça change |\n|---|---|---|\n| Stand de jeux, circuit | `maps.js` (PUBLIC, ACTIVITY) | Blips « Stand de jeux » et « Circuit », scripts Patoche reconnus (sinon « décor seul » en console) |\n| FastBox (colis) | `maps.js` | Pas de blip public : le script Patoche pose les siens (sa config) |\n| Doublons de l'import | `importer-mods.ps1` | Même mod présent deux fois (zip d'origine + WeTransfer, pack / pack_1) : traité une seule fois |\n| **Backtest allégé** | `tools/backtest.py` (PDF + site de doc) | 31 tests au lieu d'environ 90 : seulement le récent jamais revu en jeu et l'obligatoire avant l'ouverture |\n| Documentation | `ETAT_PROJET.md`, `PROMPT_REPRISE.md`, priorités du site de doc | « En attente » et priorités remis à jour (ce qui est fait retiré) |\n\n## V12.45 — vêtements convertis, récolte\n| Quoi | Où | Ce que ça change |\n|---|---|---|\n| **Coiffures et tenues converties** | `livraison/vetements-convertis` (zips ROADTRIP-…, chacun < 30 Mo) | 7 coupes femme, 13 homme (dont 9 du pack TideFN : dreads, locks, boucles), 3 robes, sweat Lace Up, Knee Jeans : en plus de celles du jeu (rien remplacé) |\n| Refusés | importeur + NETTOYER-MARQUES | Sac BOOMODS (logo YSL), Afro de Lamar (perso solo), dreadlocks Trycky (archive coupée) |\n| **Récolte : céréales, tabac** | `gs_harvest` | Vrais plants (props BzZz), revente au marché de Grapeseed |\n| **Récolte : pavot** (illégal) | `gs_harvest`, `gs_wanted` | Sans blip, alerte possible, receleur du port |\n\n## V12.46 — robes, site, docs (fin de session)\n| Quoi | Où | Ce que ça change |\n|---|---|---|\n| **Pack de robes** | 3 zips `ROADTRIP-tenues_femme_3/4/5` | 28 robes (dans « sous-haut ») + 4 hauts, en plus du jeu (le mod d'origine remplaçait des vêtements) |\n| **Site public** | `docs/site/index.html` | Carte **V5** « Dernière ligne droite avant l'ouverture » (concessions, Benny's, courses, territoires, enquêtes, mobilier, récolte, coiffures et robes) ; le teaser confidentiel devient **V6** |\n| Site de doc, guide staff | priorités, section 6 | À faire mis à jour (zips à importer, récolte à vérifier) ; récolte et nouveaux vêtements expliqués au staff |\n| Hachura « custom » | importeur | Rien à convertir : son dlc.rpf est lisible, IMPORTER-MODS l'ouvre seul (laisse l'archive d'origine dans mods-a-trier) |\n\n## V12.47 — outil « magique » pour la base\n| Quoi | Où | Ce que ça change |\n|---|---|---|\n| **REPARER-BDD.bat** | racine du dossier RoadLine | Pour `Unable to establish a connection to the database` (ECONNRESET) : un double-clic redémarre MariaDB, trouve la cause (disque plein, port pris par un autre MySQL, fichiers abîmés), répare sans rien supprimer, règle MariaDB pour qu'elle **se relance seule** si elle plante, puis relance le serveur |\n\n## V12.48 — rapport d'import du 14/10 08:22\n| Quoi | Où | Ce que ça change |\n|---|---|---|\n| **Villa bunker** | importeur | `patoche_interact` était installé sous un autre nom (gsa_patoche_interact_pack) : son script ne le trouvait pas. Il est maintenant installé sous son vrai nom, et le script de la villa avec lui |\n| Lace Up, « hair », natt_hair5 | importeur | Reconnus comme déjà convertis (plus « refusé » ni installé en double) ; l'ancien natt_hair5 n'est plus démarré |\n| Afro de Lamar | importeur | Refusé avec sa vraie raison (personnage de l'histoire) |\n\n## V12.49 — coiffeur\n| Quoi | Où | Ce que ça change |\n|---|---|---|\n| **Blush** | coiffeur (personnages femme) | Fard à joues + couleur, à côté des sourcils, du maquillage et du rouge à lèvres |\n\n**Les 9 zips de vêtements à importer** : `coiffures_homme_2`, `_3`, `_4` · `coiffures_femme_3` · `tenues_femme_1` à `_5`.\n\n## Ce qu'il reste à faire de ton côté\n1. **METTRE-A-JOUR** (applique les retouches Qbox : pop-up police, soins), puis **METTRE-A-JOUR-OVH**.\n2. **Vêtements convertis** : copie les 9 zips `ROADTRIP-…` dans `C:\\GTASOON\\mods-a-trier`, puis IMPORTER-MODS et\n   METTRE-A-JOUR-OVH. Pack Tide et robes faits ; reste `male_hair_collection_vol_1` (optionnel) : à m'envoyer en morceaux 7-Zip de 25 Mo.\n3. `patoche_villa_bunker_script_pack` : il lui faut la ressource **`patoche_interact`** (dans ton portail Cfx « Granted Assets »,\n   même compte que la clé du serveur) : elle n'était pas dans l'import du 14/10.\n3 bis. **Props de récolte** : reçus et branchés (V12.45) ; points des champs à vérifier en jeu (F11).\n4. `lace_up_sweats` : finalement converti (c'est un vêtement femme MP, mal classé par l'importeur).\n5. Placer en jeu : points du métier mécano sur la map Benny's, véhicules d'exposition + départ des essais, portes `/doorlock`.\n6. Backtest allégé : 31 tests (onglet Backtest du site de doc / PDF), ★★★ d'abord.\n\n## Nouvelles ressources de la session\n`gs_showroom` (V12.40), `gs_furniture` (V12.42) — ajoutées dans `server/cfg/resources.cfg`.\n\n## V12.50 (15/10) — retours du matin\n| Quoi | Où | Ce que ça change |\n|---|---|---|\n| **Tatouages** | retouches illenium (METTRE-A-JOUR) | Menu en français ; tatouage payé = gardé même sans « Sauvegarder » ; payé une seule fois |\n| **Voix** | retouche pma-voice + REPARER-SON.bat | On s'entend en « Normal » (6 m) ; le son du jeu ne baisse plus pendant le vocal (réglage Windows, chez chaque joueur) |\n| **Garde-robe (U)** | gs_details | La pièce s'enfile tout de suite ; une pièce d'un pack non chargé reste dans le sac au lieu d'être perdue |\n| **« Spawn patate »** | gs_onboarding | 30 s de prote         continue;
      }
      if (/^>\s?/.test(l)) { var q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, '')); out.push('<blockquote>' + inline(q.join(' ')) + '</blockquote>'); continue; }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        var ol = /^\s*\d+\./.test(l), items = [];
        while (i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
          var m = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)/);
          if (m) items.push({ depth: m[1].length, text: m[3] }); else items[items.length - 1].text += ' ' + lines[i].trim();
          i++;
        }
        out.push((ol ? '<ol>' : '<ul>') + items.map(function (it) {
          var tk = it.text.match(/^\[( |x)\]\s+(.*)/i), pad = it.depth ? ' style="margin-left:' + it.depth * 8 + 'px"' : '';
          if (tk) { var id = key + ':t' + (task++); return '<li' + pad + ' style="list-style:none"><label><input type="checkbox" data-id="' + id + '"' + ((state.checks[id] !== undefined ? state.checks[id] : tk[1] !== ' ') ? ' checked' : '') + '> ' + inline(tk[2]) + '</label></li>'; }
          return '<li' + pad + '>' + inline(it.text) + '</li>';
        }).join('') + (ol ? '</ol>' : '</ul>'));
        continue;
      }
      if (!l.trim()) { i++; continue; }
      var p = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\||>|\s*([-*]|\d+\.)\s)/.test(lines[i])) p.push(lines[i++]);
      if (!p.length) p.push(lines[i++]);
      out.push('<p>' + inline(p.join(' ')) + '</p>');
    }
    return out.join('\n');
  }
  function slug(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

  // --- Navigation ---
  var title = {}; D.categories.forEach(function (c) { c.items.forEach(function (it) { title[it.key] = it.title; }); });
  function navHtml() {
    var h = '<a href="#accueil">🏠 Accueil</a><a href="#priorites">🚦 Priorités</a><a href="#backtest">✅ Backtest à cocher</a><a href="#pdf">📄 PDF</a>';
    D.categories.forEach(function (c) { h += '<h3>' + esc(c.name) + '</h3><small>' + esc(c.desc) + '</small>' + c.items.map(function (it) { return '<a href="#doc/' + it.key + '">' + esc(it.title) + '</a>'; }).join(''); });
    $('#nav').innerHTML = h;
  }
  function mark() { var h = location.hash || '#accueil'; Array.prototype.forEach.call(document.querySelectorAll('nav a'), function (a) { a.classList.toggle('on', a.getAttribute('href') === h); }); }

  // --- Listes à cocher (priorités, backtest) ---
  function itemHtml(id, text, tags) {
    var done = !!state.checks[id];
    return '<div class="item' + (done ? ' done' : '') + '"><input type="checkbox" data-id="' + esc(id) + '"' + (done ? ' checked' : '') + '><div class="txt">' + (tags || '') + inline(text) +
      '<textarea class="note" data-note="' + esc(id) + '" placeholder="Note (bug constaté, qui a testé…)">' + esc(state.notes[id] || '') + '</textarea></div></div>';
  }
  function progress(ids) { var n = ids.filter(function (id) { return state.checks[id]; }).length; return { n: n, t: ids.length, pct: ids.length ? Math.round(n * 100 / ids.length) : 0 }; }
  function btIds() { var a = []; D.backtest.forEach(function (s, si) { s.tests.forEach(function (_, ti) { a.push('bt:' + si + ':' + ti); }); }); return a; }
  function prIds() { var a = []; D.priorities.forEach(function (s, si) { s.items.forEach(function (_, ti) { a.push('pr:' + si + ':' + ti); }); }); return a; }
  function toolsHtml() { return '<div class="tools"><button data-act="export">💾 Exporter l\'avancement (.json)</button><button data-act="import">📂 Importer</button><button data-act="report">📝 Rapport texte</button><button data-act="print">🖨 Imprimer / PDF</button><button data-act="reset">↺ Tout décocher</button></div>'; }
  function bar(p) { return '<div class="bar"><i style="width:' + p.pct + '%"></i></div><p class="muted">' + p.n + ' / ' + p.t + ' (' + p.pct + ' %)</p>'; }

  var pages = {
    accueil: function () {
      var bt = progress(btIds()), pr = progress(prIds()), ndocs = Object.keys(D.docs).length;
      return '<div class="doc"><h1>Documentation RoadLine RP</h1><p class="muted">Version ' + esc(D.version) + ' · tout est dans ce fichier, lisible sans Internet. Les cases cochées et les notes restent dans ce navigateur : exporte-les pour les garder ou les partager.</p></div>' +
        '<div class="grid"><div class="card stat"><b>' + ndocs + '</b>documents</div><div class="card stat"><b>' + pr.pct + ' %</b>priorités faites</div><div class="card stat"><b>' + bt.pct + ' %</b>backtest validé</div><div class="card stat"><b>' + D.pdfs.length + '</b>PDF</div></div>' +
        '<div class="card"><h3>Par où commencer</h3><p><a href="#doc/ETAT_PROJET">État du projet</a> : le point complet, les versions, les règles. <a href="#priorites">Priorités</a> : ce qu\'il reste jusqu\'à l\'ouverture. <a href="#backtest">Backtest</a> : les tests en jeu à cocher.</p></div>' +
        D.categories.map(function (c) { return '<div class="card"><h3>' + esc(c.name) + '</h3><p class="muted">' + esc(c.desc) + '</p>' + c.items.map(function (it) { return '<a class="btn" style="display:inline-block;margin:3px;text-decoration:none" href="#doc/' + it.key + '">' + esc(it.title) + '</a>'; }).join('') + '</div>'; }).join('');
    },
    priorites: function () {
      return '<div class="doc"><h1>Priorités jusqu\'à l\'ouverture</h1></div>' + bar(progress(prIds())) + toolsHtml() +
        D.priorities.map(function (s, si) { return '<div class="card"><h3>' + esc(s.title) + '</h3>' + s.items.map(function (t, ti) { return itemHtml('pr:' + si + ':' + ti, t); }).join('') + '</div>'; }).join('');
    },
    backtest: function () {
      return '<div class="doc"><h1>Backtest en jeu</h1><p class="muted">Ce qui reste vraiment à tester, rangé en sessions. ★★★ = bloquant pour l\'ouverture.</p></div>' + bar(progress(btIds())) + toolsHtml() +
        D.backtest.map(function (s, si) { return '<div class="card"><h3>' + esc(s.title) + '</h3>' + s.tests.map(function (t, ti) {
          return itemHtml('bt:' + si + ':' + ti, t.text, '<span class="tag">' + esc(t.who) + '</span><span class="tag p' + t.prio + '">' + '★★★'.slice(0, t.prio) + '</span> ');
        }).join('') + '</div>'; }).join('');
    },
    pdf: function () {
      return '<div class="doc"><h1>PDF</h1><p class="muted">Fichiers du dossier docs/pdf (lien relatif : ce fichier doit rester dans docs/hub).</p><ul>' +
        D.pdfs.map(function (f) { return '<li><a href="../pdf/' + encodeURI(f) + '" target="_blank">' + esc(f.replace(/_/g, ' ').replace(/\.pdf$/, '')) + '</a></li>'; }).join('') + '</ul></div>';
    }
  };

  function render() {
    var h = decodeURIComponent((location.hash || '#accueil').slice(1)), html;
    if (h.indexOf('doc/') === 0) {
      var k = h.slice(4).split('#')[0];
      html = D.docs[k] ? '<div class="tools"><button data-act="print">🖨 Imprimer / PDF</button><button data-act="md" data-key="' + esc(k) + '">⬇ Télécharger (.md)</button></div><article class="doc">' + md(D.docs[k], k) + '</article>' : '<p>Document introuvable.</p>';
    } else if (h.indexOf('search/') === 0) {
      html = search(h.slice(7));
    } else html = (pages[h] || pages.accueil)();
    $('#main').innerHTML = html; mark(); window.scrollTo(0, 0); $('#nav').classList.remove('open');
  }

  // --- Recherche ---
  function search(q) {
    q = q.trim(); if (q.length < 2) return '<p class="muted">Tape au moins 2 lettres.</p>';
    var re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), hits = [];
    Object.keys(D.docs).forEach(function (k) {
      var lines = D.docs[k].split('\n'), section = title[k] || k;
      lines.forEach(function (l) { var hh = l.match(/^#{1,4}\s+(.*)/); if (hh) section = hh[1]; re.lastIndex = 0; if (re.test(l)) hits.push({ k: k, section: section, line: l }); });
    });
    D.backtest.forEach(function (s) { s.tests.forEach(function (t) { re.lastIndex = 0; if (re.test(t.text)) hits.push({ k: '#backtest', section: 'Backtest · ' + s.title, line: t.text }); }); });
    return '<div class="doc"><h1>Recherche : « ' + esc(q) + ' »</h1><p class="muted">' + hits.length + ' résultat(s)' + (hits.length > 200 ? ' (200 premiers)' : '') + '</p></div>' +
      hits.slice(0, 200).map(function (x) {
        var go = x.k.charAt(0) === '#' ? x.k : '#doc/' + x.k + '#' + slug(x.section);
        return '<div class="hit" data-go="' + esc(go) + '"><b>' + esc(title[x.k] || 'Backtest') + '</b> · <span class="muted">' + esc(x.section) + '</span><br>' + esc(x.line.replace(/^[#>\-*\s|]+/, '').slice(0, 260)).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>') + '</div>';
      }).join('');
  }

  // --- Export / import / rapport ---
  function download(name, text, type) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  function report() {
    var day = new Date().toLocaleDateString('fr-FR'), out = ['ROADLINE · avancement ' + D.version + ' · ' + day, ''];
    var part = function (label, groups, prefix, textOf) {
      out.push('=== ' + label);
      groups.forEach(function (g, gi) { out.push('', g.title); (g.items || g.tests).forEach(function (it, ii) { var id = prefix + ':' + gi + ':' + ii; out.push((state.checks[id] ? '[x] ' : '[ ] ') + textOf(it) + (state.notes[id] ? '\n      note : ' + state.notes[id] : '')); }); });
      out.push('');
    };
    part('PRIORITÉS', D.priorities, 'pr', function (t) { return t; });
    part('BACKTEST', D.backtest, 'bt', function (t) { return t.text; });
    return out.join('\n');
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-go]'); if (!t) return;
    if (t.dataset.go) { location.hash = t.dataset.go; return; }
    var a = t.dataset.act;
    if (a === 'print') window.print();
    else if (a === 'export') download('roadline-avancement-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ version: D.version, state: state }, null, 1), 'application/json');
    else if (a === 'report') download('roadline-rapport-' + new Date().toISOString().slice(0, 10) + '.txt', report(), 'text/plain');
    else if (a === 'md') download(t.dataset.key + '.md', D.docs[t.dataset.key], 'text/markdown');
    else if (a === 'reset') { if (confirm('Tout décocher et effacer les notes ?')) { state = { checks: {}, notes: {} }; save(); render(); } }
    else if (a === 'import') {
      var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = function () { var f = inp.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { try { var d = JSON.parse(r.result); if (!d.state || !d.state.checks) throw 0; state = d.state; save(); render(); alert('Avancement importé.'); } catch (x) { alert('Fichier non reconnu.'); } }; r.readAsText(f); };
      inp.click();
    }
  });
  document.addEventListener('change', function (e) {
    var id = e.target.dataset && e.target.dataset.id; if (!id) return;
    state.checks[id] = e.target.checked; save();
    var it = e.target.closest('.item'); if (it) it.classList.toggle('done', e.target.checked);
  });
  document.addEventListener('input', function (e) { var id = e.target.dataset && e.target.dataset.note; if (id === undefined) return; if (e.target.value) state.notes[id] = e.target.value; else delete state.notes[id]; save(); });
  var timer; $('#q').addEventListener('input', function () { clearTimeout(timer); var v = this.value; timer = setTimeout(function () { location.hash = v.trim() ? 'search/' + encodeURIComponent(v) : 'accueil'; }, 250); });
  $('#menuBtn').addEventListener('click', function () { $('#nav').classList.toggle('open'); });
  $('#theme').addEventListener('click', function () {
    var dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#0f1115';
    document.documentElement.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem(KEY + '-theme', document.documentElement.dataset.theme); } catch (x) {}
  });
  window.addEventListener('hashchange', function () {
    render();
    var anchor = location.hash.split('#')[2]; if (anchor) { var el = document.getElementById(anchor); if (el) el.scrollIntoView(); }
  });
  navHtml(); render();
})();
</script>
</body>
</html>
