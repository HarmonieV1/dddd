ensure gs_rental            # location vélos / scooters / citadines
ensure gs_events            # événements saisonniers et staff (bonus d'XP, tours de roue)
ensure gs_quests            # XP, niveaux, quêtes de départ, paquets cachés, défis du jour, titres
ensure gs_services          # secours IA quand aucun EMS joueur en service
ensure gs_police            # interventions police / EMS (F4)
ensure gs_details           # radial véhicule, /me /do, mains en l'air, ceinture, kits de réparation
ensure gs_interiors         # portes vers les intérieurs du jeu (casino, labos, club-house)
ensure gs_casino            # roue de la fortune (1/jour), tickets à gratter
ensure gs_harvest           # pêche, mine, bûcheron, ferme, chasse + acheteurs
ensure gs_races             # courses de rue classées (chrono solo, courses à mise, classement Vibe)
ensure gs_insurance         # assurance auto : fourrière à 25 %
ensure gs_tuning            # néons et plaque personnalisée (cosmétique, salon LS Customs)
ensure gs_driving           # auto-école : code + examen de conduite, moniteurs
ensure gs_econstats         # tableau de bord économique du staff (/economie)
ensure gs_civil             # état civil : mariage, divorce (mairie)
ensure gs_business          # commerces tenus par des joueurs (bar, restaurant) : préparation, caisse, comptes
ensure gs_justice           # tribunal : procès, verdicts, avocats (/tribunal)
ensure gs_bank              # distributeurs et guichets (retrait, dépôt, historique)
ensure gs_gigs              # petits boulots depuis le téléphone (livraison, passeur)
ensure gs_world             # densité PNJ / trafic, Cayo Perico (chargée à l'approche), vols vers l'île

